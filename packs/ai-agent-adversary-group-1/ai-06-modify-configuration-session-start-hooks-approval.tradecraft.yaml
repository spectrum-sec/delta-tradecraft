  unsupported_title: 'Attacker achieved persistent code execution through a weaponised agent hook'

evidence:
  confirmed_incident_behavior: >-
    Verified reporting documents malware/dependency activity that modifies Claude Code hooks or
    agent-relevant configuration, alongside demonstrated weaponisation of the hook system and
    evidence of approved-MCP post-approval mutation. That the deciding event is the post-approval
    write rather than the later hook execution is this pack's framing of the procedure, registered in
    missing_context.assumptions, not an ordering the sources state per case.
  supported_conclusion: >-
    The evidence supports that an approved agent/MCP configuration or session-start hook can be
    modified after approval by a dependency or attacker and that the hook system can be weaponised to
    run attacker commands on a later session. The behavior is detectable where a content change on a
    watchlist configuration path is attributed to an unexpected writer with no authorised-change
    record, and reportable as a configuration change from a native config-change or audit event alone.
  unsupported_conclusions: >-
    The evidence does not establish the number or identity of victims, that any specific victim
    session loaded a modified state, or any objective beyond the modification itself. Confirmed
    execution of the modified configuration, and any follow-on action, require host and agent
    telemetry not carried by the cited sources.
  procedure_boundary: >-
    This procedure is the post-approval modification of an approved agent configuration or
    session-start hook. The later execution of the modified state, and any command-and-control,
    persistence, or destruction that execution performs, are separate behaviors and are not evidenced
    by the modification alone. Injection-triggered config writes at write time are the adjacent
    procedure DT-AAG1-AI-007.
