classification:
  primary_attack_surface: 'container-orchestrator'
  secondary_attack_surfaces:
    - 'workload-identity'
    - 'cloud-control-plane'
  behavior_classes:
    - 'workload-identity-token-minting'
    - 'credential-access-via-control-plane-api'
    - 'identity-borrowing'
  tags:
