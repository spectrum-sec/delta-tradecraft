  procedure_boundary: >-
    This procedure ends at the metadata service's response. What the credentials were then used for
    (signing a presigned caller-identity request and presenting it to the cluster as a bearer token,
    after which the API server resolves the caller to the node identity) is HF-04, a separate object
    that detects the consequence and never this retrieval. HF-04's detection firing is not evidence
    that this retrieval was observed. It establishes that a retrieval occurred only by implication,
    and this surface is a pre-condition of HF-04 rather than a peer of it. The strictly weaker
    question this estate can answer (whether any node group's hop limit exceeds 1) is a hunt and a
    control verification, not this behavior, and its finding must never be reported as coverage. On
    atomic indicators the source's redaction policy is quoted directly: "Live credentials, internal
    hostnames, and specific indicators have been redacted or genericized, while the techniques are
    described exactly as observed by Hugging Face" (REF-INCIDENT-HF). Anyone circulating an
    indicator list for this incident is therefore circulating something with no published origin,
    and for this surface the point is sharper than the redaction policy, because the request
    produces no record in which an indicator could appear at all. Adjacent edges were checked and
    found empty: no other modeled behavior reveals this one, and no published detection content or
    vulnerability record attaches to it.
