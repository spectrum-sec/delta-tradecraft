    - id: 'REF-PACK-ARTIFACTORY-OSS-LAB'
      type: 'telemetry-documentation'
      title: >-
        Unpublished capture, self-hosted artifact repository open-source edition 7.161.15 on
        PostgreSQL
      publisher: 'This pack'
      url: 'unpublished; not distributed with this repository'
      trust_tier: 'researcher'
      verification: 'not-resolved-no-url-exists'
      evidence_use: >-
        The origin of every measured figure in this object: thirteen artifact access events, of
        which nine accepted deposits and four accepted logins, across two client addresses; 971 HTTP
        requests across 28 distinct paths, of which 930 from an internal service principal, 33 from
        the administrator and 5 anonymous; nine deposits returning a created status against an
