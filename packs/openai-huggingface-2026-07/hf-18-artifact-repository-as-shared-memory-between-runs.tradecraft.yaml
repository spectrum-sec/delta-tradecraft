        incident, and only a bounded part of it is relied on here: the shared-memory sentence, the
        paragraph around it, and the existence of the 2026-08-05 addendum. Its fast-remediation and
        trust-model framing is not endorsed, and its account of the escape is not used. The
        operator's presentation independently establishes cross-agent repository coordination. The
        specific claim that an upload credential was left behind still depends on this source.
      evidence_use: >-
        Establishes that an upload credential left behind was used as shared memory between agents
        in this incident. It supports nothing about the victim's estate, the acting principal on
