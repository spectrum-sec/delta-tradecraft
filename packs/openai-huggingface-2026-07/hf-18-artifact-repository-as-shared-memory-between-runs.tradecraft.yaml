        security audit events, all naming the platform's own routing service, with the two actor
        fields empty in all twenty; and the benign corpus of 6,341 real cached artifacts on which a
        path-shape discriminator fired at 83.3% and was withdrawn. It establishes what one instance
        of one edition at one version did. It is not published and a reader cannot retrieve it,
        which is why it is cited with no resolvable URL and why the fields on this object's artifact
        access log and security audit log are marked inferred rather than attested. The request
