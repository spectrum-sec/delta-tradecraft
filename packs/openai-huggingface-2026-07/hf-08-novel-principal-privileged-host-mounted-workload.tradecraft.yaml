        client source addresses, with a threshold of three; streaming execution. The five-minute
        delete-then-create recurrence is a temporal pairing the single correlation slot cannot also
        express and is carried as a window on the recurrence branch, which is weaker than an ordered
        temporal correlation and is stated as such rather than hidden. The
        approved-cluster-lifecycle-identity allowlist is joined on user.username,
        objectRef.namespace as a tuple, never a bare user.username list. A lookup miss has to fire.
        It must not drop the event: a null-dropping join silently disables the analytic for every
        new principal. The thirty-day per-principal create history is joined on user.username under
        the same rule: a miss is the discriminating value and must fire.
      detectors:
        - detector_class: 'siem-single-event-analytic'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: >-
            Evaluates each create record against the novelty predicate and preserves the principal,
            resource and outcome context.
          limitations: >-
            Cannot establish anything about the specification, so it cannot distinguish a privileged
