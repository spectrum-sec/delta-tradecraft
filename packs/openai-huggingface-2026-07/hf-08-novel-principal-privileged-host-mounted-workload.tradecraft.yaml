        Audit records must identify the verb, the target resource, the creating principal or an
        explicit missing-actor state, and a success response status, and the create-history lookup
        must resolve to zero prior successful creates for that principal. The zero-history result is
        the sole discriminator. Removing it broadens the population to every pod create in the
        estate. The boosters require either three or more distinct source-address values inside the
        window or a non-empty object name paired with a preceding delete. Report a novel
        pod-creating principal, never a container escape, which this form has no evidence for.
      correlation_context: >-
