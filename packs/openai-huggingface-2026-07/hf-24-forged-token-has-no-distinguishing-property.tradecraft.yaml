      trust_tier: 'primary'
      verification: 'confirmed'
      evidence_use: >-
        The whole evidential basis for this surface: an EdDSA JWT signing key was among the
        harvested secrets and was used to mint short-lived, correctly-signed identity tokens used to
        read the operator's own private datasets, and the key was subsequently rotated. It does not
        state that the issuer holds no issuance record. That is this pack's inference. Also the
        source of the stated redaction policy behind the absence of atomic indicators, and of the
        campaign window and action count. It attests nothing about the two missing telemetry
        streams.
      relevant_locations:
