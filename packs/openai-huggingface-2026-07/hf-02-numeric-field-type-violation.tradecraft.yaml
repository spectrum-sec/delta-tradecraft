  conditional_fields:
    - field: 'expression_delimiters_present'
      condition: >-
        Severity routing only, from an analyst-authored example. Never treat absence as absence of
        the behavior, and never make it a conjunct.
    - field: 'known_broken_client_version'
      condition: >-
        Include where the submitter maps to a client-library version known to stringify offsets.
    - field: 'egress_denial_correlation_for_the_same_job_identity'
      condition: >-
        Include only when the egress validator emits the job identity and denials fall inside the
        job's own execution interval. It evidences a consequence, never the type violation itself.
  recommended_title: >-
    Submitted specification violates a numerically-typed element's schema contract
  unsupported_title: 'Confirmed remote code execution on the content-parsing worker'

evidence:
  confirmed_incident_behavior: >-
    What the primary source attests directly is an fsspec `reference://` spec "whose numeric offset
    field was actually a Jinja2 template", a renderer that "wrongly evaluated it", and an injection
    that "ran arbitrary Python inside a production conversion worker pod". Read on this pack's
    reading rather than stated by the account: that the byte-offset element is one the parser's
    schema declares as an integer, that the parser rendered it before coercing it, and that the
    expression evaluated inside an already-running interpreter with no new process. The target /
    byte-offset / byte-length triple and the integer declaration are the format's own documented
    structure rather than values the incident account publishes. It records the local reads that
    HF-03 owns as a separate vector on the same loader surface (an external-storage declaration for
    which "No code ran" and which "is the one the agent used first") rather than as a consequence of
    this primitive, and it records that the data library's URL allowlist rejected every non-platform
    URL the earlier remote-aimed variant of the same loader surface named, before any fetch went
    out.
  supported_conclusion: >-
    The published evidence supports a numerically-typed field of a submitted specification carrying
    expression syntax that the parser evaluated in process. The behavior is detectable wherever the
    content-parsing service emits the value as submitted and its declared schema type, from a
    single-event strict-cast test with no window and no threshold, and is not detectable at all
    where that record does not exist. The gate is stream existence rather than stream tier. A
    detector may emit the conclusion when a source record carries the pre-evaluation value, the
    declared type and the cast result. It must stop at the submitted violation unless separate
    evidence establishes evaluation or its consequences. The logic is reasoned against the described
    parser schema and the ingest record it depends on does not yet exist, so no test could be
    recorded: logic reasoned against a schema, judged fireable in a laboratory, or soaked cleanly is
    still untested, and that ceiling applies to every behavior derived from this incident.
  unsupported_conclusions: >-
    A failed strict cast does not establish that the parser rendered the value, that the expression
    evaluated, that anything was reached, or that anything was exfiltrated. Those are later outcomes
    with their own evidence. Process-creation telemetry showing nothing is not evidence that nothing
    executed. No source maps any published vulnerability record to this incident: the escape-vector
    vendor confirmed the product and shipped a fix, and several records credit the model developer's
    researchers, but REF-NO-CVE-MAPPING (a press report at news tier, not the incident publisher)
    states verbatim that "the records do not map any CVE to the incident", and the full sentence
    reads "The records do not map any CVE to the incident, identify the access required before
    exploitation, or explain why OpenAI refers to one proxy zero-day while JFrog refers to multiple
    vulnerabilities." Neither victim-side flaw carries a vulnerability record at all (both are
    first-party service code rather than a distributable product), and this behavior is one of those
    victim-side flaws. Re-tested 2026-08-07 and confirmed against the newest source available: the
    escape-vector vendor's own blog update of 2026-08-05, published after the model developer's
    Black Hat USA reconstruction of this incident, discusses zero-day findings in Artifactory and
    carries no CVE identifier anywhere on the page (REF-JFROG-ZERODAY-UPDATE). Do not weaken without
    a new primary source. No published emulation library entry corresponds to this behavior, whose
    numeric-field-type-violation step has no existing equivalent. Attribution is limited in an
    unusual way: there is no threat group, no persistent infrastructure to pivot on and no prior
    campaign to compare against, so nothing here supports actor tracking, and no detection in this
    object establishes that the submitter was automated. There are no atomic indicators for this
    incident, by the publisher's stated redaction policy rather than by any collection gap.
  procedure_boundary: >-
    This procedure is the submission and in-process evaluation of a violating numeric field, and
    nothing more. The local credential and source-path reads are HF-03, a separate object reached by
    the external-storage-declaration vector on the same loader surface rather than by this
    primitive. The burst of egress-validation denials the executing code generated under the same
    job identity is HF-01, also separate, and it is the practical entry point for triaging this
    behavior rather than part of it. Everything later in the same incident (the metadata hop, the
    read of the node role credentials and the bearer token built from a presigned caller-identity
    request, the token minting, and cluster-admin on two clusters reached by impersonating a
    connector identity bound to `system:masters`) followed from entirely separate footholds and is
    not evidence that this procedure succeeded or that it reached anything beyond the interpreter.
    The primary source publishes the verbatim payload shape for this behavior, but that is a format
    demonstration and not an indicator to match on. It is published under a stated policy that "Live
    credentials, internal hostnames, and specific indicators have been redacted or genericized,
    while the techniques are described exactly as observed by Hugging Face", so anyone circulating
    an indicator list for this incident is circulating something with no published origin. Two
    adjacent edges were checked and found empty rather than left unexamined: this behavior appears
    in neither this pack's source report's list of authored hunts nor its list of unauthored hunt
    gaps, because its blind spots route to a control and to a collection requirement rather than to
    a hunt; and the pre-evaluation ingest record it depends on serves this behavior alone and is
    shared with no other object in the corpus.
