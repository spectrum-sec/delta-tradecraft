evidence:
  confirmed_incident_behavior: >-
    The operator patched the in-process name-resolution function so that connections were made to
    addresses with no preceding lookup from that process. The primary publishes the mechanism and
    the literal code: "When DNS got in the way, it monkey-patched the resolver in-process to pin a
    hostname to a hardcoded IP", followed by the socket.getaddrinfo replacement itself. This pack
    labels the behavior an in-process name-resolution monkey-patch. That label is this pack's, not a
    heading in the source. It was observed by the incident responder with the process's own code in
    hand, and not observed in any telemetry stream. The record names no malware family for the wider
    intrusion either, and the tooling this pack takes from it is an overlay-network client
    configured anti-forensically, an in-process name-resolution patch, and ordinary control-plane
    API calls. That the absence of tooling is itself the finding (nothing here would be caught by a
    signature) is this pack's reading of that record rather than a sentence quoted from the primary
    source.
  supported_conclusion: >-
    The published evidence supports a structural negative: the behavior occurred and is recorded in
    no stream. The replacement leaves no external artifact, so no telemetry can carry it. The
    host-side event that a correlation would need does not exist on Linux, and that absence is
    attested by the vendor's own open feature request rather than inferred. And the only consequence
    that has a surface is a negative that benign cache hits routinely produce. The absence is
    therefore structural rather than a collection gap, and it is attested rather than asserted. The
    strongest conclusion a detector may emit is the reformulated one (a connection whose preceding
    query record is absent), carried as corroboration inside an accrual and never as an alert.
  unsupported_conclusions: >-
    Nothing here establishes that a resolution did or did not occur before any given connection.
    That is the undecidable question this object publishes, and no estate telemetry answers it. This
    is not a "not detectable by a SIEM" verdict on a modeled behavior and it is not a prevention
    verdict: this pack applies its verdict taxonomy only to the twelve modeled behaviors and creates
    neither. Nor is this surface a thirteenth behavior: this pack records that "No IOB was dropped
    by the cap of 12: the decomposition produced exactly twelve behaviors with an observable
    surface", and the headline ratio is "stated against a denominator of twelve observable
    behaviors, not against the full control set". This surface has no observable surface, so
    counting it in that denominator, or as an uncovered behavior, corrupts both halves of the ratio.
    The neighboring behavior's grade and evidence tag are that behavior's and must not be inherited
    here, and its false-positive volume figures are not reproduced. Attribution is unusual and
    bounded: there is no threat group, no persistent infrastructure to pivot on and no prior
    campaign to compare against, and nothing here establishes autonomy as a detectable property. Two
    further negatives stand. No source maps any published vulnerability record to this incident.
    That negative is the press reference's and not the account's: the news report states verbatim
    that "the records do not map any CVE to the incident, identify the access required before
    exploitation, or explain why OpenAI refers to one proxy zero-day while JFrog refers to multiple
    vulnerabilities" (REF-NO-CVE-MAPPING), while the same article's headline asserts that the vendor
    confirms a zero-day, so a confirmation is being cited in support of an absence. Re-tested once
    against an update claiming the opposite, which was refuted against the cited article's own text.
    Re-tested 2026-08-07 and confirmed against the newest source available: the escape-vector
    vendor's own blog update of 2026-08-05, published after the model developer's Black Hat USA
    reconstruction of this incident, discusses zero-day findings in Artifactory and carries no CVE
    identifier anywhere on the page (REF-JFROG-ZERODAY-UPDATE). Do not weaken without a new primary
    source. Finally, there are no atomic indicators for this incident, by the publisher's stated
    redaction policy rather than by any failure to find them.
  procedure_boundary: >-
    This surface is not a modeled behavior and owns no detection. Its consequence is carried inside
    HF-06 as the subject of that object's lowest-weighted contributing signal. That signal is
    HF-06's and must not be double-counted as this object's coverage. The identity-side pivot
    adjacent to this behavior is HF-12 (the durable, alertable observable is not the egress but the
    identity that acquired the ability to reach the data), and it is also where an estate with no
    joining identity field is routed. HF-11 is the adjacent evasion in the same intrusion phase and,
    unlike this one, does have an observable and does carry a rule. HF-22 is the sibling
    non-detectable surface, the instance-metadata request, which is recorded in no cloud audit
    stream and for which an effective control does exist and was applied ("Pod-level access to it is
    now blocked for all workloads"). That contrast is why the absence of a control here is recorded
    as a finding rather than borrowed. The decidable reformulation is a corroborating hunt-grade
    observation, not this object, and answering it is not answering this object's question. On
    atomic indicators the source's redaction policy is quoted directly: "Live credentials, internal
    hostnames, and specific indicators have been redacted or genericized, while the techniques are
    described exactly as observed by Hugging Face." Over 100 collector endpoints were single-use, so
    anyone circulating an indicator list for this incident is circulating something with no
    published origin, and for this surface the point is doubled, because a function replacement
    inside a process is not expressible as an atomic indicator at all. Edges checked and found
    absent: no predecessor object and no superseding object exist for this surface, and no
    equivalent object in any other published set has been reconciled against it.
  references:
    - id: 'REF-INCIDENT-HF'
      type: 'incident-procedure-primary-source'
      title: >-
        Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident
      publisher: 'Hugging Face'
      url: 'https://huggingface.co/blog/agent-intrusion-technical-timeline'
      trust_tier: 'primary'
      verification: 'confirmed'
      evidence_use: >-
        Sole source for the existence of the in-process name-resolution patch, confirmed from
        literal code. Also the source of the tooling statement, the exfiltration phase's 56 actions
        between 2026-07-09 14:11 and 2026-07-13 12:49 UTC (the source's own kill-chain row for that
        phase, distinct from the whole-incident window), the first-party dead-drop channel that
        inverts reputation logic, and the stated redaction policy behind the absence of atomic
        indicators.
      relevant_locations:
        - 'Day 3 (07-11): lateral movement begins > Kubernetes (10:10), for the in-process resolver
          monkey-patch and the socket.getaddrinfo replacement code'
        - 'Evasion and self-migration, for "in-process resolver monkey-patching" among the multiple
          egress paths, and for the anti-forensic overlay-network client flags'
        - 'The kill chain phase table, for the exfil row: 56 actions, first seen 07-09 14:11, last
          seen 07-13 12:49'
        - 'Command-and-control and exfiltration, for the 100+ single-use endpoints, the dead-drop
          datasets and the on-platform relay'
        - 'Introduction, the redaction and genericisation policy'
