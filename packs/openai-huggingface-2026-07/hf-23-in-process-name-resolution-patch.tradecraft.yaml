      publisher: 'AWS (Amazon Route 53)'
      url: 'https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html'
      trust_tier: 'vendor'
      verification: 'not-resolved-out-of-scope'
      evidence_use: >-
        Attests that the stream logs "only unique queries, not queries that VPC Resolver is able to
