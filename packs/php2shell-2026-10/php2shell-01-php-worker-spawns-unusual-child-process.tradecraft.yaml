      publisher: 'Cloudflare'
      url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Campaign status: Cloudflare observed attack traffic targeting its customers; edge attempts, not host
