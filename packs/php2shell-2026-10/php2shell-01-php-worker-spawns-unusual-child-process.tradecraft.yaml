    - id: 'REF-TANIUM'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: Responding to CVE-2026-109618 and CVE-2026-109619'
      publisher: 'Tanium Guardian Research Team'
      url: 'https://www.tanium.com/blog/php2shell-responding-to-cve-2026-109618-and-cve-2026-109619'
      trust_tier: 'vendor'
