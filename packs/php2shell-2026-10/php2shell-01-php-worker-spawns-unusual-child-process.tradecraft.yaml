        Campaign status: first exploitation attempts seen before patches, undescribed, no compromise reported.
        NEXT EDR Expert said to detect exploitation attempts on Linux and Windows; no rule read.
    - id: 'REF-RELIAQUEST'
      type: 'incident-campaign-secondary-source'
