      title: 'php2shell: Leaked critical PHP RCEs (CVE-2026-109618, -109619)'
      publisher: 'Hadrian'
      url: 'https://hadrian.io/vulnerability-alerts/php2shell-leaked-critical-php-rce-cve-2026-109618-cve-2026-109619'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        CISA and ReliaQuest report no (successful) exploitation; Hadrian reports it at scale without
        counts. Cited only as a vendor claim; the campaign statement survives without it.
      evidence_use: >-
        11:35 UTC "We are now seeing php2shell exploited in the wild at scale", mostly via upload
        progress; no counts. Treat a worker (php-fpm, php-cgi, httpd, apache2) starting a shell or
        downloading tools as compromise.
    - id: 'REF-CISA'
      type: 'incident-campaign-secondary-source'
      title: 'Critical Vulnerabilities in PHP Require Immediate Patching'
      publisher: 'CISA'
      url: 'https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching'
      trust_tier: 'government'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        CISA "has not observed exploitation of these vulnerabilities as of the time of publication"
        (2026-10-21); advises offline for PHP 8.1 or earlier or unpatchable systems. No KEV mention;
        the KEV statement rests on Tanium.
    - id: 'REF-CORELIGHT-REPO'
      type: 'detection-modeling-reference'
      title: 'corelight/php2shell-detect: Zeek and Suricata Detections for "php2shell" CVE-2026-109618 and CVE-2026-109619'
      publisher: 'Corelight'
      url: 'https://github.com/corelight/php2shell-detect'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Commit 4d5131c: nine Zeek notices under PHP2SHELL:: and Suricata rules 3000650
        (upload-progress POST field), 3000651 and 3000652 (PHP version in header or phpinfo).
        Cutoffs provisional; matches can be benign.
