      url: 'https://www.vulncheck.com/blog/php2shell-vulnerabilities'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        Canary telemetry 2026-10-21: scanner probes and multipart POSTs; one failed session-path
        webshell attempt (ten follow-up reads all 404). None
        of the public PoCs VulnCheck reviewed independently bypasses ASLR on x86-64.
    - id: 'REF-GHSA-109618'
