identity:
  uuid: 'b23bd243-1796-4f13-9be3-b776e2c030df'
  id: 'DT-P2S-APP-010'
  name: 'Secrets held by a PHP host are used from a source that is not the host'
  incident: >-
    PHP2Shell (CVE-2026-109618, CVE-2026-109619), disclosed 2026-10-21: the generic consequence of
    any PHP worker compromise or memory disclosure, in which a credential or token the host holds is
    reused elsewhere. No source reports such reuse for PHP2Shell.
  first_observed: '2026-10'
  last_reviewed: '2026-10-21'

classification:
  primary_attack_surface: 'application-runtime'
  secondary_attack_surfaces:
    - 'secret-store'
    - 'identity-provider'
  behavior_classes:
    - 'credential-replay-from-outside-the-issuing-boundary'
  tags:
    - 'php'
    - 'php2shell'
    - 'credential-reuse'
    - 'generic'
    - 'capability-evidence'
    - 'consequence-detection'
    - 'not-php2shell-specific'

behavior:
  definition: >-
    An adversary who has obtained a database credential, API or cloud key, certificate, or session
    token that a PHP host holds uses it from a source that is not that host, so the host compromise
    or memory leak is detected through the later use of the secret.
  detailed_definition: >-
    A generic consequence behavior, not an exploit step. A PHP worker holds secrets in config files,
    environment variables and process memory; however read, they have value only when used from
    another host. The issuing boundary is crossed: issued to the host, presented by something else.
    No standard log records possession.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers reuse of any secret the host holds from a non-host source, however obtained. No source
      reports PHP2Shell producing such reuse.
    summary: >-
      Possible when an adversary has read a host secret and can reach the service it
      authenticates to from outside. Capability is demonstrated, not observed: Wiz shows
      memory disclosure, and RCE on WordPress, Drupal and Joomla; Wiz and Imperva report a response-header leak. The
      secret is not bound to the host address.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      The receiving service records use: IdP sign-ins, cloud audit logs, database logons,
      application sessions; none records possession or the read. Typically, IdP and cloud sign-ins are
      usually on; database connection and object-read logging usually are not.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Database connection logging and data-plane object-read events must be enabled; they are
          not on by default.
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Whether a receiving service logs source and client, and whether any store holds a session
          fingerprint, varies by estate and provider.
    summary: >-
      Needs the receiving service's audit log with principal, source address, network owner and
      client fingerprint per use, retained long enough for history. It then shows a key used from a
      new address, a database logon from a non-application host, or a replayed cookie. A DNS or flow
      record alone cannot name the secret.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable from legitimate use by a deviation from the principal's own history of source and
      tooling. It does not say how the secret was obtained, and does not tie the reuse to PHP2Shell
      without a link such as a response-header leak (DT-P2S-APP-009) or a host compromise finding.
    blocking_conditions:
      - condition: 'environment-inventory-required'
        note: >-
          A per-principal baseline of sources and a map of which secret lives on which host are
          needed to call a source new and to attribute it to a PHP host.
      - condition: 'below-alerting-signal-strength'
        note: >-
          For cloud and API keys, a first-seen source alone is noisy because staff, CI and autoscaling
          change address often, so it is a risk input, not an alert. The database and session checks
          compare against a host set or creation fingerprint instead.
      - condition: 'cross-source-join-required'
        note: >-
          Tying a reuse to a PHP host needs the secret inventory joined to identity or cloud logs.
    summary: >-
      A source deviation for a principal with stable history, plus knowledge that the secret sat on
      an exposed PHP host, is meaningful. Baseline from the principal's own sign-ins, not the stolen
      use. Attribution needs the exposure inventory (DT-P2S-ESTATE-011) or leak record
      (DT-P2S-APP-009). It is a risk signal.

attack_surface_context:
  surface: >-
    The credentials and tokens that a PHP application host holds, and the identity, cloud and
    database services that accept them.
  how_the_surface_works: >-
    A PHP app reads passwords, API keys and cloud credentials from config files, environment
    variables or a local store into worker memory. The receiving service logs principal,
    source address and sometimes client. Host credentials are often not address-bound; cookies work
    from other clients unless fingerprint-bound.
  incident_processing_path: >-
    No source describes credential reuse. Wiz and CrowdStrike demonstrated code execution on
    research targets (CrowdStrike: one anonymous request yielding a shell under mod_php), which
    would expose host secrets. Wiz and Imperva both describe the leak. Later use elsewhere is this pack's
    assumption.
  processing_stages:
    - 'secret-resident-on-host'
    - 'secret-read-or-leaked'
    - 'secret-carried-off-host'
    - 'use-from-new-source'
    - 'receiving-service-authenticates'
    - 'receiving-service-logs-the-use'
  stage_evidence: >-
    The read leaves no standard record, so evidence appears at the use: the receiving service's log
    shows principal, source and time. It proves a credential was presented from a source, not that it
    was stolen from the PHP host.
  trust_boundaries: >-
    The credential's issuing boundary: issued to the PHP host, presented from elsewhere. No source
    shows this for PHP2Shell, so it is unverified. The worker memory boundary is DT-P2S-APP-009.
  security_control_context: >-
    Host-bound credentials, short-lived metadata credentials, network allow-lists on
    database and cloud endpoints, and session binding to a client fingerprint cut a stolen secret's
    value; rotation after suspected exposure is the response. A bypass is use from an already-allowed address, such as another cloud range.
  technology_variants:
    - variant: 'cloud-provider-access-keys'
      context: >-
        Cloud audit logs record the access key, caller identity, source address and user agent of
        each API call, so a key used from a new network owner or tool is visible where the audit
        stream is on.
    - variant: 'database-logon'
      context: >-
        Database audit or connection logs record the account and client address; a logon from an
        address that is not an application host is the signal, where audit is on.
    - variant: 'web-session-token'
      context: >-
        A stolen session cookie replays as a new client fingerprint on an existing session; the
        application or proxy log must carry a fingerprint for the comparison.
  practitioner_implication: >-
    Discover which secrets each PHP host holds, which services accept them, which of those log
    source address and client details and for how long, and how each principal's normal sources are
    established without using the suspect activity.

threat_research:
  why_it_matters: >-
    A leak or a read leaves no trace in standard host logs, so the use of the stolen secret is the
    one point where an intrusion into a PHP host can still be noticed. ReliaQuest says such access could
    let attackers pivot into databases, cloud consoles and connected SaaS applications.
  threat_actor: >-
    Unknown. No source attributes use of a PHP host secret to any actor in the PHP2Shell context.
  actor_class: 'unknown'
  campaign: >-
    PHP2Shell (CVE-2026-109618 and CVE-2026-109619), status as of 2026-10-21. Wiz and CrowdStrike have
    demonstrated unauthenticated remote code execution in lab conditions, CrowdStrike end to end on
    Apache mod_php, and the PHP advisory for CVE-2026-109619 validates its session path against both
    mod_php and PHP-FPM. Exploitation attempts are reported by Cloudflare, watchTowr, Patchstack (a
    07:34 UTC entry relays active exploitation incidents from hosting partners; a 13:57 UTC entry
    describes only probing), Kaspersky (attempts before the patch), Hadrian (exploitation at scale,
    with no counts) and VulnCheck (canary scans and at least one session-path webshell attempt on 21 October,
    17:22-17:24 UTC, whose ten follow-up reads all returned 404). No source documents a confirmed compromise: CISA has not observed exploitation, ReliaQuest has not seen successful exploitation in customer environments, and Tanium reported on 21 October that neither CVE was in the CISA KEV catalog. Red Hat
    rates CVE-2026-109619 CVSS 3.1 8.1 for high attack complexity, while Red Hat's page lists NVD's score as 9.8. VulnCheck reports that none of the public proofs of concept it reviewed independently bypasses ASLR on x86-64, and that
    exploitation works on ARM64 and on x86 without ASLR.
  victim: 'None documented for this behavior.'
  capability: >-
    Memory disclosure and RCE are demonstrated (Wiz), as is a response-header leak (Wiz, Imperva). No
    source shows reuse of a secret.
  target: >-
    Credentials, tokens and sessions on internet-facing PHP hosts, and the services that accept
    them. Which secrets any real worker held in the disclosure cases is unpublished.
  victimology:
    - 'PHP applications holding database, cloud or API credentials in files, environment or memory.'
    - 'Hosts where those credentials are not bound to the host address.'

  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1552'
      name: 'Unsecured Credentials'
      evidence: >-
        Covers only the host-side acquisition of stored credentials; the behavior itself is their
        later use from elsewhere (see T1078).
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1078'
      name: 'Valid Accounts'
      evidence: >-
        The reuse presents a valid credential from another source, which is the technique. The
        mapping is the pack's reading, not a reported event.

visibility:
  telemetry_sources:
    - source: 'Identity provider sign-in and token logs'
      purpose: >-
        Show the principal, source address, network owner, client and outcome of each authentication
        so a new source for a principal is visible.
      event_vocabulary: 'application-record'
      tier: 'request-response'
      operational_viability: 'opt-in'
      details: >-
        Records carry principal, source address, device or client details and result. Service
        principal and managed identity sign-ins are logged apart from user sign-ins and may need
        export enabled for retention.
      advantages:
        - 'Directly shows who authenticated from where.'
        - 'Supports a baseline of per-principal sources.'
      limitations:
        - 'Service principal and managed identity sign-ins are a separate stream that may need export enabled for retention.'
        - 'Retention may be shorter than the baseline window needs.'
        - 'The record does not say where the credential came from.'
    - source: 'Cloud provider audit logs (management and data events)'
      purpose: >-
        Show the caller identity, access key, source address, user agent and error code for each API
        call made with a host credential.
      event_vocabulary: 'cloud-management-event'
      tier: 'no-tier-model'
      operational_viability: 'on-by-default'
      details: >-
        Management events are usually recorded by default in the major clouds; data-plane events such as
        object reads usually must be enabled (provider defaults vary). The record has the source address and user agent.
      limitations:
        - 'Data events are opt-in in most clouds, so object reads by the stolen key may be missing.'
        - 'The source address is a provider or proxy address when calls pass through a service.'
        - 'No field says the key was stolen.'
    - source: 'Database authentication and connection logs'
      purpose: >-
        Show the account and client address of each logon so a logon from a non-application host is
        visible.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'opt-in'
      details: >-
        Many engines log connections only when connection or audit logging is enabled; the record
        carries account, client address and result.
      limitations:
        - 'Off in many default configurations.'
        - 'Client address is the proxy or pooler address when connections are pooled.'
        - 'Does not show the query contents unless statement audit is on.'
    - source: 'Application session logs and proxy logs with client fingerprint'
      purpose: >-
        Show a session cookie presented from a client fingerprint different from the one that
        created it.
      event_vocabulary: 'application-record'
      tier: 'request'
      operational_viability: 'first-party-build'
      details: >-
        Needs a fingerprint stored at session creation and compared on later requests; the estate
        must build this application or proxy logic.
      limitations:
        - 'Fingerprints change for legitimate reasons such as network or browser updates.'
        - 'No standard log carries it.'
    - source: 'Read monitoring of configuration and environment files on the host'
      purpose: 'Considered as evidence of the read of a secret file.'
      event_vocabulary: 'host-process-event'
      tier: 'metadata'
      operational_viability: 'rejected-not-coverage'
      details: >-
        Reads of wp-config or environment files are rarely logged by endpoint tools and are
        dominated by the application's own routine reads, so this stream does not carry the deciding
        evidence.
      limitations:
        - 'Reads are not logged by most EDR products by default.'
        - 'The application reads its own config constantly; a read by the web user is normal.'
        - 'A memory leak does not read any file at all.'

detection:
  scope: >-
    Detection is on the use of the secret at the receiving service. Three strategies split the
    stream by secret type: cloud and API keys, database logons, and web session tokens. Each detects
    later use, not theft.
  outcome_guardrails: >-
    A new source is a deviation, not theft. A secret on an exposed PHP host is stronger but does not
    make PHP2Shell the route. A successful authentication establishes use; a
    failed one, an attempt, not possession; an authenticated call later denied authorization still
    shows acceptance (this pack's inference).
  shared_normalization_context: >-
    Normalise source addresses to network owner and ASN, classify the user agent or client
    fingerprint, and map each principal to the host or application that legitimately holds the
    secret.
  shared_enrichment_context: >-
    Join the secret to host inventory, the host's exposure state (DT-P2S-ESTATE-011) and any leak
    finding (DT-P2S-APP-009). A 30-day baseline of each principal's sources is useful; a short one
    raises noise but does not stop the join.
  strategies:
    - id: 'STRAT-CLOUD-KEY-NEW-SOURCE'
      name: 'cloud or API key used from a source new to that principal'
      objective: >-
        Detect a cloud access key or service credential held by a PHP host used from a network
        owner, address or tool never seen for that principal.
      incident_relevance: >-
        Targets a possible later consequence of a host compromise or leak. No source reports such a
        use for PHP2Shell.
      detection_logic: >-
        For each call or sign-in by a principal known to be a PHP-host credential, compare source
        network owner, address and client to the principal's baseline, and record the
        authentication outcome. Emit a risk signal when the source is new and the history is stable;
        a failed authentication is labelled an attempt as the principal. Alert when, in addition, the holding host is listed
        as exposed or unpatched, or the calls enumerate identity, list secrets or read storage.
      minimum_evidence: >-
        A record with principal, source address, network owner, time and authentication outcome; a
        baseline showing the source is new; and the entry mapping the principal to a PHP host. A
        failed or unknown outcome supports only an attempt. Without the entry, report a new-source
        use, not a PHP host secret reuse.
      correlation_context: >-
        Join on principal or access key id. Baseline window 30 days; host exposure state is point in
        time. Absorb cloud log delivery delay of minutes.
      detectors:
        - detector_class: 'identity-and-cloud-audit-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins cloud audit records to a per-principal source baseline and a host map.'
          limitations: 'Needs the audit stream retained long enough and the secret-to-host map.'
        - detector_class: 'cloud-native-anomaly-detection'
          technologies:
            - 'Cloud provider threat detection services'
          contribution: 'Flags use of credentials from unusual locations with the provider baseline.'
          limitations: 'Provider baselines are opaque and cannot be tied to the PHP host without the map.'
      benign_explanations:
        - explanation: >-
            An administrator, CI job or deployment tool legitimately uses the same credential from
            another address.
          distinguishing_context: >-
            The use matches known tooling by user agent and by an approved source list; a new
            network owner with a different client does not.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding cloud provider address ranges would also exclude an attacker using the stolen
            key from a rented cloud host.
        - explanation: 'The host moved, was rebuilt, or autoscaled to a new address.'
          distinguishing_context: >-
            The change coincides with a deploy or scaling event for the same application and the
            address belongs to the estate's own network.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: >-
            source address or user agent allow-list built from a single day of observed traffic
          reason: 'A stolen key used within that day would be enrolled as normal.'
        - field: 'exclusion of the principal because it is a service account'
          reason: 'Service credentials are the ones a PHP host holds and are the target.'
        - field: 'user agent string alone as an exclusion'
          reason: 'Adversary-settable; a tool can present any user agent.'
      blind_spots:
        - description: >-
            Missing telemetry: data-plane events such as object reads are off by default, so storage
            reads with the key may be invisible.
          routes_to: null
        - description: >-
            Evasion: the adversary presents the credential from an address inside an allow-listed
            range or through the estate's own proxy.
          routes_to: null
        - description: >-
            Attribution limit: the reuse cannot be tied to PHP2Shell without a leak record or
            exposure inventory.
          routes_to: 'DT-P2S-APP-009'
      analyst_response: >-
        Identify the principal and its host, retrieve the calls from the new source, rotate the
        credential, check the host for exposure state and sibling behaviors, and review what the
        calls reached.
      safe_conclusion: >-
        A credential held by a PHP host was accepted from a source new to it, or, where
        authentication failed or its outcome is unknown, was attempted as that principal; how it was
        obtained is not established.
    - id: 'STRAT-DB-LOGON-NON-APP-HOST'
      name: >-
        database logon with an application account from an address that is not an application host
      objective: >-
        Detect a database account used by a PHP application authenticating from an address that is
        not one of the application hosts.
      incident_relevance: >-
        Targets a possible consequence of a stolen database credential; no source reports it for
        PHP2Shell.
      detection_logic: >-
        Keep an inventory of the application hosts that legitimately connect with each application
        database account. Raise when a successful logon arrives from an address outside the set and
        outside approved administration hosts. Raise severity when schema listing or bulk reads
        follow. Treat pooler and proxy addresses as the client when the database sees only them, and
        compare at the pooler's own logs instead.
      minimum_evidence: >-
        A database authentication record with account, client address and result, and the
        application host set. With only the pooler address, report that attribution is limited.
      correlation_context: >-
        Join on account name and client address. The inventory changes with deploys, so refresh it
        and compare against the inventory at event time.
      detectors:
        - detector_class: 'database-audit-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Database audit plugins'
          contribution: 'Compares logon source to an application host set for each account.'
          limitations: 'Needs connection logging enabled and an accurate host set.'
      benign_explanations:
        - explanation: >-
            Database administrators or migration tooling connect with application accounts from
            jump hosts.
          distinguishing_context: >-
            The address belongs to an approved administration host list and the activity matches
            maintenance windows.
          overlaps_incident_instance: false
          tuning_hazard: >-
            A broad exclusion for the corporate network range would hide an attacker who has first
            moved onto an internal host.
      forbidden_exclusions:
        - field: 'exclusion of an entire internal address range from the host set check'
          reason: >-
            An adversary who pivots from the compromised PHP host appears from an internal address.
        - field: 'exclusion of logons that succeed'
          reason: 'Successful logon with a stolen credential is the behavior.'
      blind_spots:
        - description: >-
            Missing telemetry: connection logging is off in many default database configurations.
          routes_to: null
        - description: >-
            Attribution limit: connections through a pooler or proxy show only the pooler address as
            client.
          routes_to: null
      analyst_response: >-
        Identify the account and its legitimate hosts, retrieve the logon and following statements
        if audited, rotate the password, and inspect the application host for exposure.
      safe_conclusion: >-
        An application database account authenticated from an address outside the application host
        set; how the credential was obtained is not established.
    - id: 'STRAT-SESSION-REPLAY-NEW-FINGERPRINT'
      name: 'session token replayed from a new client fingerprint'
      objective: >-
        Detect a web session token presented from a client whose fingerprint differs from that of
        the client that created the session.
      incident_relevance: >-
        Targets a possible consequence of leaked session data; the sources do not report session
        replay.
      detection_logic: >-
        At session creation, record a fingerprint from a few stable client attributes and compare on
        each later request. Raise when the session continues from a different network owner and
        client family shortly after earlier requests, especially if privileged. Do not rely on client
        address alone, because mobile and corporate networks change it legitimately.
      minimum_evidence: >-
        Two requests under one session identifier with different fingerprints and network owners,
        and the session creation record. Without the creation record, report a fingerprint
        discontinuity only.
      correlation_context: >-
        Join on session identifier and time. Sessions rotate; the application must distinguish a
        rotation event from a replay.
      detectors:
        - detector_class: 'application-session-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Application logging frameworks'
          contribution: 'Compares fingerprints across requests of one session.'
          limitations: 'Needs a stored fingerprint, which no standard log provides.'
      benign_explanations:
        - explanation: >-
            A user moves between networks, or a proxy changes the client address mid session.
          distinguishing_context: 'The client family and device attributes remain the same; only the network changed.'
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'client address as the sole fingerprint component'
          reason: 'A replay through any proxy would be indistinguishable from the original client.'
      blind_spots:
        - description: >-
            Missing telemetry: no standard log stores the session creation fingerprint; this must be
            built.
          routes_to: null
        - description: 'Evasion: an adversary copies the fingerprint attributes with the token.'
          routes_to: null
      analyst_response: >-
        Identify the session, the account and the privileges, terminate the session, and check
        whether a leak on the same host could have exposed the session identifier.
      safe_conclusion: >-
        A session continued from a client fingerprint different from its origin; how the token was
        obtained is not established.

  supporting_technologies_considered: >-
    Secret scanning and cloud posture management show which secrets exist and where, supporting the
    secret-to-host map, but not use. Honeytoken credentials planted in host configuration would give
    a precise signal when used; they are a candidate control, not event evidence in the sources.

detector_requirements:
  required: >-
    Receiving-service audit logs with principal, source, client and, for keys and database,
    authentication outcome; per strategy, a principal source baseline, application host set or
    creation fingerprint; a secret-to-host map to attribute use to a PHP host; alert text saying a
    credential was used or attempted, not stolen.
  optional: >-
    A feed of host exposure state and leak findings adds attribution, and honeytoken credentials add
    precision; neither gates the deployment.
  correlation:
    capability: >-
      Stable principal and access key identifiers across identity, cloud and database logs; aligned
      clocks; and a maintained host-to-secret inventory.
    window: 'Event time against a 30-day baseline; exposure state at event time.'
  baselines:
    - name: 'Per-principal network owners, addresses and clients'
      window: >-
        30 days. For a principal on an exposed host, the window ends at the host's exposure start or
        2026-10-21, whichever is earlier, and stays frozen until the secret is rotated; otherwise
        rolling (this pack's inference).
      seeded_from: >-
        The principal's own authenticated calls from approved and known tooling; never seeded from
        calls that raised a risk signal or alert, which would enrol the stolen use as normal.
  product_support_caveat: >-
    Named products are only candidates; support depends on deployed sensors, logging, fields,
    parsing and licensing. Verify each service accepting a host secret logs source and client, data
    events are enabled, and the host-to-secret map is accurate. A 2026-10-21 search found no vendor
    rule for secret reuse.

missing_context:
  unverified:
    - >-
      The first-observed month 2026-10 is the month of the public disclosure (GHSA published
      2026-10-21T13:34Z), not an observation. Evidence class: inferred.
    - 'Whether any secret has been read from a PHP host through PHP2Shell; no source reports one.'
    - 'Which secrets any demonstrated leak actually contained; the sources do not publish them.'
    - 'Whether any adversary has reused a secret obtained this way.'
    - 'Retention and enablement of non-interactive and data-plane logs in a given estate; this varies by provider and tenant.'
  assumptions:
    - id: 'ASSUMPTION-SECRET-MUST-BE-USED-ELSEWHERE'
      verdict_changing: true
      statement: >-
        A secret from a PHP host has value only when presented to a service from elsewhere, so use
        is observable there. This is the pack's reasoning, not a source finding. If the adversary
        uses it only from the compromised host, the new-source signal never fires. Resolve by
        reviewing intrusion reports.
    - id: 'ASSUMPTION-NO-BINDING-TO-HOST'
      verdict_changing: false
      statement: >-
        The credentials are not bound to the host address, so a thief can present them anywhere.
        This is the pack's reading of common deployments. If wrong, bound credentials fail outright
        and the signal becomes a failed-authentication alert. Resolve by testing each credential
        from a non-host address in a lab.
  standing_negatives:
    - statement: >-
        No source reports credential reuse or compromise after PHP2Shell as of 2026-10-21
        (watchTowr, Cloudflare); Imperva saw no matching traffic pre-disclosure; Huntress none on
        partner systems at 4:30pm ET. Bounded by Patchstack's 07:34 UTC partner reports, unreconciled
        with its 13:57 UTC entry.
      ref: 'REF-WATCHTOWR'
      valid_until: '2026-10-28'
      recheck: >-
        Check the CISA KEV catalog, the watchTowr PHP2Shell page and the Patchstack live timeline,
        and re-read vendor and government advisories and incident reports for a confirmed compromise
        that includes credential theft or reuse.
    - statement: >-
        No vendor-published detection for post-exploitation secret reuse tied to PHP2Shell was found
        as of 2026-10-21; Huntress had not seen in-the-wild exploitation across its partner base as of 4:30pm ET that day (latest update). The
        search was not exhaustive for several vendors.
      ref: 'REF-HUNTRESS'
      valid_until: '2026-12-31'
      recheck: 'Re-read vendor advisories and the Huntress post for published post-exploitation cases.'

missing_states:
  - id: 'MISSING_SECRET_TO_HOST_MAP'
    meaning: 'Missing context: no inventory of which secrets each PHP host holds.'
    coverage_claim: 'coverage-limited'
    response: >-
      Report new-source use of any principal, not a PHP host secret reuse, and build the map from
      configuration and environment inventories.
  - id: 'MISSING_RECEIVING_SERVICE_AUDIT'
    meaning: >-
      Missing telemetry: the service that accepts the secret does not log source address and client.
    coverage_claim: 'no-coverage'
    response: >-
      State that reuse of that secret is invisible and rotate it after any exposure of the host
      instead of waiting for evidence.
  - id: 'MISSING_PRINCIPAL_BASELINE'
    meaning: 'Missing context: the principal has no stable source history.'
    coverage_claim: 'coverage-limited'
    response: >-
      Report as a low-confidence risk input and wait for a baseline rather than alerting on first
      use.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'principal_or_account_and_secret_type'
    - 'host_that_holds_the_secret_when_known'
    - 'host_exposure_state_when_known'
    - 'new_source_address_network_owner_and_client'
    - 'actions_taken_with_the_secret'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'linked_leak_or_compromise_finding'
      condition: >-
        when a response header leak record or host compromise finding exists for the host that holds
        the secret
    - field: 'authentication_outcome_and_any_authorization_denial'
      condition: 'when the strategy reads an authentication result (cloud and API keys, database accounts)'
    - field: 'principal_baseline_comparison'
      condition: 'when the strategy compares to a per-principal source baseline (cloud and API keys)'
    - field: 'application_host_set_comparison'
      condition: 'when the secret is a database account'
    - field: 'session_fingerprint_comparison'
      condition: 'when the secret is a web session token'
  recommended_title: 'Credential held by a PHP host used or attempted from a source new to it'
  unsupported_title: 'PHP2Shell attacker stole and reused our database credentials'

evidence:
  confirmed_incident_behavior: >-
    The sources describe the memory disclosure and RCE capability (Wiz) and a response-header leak
    (Wiz, Imperva), and report attempts but no confirmed compromise or post-exploitation (watchTowr,
    Patchstack partner reports). They do not describe credential reuse.
  supported_conclusion: >-
    A PHP host holds secrets that a memory disclosure or code execution could expose, and where the
    receiving service logs source and client, a use from a new source is a recorded, behavior-level
    signal. A detector may emit a risk signal of a new-source credential use, raised by exposure of
    the holding host.
  unsupported_conclusions: >-
    The evidence does not establish that any secret was stolen through PHP2Shell, that any was
    reused, an actor, or the content of any leak. It does not make this object PHP2Shell-specific
    coverage, and it does not establish that a first-seen source is malicious.
  procedure_boundary: >-
    This object is the use of a secret from a source that is not the host. The leak that may supply
    the secret is DT-P2S-APP-009, the exposed state is DT-P2S-ESTATE-011, and host-side
    post-exploitation (account, scheduler and file changes) is DT-P2S-APP-001 to DT-P2S-HOST-006 and
    is not evidence that this use occurred.
  references:
    - id: 'REF-WIZ'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: AI uncovers critical RCE vulnerabilities affecting 70% of the Internet'
      publisher: 'Wiz'
      url: 'https://www.wiz.io/blog/php2shell-php-rce'
      trust_tier: 'researcher'
      verification: 'confirmed'
      evidence_use: 'Supports the demonstrated memory disclosure and RCE capability; reports no secret reuse.'
    - id: 'REF-IMPERVA'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: When PHP Runs Out of Memory at the Wrong Moment'
      publisher: 'Imperva'
      url: 'https://www.imperva.com/blog/php2shell-vulnerability-updates/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Describes the response-header leak (about 67 KB of process memory) and WAF response-pattern
        checks; supports a leak channel and nothing about use of its content.
    - id: 'REF-PATCHSTACK-PHP'
      type: 'incident-campaign-secondary-source'
      title: 'Major security alert: PHP vulnerable to critical RCE, attacks ongoing'
      publisher: 'Patchstack'
      url: 'https://patchstack.com/articles/php-major-vulnerability-alert-10-2026/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Relays Wiz hunting signs. 07:34 UTC entry relays partner reports of active exploitation
        incidents; 13:57 UTC entry says probing only, no hard evidence of breaches. Unreconciled; no
        confirmed compromise documented.
    - id: 'REF-WATCHTOWR'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: PHP Remote Code Execution Exploited'
      publisher: 'watchTowr'
      url: 'https://watchtowr.com/intelligence/php-remote-code-execution-php2shell/'
      trust_tier: 'researcher'
      verification: 'confirmed'
      evidence_use: >-
        Reports active exploitation attempts against both CVEs, in a post published 14:19 UTC, and
        describes no post-exploitation; supports the standing negative on reuse.
    - id: 'REF-HUNTRESS'
      type: 'incident-campaign-secondary-source'
      title: 'Rapid Response: php2shell, Leaked Critical PHP Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)'
      publisher: 'Huntress'
      url: 'https://huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        States generic detection of web servers spawning shells; had not seen in-the-wild exploitation
        across its partner base as of 4:30pm ET on 2026-10-21 (latest update); supports the standing negative on reuse.
    - id: 'REF-CROWDSTRIKE'
      type: 'incident-campaign-secondary-source'
      title: 'CrowdStrike Protects Customers from Threats Delivered via PHP2Shell'
      publisher: 'CrowdStrike'
      url: 'https://www.crowdstrike.com/en-us/blog/crowdstrike-protects-customers-from-php-rce-zero-days/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Reports researcher end-to-end RCE on mod_php, which makes host secrets exposable; reports no
        secret reuse.
    - id: 'REF-GHSA-109618'
      type: 'attack-surface-documentation'
      title: 'RCE via OOM corruption'
      publisher: 'PHP project (php-src security advisories)'
      url: 'https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Names CVE-2026-109618 as out-of-memory corruption; published 2026-10-21 13:34 UTC; nothing
        on secret reuse.
    - id: 'REF-GHSA-109619'
      type: 'attack-surface-documentation'
      title: 'RCE via stale global state'
      publisher: 'PHP project (php-src security advisories)'
      url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Supports that the session path is validated against both mod_php and PHP-FPM, as stated in
        the campaign statement; published 2026-10-21 13:34 UTC; nothing on secret reuse.
    - id: 'REF-TANIUM'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: Responding to CVE-2026-109618 and CVE-2026-109619'
      publisher: 'Tanium Guardian Research Team'
      url: 'https://www.tanium.com/blog/php2shell-responding-to-cve-2026-109618-and-cve-2026-109619'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Exploitation status: neither CVE in CISA KEV per the page's 14:04 UTC entry on 2026-10-21; no public IOCs
        released. Relays VulnCheck on public PoCs and watchTowr honeypot exploitation.
    - id: 'REF-CLOUDFLARE'
      type: 'incident-campaign-secondary-source'
      title: 'Cloudflare deploys protections against php2shell vulnerability'
      publisher: 'Cloudflare'
      url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Cited for the exploitation status in the campaign statement: observed attack traffic targeting
        its customers. Attempts against an edge, not compromise of a host.
    - id: 'REF-KASPERSKY'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: How to Protect Your Server'
      publisher: 'Kaspersky'
      url: 'https://www.kaspersky.com/blog/cve-2026-109618-109619-php-vulnerabilities/56583/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        Cited for the exploitation status in the campaign statement: first attempts were observed
