    - id: 'REF-RELIAQUEST'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell: Responding to Critical PHP Vulnerabilities | Threat Spotlight'
      publisher: 'ReliaQuest'
      url: 'https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
