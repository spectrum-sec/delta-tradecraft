    - id: 'REF-HADRIAN'
      type: 'incident-campaign-secondary-source'
      title: 'php2shell: Leaked critical PHP RCEs (CVE-2026-109618, -109619)'
      publisher: 'Hadrian'
      url: 'https://hadrian.io/vulnerability-alerts/php2shell-leaked-critical-php-rce-cve-2026-109618-cve-2026-109619'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        CISA and ReliaQuest report no observed (successful) exploitation, while Hadrian reports it
