        pivots; reports none.
    - id: 'REF-PHP2SHELL-SITE'
      type: 'incident-campaign-secondary-source'
      title: 'PHP2Shell — AI uncovers critical vulnerabilities in the backbone of the web'
      publisher: 'php2shell.com (research disclosure site)'
      url: 'https://www.php2shell.com/'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
