      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Recommends reviewing download or networking tools (curl, wget, nc) and reverse-shell strings
        after PHP RCE; no in-the-wild exploitation on partners (10am and 4:30pm ET). Not
        observation.
