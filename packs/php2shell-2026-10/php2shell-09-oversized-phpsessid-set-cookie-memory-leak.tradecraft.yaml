      trust_tier: 'researcher'
      verification: 'confirmed'
      evidence_use: >-
        States that it demonstrated unauthenticated memory disclosure (application-agnostic) and,
        separately, RCE against WordPress, Drupal and Joomla. No in-the-wild use or leaked content.
