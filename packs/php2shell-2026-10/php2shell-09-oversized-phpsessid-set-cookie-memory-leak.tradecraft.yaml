      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Single vendor: an attack can expose approximately 67 KB of process memory through a Set-Cookie: PHPSESSID header; leads include unexpectedly large PHPSESSID response values. Size not corroborated.
