identity:
  uuid: '84621582-2be2-47a6-8af2-1945bcbd1f31'
  id: 'DT-J4SH-HOST-002'
  name: 'A network-exposed Java process dies on a fatal JVM error and is restarted (generic crash signal; possible attempt only on an affected build)'
  incident: 'Java4Shell (CVE-2026-114938)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-18'

classification:
  primary_attack_surface: 'application-runtime'
  secondary_attack_surfaces:
    - 'host-os'
    - 'container-workload'
  behavior_classes:
    - 'other'
  behavior_classes_note: >-
    Denial-shaped runtime failure of an exposed service (ATT&CK T1190 attempt, resembles T1499):
    no member names a crash of the attacked process.
  tags:
    - 'java4shell'
    - 'openjdk'
    - 'jvm-crash'
    - 'hs-err'
    - 'crash-loop'
    - 'generic'
    - 'risk-signal'
    - 'attempt-only'
    - 'must-have'
    - 'denial-of-service'
    - 'lab-checked-artifacts'

behavior:
  definition: >-
    A network-exposed JVM aborts on a fatal VM error and its supervisor restarts it, possibly in a
    loop. Generic: detects generic behavior that also covers this threat; don't report as
    Java4Shell-specific coverage.
  detailed_definition: >-
    A JVM on a fatal error prints a banner, writes a report and exits; a supervisor restarts it.
    A crash is at most a possible attempt, never a cause or compromise. It is
    Java4Shell-relevant when DT-J4SH-ESTATE-001 reads the process affected;
    on not affected or mitigated-not-patched it is an ordinary crash, down-ranked.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a fatal JVM error on a service that is network-reachable; whether the build is
      affected is the verdict of DT-J4SH-ESTATE-001, not a property of the crash.
    summary: >-
      Needs a JVM process serving a network path and a supervisor or operator that restarts it.
      Datadog rates denial of service the more readily achievable impact and its test JVM later
      crashed during garbage collection (REF-DATADOG-JAVA4SHELL); other labs reproduced JVM
      crashes (REF-THN-JAVA4SHELL).
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where container status, stdout logs, file-create records or service-manager
      records are collected; the error report file is lost where the container is ephemeral.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          File-create records for the report path need an EDR sensor or audit rule on the path;
          container stdout needs a log shipper.
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Container exit status sits in the container's terminated state and reaches a SIEM only via
          a status collector or runtime die events; service-manager and core-dump records only where shipped.
      - condition: 'action-emits-no-record'
        note: >-
          Structurally lost: the report file written inside an ephemeral container (working or temp
          directory) is deleted with it, so only the banner and the exit status survive.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      A fatal JVM error is separable from deploys and external kills; its cause is not, and on a
      process 001 does not read affected it is an ordinary down-ranked crash.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          Linking a crash to an affected verdict needs the build line from the banner or report and
          the per-process verdict of DT-J4SH-ESTATE-001, which reads the CPU from the host.
      - condition: 'below-alerting-signal-strength'
        note: >-
          A crash alone matches native-library, JIT and memory-pressure failures; it is a lead, not
          an alert, unless the build has an affected verdict and the service is exposed.
    summary: >-
      A fatal JVM error is separable by the banner or a read report; exit status, signal or a core
      alone gives a crash candidate, with kills, OOM and deploys down-ranked. Not separable by crash
      alone from other crash causes.

attack_surface_context:
  surface: >-
    The JVM fatal-error path and the workload supervisors (container runtime, orchestrator,
    service manager) around a network-exposed Java service.
  how_the_surface_works: >-
    On a fatal error the JVM writes hs_err_pid<pid>.log in the working directory, or the OS temp
    directory (/tmp; %TMP% or %TEMP% on Windows) if it cannot, unless -XX:ErrorFile sets the path;
    the header also goes to stdout (REF-ORACLE-FATAL-ERROR-LOG). A supervisor restarts it.
  incident_processing_path: >-
    Other labs report crashes, memory corruption and a memory disclosure (REF-THN-JAVA4SHELL,
    REF-BLACKPOINT-JAVA4SHELL); Datadog's test JVM crashed later in garbage collection, so a crash
    can lag its input (REF-DATADOG-JAVA4SHELL). No primary source names a frame or stub.
  processing_stages:
    - 'jvm-process-serving-network-requests'
    - 'fatal-error-detected'
    - 'banner-written-to-stdout'
    - 'error-report-file-written'
    - 'process-ends-on-abort-or-fault-signal'
    - 'supervisor-restarts-workload'
  stage_evidence: >-
    The banner proves a fatal VM error and carries the build line. Exit status alone does not:
    an external SIGSEGV also exited 134 in our lab and java as PID 1 is unmeasured; Hadrian saw 134
    with a fatal error log on Temurin 17 (REF-HADRIAN-JAVA4SHELL, supporting only).
  trust_boundaries: >-
    The boundary at issue is attacker-controlled Base64 reaching the JDK decoder, often before
    authentication (REF-REDHAT-RHSB-2026-018). A crash shows at most that something went wrong
    inside the process, never which input reached it.
  security_control_context: >-
    -XX:ErrorFile moves the report; -XX:-CreateCoredumpOnCrash exits 1, not an abort
    (REF-JDK17U-OS-POSIX). A memory-limit kill leaves no banner; heap out-of-memory aborts only if
    set to crash on it; a failed native malloc or mmap prints the insufficient-memory header and
    exits 1 without a core (REF-JDK17U-VMERROR).
  special_context:
    topic: 'jvm-fatal-error-artifacts'
    context: >-
      Our lab saw the banner on stdout, exit 134 with the out-of-memory flag false under an init
      process, a report at the default or ErrorFile path, and "(sent by kill)" on an external signal.
      Java 8 shows si_code 0 instead. Not every fatal error is SIGSEGV.
  practitioner_implication: >-
    Discover which workloads run a JVM and are exposed, whether JVM output and container exit
    status reach the SIEM, whether -XX:ErrorFile is set to a durable path, and the live build, host
    CPU features and flags per process (DT-J4SH-ESTATE-001).

threat_research:
  why_it_matters: >-
    Must-have: crashes are the outcome most public lab reports describe and Datadog rates denial of
    service the more readily achievable impact (REF-BLACKPOINT-JAVA4SHELL, REF-HADRIAN-JAVA4SHELL,
    REF-DATADOG-JAVA4SHELL), so on an affected build a crash is the likeliest trace of an attempt
    though it cannot show harm.
  threat_actor: 'Unknown. No source attributes any Java4Shell activity to anyone.'
  campaign: >-
    Java4Shell (CVE-2026-114938) was published 2026-11-17 (REF-CVE-API); vendor fixes are out for
    most distributors (REF-OPENJDK-ADVISORY-2026-11-17); not in KEV and no in-the-wild exploitation
    reported as of 2026-11-18 ~06:00 PT (REF-CISA-KEV, REF-CCCS-AL26-029); status expires 2026-11-20.
  victim: 'None documented.'
  capability: >-
    Calif (public proof of concept) and Wiz state code execution against named products, chains
    unpublished (REF-CALIF-JAVA4SHELL, REF-WIZ-JAVA4SHELL); other labs report crashes, corruption
    and a memory disclosure (REF-THN-JAVA4SHELL, REF-BLACKPOINT-JAVA4SHELL); Hadrian states lab code
    execution (REF-HADRIAN-JAVA4SHELL).
  target: >-
    Network-exposed Java services on HotSpot x86-64 builds below the vendor fix: branch 17 from
    17.0.6, and 21, 25 and 27 (REF-OPENJDK-ADVISORY-2026-11-17); CPU and flags decide per
    process (DT-J4SH-ESTATE-001). An unknown verdict is neither affected nor cleared.
  victimology:
    - 'Internet or untrusted-network facing Java services in containers or on hosts.'
    - 'Fleets of one JVM build behind a restarting supervisor, where a crash wave would be visible.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1190'
      name: 'Exploit Public-Facing Application'
      evidence: >-
        Targeted but unachieved: a crash would be at most a failed or noisy attempt on an exposed
        service. No attempt is reported (REF-CCCS-AL26-029, REF-JPCERT-2026111801); the mapping is
        this pack's reading of the behavior.

visibility:
  telemetry_sources:
    - source: 'Container runtime and orchestrator workload status'
      purpose: >-
        Show how a JVM workload ended (exit code, signal, reason) and its restarts: signal 6 or 11,
        exit 134 or 139 is a crash candidate; 137, 143 or OOMKilled is a kill, down-ranked.
      event_vocabulary: 'other'
      event_vocabulary_note: >-
        Workload status records (exit code, signal, reason, restart count); none of the listed
        families covers them.
      tier: 'no-tier-model'
      operational_viability: 'other'
      operational_viability_note: >-
        Exit code and reason sit in the container's terminated state, not an event stream
        (REF-K8S-POD-LIFECYCLE); a SIEM sees them only via a status collector or runtime die events.
      fields:
        - name: 'state.terminated.exitCode and lastState.terminated.exitCode'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-K8S-API-TYPES'
          load_bearing: true
          note: >-
            Lab: a JVM abort gave 134 under an init, and so did an external SIGSEGV. PID 1 unmeasured.
            A flat code loses exit versus signal (REF-WAITPID): System.exit(134) looks the same. Exit
            1 (REF-JDK17U-OS-POSIX) only with a banner or report.
        - name: 'state.terminated.signal and lastState.terminated.signal'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-K8S-API-TYPES'
          load_bearing: true
          note: >-
            int32 signal number (6 = SIGABRT, 11 = SIGSEGV), not a name; optional and often unset when
            the runtime reports only 128+n in exitCode. Keep it apart from exitCode. Not lab-checked.
        - name: 'state.terminated.reason and lastState.terminated.reason'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-K8S-API-TYPES'
          load_bearing: true
          note: 'Free text; the OOMKilled value is not in the cited type file. Docker shows State.OOMKilled (lab: false on a JVM abort).'
        - name: 'restartCount'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-K8S-API-TYPES'
          load_bearing: true
          note: 'Cumulative; may reset to 0 on node restart; a replacement pod starts a new count.'
        - name: 'state.terminated.containerID and finishedAt (and lastState.terminated)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-K8S-API-TYPES'
          load_bearing: true
          note: 'Dedupe key. Image and entrypoint come from separate status and spec fields; other platforms not sourced.'
      details: >-
        Kubernetes status holds only the current state and lastState (REF-K8S-API-TYPES), so retain
        each transition or runtime die event. Default back-off doubles from 10s to a 300s cap, subject
        to version, feature gates and kubelet settings (REF-K8S-POD-LIFECYCLE).
      advantages:
        - 'Survives the loss of the report file; needs no sensor on the host.'
      limitations:
        - 'Exit 134 or 139 is a crash candidate, not a fatal VM error: System.exit, a wrapper, an external signal or a native abort gives it too.'
        - 'HotSpot handles SIGSEGV itself and ends through abort, so 134 is the usual fatal-error exit (REF-JDK17U-VMERROR); 139 means a fault the VM did not handle, so a VM fatal error is not its expected cause, yet both stay candidates.'
        - 'Java as PID 1 without an init (the Kubernetes default) was not measured; the exit may not be 134, or a hang may end in a probe kill (137).'
        - 'A feed of cluster events or audit logs may not carry the exit code; check the fields.'
        - 'No cause: the same status follows native-library crashes and deliberate aborts.'
        - 'Polling status loses crashes between polls; restartCount can reset and a replacement pod starts a new count.'
        - 'Exit 1 is a JVM fatal error only with a matching banner or report (core dumps off in the JVM, or a native-memory failure, which never dumps core); most exit 1s are not crashes.'
    - source: 'Container stdout and service logs'
      purpose: 'Carry the fatal-error banner, its signal or reason line, and the JVM build line.'
      event_vocabulary: 'application-record'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'banner: A fatal error has been detected by the Java Runtime Environment'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ORACLE-FATAL-ERROR-LOG'
          load_bearing: true
          note: 'Oracle: the header goes to stdout and may show in the output log. Lab: on stdout; stderr held only the shell abort line.'
        - name: 'header: There is insufficient memory for the Java Runtime Environment to continue.'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-JDK17U-VMERROR'
          load_bearing: true
          note: >-
            Printed instead of the fatal-error line when a native malloc or mmap fails; a resource
            failure with exit 1 and no core. Not lab-checked.
        - name: 'signal or reason line, with "(sent by kill)"'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Lab: "(sent by kill)" marked an external signal on 17+; Java 8 shows siginfo si_code 0.
        - name: 'JRE version line'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ORACLE-FATAL-ERROR-LOG'
          load_bearing: true
          note: 'The header shows signal, pid and JRE and VM version and build.'
      details: >-
        The banner is the durable, ephemeral-safe copy of the crash. In our lab it listed the
        signal or internal-error line, the JRE and VM build, and the report path.
      advantages:
        - 'Works when the container and its report file are gone; carries the build for the inventory join.'
      limitations:
        - 'Needs the JVM output collected; streams can be redirected or merged, so match any stream.'
        - 'Multi-line banner can be split or truncated by the shipper.'
        - 'The fatal-error banner alone does not separate an abort on Java heap out-of-memory from a memory fault; read the reason line.'
    - source: 'File-create telemetry (EDR, audit, file integrity monitoring)'
      purpose: 'Show a java process creating a file named as the JVM error report in its working or temp directory or at the ErrorFile path: a candidate report.'
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'TargetFilename (Sysmon event 11)'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Sysmon event 11 records file create and overwrite (REF-SYSMON); the page names no event 11
            fields. Linux audit and FIM field names are not sourced here.
        - name: 'Image (Sysmon event 11)'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'Creating process; the page shows Image only as a field of other events. Content is not recorded.'
        - name: 'report path: hs_err_pid<pid>.log in the working or temp directory, or the -XX:ErrorFile value'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ORACLE-FATAL-ERROR-LOG'
          load_bearing: true
          note: >-
            Oracle states the default name, the working directory, the temp-directory fallback (/tmp;
            %TMP% or %TEMP% on Windows) and ErrorFile with %p as the pid. Our lab saw the working-directory default.
      details: >-
        A create of a file with that name by a java process, in its working directory, the OS temp
        directory or the ErrorFile path, is a candidate error-report file; only its header or a
        matched banner shows a fatal error. A real report holds a CPU line and build.
      advantages:
        - 'Independent of log shipping; unaffected by banner truncation.'
      limitations:
        - 'Not collected by default; file events on a temp or working path are often filtered out.'
        - 'Lost with an ephemeral container unless the path is a mounted volume.'
        - 'ErrorFile can be set to a path or name the rule does not know, and -XX:+ErrorFileToStdout or ErrorFileToStderr writes no file at all (REF-JDK17U-GLOBALS).'
    - source: 'Host service-manager and core-dump records'
      purpose: 'Show a java service unit failing on a signal or abort and a core dump being recorded.'
      event_vocabulary: 'other'
      event_vocabulary_note: >-
        Service-manager journal and core-dump handler records; none of the listed families fits.
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'journal process-exit record: EXIT_CODE, EXIT_STATUS, MESSAGE, INVOCATION_ID'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SYSTEMD-UNIT-C'
          load_bearing: true
          note: >-
            systemd source: EXIT_CODE is exited, killed or dumped; EXIT_STATUS is always a number,
            the exit status with exited or the signal (6 ABRT, 11 SEGV) with killed or dumped,
            named only in MESSAGE, so read them together. A clean exit, even one SuccessExitStatus
            declares, is logged at debug level. Not lab-checked.
        - name: 'journal unit-failure record: UNIT_RESULT, INVOCATION_ID'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SYSTEMD-UNIT-C'
          load_bearing: true
          note: >-
            A separate "Failed with result" record carries UNIT_RESULT (signal, core-dump,
            oom-kill, exit-code); join on unit and INVOCATION_ID. REF-SYSTEMD-EXEC's
            SERVICE_RESULT, EXIT_CODE and EXIT_STATUS are the ExecStopPost environment, usable
            only via a collector run there.
        - name: 'core-dump record: executable, signal, pid'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: 'Lab: an abort left a core file of about 450 MB in the working directory where ulimit allowed.'
      details: >-
        On a host service a failed unit and a core-dump record give the crash and its signal even
        where the banner goes to a log nobody collects.
      limitations:
        - 'Core dumps are often disabled, size-limited or routed away.'
        - 'Not checked in our lab; only the systemd source and man page are read.'
        - 'Container workloads usually have no service manager.'
        - 'Windows services have no systemd record; a Windows crash path is not sourced here.'
    - source: 'Inbound request logs and runtime build inventory'
      purpose: >-
        Show which hosts run the same build, for the wave branch of the hunt in strategy five, and
        request context that only ranks its findings.
      event_vocabulary: 'application-record'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'live JVM build and effective flags per process (jcmd VM.version, VM.flags -all)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ORACLE-JCMD'
          load_bearing: true
          note: >-
            jcmd gives the live build and effective flags (REF-ORACLE-JCMD). The CPU condition is
            the host or guest read (/proc/cpuinfo or hypervisor inventory), as CERT Polska checks
            it (REF-CERT-POLSKA-216-2026); the JVM's CPU line drops AVX-512 when UseAVX is below
            3, so it only cross-checks. Use 001's verdict as is.
        - name: 'request time, status and connection outcome per exposed service'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: >-
            Used only as time context; the pack names no request shape and no source ties one to a
            crash.
      details: >-
        Access logs give time, client, status and aborted connections around a crash. The build
        inventory from DT-J4SH-ESTATE-001 or the banner's build line groups crashes by build.
      limitations:
        - 'Request logs show no crash and no cause; a clustering in time can be chance or a deploy.'
        - 'Inventory is a first-party build and goes stale after a restart on a new build.'

detection:
  scope: >-
    Five strategies: exit status, report file, banner, service and core-dump records, and a hunt
    for a crash wave on one build or a non-hook child of a crash. Generic JVM-crash detection as
    CISA ("unexpected JVM crashes") and Sysdig ("bursts of worker restarts") word it
    (REF-CISA-ALERT-2026-11-17, REF-SYSDIG-JAVA4SHELL).
  outcome_guardrails: >-
    A restart is a supervisor action. ABRT, SEGV, 134, 139 or a core is a crash candidate; a fatal
    error needs that process's banner or read report. A report-file create alone is at most
    relevant for investigation. Only a crash on an exposed service that 001 reads affected, with
    no benign cause, is a possible attempt.
  shared_normalization_context: >-
    Key a crash by container ID or host, pid and time; keep exit status apart from signal
    (REF-WAITPID). Banner: the fatal-error or native insufficient-memory header (down-ranked).
    Classes: fatal error, crash candidate (ABRT, SEGV, 134, 139, core), kill (137, 143, KILL,
    TERM, OOM), candidate report; exit 1 needs a banner.
  shared_enrichment_context: >-
    Join each crash to the live verdict of DT-J4SH-ESTATE-001 (affected, mitigated-not-patched, not
    affected or unknown) and to deploy, scale and drain events, attached to down-rank, not drop.
    Unknown stays unscoped; not affected or mitigated-not-patched is an ordinary crash.
  strategies:
    - id: 'STRAT-WORKLOAD-ABORT-OR-FAULT-EXIT'
      name: 'JVM workload ends on an abort or fault exit (crash candidate), kills down-ranked'
      objective: >-
        Detect a java workload ending on ABRT, SEGV, exit 134 or 139 as a crash candidate, a fatal
        JVM error only with its banner or report, rank kills and OOM below it, and escalate on a
        crash loop.
      incident_relevance: >-
        Generic: detects generic behavior that also covers this threat; don't report as
        Java4Shell-specific coverage. Matches CISA "unexpected JVM crashes" and Sysdig "bursts of
        worker restarts" (REF-CISA-ALERT-2026-11-17, REF-SYSDIG-JAVA4SHELL).
      detection_logic: |
        Admit every java workload termination (state or lastState) with signal 6 or 11 (ABRT or
        SEGV by name), exitCode 134, 139, 137 or 143, reason OOMKilled, or exitCode 1 with a banner
        or report. Keep exitCode, signal and reason as emitted; dedupe by containerID and finishedAt. Rank: fatal JVM error with a banner or report; crash candidate for 6, 11,
        134 or 139 alone; down-ranked, never dropped, with the change attached: 137, 143,
        OOMKilled, eviction, "(sent by kill)", an out-of-memory reason, rollout, drain or stop in 15
        minutes. Raise on 3+ restart deltas in 60 minutes, a crash-loop state or an exposed
        workload. Join 001: affected is a possible attempt; others down-rank, never drop.
      minimum_evidence: >-
        A java workload termination with exitCode, signal and reason as emitted, ranked: fatal JVM
        error only with a banner or report; signal 6 or 11 (ABRT, SEGV), 134 or 139 alone a crash
        candidate; 137, 143 or OOMKilled a down-ranked kill. State any change. Without identity, an
        unexplained exit.
      correlation_context: >-
        Keys are container ID and termination time; the 15-minute change window (down-rank only) and
        3-in-60 escalation are this pack's choices. Count restart deltas, not delays, since back-off
        varies (REF-K8S-POD-LIFECYCLE, REF-K8S-API-TYPES). Events can arrive late.
      detectors:
        - detector_class: 'container-lifecycle-detection'
          technologies:
            - 'Kubernetes pod and container status'
            - 'Docker or containerd events'
            - 'Cloud container platform status'
          contribution: 'Gives exit code, kill reason, restart count and workload identity.'
          limitations: 'Cannot tell a fatal VM error from an external signal; blind where no collector ships the terminated state.'
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins terminations to deploy events and the exposure inventory.'
          limitations: 'Only as good as ingested status fields and clock alignment.'
      benign_explanations:
        - explanation: 'The JVM aborts on out-of-memory because the operator set it to crash on out-of-memory.'
          distinguishing_context: >-
            Only the banner reason line names out-of-memory; from exit status alone it cannot be
            told apart and stays a lead. Heap use or limits rose before it.
          overlaps_incident_instance: true
          tuning_hazard: >-
            An abort on out-of-memory is a resource fault; down-rank by the reason line only, never
            drop, since exit status alone matches a fault crash, and keep other Internal Error banners.
        - explanation: 'A native malloc or mmap fails and the JVM exits 1 with the insufficient-memory header.'
          distinguishing_context: >-
            Exit 1 with no core and the header "There is insufficient memory for the Java Runtime
            Environment to continue." for that pid (REF-JDK17U-VMERROR).
          overlaps_incident_instance: false
          tuning_hazard: 'A resource failure; down-rank by the header, never drop, and do not infer a cause from it.'
        - explanation: >-
            System.exit(134 or 139), a wrapper returning that status, an external signal or a native
            abort() ends the JVM without HotSpot fatal-error handling (REF-WAITPID).
          distinguishing_context: >-
            No fatal-error banner or report for that pid; a sending process, wrapper or application
            exit message instead.
          overlaps_incident_instance: false
          tuning_hazard: 'Keep it a crash candidate without the banner or report; do not exclude exit 134 as a class, nor admit exit 1 without it.'
        - explanation: 'A native library, agent or JIT bug crashes the JVM.'
          distinguishing_context: >-
            Same workload crashes at the same call site across versions and hosts; no change after
            patching; the fault frame names the library.
          overlaps_incident_instance: true
          tuning_hazard: >-
            The fault frame of a real memory-corruption crash is unsourced and may sit anywhere;
            excluding by frame or library also removes the incident.
        - explanation: 'A deploy, scale-in, node drain, or operator kill ends the workload.'
          distinguishing_context: >-
            A rollout or drain event exists for it, or the banner shows "(sent by kill)"; exit 137
            is the usual signature for kills.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Suppress only a termination positively matched to a planned stop by estate policy;
            excluding all restarts in a change window hides a crash in it.
        - explanation: 'The process runs a build, CPU or flag set that 001 rates not affected or mitigated-not-patched.'
          distinguishing_context: >-
            The live verdict on the crashed process, not its host or image tag, reads not affected or
            mitigated-not-patched, so the crash has another cause.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the verdict only, never drop: it is a point-in-time read and goes stale
            after a restart or a flag change.
      forbidden_exclusions:
        - field: 'processes that 001 rates not affected or mitigated-not-patched'
          reason: 'Down-rank only: the verdict is point-in-time, and the crash is still worth ranking.'
        - field: 'workloads that restart often (known flappy)'
          reason: 'A crash loop is the signal; exempting the flappy services removes the one that matters.'
        - field: 'JVM vendor or image tag, other than the version string'
          reason: 'Scope is by build per DT-J4SH-ESTATE-001; a tag is adversary-settable and drifts.'
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          In a telemetry-only lab we own (ordinary JVM runs, flag dumps and benign crashes; the
          vulnerability was not triggered), an out-of-memory abort under an init process exited 134
          with the flag false, as did an external SIGSEGV, on emulated x86. PID 1 and restarts unseen.
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate. Stable fleets should see this rarely; an estate with flapping
          services will not. Figure unmeasured.
      blind_spots:
        - description: >-
            Missing telemetry: no container status shipped; java as PID 1 without an init is
            unmeasured: a namespace init gets only handled signals (REF-PID-NAMESPACES), so the abort
            may hang until a probe kill (137), which this strategy only down-ranks.
          routes_to: null
        - description: >-
            Coverage limit: a JVM that ends with an exit code outside the admitted set, or a workload
            under restartPolicy Never, leaves no crash loop for this strategy to escalate.
          routes_to: null
        - description: >-
            Missing telemetry: a status poller sees only state and lastState, so crashes between polls
            are lost; exit 1 (core dumps off in the JVM, or a native-memory failure) is silent
            without the banner.
          routes_to: null
        - description: >-
            Missing telemetry: Windows Java services; this logic is Linux and container only and was
            not lab-checked on Windows.
          routes_to: null
        - description: >-
            Scope: build, CPU or flags unknown; this strategy cannot say the process is affected.
          routes_to: 'DT-J4SH-ESTATE-001'
        - description: >-
            Scope: CERT Polska says successful exploitation may leave no log traces
            (REF-CERT-POLSKA-216-2026) and Sysdig says almost nothing at the application layer
            (REF-SYSDIG-JAVA4SHELL); a missing crash clears no host.
          routes_to: 'DT-J4SH-HOST-003'
      analyst_response: >-
        Read the last log lines for the banner, reason and build line, deploy and drain events and
        restart count. Check the 001 verdict on the live process (REF-ORACLE-JCMD), other replicas
        on the build and exposure.
      safe_conclusion: >-
        A Java workload ended abnormally: a crash candidate, a down-ranked kill, or a fatal JVM error
        only where its banner or report matches, with any nearby change stated; the cause, any
        trigger and any compromise are not established.
    - id: 'STRAT-ERROR-REPORT-FILE-CREATE'
      name: 'java process creates a file named as a JVM error report (candidate report)'
      objective: >-
        Detect a java process creating a file named hs_err_pid<pid>.log, or at its -XX:ErrorFile
        path, from file-create telemetry, as a candidate error-report file.
      incident_relevance: >-
        Generic: detects generic behavior that also covers this threat; don't report as
        Java4Shell-specific coverage. Matches Sysdig "hs_err_pid*.log files" (REF-SYSDIG-JAVA4SHELL).
        Survives banner loss, not an ephemeral container.
      detection_logic: >-
        Alert on a file-create by java, java.exe or javaw.exe (or the service's launcher, such as
        a procrun service exe) named hs_err_pid<digits>.log in its working directory, the OS temp
        directory (/tmp; %TMP% or %TEMP% on Windows) or its -XX:ErrorFile path with %p as the pid,
        learned from the command line. Exclude copy, archive or read tools. The create is a
        candidate report: with an affected 001 verdict it is relevant for investigation, never an
        attempt; other verdicts down-rank, never drop. It is a fatal-error report
        (REF-JDK17U-VMERROR) only once its header is read or a banner matches; down-rank an
        out-of-memory reason or header. Raise on a network-serving host or 3+ in 60 minutes.
      minimum_evidence: >-
        A create record with the java process image and a path matching the report name or the
        ErrorFile value: a candidate error-report file, at most relevant for investigation. A
        fatal-error report needs its header read or a matched banner. A matching name made by another
        process is a stray file.
      correlation_context: >-
        Keys are host, pid and path; pid in the file name is checked against the creating process.
        Join to the banner in strategy three and the restart in strategy one when available.
      detectors:
        - detector_class: 'file-creation-telemetry-detection'
          technologies:
            - 'EDR file-create events'
            - 'Sysmon (Windows)'
            - 'Linux auditd path watch'
            - 'File integrity monitoring'
          contribution: 'Gives creating process, path and time of the report.'
          limitations: 'Needs a sensor or watch on the path; Linux field names vary by product.'
      benign_explanations:
        - explanation: 'A native-library, agent or JIT bug crashes the JVM and writes a report.'
          distinguishing_context: >-
            Report header names a library frame and recurs across versions; compare with the build
            line and crash history of that service.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding reports with a native-library frame also removes a crash whose frame is not
            sourced; the incident's frame is unknown.
        - explanation: 'The JVM aborts on Java heap out-of-memory by operator setting, or a native malloc or mmap fails.'
          distinguishing_context: 'Report reason names out-of-memory, or the header is the insufficient-memory one.'
          overlaps_incident_instance: false
          tuning_hazard: 'An abort on out-of-memory is a resource fault; down-rank by the reason, never drop, and keep every other reason.'
        - explanation: 'A test or build host forces a crash.'
          distinguishing_context: 'The host runs a known test or build job.'
          overlaps_incident_instance: false
          tuning_hazard: 'Excluding test hosts by name hides an exposed test host.'
        - explanation: 'An administrator copies, restores or archives an old report file.'
          distinguishing_context: 'Creating process is a copy, archive or shell tool, not java.'
          overlaps_incident_instance: false
          tuning_hazard: 'Requiring java as creator is correct; do not widen to any process.'
        - explanation: 'Java application code creates, copies or archives a file with a report-like name.'
          distinguishing_context: >-
            The file lacks the fatal-error header, and no banner, abnormal exit or restart matches
            that pid.
          overlaps_incident_instance: false
          tuning_hazard: 'Confirm by reading the content; excluding report paths or names hides real reports.'
        - explanation: 'The process runs a build, CPU or flag set that 001 rates not affected or mitigated-not-patched.'
          distinguishing_context: >-
            The live verdict on the crashed process, not its host or image tag, reads not affected or
            mitigated-not-patched, so the crash has another cause.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the verdict only, never drop: it is a point-in-time read and goes stale
            after a restart or a flag change.
      forbidden_exclusions:
        - field: 'processes that 001 rates not affected or mitigated-not-patched'
          reason: 'Down-rank only: the verdict is point-in-time, and the crash is still worth ranking.'
        - field: 'ErrorFile paths or report directories as noise'
          reason: 'The operator-set path is where real reports land; excluding it removes the signal.'
        - field: 'paths under /tmp, %TMP% or the working directory'
          reason: 'Oracle documents the working directory as default and the OS temp directory as fallback; excluding either hides real reports.'
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          In a telemetry-only lab we own (ordinary JVM runs, flag dumps and benign crashes; the
          vulnerability was not triggered), an out-of-memory abort left a report in the working
          directory and an -XX:ErrorFile JVM wrote there after an external signal, on emulated x86.
          Read from the files.
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: reports are rare on a healthy fleet. A service with a known
          native crash will exceed it.
      blind_spots:
        - description: >-
            Missing telemetry: the report file is lost with an ephemeral container unless the path
            is a mounted volume; strategy three covers it from the banner.
          routes_to: null
        - description: >-
            Missing telemetry: hosts with no file-create sensor or path watch emit nothing.
          routes_to: null
        - description: >-
            Coverage limit: an ErrorFile value the rule has not learned, or a device path, leaves no
            create record the rule matches; read ErrorFile from the live command line.
          routes_to: null
        - description: >-
            Configuration limit: -XX:+ErrorFileToStdout or ErrorFileToStderr prints the report to a
            stream and writes no file (REF-JDK17U-GLOBALS); strategy three covers it where output is collected.
          routes_to: null
        - description: >-
            Missing telemetry: Windows report creates were not lab-checked; the temp-directory path
            rests on the vendor page only.
          routes_to: null
      analyst_response: >-
        Read the report header: signal or reason, pid, JRE build, command line, host and time. Check
        the creating process, the service's exposure, earlier reports, and whether the service
        restarted. Compare the build to DT-J4SH-ESTATE-001.
      safe_conclusion: >-
        A java process created a candidate JVM error-report file on this host, relevant for
        investigation and never an attempt; a fatal error is established only once its content or a
        matched banner confirms it, and the cause, any trigger and any compromise are not established.
    - id: 'STRAT-FATAL-ERROR-BANNER-IN-LOGS'
      name: 'Fatal-error banner in container stdout or service logs'
      objective: >-
        Detect the JVM fatal-error banner, or the native insufficient-memory header, in collected
        stdout or service logs and recover the build line.
      incident_relevance: >-
        Generic: detects generic behavior that also covers this threat; don't report as
        Java4Shell-specific coverage. Keeps the crash and build once the container is gone.
      detection_logic: >-
        Alert on a log record from a java workload containing "A fatal error has been detected by
        the Java Runtime Environment" or "There is insufficient memory for the Java Runtime
        Environment to continue." (a native malloc or mmap failure, REF-JDK17U-VMERROR) on any
        collected stream. Do not require SIGSEGV or a "Problematic frame" line. Extract the reason
        and "JRE version" lines. Down-rank, never drop, "(sent by kill)" on 17+, si_code 0 on 8,
        an out-of-memory reason and the insufficient-memory header. Reassemble the banner by
        workload and time. Raise on an exposed workload or 2+ banners in 60 minutes. Join 001:
        affected is a possible attempt; other verdicts down-rank, never drop.
      minimum_evidence: >-
        The banner line from a java workload, its reason line and the build line. Without the build
        line, report an unscoped fatal error; with an external-signal marker, an out-of-memory reason
        or the insufficient-memory header, report it down-ranked.
      correlation_context: >-
        Keys are workload, pid and time; the reason and build lines sit within the same banner, so
        group by workload and a 60-second window. Join to strategy one for the restart.
      detectors:
        - detector_class: 'log-content-match-detection'
          technologies:
            - 'Container log shipper to a SIEM'
            - 'Cloud log service'
            - 'Service log collector'
          contribution: 'Gives the reason, build and path lines of the crash, durable past the container.'
          limitations: 'Needs the JVM output collected and a multi-line grouping; match any stream.'
      benign_explanations:
        - explanation: 'The JVM aborts on out-of-memory because the operator set it to crash on out-of-memory.'
          distinguishing_context: >-
            Reason line names out-of-memory and an abort line precedes the banner; this is a resource
            fault, not a memory fault.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the out-of-memory reason only, never drop, and keep other Internal Error
            lines, which a memory fault can also print.
        - explanation: 'A native malloc or mmap fails on a host or container short of memory.'
          distinguishing_context: >-
            The header reads "There is insufficient memory for the Java Runtime Environment to
            continue." and the process exits 1 with no core (REF-JDK17U-VMERROR).
          overlaps_incident_instance: false
          tuning_hazard: 'A resource failure; down-rank by the header, never drop, and keep every fatal-error banner.'
        - explanation: 'A native-library, agent or JIT bug crashes the JVM.'
          distinguishing_context: >-
            The same frame recurs across restarts and versions and predates this disclosure.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding by problematic frame or library also removes the incident, whose frame is
            unsourced; use recurrence and build, not frame.
        - explanation: 'An operator or tool sends a signal to the JVM, for a test or a stuck process.'
          distinguishing_context: >-
            "(sent by kill)" appears on 17+; Java 8 shows si_code 0 with a sender pid.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the marker only, which our lab saw only for kill-sent signals; do not exclude
            the sending user, which an adversary with host access could also use.
        - explanation: 'The process runs a build, CPU or flag set that 001 rates not affected or mitigated-not-patched.'
          distinguishing_context: >-
            The live verdict on the crashed process, not its host or image tag, reads not affected or
            mitigated-not-patched, so the crash has another cause.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the verdict only, never drop: it is a point-in-time read and goes stale
            after a restart or a flag change.
      forbidden_exclusions:
        - field: 'processes that 001 rates not affected or mitigated-not-patched'
          reason: 'Down-rank only: the verdict is point-in-time, and the crash is still worth ranking.'
        - field: 'requiring SIGSEGV or a Problematic frame line'
          reason: 'Aborts and internal errors carry neither and are fatal errors too.'
        - field: 'filtering the log stream to stdout only'
          reason: 'Oracle says the header goes to stdout and may show in the output log; wrappers redirect or merge streams.'
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          In a telemetry-only lab we own (ordinary JVM runs, flag dumps and benign crashes; the
          vulnerability was not triggered), the banner, reason and JRE build lines of an
          out-of-memory abort were read from a container's stdout on emulated x86; an external
          SIGSEGV showed "(sent by kill)".
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: banners are rare per service on a stable fleet; known native
          crashes raise it.
      blind_spots:
        - description: >-
            Missing telemetry: stdout is not collected, or the shipper splits the multi-line banner.
          routes_to: null
        - description: >-
            Missing telemetry: JVM output written to a file nobody collects, or a VM killed before it
            prints (for example by an external kill), leaves no banner to read.
          routes_to: null
        - description: >-
            Attribution limit: banner proves a fatal VM error, not its trigger.
          routes_to: null
      analyst_response: >-
        Read the reason and build lines, the report path, and earlier banners from the same
        workload. Check deploy and drain events, other replicas on the same build, and request logs
        at that time. Compare the build to DT-J4SH-ESTATE-001.
      safe_conclusion: >-
        A Java workload printed a fatal-error banner of the stated type on the stated build; the
        trigger, any attack and any compromise are not established.
    - id: 'STRAT-HOST-SERVICE-CRASH-AND-CORE-DUMP'
      name: 'Java service unit ends abnormally or dumps core (crash candidate), kills down-ranked'
      objective: >-
        Detect a java service on a Linux host ending on an abort or fault signal or dumping core as a
        crash candidate, with kills and OOM down-ranked, where neither JVM output nor file events are
        collected.
      incident_relevance: >-
        Generic: detects generic behavior that also covers this threat; don't report as
        Java4Shell-specific coverage. Fallback on service-managed hosts.
      detection_logic: >-
        Admit every java unit exit with EXIT_CODE killed or dumped at any EXIT_STATUS, exited 134 or
        139, UNIT_RESULT oom-kill or core-dump (failure record joined on unit and
        INVOCATION_ID) or a java core dump on a network-serving host (REF-SYSTEMD-UNIT-C), then
        classify. Read numeric EXIT_STATUS with EXIT_CODE; exit 1 only with a banner or report;
        admit a clean-declared exit where its debug record is kept. Rank: fatal error with a banner
        or report; crash candidate for dumped, killed 6 or 11, 134, 139 or a core; down-ranked,
        never dropped: any other killed signal (such as 1, 2, 9, 15), oom-kill, or a stop or deploy
        in 15 minutes. Raise on 3+ in 60 minutes. Join 001: affected is a possible attempt.
      minimum_evidence: >-
        A java unit exit or core-dump record with code, numeric status and joined result as emitted.
        Fatal error only with a banner or report; dumped, killed ABRT or SEGV, 134, 139 or a core
        alone a crash candidate; any other killed signal (TERM, KILL, HUP, INT or other) or oom-kill
        kept, down-ranked. State any stop or deploy.
      correlation_context: >-
        Keys are host, unit and pid. The 15-minute change window (down-rank only) and 3-in-60
        escalation are this pack's choices. Core-dump handlers can log later than the failure.
      detectors:
        - detector_class: 'host-service-crash-detection'
          technologies:
            - 'systemd journal'
            - 'Core-dump handler logs'
            - 'EDR service and crash telemetry'
          contribution: 'Gives unit, signal, executable and time of a crash without the banner.'
          limitations: 'Not lab-checked; field names rest on systemd source; core dumps often off.'
      benign_explanations:
        - explanation: 'An administrator or deploy tool stops, kills or restarts the unit.'
          distinguishing_context: >-
            A stop or restart job exists for the unit, or the exit was clean (SuccessExitStatus can
            make a signal or status clean, and a clean exit is logged only at debug level).
          overlaps_incident_instance: false
          tuning_hazard: 'Suppress only a stop positively matched by estate policy; excluding unit restarts in a window hides a crash in it.'
        - explanation: 'A native-library, agent or JIT bug crashes the service.'
          distinguishing_context: >-
            Same signal and crash history on that service across versions and before this disclosure.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding by signal or library removes the incident's own record; use recurrence and
            build.
        - explanation: 'The kernel out-of-memory killer or a memory limit ends the service.'
          distinguishing_context: 'UNIT_RESULT oom-kill, or EXIT_CODE killed with EXIT_STATUS 9 or 15 and no core; no 6 or 11.'
          overlaps_incident_instance: false
          tuning_hazard: 'Down-rank by result, not by unit, never drop; a kernel kill ends the process before any VM fault shows.'
        - explanation: 'The process runs a build, CPU or flag set that 001 rates not affected or mitigated-not-patched.'
          distinguishing_context: >-
            The live verdict on the crashed process, not its host or image tag, reads not affected or
            mitigated-not-patched, so the crash has another cause.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Down-rank by the verdict only, never drop: it is a point-in-time read and goes stale
            after a restart or a flag change.
      forbidden_exclusions:
        - field: 'processes that 001 rates not affected or mitigated-not-patched'
          reason: 'Down-rank only: the verdict is point-in-time, and the crash is still worth ranking.'
        - field: 'units known to crash'
          reason: 'A new crash on a noisy unit is still the signal; use recurrence and build.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source or measurement; not exercised in our lab.'
      blind_spots:
        - description: >-
            Missing telemetry: containers and hosts without a service manager or with core dumps
            disabled emit nothing; with -XX:-CreateCoredumpOnCrash, or on a native-memory failure,
            the unit shows only exit 1.
          routes_to: null
        - description: >-
            Attribution limit: a signal result names no cause and no build without a join.
          routes_to: 'DT-J4SH-ESTATE-001'
        - description: >-
            Scope: strategy three or one covers container workloads.
          routes_to: null
        - description: >-
            Missing telemetry: Windows Java services (with procrun the service exe hosts the JVM) have
            no systemd record; a Windows crash path is not sourced or lab-checked here.
          routes_to: null
      analyst_response: >-
        Read the unit's journal around the failure, core-dump metadata (signal, executable, time),
        and any report file. Check deploy or stop events, other hosts on the same build and the
        service's exposure.
      safe_conclusion: >-
        A Java service on this host ended abnormally: a crash candidate, a down-ranked kill, or a
        fatal JVM error only where its banner or report matches, with any stop or deploy stated; the
        cause, any trigger and any compromise are not established.
    - id: 'STRAT-CRASH-WAVE-AND-EXPOSURE-HUNT'
      name: 'Hunt: a crash wave on one build, or a non-hook child of a crashed process'
      objective: >-
        Hunt for a wave of crashes across hosts or workloads on one exact build, or a crash whose own
        process spawned a child that is not its expected error hook, and hand the child branch to
        DT-J4SH-HOST-003; requests only rank, and one crash with request anomalies is no finding.
      incident_relevance: >-
        Generic hunt: don't report hits as Java4Shell-specific coverage. It looks for a pattern a
        trigger might leave; no source says one would. A crash can lag its input
        (REF-DATADOG-JAVA4SHELL), so requests only rank. It hands candidates to DT-J4SH-HOST-003.
      detection_logic: >-
        Hunt, do not alert. Take crashes from strategies one to four. Wave branch: one exact build
        (banner or DT-J4SH-ESTATE-001) crashing on 3+ hosts in 24 hours or 3+ workloads in one
        rollout. Child branch: a crash whose exact process (host, pid, start time) spawned a child
        before the fatal event or in error handling (REF-JDK17U-VMERROR) that is not an expected
        hook execution per the hook twin; where the hook or lineage is unresolved, label the check
        unknown, never non-hook; hand to DT-J4SH-HOST-003. Requests from process start or 60
        minutes before only rank either branch, as a crash can lag in a GC thread.
      minimum_evidence: >-
        Wave branch: one exact build crashing on 3+ hosts in 24 hours or 3+ workloads in one rollout;
        request context optional. Child branch: one crash whose own process spawned a child before or
        during error handling, with the hook check stated as non-hook or unknown. Requests alone, or
        one crash with requests, is no finding.
      correlation_context: >-
        Keys are host, pid with start time, build and time; clocks must align within seconds. Windows
        of 60 minutes and 24 hours are this pack's choices; the request join ranks, never gates.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Groups crashes by build and host and joins them to request and deploy context.'
          limitations: 'Only as good as ingested fields, clock alignment and the build join.'
        - detector_class: 'web-and-network-request-log-analysis'
          technologies:
            - 'Web server and load-balancer access logs'
            - 'Reverse proxy or WAF logs'
          contribution: 'Give request time, client, status and aborted connections near a crash.'
          limitations: 'Show no crash and no cause; payload content is not retained or read.'
      benign_explanations:
        - explanation: 'A bad rollout, config change or shared dependency crashes many hosts on one build.'
          distinguishing_context: >-
            Crashes start at the rollout or change time, and every replica fails the same way
            independent of requests.
          overlaps_incident_instance: true
          tuning_hazard: >-
            A systematic trigger also looks like a rollout; check the request side before excluding
            a wave as a deploy.
        - explanation: 'A load spike, scan or health check coincides with a crash for another reason.'
          distinguishing_context: >-
            Same request volume occurs without crashes at other times; time order alone does not
            separate it, since a crash can lag its trigger.
          overlaps_incident_instance: false
          tuning_hazard: 'Excluding known scanner sources hides a scanner-sourced attempt.'
        - explanation: 'Memory pressure on a busy service causes crashes at peak.'
          distinguishing_context: >-
            Crashes track load and memory, and the reason line names resource exhaustion.
          overlaps_incident_instance: true
          tuning_hazard: 'Excluding peak hours hides a trigger sent at peak; rank by the reason line, never by time of day.'
        - explanation: 'A native-library, agent or JIT bug crashes a busy service, including in a GC or compiler thread.'
          distinguishing_context: >-
            Recurs across versions and predates this disclosure; a GC or compiler-thread frame does
            not separate it from a delayed memory-corruption crash (REF-DATADOG-JAVA4SHELL).
          overlaps_incident_instance: true
          tuning_hazard: 'Excluding by frame, thread or library also removes the incident, whose frame is unsourced.'
        - explanation: >-
            A JVM -XX:OnError or -XX:OnOutOfMemoryError hook runs its configured command at the fatal
            error or first OutOfMemoryError (REF-ORACLE-JAVA-MAN): the error-hook twin in DT-J4SH-HOST-003.
          distinguishing_context: >-
            Read the hook from the live process (jcmd VM.flags), since an options variable can set
            it. HotSpot splits it on ';', expands %p and runs each part as
            /bin/sh -c (cmd /C on Windows) after the report (REF-JDK17U-VMERROR,
            REF-JDK17U-OS-POSIX, REF-JDK17U-OS-WINDOWS); expect those shells and their descendants.
          overlaps_incident_instance: true
          tuning_hazard: >-
            A real crash also runs the hook; allow only those expected shells and their descendants
            from the crashed process at error time, keep every other child visible, and label the
            check unknown where the hook or lineage is unresolved.
      forbidden_exclusions:
        - field: 'request content, size, path or client as a discriminator'
          reason: 'No source describes a request shape; filtering on one adds an unsupported claim.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'A hunt run on demand over a window; no rate is available.'
      blind_spots:
        - description: >-
            Missing telemetry: request logs that omit aborted connections, TLS-terminated
            traffic seen only by the proxy, or no request logs on the host.
          routes_to: null
        - description: >-
            Coverage limit: activity that does not crash the process shows no wave, and the wave
            branch finds only waves at or above its host bar; the child branch and DT-J4SH-HOST-003
            still apply.
          routes_to: 'DT-J4SH-HOST-003'
        - description: >-
            Scope: build unknown for crashes without a banner or inventory.
          routes_to: 'DT-J4SH-ESTATE-001'
      analyst_response: >-
        Pull crashes by build with deploy and request context. Check for a child of the crashed
        process under DT-J4SH-HOST-003, setting aside only expected hook shells and their
        descendants, and the 001 verdict. A logged decoder exception near a crash is supporting
        only (REF-SYSDIG-JAVA4SHELL).
      safe_conclusion: >-
        A wave of crashes on one build, or a crashed process's child that is not its expected hook
        (or whose hook check is unknown), is a lead for review; one crash near unusual requests is no
        finding, and no trigger, attack or compromise is established.
  supporting_technologies_considered: >-
    Core-file forensics would give the faulting frame but is not event telemetry. Elastic's PR 7200
    "Java HotSpot Fatal Error Log Created" is an open proposal, never shipped (REF-ELASTIC-DR-7200).
    Scanners reveal build and exposure, not crashes; runtime protection was not assessed.

detector_requirements:
  required: >-
    A way to identify java workloads and their exposure, at least one of: container exit status
    (via a status collector that keeps transitions), JVM output logs, file-create events or
    service-manager records, and a deploy or drain feed to down-rank planned restarts. For scope, the live build, CPU and flags per process.
  optional: >-
    Report path set to a mounted volume with -XX:ErrorFile keeps the file past the container;
    a stable build inventory narrows alerts to in-scope builds; request logs add context for the hunt.
  correlation:
    capability: >-
      Aligned clocks, a stable workload key across status, logs and file events, deploy events,
      and a join from the banner or inventory build line to DT-J4SH-ESTATE-001.
    window: '15 minutes before for a change (down-rank only), 60 minutes for restart deltas; no fixed restart window (back-off defaults to a 300s cap and varies by version and kubelet settings)'
  product_support_caveat: >-
    A named product is only a candidate; support depends on sensors, logging, fields and parsing,
    so verify first. Check where the JVM's stdout goes, whether container exit status is shipped,
    and file-event coverage of the report path.

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure. No primary source names a frame or stub;
      Sysdig names SIGSEGV and hs_err files and Hadrian exit 134 as generic crash signs, not a CVE
      signature (REF-SYSDIG-JAVA4SHELL, REF-HADRIAN-JAVA4SHELL).
    - >-
      Branches 18 to 20, 22 to 24 and 26: no vendor lists them, so 001 reads unknown for them
      (REF-OPENJDK-ADVISORY-2026-11-17).
    - >-
      Orchestrator and Linux file-event field names, any Windows crash path and java-as-PID-1 exit
      status are unchecked; our lab saw only container exit status and the kill flag, under an
      init on emulated x86. Exit 1 (core dumps off, or a native-memory failure) rests on source
      (REF-JDK17U-OS-POSIX, REF-JDK17U-VMERROR).
    - >-
      Whether a crash from a real trigger shows a fault signal, an abort or another reason line, and
      whether "(sent by kill)" marks signals sent other than by kill; the lab used an out-of-memory
      abort and a kill-sent signal only.
  assumptions:
    - id: 'ASSUMPTION-CRASH-IS-A-TRIGGER-OUTCOME'
      verdict_changing: true
      statement: >-
        A field attempt crashes the JVM as the labs' crash tests did (REF-BLACKPOINT-JAVA4SHELL,
        REF-HADRIAN-JAVA4SHELL). If wrong, these strategies reduce to generic JVM-crash
        detection. Resolve it by a vendor or discoverer note naming a crash outcome in the field.
    - id: 'ASSUMPTION-BANNER-AND-EXIT-DO-NOT-DEPEND-ON-TRIGGER'
      verdict_changing: false
      statement: >-
        The banner, exit status and report file seen for an out-of-memory abort and an external
        signal match those of a fault-driven crash. If wrong, the banner strategy misses it. Resolve it
        from a vendor or discoverer report that shows the banner of a fault-driven crash.
    - id: 'ASSUMPTION-RESTART-FOLLOWS-CRASH'
      verdict_changing: false
      statement: >-
        The exposed service is supervised and restarts. If wrong (for example restartPolicy Never),
        strategies one and four lose crash-loop escalation and still fire per crash. Resolve it by
        checking each workload's restart policy.
  standing_negatives:
    - statement: >-
        Not in the CISA KEV catalog released 2026-11-17 09:53 PT, checked 2026-11-18 05:30 PT.
      ref: 'REF-CISA-KEV'
      valid_until: '2026-11-20'
      recheck: 'Re-read the KEV JSON feed for the CVE id on the expiry date.'
    - statement: >-
        No in-the-wild exploitation is reported as of 2026-11-18 ~06:00 PT: CCCS and JPCERT/CC
        report none and CISA's ADP entry rates Exploitation none (REF-JPCERT-2026111801, REF-CVE-API).
      ref: 'REF-CCCS-AL26-029'
      valid_until: '2026-11-20'
      recheck: 'Re-read the CCCS and JPCERT/CC pages, the CVE API record and the KEV feed.'
    - statement: >-
        No primary source read as of 2026-11-18 names a crash signal, frame or hs_err text for this
        CVE; checked were Calif, Datadog and Red Hat (REF-CALIF-JAVA4SHELL, REF-REDHAT-RHSB-2026-018).
      ref: 'REF-DATADOG-JAVA4SHELL'
      valid_until: '2026-11-20'
      recheck: 'Re-read the three pages for signal, frame or hs_err wording.'
    - statement: >-
        No agreed severity as of 2026-11-18: Oracle as CNA gives CVSS 3.1 8.1, Calif CVSS 4.0 9.2,
        Red Hat a preliminary 9.8 and Amazon CVSS 3.1 8.8 (REF-CALIF-JAVA4SHELL, REF-REDHAT-CVE,
        REF-ALAS-CVE); CISA calls it critical (REF-CISA-ALERT-2026-11-17). Recorded, not picked.
      ref: 'REF-CVE-API'
      valid_until: '2026-11-20'
      recheck: 'Re-read the CVE record and the Red Hat and Amazon CVE pages for changed scores.'

missing_states:
  - id: 'MISSING_CRASH_ARTIFACT_EPHEMERAL_CONTAINER'
    meaning: >-
      Missing telemetry: the container is gone and its report file with it, and stdout was not collected.
    coverage_claim: 'no-coverage'
    response: >-
      State that no banner or file evidence exists; use exit status and restart count only, as an
      unexplained abnormal exit.
  - id: 'MISSING_BUILD_FOR_CRASHED_PROCESS'
    meaning: >-
      Missing context: the crashed process's build, CPU or flags are unknown (no banner, report or
      live inventory), so 001 reads unknown.
    coverage_claim: 'coverage-limited'
    response: >-
      Report an unscoped JVM crash, never as affected or as Java4Shell activity.
  - id: 'MISSING_DEPLOY_AND_DRAIN_FEED'
    meaning: >-
      Missing context: no deploy, scale or drain events to separate planned restarts.
    coverage_claim: 'coverage-limited'
    response: >-
      Report restarts as unexplained, with the banner marker "(sent by kill)" as the only external-kill test.
  - id: 'MISSING_REQUEST_LOGS_FOR_EXPOSED_SERVICE'
    meaning: >-
      Missing context: no request logs for the exposed service in the crash window.
    coverage_claim: 'coverage-limited'
    response: >-
      State the hunt in strategy five cannot rank crashes by requests; its wave and child branches still run.
  - id: 'MISSING_EXIT_STATUS_NOT_SHIPPED'
    meaning: >-
      Missing telemetry: restarts or crash-loop events reach the SIEM but the container's terminated
      exit code and reason do not.
    coverage_claim: 'coverage-limited'
    response: >-
      Report a restarting java workload with exit status unknown; confirm a fatal error from the
      banner or the report file's content.
  - id: 'MISSING_CRASH_AFTER_SUCCESSFUL_EXPLOITATION'
    meaning: >-
      Missing telemetry by design: CERT Polska says successful exploitation may leave no log traces
      (REF-CERT-POLSKA-216-2026), so no crash is seen.
    coverage_claim: 'no-coverage'
    response: >-
      State that an absent crash clears no host; build status comes from DT-J4SH-ESTATE-001 alone.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'workload_or_host_and_exposure_status'
    - 'exit_status_signal_and_reason_kept_apart_or_missing_state'
    - 'outcome_class_fatal_error_with_banner_or_report_crash_candidate_down_ranked_kill_or_unconfirmed_report_file'
    - 'jvm_build_line_and_001_host_cpu_and_flags_or_explicit_unknown'
    - 'estate_001_verdict_affected_mitigated_not_patched_not_affected_or_unknown'
    - 'restart_and_deploy_event_check_result'
    - 'out_of_memory_and_external_signal_check_result'
    - 'outcome_statement_generic_crash_possible_attempt_or_report_file_relevant_for_investigation'
    - 'change_correlation_attached_not_excluded'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'report_file_path_creating_process_and_content_check_state'
      condition: 'when the alert rests on a file-create record'
    - field: 'crash_wave_host_count_and_build'
      condition: 'when the strategy five wave branch fires'
    - field: 'crashed_process_identity_child_and_hook_check_expected_non_hook_or_unknown'
      condition: 'when the strategy five child branch fires'
  recommended_title: >-
    Network-exposed JVM crash candidate, fatal error or candidate error-report file (generic; fatal
    only with banner or read report; a candidate file is at most relevant for investigation; possible
    attempt only for a crash on a process rated affected)
  unsupported_title: 'Java4Shell exploitation crashed this server'

evidence:
  confirmed_incident_behavior: >-
    Other labs report crashes, memory corruption and a memory disclosure (REF-THN-JAVA4SHELL,
    REF-BLACKPOINT-JAVA4SHELL) and Datadog's test JVM later crashed in garbage collection
    (REF-DATADOG-JAVA4SHELL). No primary source names a frame or stub, and none reports a field attempt.
  supported_conclusion: >-
    A crash candidate or fatal JVM error on an exposed service that 001 reads affected, with no
    benign cause, is at most a possible attempt and a candidate report file at most relevant for
    investigation. Not affected or mitigated-not-patched is an ordinary crash and unknown
    unscoped; all are down-ranked, never dropped.
  unsupported_conclusions: >-
    The evidence does not establish that any crash was triggered by Java4Shell, that any host was
    compromised, or that no crash means safe (REF-CERT-POLSKA-216-2026). A logged decoder exception
    is supporting only (REF-SYSDIG-JAVA4SHELL).
  procedure_boundary: >-
    The crash and restart of the process. Build exposure belongs to DT-J4SH-ESTATE-001 and a
    child process of a Java server to DT-J4SH-HOST-003; neither is shown by a crash.
  references:
    - id: 'REF-ORACLE-FATAL-ERROR-LOG'
      type: 'telemetry-documentation'
      title: 'Fatal Error Log (Java SE 17 Troubleshooting Guide)'
      publisher: 'Oracle'
      url: 'https://docs.oracle.com/en/java/javase/17/troubleshoot/fatal-error-log.html'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'partial-use'
      citation_caveat_note: >-
        The page states the default name, working directory, temp-directory fallback, ErrorFile
        with %p, and header content and stdout output; it gives no exit code, which rests on our lab.
      evidence_use: >-
        Default hs_err_pid<pid>.log in the working directory, else /tmp or %TMP%/%TEMP%;
        -XX:ErrorFile with %p as pid; header on stdout with signal, pid, JRE and VM build.
    - id: 'REF-ORACLE-JCMD'
      type: 'telemetry-documentation'
      title: 'The jcmd Command (Java SE 17)'
      publisher: 'Oracle'
      url: 'https://docs.oracle.com/en/java/javase/17/docs/specs/man/jcmd.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'jcmd VM.version, VM.system_properties, VM.flags and VM.command_line are documented; used for the live build.'
    - id: 'REF-SYSMON'
      type: 'telemetry-documentation'
      title: 'Sysmon'
      publisher: 'Microsoft Sysinternals'
      url: 'https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Event 11 records file create and overwrite; event 1 records process creation.'
    - id: 'REF-K8S-POD-LIFECYCLE'
      type: 'telemetry-documentation'
      title: 'Pod Lifecycle'
      publisher: 'Kubernetes'
      url: 'https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Default restart back-off 10s doubling to a 300s cap, reset after 10 minutes; alpha and beta
        gates shorten or reconfigure it per node; restartPolicy values; a Terminated container shows
        a reason and an exit code.
    - id: 'REF-SYSTEMD-EXEC'
      type: 'telemetry-documentation'
      title: 'systemd.exec'
      publisher: 'systemd project'
      url: 'https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        ExecStop and ExecStopPost environment: SERVICE_RESULT, EXIT_CODE and EXIT_STATUS (the
        signal name when not exited); SuccessExitStatus declares clean exits. Strategy four's
        stop-hook alternative only.
    - id: 'REF-SYSTEMD-UNIT-C'
      type: 'telemetry-documentation'
      title: 'systemd src/core/unit.c'
      publisher: 'systemd project'
      url: 'https://github.com/systemd/systemd/blob/main/src/core/unit.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Process-exit record: EXIT_CODE exited, killed or dumped, numeric EXIT_STATUS, signal name
        only in MESSAGE, debug level on success; UNIT_RESULT in a separate failure record; both
        carry the invocation id.
    - id: 'REF-ORACLE-JAVA-MAN'
      type: 'attack-surface-documentation'
      title: 'The java Command (Java SE 17)'
      publisher: 'Oracle'
      url: 'https://docs.oracle.com/en/java/javase/17/docs/specs/man/java.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        -XX:OnError runs a command when an irrecoverable error occurs; -XX:OnOutOfMemoryError when
        an OutOfMemoryError is first thrown. Used for the error-hook benign twin in the hunt.
    - id: 'REF-PID-NAMESPACES'
      type: 'attack-surface-documentation'
      title: 'pid_namespaces(7)'
      publisher: 'Linux man-pages project'
      url: 'https://man7.org/linux/man-pages/man7/pid_namespaces.7.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        A namespace init gets only signals it has a handler for, except SIGKILL or SIGSTOP from an
        ancestor; basis for leaving java-as-PID-1 exit status unsettled. Not a lab result.
    - id: 'REF-JDK17U-OS-POSIX'
      type: 'attack-surface-documentation'
      title: 'jdk17u os_posix.cpp'
      publisher: 'OpenJDK project'
      url: 'https://raw.githubusercontent.com/openjdk/jdk17u/master/src/hotspot/os/posix/os_posix.cpp'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        os::abort calls ::abort() to dump core, else _exit(1); the exit 1 path behind
        -XX:-CreateCoredumpOnCrash. os::fork_and_exec runs each hook command as /bin/sh -c.
    - id: 'REF-JDK17U-OS-WINDOWS'
      type: 'attack-surface-documentation'
      title: 'jdk17u os_windows.cpp'
      publisher: 'OpenJDK project'
      url: 'https://raw.githubusercontent.com/openjdk/jdk17u/master/src/hotspot/os/windows/os_windows.cpp'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        On Windows os::fork_and_exec prefixes each hook command with "cmd /C " and starts it with
        CreateProcess as a child of the JVM.
    - id: 'REF-JDK17U-VMERROR'
      type: 'attack-surface-documentation'
      title: 'jdk17u vmError.cpp'
      publisher: 'OpenJDK project'
      url: 'https://raw.githubusercontent.com/openjdk/jdk17u/master/src/hotspot/share/utilities/vmError.cpp'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Any fatal error writes the report, runs OnError (split on ';', %p expanded), then calls
        os::abort; native malloc or mmap failures print the insufficient-memory header and never
        dump core.
    - id: 'REF-JDK17U-GLOBALS'
      type: 'attack-surface-documentation'
      title: 'jdk17u globals.hpp'
      publisher: 'OpenJDK project'
      url: 'https://raw.githubusercontent.com/openjdk/jdk17u/master/src/hotspot/share/runtime/globals.hpp'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Product flags ErrorFileToStdout and ErrorFileToStderr print error data to the stream instead
        of a file.
    - id: 'REF-K8S-API-TYPES'
      type: 'telemetry-documentation'
      title: 'Kubernetes core/v1 types.go'
      publisher: 'Kubernetes'
      url: 'https://raw.githubusercontent.com/kubernetes/api/master/core/v1/types.go'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        ContainerStatus holds state and lastState only; restartCount may reset to 0 after node
        restarts; terminated state carries exit code, signal, reason, times and container ID.
    - id: 'REF-WAITPID'
      type: 'telemetry-documentation'
      title: 'waitpid(2)'
      publisher: 'Linux man-pages project'
      url: 'https://man7.org/linux/man-pages/man2/waitpid.2.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        WIFEXITED/WEXITSTATUS and WIFSIGNALED/WTERMSIG separate a normal exit status from a signal
