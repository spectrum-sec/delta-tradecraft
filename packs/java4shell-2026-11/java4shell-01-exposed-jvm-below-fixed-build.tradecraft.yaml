      publisher: 'OpenJDK Vulnerability Group'
      url: 'https://openjdk.org/groups/vulnerability/advisories/2026-11-17'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Used: hotspot/compiler; matrix marks 17, 21, 25, 27 and not 8 or 11. Not used: the header
        version list, which covers every CVE on the page.
    - id: 'REF-REDHAT-RHSB-2026-018'
      type: 'attack-surface-documentation'
      title: >-
        RHSB-2026-018 Remote Code Execution via memory corruption on x86-64 systems - OpenJDK
        (CVE-2026-114938) - "java4shell"
      publisher: 'Red Hat'
