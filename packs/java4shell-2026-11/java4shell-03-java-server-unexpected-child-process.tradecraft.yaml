      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Endpoint.Processes analytic; java, java.exe, javaw.exe parents need server command-line
        patterns. Last updated 2026-10-28; no CVE mention. Complement only.
