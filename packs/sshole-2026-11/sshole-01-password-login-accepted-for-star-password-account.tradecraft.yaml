identity:
  uuid: '3000ca24-12d1-4964-ad17-4480d060b17c'
  id: 'DT-SSHH-HOST-001'
  name: 'sshd accepts a password login for an account whose stored password field is the "*" placeholder'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
  behavior_classes:
    - 'identity-borrowing'
  tags:
    - 'sshd'
    - 'openssh'
    - 'sshole'
    - 'musl'
    - 'alpine'
    - 'cve-2026-123158'
    - 'password-authentication-bypass'
    - 'account-state-join'
    - 'specific'

behavior:
  definition: >-
    An adversary who can reach sshd names a login account that holds no password and gets sshd to
    accept a password login for it without knowing any valid secret.
  detailed_definition: >-
    A password check compares a value derived from the offered password with a stored placeholder,
    and the derivation's error marker equals the placeholder. A successful password login for
    such an account is where the check was crossed; on stock Alpine it follows a Failed line in
    the same connection (lab).

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers OpenSSH portable without the 10.6p2 fix (upstream before 10.6p2, or a distro package
      below its branch's fixed release) on Linux with musl libc and PAM not in effect; not glibc or
      PAM-enabled hosts, and not locked accounts.
    summary: >-
      Alpine requires: musl sshd without PAM, or openssh-server-pam with UsePAM no;
      PasswordAuthentication yes; an account whose password field is exactly *; and a usable
      $-format donor hash, per DT-SSHH-ESTATE-005. Root needs PermitRootLogin yes.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where the sshd authentication log is retained and forwarded; the log records the
      accepted login, never the password or its length.
    blocking_conditions:
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Whether the sshd line reaches a store depends on the syslog setup; the Alpine advisory
          points to /var/log/messages.
    summary: >-
      An Accepted password record naming user, source address and port; on stock Alpine it follows
      a Failed password line from the same sshd-session PID and source port. Too weak: a Failed
      line alone, a penalty line, or a lone password login with no account-state evidence.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable where the account's stored-field state at login is known, or, without inventory,
      where a Failed then Accepted password pair shares one connection; a lone Accepted line with
      neither is indistinguishable from any password login.
    blocking_conditions:
      - condition: 'environment-inventory-required'
        note: 'The join needs per-account stored-field state: a host-local shadow read or a fleet inventory.'
      - condition: 'cross-source-join-required'
        note: 'The sshd line and the account state come from different sources and must be joined.'
    summary: >-
      Join the accepted password line to the account's effective field on an exposed-class host:
      exactly * has no valid password, so a hit has few benign explanations. Without inventory, a
      Failed then Accepted pair for one user, PID and source port in one connection is the stock
      Alpine shape; a short gap adds confidence.

attack_surface_context:
  surface: 'sshd password authentication against the local password field on Linux without PAM'
  how_the_surface_works: >-
    Without PAM, sshd hashes the offered password with the C library crypt() and compares the
    result to the stored field, salted from the first $-format hash in passwd order (xcrypt.c).
    musl's SHA crypt returns * on error. On Linux without PAM a !-prefixed field is locked; * is
    not (platform.c, configure.ac).
  incident_processing_path: >-
    Spraying and a honeypot payload reported; no production compromise. Alpine: a reachable
    attacker "can log in without knowing any password" in "one connection", no retries; the
    discoverer (sshhole.com) says * "needs a wrong try first", and our lab saw attempt 2 succeed.
    Success writes the ordinary Accepted line (auth2.c).
  processing_stages:
    - 'network-reach-to-sshd'
    - 'account-name-supplied'
    - 'password-method-attempt'
    - 'failed-password-record-logged-on-first-attempt'
    - 'password-hash-compare-against-stored-field'
    - 'accepted-password-record-logged'
    - 'session-opened-as-account'
  stage_evidence: >-
    The accepted record is written at the compare outcome, so it proves sshd accepted a password
    login; it cannot show the bypass was used, who sent it, or what the session then did.
  trust_boundaries: >-
    Network client into authenticated host access as an account with no password. Reached: a
    honeypot, per one uncorroborated researcher; no production compromise documented. An accepted
    root password shows PermitRootLogin allowed it (auth-passwd.c).
  security_control_context: >-
    Fix: 10.6p2 rejects a stored field under 4 characters as a hash. Alpine ships per-branch fixes
    (none before 3.16, Cycode); it advises PasswordAuthentication no or UsePAM yes. Exposure:
    openssh-server version (not the meta-package) and sshd restarted since; lab: the old binary ran
    until restart. Unrestarted is exposed.
  special_context:
    topic: 'which-stored-field-values-matter'
    context: >-
      Only a field exactly * matches the error marker (this pack's reading of the sshd compare and
      musl source). Alpine says ! fields are not affected. Empty, !-prefixed and hash fields are not
      the bypass condition, so a fuzzy match on field state would raise false hits.
  practitioner_implication: >-
    Before writing a rule, discover which hosts are in the exposed class, how effective-field state
    is collected (shadow and passwd database), where the sshd line lands, under which program and
    with PID and port, and which accounts hold * (root, key-only, tiny-cloud alpine, directory).

threat_research:
  why_it_matters: >-
    A success needs one connection and no valid secret, and yields a login as the target account;
    on tiny-cloud images the alpine user can reach root through passwordless doas, per Alpine.
  threat_actor: 'Unknown. No source attributes the reported spraying to any actor.'
  actor_class: 'unattributed-remote-authentication-bypass'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. OpenSSH 10.6p2 was released 2026-11-05
    with a workaround for a password authentication bypass affecting Linux systems built and run
    with PAM disabled. CVSS 3.1 8.1 (AV:N/AC:H), CWE-394, CISA ADP SSVC exploitation poc. Not in
    the CISA KEV catalog release of 2026-11-04, which predates disclosure. One researcher reports
    Internet-wide spraying of root and alpine with very long passwords and a coin miner as the
    first honeypot payload (https://cyberplace.social/@GossiTheDog/117564277295417498, 2026-11-05
    14:21 UTC). Uncorroborated; no compromise of a production host is documented.
  victim: 'A honeypot only, per one uncorroborated researcher; no production host compromise is documented.'
  capability: >-
    Alpine states an attacker can log in without a password in one connection when the preconditions
    hold; our own isolated lab reproduced it on the stock package. One researcher reports a honeypot
    coin-miner payload; no production intrusion is documented.
  target: >-
    Accounts with a * field on hosts running non-PAM sshd on musl; root and alpine are the names
    reported sprayed. A Failed line alone is not used; one followed by Accepted in the same
    connection is.
  victimology:
    - 'Alpine hosts running openssh-server, or openssh-server-pam with UsePAM no.'
    - >-
      Official Alpine tiny-cloud images 3.18.11 through 3.24.3, where the alpine user has * and
      passwordless doas (Alpine advisory), once a usable $-format donor hash exists
      (DT-SSHH-ESTATE-005).
    - >-
      Root where it holds * (Alpine base image since about 3.16) and PermitRootLogin yes; key-only
      (including usermod -p '*') and directory-sourced accounts.
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1078.003'
      name: 'Valid Accounts: Local Accounts'
      evidence: >-
        The login uses an existing local account without its credential. T1110 does not fit:
        no guessing is involved; the reported spray sends over-long passwords, not guesses.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1190'
      name: 'Exploit Public-Facing Application'
      evidence: >-
        Exploits an authentication bypass in a network-facing service (sshd); success surfaces
        as the local-account login mapped above.

visibility:
  telemetry_sources:
    - source: 'sshd authentication log (syslog facility AUTH)'
      purpose: 'Record failed and accepted password logins with user, source address, port and PID.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Accepted password for <user> from <ip> port <n> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
        - name: 'Failed password for <user> from <ip> port <n> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: 'Load-bearing for the Failed-then-Accepted strategy only.'
        - name: 'syslog program (sshd or sshd-session)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-RELNOTES-9-8'
          load_bearing: false
          note: >-
            The 9.8 notes say some log messages are tagged as originating from "sshd-session" rather
            than "sshd". Lab: auth lines carry sshd-session, penalty lines the sshd listener.
        - name: 'syslog process id of the per-connection process (sshd-session[pid])'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'Lab: the Failed and Accepted lines of one connection carry the same PID.'
      details: >-
        The password method logs at INFO, the default LogLevel, for success and failure. An invalid
        user prefix means the account is unknown or allowed_user refused it (locked, Deny/Allow
        lists). The record states the method; it never carries the password or its length, at INFO
        or VERBOSE (lab).
      advantages:
        - 'Present at the default log level.'
        - 'rsyslog runs on Alpine/musl and can forward off-box, where the record survives a local wipe (lab).'
      limitations:
        - 'Landing file and program tag vary by syslog setup and OpenSSH version.'
        - 'Shows the login, not that the bypass was used; no password length is logged.'
        - 'busybox syslogd timestamps have one-second resolution, too coarse to order a ms-scale pair by time.'
        - 'Ubuntu rsyslog compresses repeats as "message repeated N times: [...]"; parse both forms.'
    - source: 'Account stored-field state (local shadow read or fleet account inventory)'
      purpose: 'Show whether the effective password field of the account held exactly * at login.'
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'effective password field: shadow entry, else passwd-database field (NSS included)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-XCRYPT-C'
          load_bearing: true
          note: 'shadow_pw uses the passwd field when no shadow entry exists; Alpine names * holders.'
      details: >-
        Per account: *, !-prefixed (locked), a $-format hash, or empty. Directory users have no
        shadow entry, so sshd compares their passwd-database field. Only exactly * is the bypass
        condition. Shadow lastchg gives the day of the last change, not its time.
      limitations:
        - 'Point-in-time: a field can change between samples and login.'
        - 'lastchg is a day count: it cannot order a same-day change against a login.'
        - 'Reading shadow needs privilege; an inventory of /etc/shadow alone misses directory users.'
        - 'On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. Collect by script or configuration management.'
    - source: 'Package and effective sshd configuration inventory'
      purpose: >-
        Show the host is in the exposed class: musl sshd without PAM, or openssh-server-pam with
        UsePAM no.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'openssh-server or openssh-server-pam package and version'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: >-
            Never the openssh meta-package: in the lab, upgrading it alone left openssh-server
            vulnerable and the bypass still worked.
        - name: 'running sshd start time versus openssh-server install time'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: >-
            An upgraded package with sshd not restarted since is treated as exposed: Alpine says
            restart, and the lab saw the old binary served until restart (bypass on an upgraded,
            unrestarted host not separately tested).
      details: >-
        Package name and version against the Alpine fixed-version table for its branch, sshd
        restart after any upgrade, plus effective PasswordAuthentication and UsePAM, as they stood
        at the login. The class gates the alert; unknown class yields a lead, not an alert.
      limitations:
        - 'Compare the distro package version, not the upstream number: older upstream versions carry fixes.'
    - source: 'Packet capture of SSH sessions (off-box sensor or host tcpdump)'
      purpose: 'Show over-length client-to-server packets in the SSH user-authentication phase.'
      event_vocabulary: 'other'
      event_vocabulary_note: 'Raw packet sizes and order from a capture; not a flow record or a log.'
      tier: 'metadata'
      operational_viability: 'opt-in'
      fields:
        - name: 'client-to-server packet length in the user-authentication phase'
          attestation: 'detector-computed'
          load_bearing: true
          note: 'The phase is inferred from packet order after key exchange; the payload is encrypted.'
        - name: 'client software version string (Suricata ssh event)'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: 'Lab: Suricata recorded the client version string; context only, client-settable.'
      details: >-
        Lab: two 300-byte password attempts appeared as two client-to-server packets of about 400 B
        in the auth phase; normal password packets in the same capture were 48 to 80 B. Suricata and
        tcpdump ran on musl in the lab; Zeek is not in Alpine's default repositories and was not tested.
      limitations:
        - 'Size only: no user, method or outcome; publickey requests are also large.'
        - 'Flow records show a weak byte difference only, not the auth-phase packet size.'

detection:
  scope: >-
    One joins the accepted password line to account state at login, continuously; two is a
    host-local retrospective review; three needs no inventory and keys on a Failed then Accepted
    pair in one connection; four is a packet-size hunt. None sees the password. Follow-on behavior
    is covered by sibling objects.
  outcome_guardrails: >-
    A Failed line alone is an attempt. An Accepted password for a * account on an exposed-class
    host, or a Failed then Accepted pair in one connection, shows a password login was accepted;
    not who sent it, which password, or any follow-on. A large auth packet shows only an attempt.
  shared_normalization_context: >-
    Parse program (sshd or sshd-session), PID, user, source address and port; match message
    content, not program. Expand "message repeated N times". An invalid user prefix means unknown
    or refused by allowed_user (locked, Deny/Allow lists), not non-existence. Compare the field
    byte-exact to *.
  shared_enrichment_context: >-
    Join per host field samples around login, change records and class at login: musl sshd
    without PAM, or openssh-server-pam with UsePAM no; package below the branch fix or sshd not
    restarted since; PasswordAuthentication yes. A later fix does not clear it; unknown upgrade or
    restart time: class unknown.
  strategies:
    - id: 'STRAT-ACCEPTED-PASSWORD-JOINED-TO-STAR-FIELD'
      name: 'accepted password login joined to the account stored-field state'
      objective: >-
        Detect, on an exposed-class host, an sshd password-method success for an account whose
        effective field was exactly * at the time of login.
      incident_relevance: >-
        Detects the documented bypass outcome: a successful password login for an account with no
        password. One researcher reports a honeypot payload; no production hit is documented.
      detection_logic: |
        Alert on an sshd or sshd-session record, outcome Accepted, method password, for a user whose
        effective field was exactly * at login, on a host in the exposed class at login (musl sshd
        without PAM, or openssh-server-pam with UsePAM no). The effective field is the shadow field,
        else the passwd-database field (NSS included). * at login needs the dating in
        correlation_context; without it, emit a lead marked state at login unknown. Locked, empty
        and hash fields do not match; an unreadable field is unknown. Unknown class gives a lead
        marked class unknown. Root needs no config gate: an accepted root password shows
        PermitRootLogin allowed it. A same-connection Failed line is context, not required.
      minimum_evidence: >-
        One Accepted password record (user, source, time), exposed-class facts for the host at
        login, and * held at login, dated per correlation_context. Without state, report an
        ordinary password login; with undated change, a lead.
      correlation_context: >-
        Keys: host, user, time. * held at login if the first post-login sample reads * and lastchg
        is on an earlier day, or change records cover the gap, or lastchg is empty, the last
        pre-login sample read * and no change record falls between (alert names
        ASSUMPTION-STATE-AT-SAMPLE-MATCHES-LOGIN). Login-day lastchg: lead.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the sshd line to account state on host and user between bracketing samples.'
          limitations: 'Only as good as the log collection and the freshness of the state it joins.'
        - detector_class: 'endpoint-account-inventory'
          technologies:
            - 'Host-local script reading shadow and the passwd database'
            - 'Configuration-management facts'
            - 'osquery or EDR account inventory (non-musl hosts only)'
          contribution: 'Supplies the stored-field state per account and host.'
          limitations: >-
            Point-in-time; needs privilege to read shadow; directory users need the passwd database.
            On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
      benign_explanations:
        - explanation: >-
            A password hash was set on the account between inventory sample and login, and the login
            used it.
          distinguishing_context: >-
            A time-stamped, attributable change record dates the hash before the login. lastchg on
            the login day cannot order the two, so the lead stays open; a change after the login is
            not benign.
          overlaps_incident_instance: false
          tuning_hazard: >-
            A window exclusion after any account change on the host would hide a bypass login on a
            host where a donor hash was just set; key it to the target account's own field.
        - explanation: 'An authorized security test exercises the bypass against the host.'
          distinguishing_context: 'A scope record names host, account, time and source.'
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding by source address or account name would also suppress a real attacker using
            that address or account; match the scope record.
        - explanation: >-
            On a host of unknown class that is in fact PAM-enabled or glibc, PAM accepts the
            password against another backend (for example a directory) while the local field is *.
          distinguishing_context: 'Package and effective UsePAM show PAM in effect, or the host is not musl.'
          overlaps_incident_instance: false
          tuning_hazard: >-
            Settle it with host class evidence, never by excluding the account name; a host whose
            class stays unknown keeps the lead open.
      forbidden_exclusions:
        - field: 'excluding by source address or network range'
          reason: 'An attacker can connect from any reachable address; it would suppress the incident record.'
        - field: 'requiring a preceding Failed password line'
          reason: >-
            The researcher and our lab show one first on stock Alpine, but Alpine says no retries
            and other builds may differ; it would drop those incident records.
        - field: 'excluding accounts by name (alpine, root, service accounts)'
          reason: 'Alpine names them as exposed and root and alpine are the names reported sprayed; it removes true positives.'
        - field: 'gating or excluding hosts by upstream OpenSSH version'
          reason: 'Alpine fixed older upstream numbers (for example 10.3_p1-r2); upstream version cannot decide.'
        - field: 'treating a host as fixed by the openssh meta-package version or an upgrade event alone'
          reason: >-
            Lab: upgrading the meta-package left openssh-server vulnerable, and an unrestarted sshd
            kept its old binary; it would suppress records from still-exposed hosts.
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: on an exposed-class host a * account has no legitimate password
          login, so hits are bypass use, stale state, or tests. Population: exposed-class hosts with
          state; class-unknown leads are counted apart.
      blind_spots:
        - description: >-
            Missing telemetry: hosts whose sshd log is not collected, or with no syslog, emit
            nothing.
          routes_to: null
        - description: >-
            Attribution limit: the line gives user, source and time only; it does not show an
            over-long password was sent.
          routes_to: null
        - description: >-
            Missing telemetry: without account-state inventory this strategy cannot run; the
            baseline sibling covers key-only accounts without it, and the Failed-then-Accepted
            strategy here needs none.
          routes_to: 'DT-SSHH-HOST-002'
        - description: >-
            Parsing difference: a parser keyed to program sshd misses sshd-session lines on 9.8+.
          routes_to: null
        - description: >-
            Missing context: an inventory reading only /etc/shadow misses directory users whose *
            comes from the passwd database (NSS); Alpine names them as * holders.
          routes_to: null
        - description: >-
            Missing context: hosts whose exposed class is unknown give leads, not alerts.
          routes_to: 'DT-SSHH-ESTATE-005'
        - description: >-
            Attribution limit: accounts with no lastchg (root:* on the Alpine base image, directory
            users) are dated only by bracketing samples and absent change records; an edit and
            revert between samples with no record is missed.
          routes_to: null
        - description: >-
            Missing telemetry: during a PerSourcePenalties penalty sshd refuses the source with no
            Failed or Accepted line, so same-source attempt context is incomplete.
          routes_to: null
      analyst_response: >-
        Confirm user, source, time, class at login, field, and a Failed line on the same PID and
        port. Check openssh-server, sshd restart and donor hashes (005). Review doas use, new users,
        files and keys by PID lineage and time (auditd auid is unset on non-PAM Alpine). Alpine:
        treat as compromised unless ruled out.
      safe_conclusion: >-
        On an exposed-class host, sshd accepted a password login for an account whose effective
        field is dated to exactly * at login, the documented bypass condition; attacker use and any
        follow-on are not established. A lead with undated change does not support this.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), stock Alpine 3.24.3 tiny-cloud: 12/12
          reproduced bypass logins wrote Accepted password for * users (alpine, key-only); the $6$
          donor's legitimate login holds a hash; boundary, ! and glibc/patched controls wrote no
          Accepted line. Checked by hand against the captured records.
    - id: 'STRAT-HOST-LOCAL-REVIEW-OF-ACCEPTED-PASSWORD-LINES'
      name: 'host-local review of accepted password lines against the shadow database'
      objective: >-
        On one host in the exposed class at login, patched since or not, without a fleet inventory,
        find retained accepted password logins by users whose effective field is exactly *.
      incident_relevance: >-
        Follows the Alpine hunt guidance: look for sshd lines reading Accepted password for an
        account that has no password. Retrospective, so weaker than strategy one.
      detection_logic: |
        For each Accepted password line (sshd or sshd-session) in every retained log and rotation,
        on a host in the exposed class at that login (upgraded since stays in scope; unknown
        upgrade time: lead), read the user's effective field now: shadow, else passwd database.
        Field *: lastchg on an earlier day, or empty lastchg with no change record since the login,
        supports * at login; the login day or later leaves it open. Hash:
        lastchg before the login day means a hash at login, not a hit; the login day is ambiguous;
        a later day is a separate follow-on lead. Lost log or user: no answer. Locked
        and empty fields are not hits. A hunt result, not a standing alert.
      minimum_evidence: >-
        A retained Accepted password record, the host's class at login, and the field and lastchg
        now. Field * with lastchg before the login day, or empty with no change record since,
        supports a hit; a same-day or later lastchg leaves it open; lost logs give no answer.
      detectors:
        - detector_class: 'host-local-log-and-account-review'
          technologies:
            - 'Shell or script on the host'
            - 'Configuration-management remote execution'
            - 'osquery or EDR live query (non-musl hosts only)'
          contribution: 'Lists accepted password logins and the current effective field of each user.'
          limitations: >-
            Reads state at hunt time; needs privilege and intact, unrotated-out logs. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
      benign_explanations:
        - explanation: >-
            The account held a hash at login and was later set back to * (for example to deactivate
            password login), so it now reads as a hit.
          distinguishing_context: 'Backups or account-change records show a hash at login time.'
          overlaps_incident_instance: false
        - explanation: 'An authorized security test exercised the bypass against the host.'
          distinguishing_context: 'A scope record names host, account, time and source.'
          overlaps_incident_instance: true
          tuning_hazard: 'Excluding by source or account would also hide a real attacker; match the scope record.'
        - explanation: >-
            The host is in fact PAM-enabled or glibc, and PAM accepted the password against another
            backend while the local field is *.
          distinguishing_context: 'Package and effective UsePAM show PAM in effect, or the host is not musl.'
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding logins by source address or by account name'
          reason: 'Both are attacker-reachable or are the exposed accounts; it would suppress the incident record.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source gives a rate and the pack did not model one; it is a per-host hunt.'
      blind_spots:
        - description: >-
            Attribution limit: the field is read at hunt time and can differ from its state at login
            in either direction.
          routes_to: null
        - description: >-
            Missing telemetry: logs rotated away, journal-only hosts and hosts with no syslog leave
            nothing to review.
          routes_to: null
        - description: >-
            Evasion: an actor with root can edit the log or the shadow file after login.
          routes_to: null
      analyst_response: >-
        List each hit's user, source and time; read account-change records and backups for the field
        at login. Check for a Failed line on the same PID and port, openssh-server status and sshd
        restart time. Review doas use, new users, files and authorized keys after each login
        (Alpine), by PID lineage and time.
      safe_conclusion: >-
        A retained log shows an accepted password login for a user whose field is now *; the field
        at login is supported only by lastchg before the login day or by empty lastchg with no
        change record since, and use of the bypass is not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), stock Alpine 3.24.3 tiny-cloud: 12/12
          reproduced bypass logins left Accepted password lines for users whose shadow field is *;
          controls left none. No review was run against these records and no field changed, so the
          dating rules are unexercised.
    - id: 'STRAT-FAILED-THEN-ACCEPTED-SAME-CONNECTION'
      name: 'Failed then Accepted password for one user in the same sshd connection'
      objective: >-
        Detect, without account inventory, a password success that follows a password failure for
        the same user inside one sshd connection, the shape the stock Alpine package leaves on a
        successful bypass.
      incident_relevance: >-
        Detects the bypass outcome as the stock Alpine package logs it: the researcher says *
        "needs a wrong try first" (REF-SSHHOLE-SITE), and the lab saw 12/12 on attempt 2. Alpine
        says no retries, so it is not required elsewhere. Inventory free.
      detection_logic: |
        Alert on a Failed password record followed by an Accepted password record that share host,
        user, sshd or sshd-session PID, source address and source port: one connection. The gap is
        not a gate: scripted lab clients left 2 to 7 ms, a bypass typed by hand leaves seconds; a
        short gap only raises confidence. Order by log order. Match message content, not program
        name; expand "message repeated N times". Rank first where inventory shows the user's field
        is * or the account key-only, then by exposed class; unknown class or state does not
        suppress the alert. Penalty lines and lone Failed lines are not evidence.
      minimum_evidence: >-
        One Failed then one Accepted password record with the same host, user, PID, source address
        and port, at any gap. Without the PID or port, report a same-user, same-source pair as a
        lead.
      correlation_context: >-
        Keys: host, PID, user, source address and port; both records come from one connection, so
        the join is exact. Use the source timestamp, not ingestion time; pipelines can reorder
        records. No time window beyond the connection; record the gap as confidence context.
      detectors:
        - detector_class: 'siem-sequential-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Pairs the two sshd records on host, PID, user, source and port in one connection.'
          limitations: 'Needs the PID and port parsed and source timestamps; one-second timestamps blur order.'
      benign_explanations:
        - explanation: >-
            A person mistypes the password, then types the right one in the same connection; sshd
            allows several password attempts per connection.
          distinguishing_context: >-
            Inventory shows the user's field holds a hash (not *, not a key-only account), and the
            user confirms the login.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Suppressing pairs seconds apart would also hide a bypass typed by hand; rank by the
            account field instead and keep * and key-only accounts at the top.
        - explanation: >-
            Automation legitimately password-authenticates after a scripted failure in one
            connection, such as a client that tries a stale password and then the current one.
          distinguishing_context: >-
            The user's field holds a hash, the host is not in the exposed class, and an owner
            documents the automation from that source and account.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Allowlisting the account name or source address would also hide a bypass on that
            account; key any exception to a hash-holding account and documented automation.
        - explanation: 'An authorized security test exercises the bypass against the host.'
          distinguishing_context: 'A scope record names host, account, time and source.'
          overlaps_incident_instance: true
          tuning_hazard: 'Excluding by source or account would also hide a real attacker; match the scope record.'
      forbidden_exclusions:
        - field: 'excluding by source address or network range'
          reason: 'An attacker can connect from any reachable address; it would suppress the incident record.'
        - field: 'excluding accounts by name (alpine, root, service accounts)'
          reason: 'Alpine names them as exposed and they are the names reported sprayed; it removes true positives.'
        - field: 'requiring account-state inventory or a known exposed class'
          reason: 'The strategy exists to fire without them; the gate would drop hosts with no inventory.'
      expected_volume:
        band: null
        basis: 'modelled'
        note: >-
          Reasoned, not measured: every mistyped-then-correct password in one
          connection matches, so volume tracks password typos on password-auth hosts; lab
          legitimate logins succeeded on attempt 1. Ranking by * or key-only field cuts it where
          inventory exists. Population: hosts whose sshd log is collected with PID and port.
      blind_spots:
        - description: >-
            Missing telemetry: a build or log source where the bypass succeeds on the first attempt
            leaves no Failed line; the account-state join still covers it.
          routes_to: null
        - description: >-
            Parsing difference: a parser that drops the PID or source port, or keys on program sshd,
            cannot form the exact pair.
          routes_to: null
        - description: >-
            Missing telemetry: hosts whose sshd log is not collected or forwarded emit nothing; a
            local log can be wiped after login.
          routes_to: null
        - description: >-
            Attribution limit: the pair shows a failure then a success in one connection, as a
            mistyped password also does; it does not show an over-long password or a * field.
          routes_to: null
      analyst_response: >-
        Confirm the pair on host, PID, user, source and port and note the gap, then the user's field
        (* or hash), the host class and sshd restart time. Review doas use, new users, files and keys by sshd-session
        PID lineage and time (auditd auid is unset on non-PAM Alpine). Alpine: treat as compromised
        unless ruled out.
      safe_conclusion: >-
        sshd accepted a password login after a failed one for the same user in the same connection,
        the shape the bypass leaves on stock Alpine and also of a mistyped password; use of the
        bypass and any follow-on are not established without the account field.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), stock Alpine 3.24.3 (10.3_p1-r1): 12/12
          reproduced bypasses won on attempt 2, each Failed then Accepted for one user, PID and port
          2 to 7 ms apart (scripted clients); legitimate logins on attempt 1; controls wrote no
          Accepted. Evasion tests in the same lab: a 10 s pause between attempts still succeeded
          (limit LoginGraceTime); a 16-byte wrong primer and a failed publickey attempt first left
          the pair intact; sshd refused a username change within the connection; five decoy
          failures hit MaxAuthTries before the payload. Checked by hand against the captured records.
    - id: 'STRAT-OVERSIZED-AUTH-PHASE-PACKETS'
      name: 'oversized client-to-server packets in the SSH user-authentication phase (hunt only)'
      objective: >-
        Find SSH sessions whose client sends packets of about 350 B or more during user
        authentication, the size an over-length password attempt produces despite encryption.
      incident_relevance: >-
        Detects the attempt on the wire, success or not, including on hosts with no usable host
        telemetry. Weak alone: a hunt lead to pair with the sshd log, not a standing alert.
      detection_logic: |
        Hunt only. In captured SSH sessions, after key exchange, take client-to-server packets
        in the user-authentication phase (before the first channel open) and flag those of about
        350 B or more; lab: about 400 B for a 300-byte password. Sizes vary with cipher and MAC, so
        calibrate on the estate's own password logins. Join leads to the sshd log on host, source
        address, port and time for user and outcome. The Suricata client version is context only.
      minimum_evidence: >-
        One SSH session with at least one auth-phase client packet at or above the calibrated
        threshold. Report it as an over-length authentication attempt lead; success needs the sshd
        log.
      correlation_context: >-
        Keys: destination host, source address and port, time. The sshd records of the same
        connection carry the same source port, so the join to Failed and Accepted lines is exact.
      detectors:
        - detector_class: 'network-packet-size-analytics'
          technologies:
            - 'Suricata (off-box)'
            - 'Zeek (off-box)'
            - 'tcpdump or full packet capture'
            - 'NDR platforms'
          contribution: 'Measures auth-phase packet sizes per session from capture.'
          limitations: >-
            Blind to anything but size; phase boundary is inferred; needs capture at a choke point
            or on the host. Flow records carry only a weak byte difference.
      benign_explanations:
        - explanation: >-
            Publickey authentication requests carry a key blob and signature, often several hundred
            bytes for RSA keys or certificates. Lab: Ed25519 requests were about 256 B and RSA
            requests overlapped 350 to 500 B; only sizes of about 1,100 B or more were unambiguous.
          distinguishing_context: 'The sshd log for the same source port shows Accepted or Failed publickey, not password.'
          overlaps_incident_instance: false
          tuning_hazard: >-
            Raising the threshold above publickey sizes would also hide most over-length passwords;
            separate by the logged method instead.
        - explanation: 'A user or tool sends a legitimately long password or passphrase.'
          distinguishing_context: >-
            Lab overhead was about 100 B over the password length, so passwords near 250 B or more
            reach the threshold; separate them by the logged outcome and the account field, not by
            size.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding by source address or network range'
          reason: 'An attacker can connect from any reachable address; it would suppress the incident record.'
        - field: 'excluding by client software version string'
          reason: 'The client sets it; an attacker can send any version.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No rate measured; publickey traffic also crosses the threshold, so volume depends on the
          estate's key types and login mix. Per-session hunt over captured SSH traffic.
      blind_spots:
        - description: 'Missing telemetry: no capture on the path to the host means no record.'
          routes_to: null
        - description: >-
            Attribution limit: size gives no user, method or outcome; the sshd log is needed for
            all three.
          routes_to: null
        - description: >-
            Parsing difference: cipher, MAC and packet coalescing change sizes; an uncalibrated
            threshold misses or over-matches.
          routes_to: null
      analyst_response: >-
        Join each lead to the sshd log by source port and time: method, user, outcome, and a Failed
        then Accepted pair. Check the user's field and the host class. Escalate only when the log
        shows a password success.
      safe_conclusion: >-
        A client sent an unusually large packet during SSH user authentication, consistent with an
        over-length password attempt; neither the method, the account nor success is established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), exposed Alpine host, tcpdump: two 300-byte
          password attempts showed as two client-to-server auth-phase packets of 400 B; normal
          password packets were 48 to 80 B; Ed25519 publickey requests were about 256 B and RSA
          requests overlapped 350 to 500 B. A 1,024-byte password gives about 1,124 B, above any
          key request seen. Checked by hand against the captured records; not yet replayed as an
          automated query.
  supporting_technologies_considered: >-
    PerSourcePenalties (OpenSSH 9.8+, on by default) logs failed-authentication connections; this
    pack reads no penalty for a success, so it flags guessing. Banner scans over-match (fixed
    packages carry older numbers). Flow records show only a weak byte difference (lab). Package
    and config exposure is a sibling object.

detector_requirements:
  required: >-
    Collect the sshd auth log with program, PID, user, source, port and source time; per-host
    effective field exact to *, passwd-database fields included; exposed-class facts per host;
    host identity joinable across all; alert text that states login accepted, not exploit proven.
  optional: >-
    Time-stamped account-change records settle same-day and in-between changes; package and config
    state adds exposed-class detail; PermitRootLogin per host flags config drift on a root hit;
    packet capture of SSH sessions supports the size hunt.
  correlation:
    capability: >-
      Aligned host clocks, a stable host and user key across log and inventory, and state samples
      with lastchg on both sides of the login.
    window: >-
      Bracketing samples (the last before and the first after the login) for the join; one PID
      and port (one connection, no time gate) for the Failed-then-Accepted pair.
  baselines:
    - name: 'Per-account effective-field state (*, locked, hash, empty) and lastchg for each host'
      window: 'Refreshed daily and on any account-change record'
      seeded_from: >-
        Host-local shadow and passwd-database reads or configuration-management facts; never
        seeded from sshd log lines, which carry no field state.
  product_support_caveat: >-
    On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. rsyslog, auditd and Tetragon run. Verify sshd lines parse with PID and port. No
    public rule for this CVE found (2026-11-05).

missing_context:
  unverified:
    - >-
      first_observed 2026-11: month of disclosure; spraying reported 2026-11-05
      (REF-BEAUMONT-SPRAY).
    - >-
      Lower bound of the trigger length: the CVE text says 256 to 1024, Alpine says 257 to 1024;
      in our lab 256 B failed and 257 B succeeded. The length is never logged.
    - >-
      Attempt count: Alpine says no retries; the researcher, and our lab on the stock package,
      saw success only on attempt 2 in one connection. Other builds are unknown, so the Failed
      line is never required.
    - >-
      Which accounts hold *: Alpine lists key-only users, but busybox adduser writes !. On non-PAM
      Linux sshd a !-prefixed account is refused every method (auth.c, platform.c), so a working
      key-only account holds *, empty or a hash; only * is exposed.
    - 'How each estate inventories passwd-database (NSS) fields of directory users without a shadow entry.'
    - 'Exposure of musl distributions other than Alpine; check package build flags per distribution.'
    - 'Syslog program tag, landing file and retention for the sshd line on each image and host.'
  assumptions:
    - id: 'ASSUMPTION-STAR-FIELD-HAS-NO-LEGITIMATE-PASSWORD'
      verdict_changing: true
      statement: >-
        On an exposed-class host a * field has no valid password, so an accepted password for it is
        not a normal login; Alpine: "no password set". On PAM hosts another backend can accept one,
        hence the class gate. If wrong, the few-benign reading fails. Resolve by checking directory
        users on a non-PAM sshd.
    - id: 'ASSUMPTION-STATE-AT-SAMPLE-MATCHES-LOGIN'
      verdict_changing: true
      statement: >-
        A post-login * held at login if lastchg is on an earlier day, or if lastchg is empty and no
        change record exists since the login (and a pre-login sample read *, where one exists).
        lastchg misses direct file edits; a same-day change stays a lead. If wrong, hits are false
        or missed. Resolve with change records.
  standing_negatives:
    - statement: >-
        As of 2026-11-05 no compromise of a production host is documented; one researcher reports
        spraying and a honeypot coin miner, uncorroborated. Not in the CISA KEV catalog release of
        2026-11-04, which predates disclosure.
      ref: 'REF-BEAUMONT-SPRAY'
      valid_until: '2026-11-12'
      recheck: >-
        Re-fetch the KEV catalog and the Alpine advisory, look for corroboration of the spraying
        report, and search vendor and CERT bulletins for an intrusion naming CVE-2026-123158.
    - statement: >-
        No Sigma, Elastic, Splunk, Falco or ET Open (Suricata) rule for CVE-2026-123158 was found in
        checkouts of those repositories on 2026-11-05.
      valid_until: '2026-11-12'
      recheck: 'Search the same repositories for the CVE id and for accepted-password-to-star-field logic.'

missing_states:
  - id: 'MISSING_ACCOUNT_STATE_INVENTORY'
    meaning: 'Missing telemetry: stored-field state per account is not collected or is stale.'
    coverage_claim: 'no-coverage'
    response: >-
      Report a password login with no state, not a bypass; run the Failed-then-Accepted strategy
      and fall back to the baseline sibling DT-SSHH-HOST-002.
  - id: 'MISSING_SSHD_AUTH_LOG'
    meaning: 'Missing telemetry: the sshd authentication log is not retained or forwarded.'
    coverage_claim: 'no-coverage'
    response: 'State the host is not covered; a quiet SIEM says nothing about it.'
  - id: 'MISSING_EXPOSED_CLASS_EVIDENCE'
    meaning: >-
      Missing context: package, PAM and PasswordAuthentication state at the login are unknown for
      the host, including an unknown upgrade or sshd restart time or an unreloaded config edit.
    coverage_claim: 'coverage-limited'
    response: >-
      Emit a lead marked class unknown, not an alert; unknown is neither exposed nor safe. Collect
      openssh-server version, sshd start time and UsePAM state before closing.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_sshd_program_and_pid'
    - 'authenticating_user'
    - 'source_address_and_port'
    - 'login_timestamp'
    - 'effective_field_samples_before_and_after_login'
    - 'state_at_login_dating_or_unknown'
    - 'field_state_source'
    - 'host_exposure_class_evidence_or_unknown'
    - 'preceding_failed_password_same_pid_and_port_or_none'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'permit_root_login_setting'
      condition: 'when the user is uid 0; context only, a mismatch is config drift'
    - field: 'follow_on_activity_references'
      condition: 'when doas, sudo, process or file records exist for the same session (PID lineage)'
    - field: 'failed_to_accepted_delta_ms'
      condition: 'when STRAT-FAILED-THEN-ACCEPTED-SAME-CONNECTION fired'
    - field: 'auth_phase_client_packet_sizes'
      condition: 'when STRAT-OVERSIZED-AUTH-PHASE-PACKETS supplied the lead'
  recommended_title: >-
    sshd accepted a password login for an account whose stored password field is * (bypass
    condition; attacker use not established)
  unsupported_title: 'Attacker exploited CVE-2026-123158 and compromised Alpine host'

evidence:
  confirmed_incident_behavior: >-
    The discoverer (sshhole.com) and Alpine describe the bypass: a reachable attacker "can log in
    without knowing any password" in one connection; our isolated lab reproduced it 12/12 on the
    stock package; CISA ADP: poc. Separately, one researcher reports honeypot spraying of root and
    alpine and a coin miner as the first payload; uncorroborated, no production compromise
    documented.
  supported_conclusion: >-
    On an exposed-class host, an Accepted password for an account whose effective field is exactly
    * matches the documented bypass condition and is the ordinary line (auth2.c). On stock Alpine
    a Failed then Accepted pair in one connection is the lab shape (2 to 7 ms, scripted clients).
    Inferred: rare and separable.
  unsupported_conclusions: >-
    The evidence does not establish compromise of any production host, that a given host is exposed,
    that an over-long password was sent, who was behind a login, or that any follow-on action
    happened.
  procedure_boundary: >-
    Only the accepted password login for a * account. Other behaviors, such as logins for key-only
    accounts without state, doas use and the reported miner, belong to sibling objects.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example; other * holders stand via
        REF-TINY-CLOUD-INIT.
      evidence_use: >-
        Used: preconditions, * accounts, fixed versions, tiny-cloud, hunt guidance. Not used: the
        adduser example, which REF-BUSYBOX-ADDUSER contradicts. Silent on exploitation.
    - id: 'REF-OPENSSH-RELNOTES-10-6P2'
      type: 'attack-surface-documentation'
      title: 'OpenSSH release notes, 10.6p2 (2026-11-05)'
      publisher: 'OpenSSH project'
      url: 'https://www.openssh.org/releasenotes.html#10.6p2'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fixed in 10.6p2; bug exploitable via sshd; root cause outside sshd.'
    - id: 'REF-OPENSSH-FIX-COMMIT'
      type: 'attack-surface-documentation'
      title: 'avoid password authn bypass (commit 4353fdc)'
      publisher: 'OpenSSH portable'
      url: 'https://github.com/openssh/openssh-portable/commit/4353fdc43ef646c43a8dda7025cc1a898caf1482.patch'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix rejects a stored field shorter than 4 characters as a hash; not a length cap.'
    - id: 'REF-OPENSSH-AUTH-C'
      type: 'telemetry-documentation'
      title: 'auth.c at V_10_6_P1 (auth_log, allowed_user)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Log format, INFO level for the password method, no length logged; locked-account check when
        PAM is off.
    - id: 'REF-OPENSSH-AUTH-PASSWD-C'
      type: 'attack-surface-documentation'
      title: 'auth-passwd.c at V_10_6_P1'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth-passwd.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        uid 0 password login refused unless PermitRootLogin is yes, so an accepted root password
        shows it was allowed; 1024-byte limit; compare against shadow_pw when PAM is off.
    - id: 'REF-OPENSSH-RELNOTES-9-8'
      type: 'telemetry-documentation'
      title: 'OpenSSH 9.8 release notes'
      publisher: 'OpenSSH project'
      url: 'https://www.openssh.com/txt/release-9.8'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Per-session binary named sshd-session, so the syslog program may not be sshd.'
    - id: 'REF-OPENSSH-SSHD-CONFIG-MAN'
      type: 'attack-surface-documentation'
      title: 'sshd_config(5) manual page'
      publisher: 'OpenBSD (OpenSSH)'
      url: 'https://man.openbsd.org/sshd_config'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'LogLevel default INFO; PerSourcePenalties on by default and refuses penalised sources.'
    - id: 'REF-MUSL-CRYPT-SHA512'
      type: 'attack-surface-documentation'
      title: 'musl crypt_sha512.c'
      publisher: 'musl libc'
      url: 'https://git.musl-libc.org/cgit/musl/plain/src/crypt/crypt_sha512.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'On error the crypt function returns "*"; the key limit is 256 bytes.'
    - id: 'REF-TINY-CLOUD-INIT'
      type: 'attack-surface-documentation'
      title: 'tiny-cloud lib/tiny-cloud/init (default user creation)'
      publisher: 'Alpine Linux (tiny-cloud)'
      url: 'https://gitlab.alpinelinux.org/alpine/cloud/tiny-cloud/-/raw/main/lib/tiny-cloud/init'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Default user gets * via chpasswd -e, wheel, passwordless doas and sudo.'
    - id: 'REF-BUSYBOX-ADDUSER'
      type: 'attack-surface-documentation'
      title: 'busybox loginutils/adduser.c'
      publisher: 'BusyBox'
      url: 'https://raw.githubusercontent.com/mirror/busybox/master/loginutils/adduser.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'adduser writes ! as the password field and -D skips setting a password.'
    - id: 'REF-CVE-RECORD'
      type: 'attack-surface-documentation'
      title: 'CVE-2026-123158 record'
      publisher: 'CVE Program (MITRE CNA)'
      url: 'https://www.cve.org/CVERecord?id=CVE-2026-123158'
      trust_tier: 'registry'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Text says 256 to 1024; Alpine and musl KEY_MAX 256 (REF-MUSL-CRYPT-SHA512) give 257 to
        1024. Length is never logged, so no detection claim rests on either bound.
      evidence_use: 'Used: CVE id, CVSS 3.1 8.1, CWE-394. Not used: the 256 lower bound.'
    - id: 'REF-NVD-RECORD'
