identity:
  uuid: 'fecc94be-d970-4493-929a-1ca045666364'
  id: 'DT-SSHH-ESTATE-005'
  name: >-
    Host runs a no-PAM musl sshd without the fix, with a password-reachable star account and a $5$
    or $6$ salt-donor hash
  incident: >-
    sshole (CVE-2026-123158), fixed in OpenSSH 10.6p2 on 2026-11-05: the exposure state the Alpine
    advisory describes. A control and posture object, not an adversary behavior.
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'estate-preventive-control-configuration'
  secondary_attack_surfaces:
    - 'host-os'
    - 'host-filesystem'
    - 'container-workload'
  behavior_classes:
    - 'control-state-verification'
    - 'estate-precondition-removal'
  tags:
    - 'sshole'
    - 'specific'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'control'
    - 'exposure-state'
    - 'posture'
    - 'inventory'
    - 'advisory-evidence'
    - 'prevent'

behavior:
  definition: >-
    The pack's posture companion. A host with a running sshd holds every precondition the Alpine
    advisory lists: a no-PAM sshd without the fix, password login on, a star account reachable by
    password, and a first $-format hash of $5$ or $6$.
  detailed_definition: >-
    A state, not a step. Exposure needs all conditions, so a host can become exposed later,
    as when a first password is set where a login account holds a star. Verdicts: exposed, no
    vendor fix, latent (sshd not running), not exposed, unknown. Other first donor type: unknown;
    no $-format field (NSS read): not exposed.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers the existence of the exposed state on a host meeting every prerequisite; not that any
      host was attacked, or that the bypass works on every build.
    summary: >-
      Alpine: affected if all hold: musl sshd without PAM, or openssh-server-pam with UsePAM no;
      PasswordAuthentication yes, an account whose field is exactly '*', and a $5$/$6$ first $-format hash. Other first
      types are unknown (REF-IONIX). Root counts only with PermitRootLogin yes; nopass doas raises
      severity.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Covers hosts whose package, sshd run state, applied sshd config and account-database shape
      are collected; not hosts without such inventory, which stay unknown.
    blocking_conditions:
      - condition: 'environment-inventory-required'
        note: >-
          No stock stream reports package revision, applied sshd config and the shadow field
          classes together; the estate must build them.
      - condition: 'cross-source-join-required'
        note: 'Package, config and account facts come from different sources and must be joined per host.'
    summary: >-
      Observe per host the openssh-server release, whether sshd runs and started after it was
      installed, config from sshd -T (-C for Match) and whether the listener loaded it, each
      account's field class ('*', locked, hash type, empty) in passwd order, and directory users.
      Too weak: a banner or the openssh meta-package.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Covers exposure assessment from inventory and password-set records; not detection of attempts
      or logins, which are sibling objects.
    blocking_conditions:
      - condition: 'environment-inventory-required'
        note: 'Detection is only as good as the package and account inventory.'
    summary: >-
      Exposed is separable from not exposed by evaluating every prerequisite against the applied
      config and the host's own fix. A failed conjunct is not exposed; an unread one, an unassessed
      donor type or uninventoried directory users is unknown. Password-set records trigger reassessment.

attack_surface_context:
  surface: 'OpenSSH sshd password authentication on a no-PAM musl host (Alpine, OpenWrt packaging)'
  how_the_surface_works: >-
    Without PAM, sshd hashes the presented password with crypt() and compares it to the stored
    field; for fields too short to carry a salt it borrows the salt of the first $-format hash in
    passwd-database order (Alpine advisory, xcrypt.c pick_salt). Alpine's openssh-server is built
    without PAM (aports APKBUILD).
  incident_processing_path: >-
    Alpine: "You are affected if all of the following are true", then the prerequisites quoted in
    manifestation. The fix commit rejects a stored password field shorter than 4 characters; the
    release notes call the root cause outside sshd.
  processing_stages:
    - 'sshd-build-without-pam'
    - 'sshd-running'
    - 'password-authentication-enabled'
    - 'star-account-password-reachable'
    - 'first-dollar-hash-donor-type'
    - 'package-without-fix'
    - 'network-reachable'
    - 'password-login-attempt'
  stage_evidence: >-
    Inventory sees the first six stages; none proves reachability or a login. A satisfied inventory
    shows exposure only. The attempt stage is the sibling objects' evidence.
  trust_boundaries: >-
    The boundary is the password check at sshd's front door. One researcher reports spraying and a
    honeypot payload; no source documents it crossed on a production host. This object says only
    which hosts could be crossed.
  security_control_context: >-
    Alpine's controls: the fixed openssh-server with sshd restarted; PasswordAuthentication no; the
    PAM build with UsePAM yes. Alpine says restart after upgrading; our isolated lab (2026-11-05)
    saw the old binary served until restart, twice (bypass not retried on an upgraded, unrestarted
    host); the pack counts it exposed.
  special_context:
    topic: 'safe-to-exposed-transition'
    context: >-
      Alpine: official tiny-cloud images 3.18.11 to 3.24.3 ship an 'alpine' user with '*' and
      passwordless doas, safe on first boot, exploitable once any $6$ hash exists (pack terms: the
      first $-format hash in passwd order is $5$/$6$). Our isolated lab (2026-11-05) confirmed it on
      3.24.3 with one $6$ donor.
  technology_variants:
    - variant: 'alpine-linux'
      context: >-
        Fixed (Alpine advisory): edge 10.6_p2-r0; 3.24 10.3_p1-r2; 3.23 10.2_p1-r1; 3.22
        10.0_p1-r11; 3.21 9.9_p2-r1; 3.20 9.7_p1-r6; 3.19 9.6_p1-r3; 3.18 9.3_p2-r4; 3.17 9.1_p1-r7;
        3.16 9.0_p1-r6. None before 3.16 (Cycode). Compare openssh-server (not
        the openssh meta-package) by apk version ordering, -rN included.
    - variant: 'openwrt'
      context: >-
        openssh-server is built without PAM (Makefile). Fixed: master and 25.12 at 10.6_p2-1;
        24.10 stays 9.9_p2 with PKG_RELEASE 2 and a backported patch, so judge by release. 23.05
        and 22.03 stay 9.8p1-1 with no fix patch (branch Makefiles). Dropbear is not affected.
    - variant: 'void-linux'
      context: >-
        Void builds openssh with PAM (template) and its packaged sshd_config sets UsePAM yes
        (sshd_config.patch), so it is in class only where an administrator sets UsePAM no.
    - variant: 'other-musl-builds'
      context: >-
        Buildroot, Yocto and other source builds are build-dependent; no source confirms exposure.
        Read version, source or patch provenance: unfixed is exposed (the upstream fix exists), not
        'no vendor fix'; an unidentified build is unknown.
  practitioner_implication: >-
    Find which hosts run a no-PAM musl sshd, how openssh-server revisions and sshd start times are
    collected where osquery has no official build and Wazuh may not be deployed, whether sshd -T can run, how field classes and
    order are read without exporting hashes, and whether password-set records reach the SIEM.

threat_research:
  why_it_matters: >-
    The advisory ties exploitability to a state an estate can remove: patch, disable password login,
    or use the PAM build with UsePAM yes. Exposure is invisible to login detection until someone
    logs in, and a host can move from safe to exposed after first boot.
  threat_actor: >-
    Not applicable. This object describes an estate state, not an actor.
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. CISA ADP SSVC lists exploitation as 'poc'.
    One researcher reports Internet-wide spraying of `root` and `alpine` with very long passwords
    and a coin miner as the first honeypot payload
    (https://cyberplace.social/@GossiTheDog/117564277295417498, 2026-11-05 14:21 UTC).
    Uncorroborated; no compromise of a production host is documented. Not in the CISA KEV catalog
    release of 2026-11-04, which predates disclosure.
  victim: 'A honeypot only, per one uncorroborated researcher; no production host compromise is documented.'
  capability: >-
    Not applicable as an adversary capability. CVSS 3.1 8.1 (AV:N/AC:H), CWE-394 (CVE record).
  target: >-
    No-PAM musl sshd hosts: documented for Alpine and OpenWrt's openssh-server; other musl builds
    are unconfirmed.
  victimology:
    - 'Alpine hosts and containers running openssh-server with password authentication.'
    - 'Cloud images that create a login user with a star password field.'
    - 'Hosts whose directory-sourced users have no shadow entry (Alpine advisory).'

  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1190'
      name: 'Exploit Public-Facing Application'
      evidence: >-
        The state is the precondition of authenticating through an exposed sshd without a valid
        secret. The mapping marks what the state enables, not any exploitation; it matches
        DT-SSHH-HOST-001.

visibility:
  telemetry_sources:
    - source: 'Package inventory with package name, full version-release and sshd run state'
      purpose: >-
        Show openssh-server versus the PAM build, the release against the branch fix, and whether
        sshd is enabled or running.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'openssh-server package name and version-release'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: >-
            Never the openssh meta-package: in our isolated lab (2026-11-05) apk upgrade openssh
            left openssh-server unfixed; apk upgrade -U -a fixed it.
        - name: 'sshd service enabled or process running'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: 'Alpine excludes containers that do not run sshd; installed-only is latent.'
        - name: 'sshd listener start time versus openssh-server install time'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: >-
            Alpine says restart after upgrading; the lab saw the old binary served until restart.
            A listener started before the fixed install is treated as exposed.
      details: >-
        Estate-built inventory reading the package database, including images, plus service and
        process state. The distro revision decides fix state; the upstream version alone does not.
      limitations:
        - 'Does not exist unless the estate builds it; containers and appliances are easily missed.'
        - 'Image inventory cannot see whether a container entrypoint starts sshd.'
        - >-
          On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. Collect with
          apk, sshd -T and ps over a shell or cloud run-command, or by image census.
    - source: 'sshd configuration per host (sshd -T) and listener load time'
      purpose: >-
        Show PasswordAuthentication, UsePAM and PermitRootLogin as the files set them, and whether
        the running listener has loaded those files.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'PasswordAuthentication'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
        - name: 'UsePAM'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
        - name: 'PermitRootLogin'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: 'Root counts only when yes; other star accounts stay in scope.'
        - name: 'listener start or last reload time versus config file change time'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-SSHD-C-1006'
          load_bearing: true
          note: 'A config change after the listener loaded it is not applied to new connections.'
      details: >-
        sshd -T reads the files on disk; run it with the service's binary and -f/-o options, and -C
        user=,host=,addr= for Match (sshd(8)). First obtained value wins (sshd_config(5)). Alpine
        reads sshd_config.d from 3.19. Applied config is the listener's until SIGHUP or restart.
      limitations:
        - 'Running sshd -T needs host execution rights the estate may not grant.'
        - 'Match blocks need one evaluation per star account and untrusted source.'
        - 'Neither -T nor a file parser shows the listener''s loaded config; it needs the load time.'
    - source: 'Account database field classes, order and directory users'
      purpose: >-
        Show accounts with a star field and the scheme of the first $-format hash in passwd-database
        order, and whether NSS supplies users without a shadow entry.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'shadow password field class'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-ALPINE-ADVISORY'
          load_bearing: true
          note: 'Only exactly "*" matters; reduce to a class, never export the hash.'
        - name: 'scheme of the first $-format field in passwd order'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-XCRYPT'
          load_bearing: true
          note: '$5$/$6$ meets the Alpine condition; another type is unknown (REF-IONIX).'
      details: >-
        Per account, the class of the stored field, not its value, read in getpwent order. Without a
        shadow entry sshd uses the passwd-database field, so directory users count (Alpine advisory).
      limitations:
        - 'Reading the shadow file needs privileged collection.'
        - 'Directory-sourced users are not in the local files; inventory must enumerate NSS.'
    - source: 'Host syslog password-set records'
      purpose: 'Show a password field change that may alter exposure, as a trigger to reassess.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'busybox chpasswd: password for ''<user>'' changed (empty program tag)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-CHPASSWD'
          load_bearing: true
          note: 'No openlog call; musl leaves the ident empty (REF-MUSL-SYSLOG). Match on message.'
        - name: 'busybox passwd (tag passwd, auth): password for <user> changed by <actor>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-PASSWD'
          load_bearing: true
        - name: 'shadow-utils usermod: change user ''<user>'' password; useradd: new user: name=<user>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SHADOW-USERMOD'
          load_bearing: false
          note: 'useradd wording per REF-SHADOW-USERADD; a new user may carry no hash.'
        - name: 'shadow-utils chpasswd (tag chpasswd, authpriv): pam_unix(chpasswd:chauthtok): password changed for <user>'
          attestation: 'other'
          load_bearing: true
          note: 'Lab record only (Alpine 3.24, shadow package, 2026-11-05); the line set a $6$ hash.'
      details: >-
        Local logging is on by default; forwarding varies. The record names the account, never the
        hash or the new field class; post-event account inventory decides what changed.
      limitations:
        - 'Containers often have no syslog daemon; logs may stay on the host.'
        - 'busybox passwd logs the same line for set, lock, unlock and password deletion.'
        - 'busybox chpasswd logs to facility user; forwarding limited to auth/authpriv drops it.'
    - source: 'Shadow-file write events (file integrity, audit or EDR)'
      purpose: 'Show a write to the shadow file by any tool, including tools that log nothing.'
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'opt-in'
      fields:
        - name: 'shadow file path and writing process'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: 'Sensor field names not checked; includes aging-only writes.'
      details: >-
        Covers tools that write no syslog line, such as busybox adduser. Shows a change, not the
        new field class. On musl, auditd, static Tetragon and Wazuh FIM (vendor repo; /etc by default, 12 h scan)
        run; osquery has no official build and Falco ran only as a container (lab, 2026-11-05).
      limitations:
        - 'Needs a file or audit rule on the shadow file; not collected by default.'
        - 'auditd auid is unset on non-PAM Alpine; attribute by PID/PPID lineage and time.'

detection:
  scope: >-
    The detectable gate is conditional on inventory, so the strategies frame exposure assessment: a
    full prerequisite evaluation against the host's own fix, and event-time reassessment after a password-field change.
    Neither detects an attack or claims to cover login attempts.
  outcome_guardrails: >-
    Exposed is not attacked and needs every conjunct read and true. Not exposed needs one conjunct
    proven false. Otherwise unknown: unread prerequisites, unloaded config edits, a non-$5$/$6$
    first donor, uninventoried directory users. Installed only is latent. A fix ends exposure
    at sshd restart, not for earlier logins.
  shared_normalization_context: >-
    Normalise openssh-server (never the openssh meta-package) to its branch and compare the release
    with apk version ordering against that branch's fix. Reduce account fields to classes: star, locked, hash type, empty. Treat only
    a field exactly '*' as the affected class; keep passwd-database order.
  shared_enrichment_context: >-
    Join to network exposure, image lineage, owner, and passwordless doas or sudo rules that let a
    star account become root. No behavioral baseline is required.

  strategies:
    - id: 'STRAT-PREREQUISITE-INVENTORY-JOIN'
      name: 'all-prerequisite evaluation of no-PAM musl sshd hosts against the branch fix'
      objective: >-
        Find hosts that meet every Alpine prerequisite without a fixed package, separating exposed,
        exposed with no fix, latent and unknown.
      incident_relevance: >-
        Addresses the precondition of the disclosed bypass, not any observed attack. The
        reformulation required because the object is a state, not a behavior.
      detection_logic: |
        Per host or image (sshd -T with the service's binary, -f/-o, -C): musl sshd without
        PAM, or openssh-server-pam with UsePAM no; PasswordAuthentication yes and applied (no
        config change since listener start or reload); a '*' account password auth can reach
        (root only with PermitRootLogin yes; not refused by Allow/Deny, AuthenticationMethods);
        first $-format field in passwd order $5$/$6$; openssh-server below the branch fix, or
        fixed but sshd started before its install. All hold, sshd runs: exposed. No vendor
        package (Alpine <3.16, OpenWrt 23.05/22.03): exposed, no vendor fix. Installed only:
        latent. A conjunct false or no $-format field (NSS read): not exposed. Else unknown.
      minimum_evidence: >-
        Exposed: every conjunct read and true (release and branch, run state, config with Match
        evaluated and loaded, field classes in passwd order). Not exposed: one proven false (fixed
        openssh-server with sshd started after it, applied PasswordAuthentication no, no
        reachable star with NSS read, no $-format field).
      correlation_context: >-
        Join on host and image identifiers. Inventory freshness bounds every conclusion; a stale
        record cannot show a recent hash.
      detectors:
        - detector_class: 'software-inventory-and-sbom'
          technologies:
            - 'Package manager queries (apk list -I)'
            - 'Container image scanners'
            - 'Software bill of materials tooling'
            - 'Image or AMI package census'
          contribution: 'Establishes the openssh-server package, branch and release per host and image.'
          limitations: >-
            Cannot show config, run state, sshd start time or account state without added
            collection. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
        - detector_class: 'host-configuration-and-account-state-collector'
          technologies:
            - 'Shell collection over SSH or cloud run-command (apk, sshd -T, ps)'
            - 'Configuration management facts'
          contribution: >-
            Establishes sshd config and listener start and load time, run state and account field
            classes.
          limitations: >-
            Needs privileged read of the shadow file and the right to run sshd -T; run-command
            agent support on musl is unverified; container-only estates may lack both.
      benign_explanations:
        - explanation: >-
            Password login is blocked at the network layer, so the exposed host is not reachable
            from untrusted segments.
          distinguishing_context: >-
            Network evidence shows no path from untrusted segments to the sshd port. The state stays
            exposed; reachability is reported separately.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding on a firewall rule that may change leaves the exposed state in place; record
            the compensating control with an expiry.
      forbidden_exclusions:
        - field: 'exclusion of a host because its SSH banner version looks fixed'
          reason: >-
            Alpine fixes keep the older upstream version, so a banner cannot show fix state
            (REF-CHECKPOINT); the package release decides.
        - field: 'exclusion of a host because default PermitRootLogin blocks root'
          reason: 'Other star accounts that can log in remain in scope (REF-ALPINE-ADVISORY).'
        - field: 'exclusion of an account because adduser was used'
          reason: >-
            Only the stored field decides. Alpine lists adduser users as star accounts; busybox
            source writes '!' (REF-ALPINE-ADVISORY, REF-BUSYBOX-ADDUSER).
        - field: 'exclusion of an account because its shell is nologin'
          reason: 'allowed_user() only needs an existing, executable shell (REF-OPENSSH-AUTH-C).'
        - field: 'exclusion of a host because its first $-format hash is not $5$ or $6$'
          reason: >-
            Alpine names only $5$/$6$; IONIX reports bcrypt donors also qualify through 10.6p1. Report
            unknown, not cleared (REF-IONIX, REF-OPENSSH-BCRYPT-SALT).
        - field: 'exclusion of a host because sshd -T shows PasswordAuthentication no'
          reason: >-
            -T reads the files; a listener not reloaded since the edit still applies its old config
            to new connections (REF-OPENSSH-SSHD-C-1006).
        - field: 'exclusion of a host because a package upgrade ran or the openssh package is fixed'
          reason: >-
            The openssh meta-package can be fixed while openssh-server is not, and a running sshd
            keeps its old binary until restart (Alpine advisory; our lab, 2026-11-05).
      blind_spots:
        - description: >-
            Missing telemetry: directory-sourced users have no shadow entry; unless NSS is
            enumerated the star conjunct is unknown.
          routes_to: null
        - description: >-
            Missing telemetry: container runtime state (entrypoint-set passwords, config edits)
            can differ from image inventory; read the running container.
          routes_to: null
        - description: >-
            Attribution limit: an exposed host cannot be linked to any login or attempt by this
            strategy.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Evasion: a hand-built or statically linked sshd binary escapes package-name inventory.
          routes_to: null
        - description: >-
            Missing telemetry: without listener start or reload times, a config edit not yet loaded
            or an upgrade not yet restarted looks like an applied mitigation.
          routes_to: null
        - description: >-
            Missing telemetry: On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. An agent-only estate may have no inventory for these
            hosts.
          routes_to: null
      analyst_response: >-
        For each exposed host: confirm reachability, run apk upgrade -U -a (or disable password
        login, the only option with no vendor fix), restart sshd, re-read openssh-server and sshd
        start time, then review star-account password logins, doas use, new users and key changes.
        Alpine: treat as compromised unless ruled out.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), Alpine 3.24.3 10.3_p1-r1: 12/12 bypass logins;
          apk upgrade openssh left openssh-server r1, still bypassable; old binary ran until
          restart. Controls (r2 restarted, `!` user, glibc): no bypass. Checked by hand against the
          captured records; Match, NSS, non-SHA donors untested.
      safe_conclusion: >-
        The host runs sshd and meets every Alpine prerequisite, with the config applied and no
        fixed package; it is exposed, with no evidence it was attacked.

    - id: 'STRAT-PASSWORD-SET-ON-STAR-ACCOUNT-HOST'
      name: 'password field change on a star-account host, as an exposure reassessment trigger'
      objective: >-
        Use a password-field change on a host with a star account and an unfixed no-PAM sshd to
        reassess exposure at event time, reporting candidate, exposed or newly exposed.
      incident_relevance: >-
        Follows the state change Alpine says makes a tiny-cloud host exploitable (an admin or
        user-data sets a password); not any login.
      detection_logic: |
        Trigger on a password-set record (busybox chpasswd: password for '<user>' changed, empty
        tag, match facility plus message; passwd: password for <user> changed by <actor>;
        pam_unix(chpasswd:chauthtok): password changed for <user>; usermod: change user '<user>'
        password; useradd: new user: name=<user>) or a shadow-file write, on a
        host whose last inventory shows a '*' account and an unfixed no-PAM sshd. The event is a
        candidate change: the same lines cover lock, unlock, delete, a star set with chpasswd -e,
        or aging only. Re-collect the post-event state and run the inventory verdict: exposed only
        if it matches; newly exposed only with a non-exposed pre-state. Record the account only.
      minimum_evidence: >-
        The record or file event, the named account, and a post-event inventory deciding every
        conjunct; newly exposed also needs a pre-event inventory showing not exposed. A record alone
        is a candidate exposure change.
      correlation_context: >-
        Join the record, actor process and account inventory on host; attribute by PID/PPID lineage
        and time (auditd auid is unset on non-PAM Alpine). Other transitions (config flipped,
        package downgraded) surface through the inventory strategy at poll time.
      detectors:
        - detector_class: 'log-analytics-correlation'
          technologies:
            - 'SIEM correlation over forwarded syslog'
            - 'syslog daemons forwarding auth and user facilities'
          contribution: 'Matches password-set records and joins them to host inventory.'
          limitations: >-
            Needs the records forwarded; program-name filters miss chpasswd's empty tag.
        - detector_class: 'file-integrity-monitoring'
          technologies:
            - 'auditd'
            - 'Tetragon (static build)'
            - 'File-integrity monitoring'
          contribution: 'Records a write to the shadow file and the writing process.'
          limitations: >-
            Shows a change, not the hash scheme; needs the account inventory. On musl, Wazuh FIM
            runs from the vendor repo; osquery has no official build.
      benign_explanations:
        - explanation: >-
            A sanctioned password set (console password, user-data) on a host with a compensating
            control recorded.
          distinguishing_context: >-
            A change ticket and a recorded control with an expiry. The host is still exposed until
            patched or password login is off.
          overlaps_incident_instance: true
        - explanation: >-
            Locking, unlocking or deleting a password (same busybox line), or a password set on the
            last star account, which removes exposure.
          distinguishing_context: >-
            Post-event inventory shows no reachable '*' account, or no $-format field at all. A
            non-$5$/$6$ first donor stays unknown (FIRST_DONOR_NOT_SHA).
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'exclusion of a change made by root or a privileged account'
          reason: >-
            An attacker with a foothold changes passwords under the same identities; this is also
            the Alpine hash prerequisite.
        - field: 'exclusion of changes during provisioning or first boot'
          reason: 'Alpine names first-boot password setting as the tiny-cloud exposure route.'
      blind_spots:
        - description: >-
            Missing telemetry: busybox adduser writes no syslog record, and hosts or containers
            without a syslog daemon leave only file events or inventory diffs.
          routes_to: null
        - description: >-
            Attribution limit: the strategy cannot say whether the new state was later used.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Missing telemetry: busybox chpasswd logs to facility user with an empty tag; forwarding
            limited to auth/authpriv drops it.
          routes_to: null
      analyst_response: >-
        Identify the actor and session, re-run the inventory verdict on the post-event state, check
        reachability, and if exposed check accepted password logins for star accounts after the
        change. Patch with apk upgrade -U -a or disable password login, then restart sshd.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Our lab (Delta research team, 2026-11-05), Alpine 3.19/3.24, 3 syslogds: busybox chpasswd
          user.info (no tag), passwd auth.info, adduser none; 3.24: shadow-utils chpasswd, usermod,
          useradd. Emulated useradd sent "new user: name=" off-box; auditd saw the passwd/shadow
          rename. Checked by hand against the captured records.
      safe_conclusion: >-
        A password field changed on a host that had a star account and an unfixed no-PAM sshd; the
        post-event inventory, not the record, decides whether it is exposed.

  supporting_technologies_considered: >-
    External exposure scanners and version banners can point at password-login SSH but cannot see
    package revision or account state. Scanner content exists (goonami-scanner PR 277, merged;
    Nuclei PR 17702, open); neither is primary evidence here.

detector_requirements:
  required: >-
    Per-host openssh-server release with branch, sshd run state and start time versus install,
    sshd -T values with Match evaluated plus listener load time, account field classes in passwd order without hash values,
    directory-user coverage, freshness timestamps, and alert text that states the verdict class.
  optional: >-
    Forwarded password-set records and file-integrity or audit coverage on the shadow file buy the
    reassessment trigger at event time rather than poll time.
  correlation:
    capability: >-
      Per-host join of package, config, account state and password-set records with synchronised
      clocks and stable host identity across image rebuilds.
    window: 'inventory freshness window set by the estate; event-time for the reassessment strategy'
  baselines:
    - name: 'Per-host type of the first $-format hash and set of star accounts'
      window: 'rebuilt at each inventory poll'
      seeded_from: >-
        Sanctioned account inventory; never seeded from hosts already suspected of compromise.
  product_support_caveat: >-
    A named product is only a candidate. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. auditd, rsyslog and static Tetragon run.
    Verify it reads the openssh-server release, not the meta-package.

missing_context:
  unverified:
    - >-
      Whether every no-PAM musl build behaves like stock Alpine openssh-server; no source settles
      build-to-build reliability. Check against the vendor advisory or the host's own package state.
    - >-
      The Alpine advisory lists users made with adduser without a password as star accounts;
      busybox adduser.c writes '!'. The field-class rule decides, not the tool used.
    - 'Exposure of Buildroot and Yocto builds: secondary sources hedge it; no source confirms either way.'
    - >-
      Whether a first donor other than $5$/$6$ exposes an affected host: Alpine names only $5$/$6$;
      IONIX reports bcrypt also qualifies through 10.6p1. Reported unknown, not cleared.
    - >-
      first_observed 2026-11: month of disclosure; spraying reported 2026-11-05 (REF-BEAUMONT-SPRAY).
      When shipped images first held the state is undated.
  assumptions:
    - id: 'ASSUMPTION-PASSWORD-TOOLS-WRITE-SHA512'
      verdict_changing: false
      statement: >-
        Password tools on these hosts write $6$ by default (lab, Alpine 3.24). This sets triage priority only;
        the reassessment strategy re-reads the first donor type and does not rely on it.
  standing_negatives:
    - statement: >-
        No published Sigma, Elastic, Splunk, Falco or ET Open (Suricata) rule for this CVE's posture was found
        in a shallow-clone and vendor-page search on 2026-11-05. Scanner content exists: goonami-scanner
        PR 277 (merged), Nuclei PR 17702 (open).
      ref: 'REF-GOONAMI-PR'
      valid_until: '2026-11-12'
      recheck: 'Search the rule repositories and scanner plugin feeds for the CVE id again.'
    - statement: >-
        The CVE was not in the CISA KEV catalog release of 2026-11-04, which predates disclosure. One
        researcher reports spraying and a honeypot coin miner, uncorroborated; no production
        compromise is documented.
      ref: 'REF-CISA-KEV'
      valid_until: '2026-11-12'
      recheck: 'Re-read the CISA KEV catalog and vendor advisories for the CVE id.'

missing_states:
  - id: 'PACKAGE_RELEASE_UNREADABLE'
    meaning: 'Missing telemetry: only an upstream version or banner is available, not the package release.'
    coverage_claim: 'no-coverage'
    response: 'Report unknown; do not mark fixed or exposed from the version string or the openssh meta-package.'
  - id: 'SSHD_START_VS_INSTALL_UNREAD'
    meaning: 'Missing telemetry: openssh-server is fixed but whether sshd restarted after the install is not known.'
    coverage_claim: 'no-coverage'
    response: 'Report unknown, never not exposed; restart sshd and re-read its start time.'
  - id: 'ACCOUNT_FIELD_CLASS_UNREAD'
    meaning: 'Missing telemetry: the shadow field classes or their order are not collected for the host.'
    coverage_claim: 'no-coverage'
    response: 'Report unknown for the star and hash conjuncts; name them in the alert.'
  - id: 'EFFECTIVE_CONFIG_UNREAD'
    meaning: 'Missing telemetry: sshd -T output, Match evaluation, or the listener load time is not available.'
    coverage_claim: 'no-coverage'
    response: 'Report unknown and name the setting; do not infer it from the main config file.'
  - id: 'FIRST_DONOR_NOT_SHA'
    meaning: 'Missing context: the first $-format field is not $5$/$6$; its effect on an affected build is unassessed.'
    coverage_claim: 'coverage-limited'
    response: 'Report unknown, never not exposed; cite REF-IONIX and REF-OPENSSH-BCRYPT-SALT.'
  - id: 'SSHD_RUN_STATE_UNREAD'
    meaning: 'Missing telemetry: whether sshd is enabled or running is not known.'
    coverage_claim: 'coverage-limited'
    response: 'Report latent-or-exposed as unknown; do not report exposed from the package alone.'
  - id: 'DIRECTORY_USERS_NOT_LOCAL'
    meaning: 'Missing telemetry: NSS supplies users with no local shadow entry and they are not inventoried.'
    coverage_claim: 'no-coverage'
    response: 'Report the star conjunct unknown, never not exposed; read the users through NSS.'
  - id: 'REACHABILITY_UNKNOWN'
    meaning: 'Missing context: network reachability of the sshd port is not known.'
    coverage_claim: 'coverage-unaffected'
    response: 'Report exposure of the host state and its reachability as separate facts.'

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_exposure_claim'
    - 'verdict_class_exposed_no_vendor_fix_latent_not_exposed_unknown_or_candidate'
    - 'host_or_image_and_owner'
    - 'openssh_server_variant_and_package_release'
    - 'branch_fix_release_compared_or_no_fix'
    - 'sshd_run_state'
    - 'sshd_start_time_versus_openssh_server_install_time'
    - 'password_authentication_pam_and_root_login_state_and_listener_load_time'
    - 'star_account_names_and_password_reachability'
    - 'first_dollar_hash_type_in_passwd_order'
    - 'network_reachability_state'
    - 'timestamps_and_inventory_freshness'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'compensating_control_and_expiry'
      condition: 'when a firewall or config block is relied on for a host not yet patched'
    - field: 'password_set_record_actor_session_and_pre_and_post_event_inventory'
      condition: 'when the alert comes from the reassessment strategy'
    - field: 'root_reachability_via_nopass_doas_or_sudo'
      condition: 'when a star account can become root without a password'
  recommended_title: >-
    sshole exposure verdict for SSH host (exposed, candidate change or unknown)
  unsupported_title: 'Host was compromised through sshole'

evidence:
  confirmed_incident_behavior: >-
    Alpine lists the prerequisites and fixes; the release notes call the fix a critical workaround
    for musl without PAM; the commit rejects fields under 4 characters. Our isolated lab
    (2026-11-05) reproduced the bypass on a host meeting every prerequisite. A researcher reports
    spraying; no compromise is documented.
  supported_conclusion: >-
    Patching openssh-server and restarting sshd, disabling password login, or the PAM build with
    UsePAM yes removes the state (advisory, lab). A report may state a host as exposed, exposed
    with no vendor fix, latent, not exposed or unknown from package, applied config and accounts.
  unsupported_conclusions: >-
    The evidence does not establish that any host was attacked, that unconfirmed musl builds are
    exposed, that a non-$5$/$6$ first donor is safe, that a fixed host was safe earlier, or that
    an upgrade fixed a host before sshd restarted or when only the openssh meta-package moved.
  procedure_boundary: >-
    Logins by star accounts are DT-SSHH-HOST-001 and DT-SSHH-HOST-002; follow-on actions are
    DT-SSHH-HOST-003 and DT-SSHH-HOST-004. This object shows the state, not use of it.
