        Its $5$/$6$ donor condition is narrower than IONIX's bcrypt report.
      evidence_use: >-
        Used: prerequisites, root/doas, directory users, tiny-cloud, fixed table, restart advice. Not
        used: adduser example (busybox source wins). Donor list treated as sufficient, not complete.
