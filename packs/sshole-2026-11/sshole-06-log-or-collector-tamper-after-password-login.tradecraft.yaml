identity:
  uuid: '03cb4941-804c-476d-bd25-78caa3716c00'
  id: 'DT-SSHH-HOST-006'
  name: 'A session that began with an SSH password login stops log or telemetry collectors and truncates or deletes local logs'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
    - 'host-filesystem'
  behavior_classes:
    - 'defense-impairment'
  tags:
    - 'sshole'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'log-tampering'
    - 'collector-stop'
    - 'auditd'
    - 'rsyslog'
    - 'ssh-session-attribution'
    - 'inferred'
    - 'generic'
    - 'post-exploitation'

behavior:
  definition: >-
    After logging in over SSH with a password, an adversary uses that session, often elevated to root
    through doas, to stop log and telemetry collectors and to truncate or delete local log files.
  detailed_definition: >-
    Collectors are stopped by service commands or signals; logs are emptied by redirection or removed
    by delete commands. Stopping needs root for system services. The attempt ends at the command;
    success begins when a collector stops recording or a log file loses its content.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a password-authenticated session that holds root and tampers with collectors or local
      logs; not the claim that sshole exploitation did so.
    summary: >-
      Needs a successful SSH password login, however obtained, and root, which tiny-cloud images
      grant to wheel through passwordless doas. No source reports this after an sshole login. Our
      own isolated lab emulated it on Alpine 3.24; it was not observed in the wild.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable only from records that live off the host or in a sensor the session did not stop;
      on-host logs and the collectors the session stops go blank.
    blocking_conditions:
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Many Alpine hosts and containers forward no syslog and run no audit rules or sensor; there
          the wipe leaves nothing to read.
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Log truncation by shell redirection runs no tool; only a file-event source records it, and
          none is on by default.
    summary: >-
      Needs an off-box syslog stream that was live until the stop, or a process or file source that
      keeps recording after the session acts. An on-host log read after the wipe shows only absence.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable where collectors are changed rarely and only by named automation; not where
      administrators restart logging daemons by hand after a password login.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          The password login, the stop command and the log change come from different streams; the
          join between them (user, session process, time) is this pack's inference.
      - condition: 'environment-inventory-required'
        note: 'Which hosts forward logs, and which automation restarts collectors, must be known.'
    summary: >-
      A collector stop or log deletion by a password session is a small population on a managed
      fleet. A stream that goes silent just after a stop command is a high-value correlation, but
      silence alone also follows reboots, network faults and maintenance.

attack_surface_context:
  surface: >-
    Log and telemetry collectors (syslog daemons, auditd, eBPF and packet tools) and the local log
    files under /var/log on a Linux host reached by an SSH password login; Alpine is the worked case.
  how_the_surface_works: >-
    Alpine runs services under OpenRC; rc-service stops one. Busybox or rsyslog writes
    /var/log/messages, auditd writes /var/log/audit, and rsyslog can forward over TCP to a remote
    receiver. Tetragon runs as an eBPF sensor with its own export file.
  incident_processing_path: >-
    The Alpine advisory says to review doas use and treat an exposed machine as compromised. It
    describes no post-login activity. One researcher reports a coin miner as the first honeypot
    payload. Collector tamper is this pack's inference, exercised only by lab emulation.
  processing_stages:
    - 'ssh-password-login-accepted'
    - 'privilege-elevation-to-root'
    - 'collector-stop-command'
    - 'local-log-truncate-or-delete'
    - 'collectors-silent'
  stage_evidence: >-
    The login line proves a login. A stop or delete command proves an attempt; a stopped process or
    an emptied file proves the effect; silence in a stream proves only that records stopped arriving.
  trust_boundaries: >-
    Password login into a user session is the boundary the flaw bypasses. Stopping system collectors
    crosses to root, which doas grants. Reached: unverified for sshole.
  security_control_context: >-
    Off-box forwarding, sensors the session cannot stop, append-only log files and restrictive doas
    rules decide the outcome. A session that stops only the on-host copy leaves the forwarded copy.
  special_context:
    topic: 'tool-logging-differs-by-implementation'
    context: >-
      Under musl, doas lines carry an empty program tag and rsyslog renders embedded newlines as
      #012. Match message text and facility, not tag.
  technology_variants:
    - variant: 'systemd-hosts'
      context: >-
        On systemd hosts the stop is systemctl or a signal, not rc-service. Match the class of
        collector stop, not the Alpine command.
  practitioner_implication: >-
    Learn which hosts forward syslog off-box and how long they stay silent in normal operation,
    which sensors run outside the session's reach, and which automation restarts collectors.

threat_research:
  why_it_matters: >-
    Stopping collectors and wiping local logs leaves a host-only analyst with no record of what the
    session did; only an off-box or surviving record remains.
  threat_actor: >-
    Unknown. No source attributes any sshole activity to a group.
  actor_class: 'generic-post-exploitation'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. OpenSSH fixed it in 10.6p2 and calls the root
    cause outside sshd. CISA's ADP entry records exploitation "poc". One researcher reports
    Internet-wide spraying of root and alpine with very long passwords and a coin miner as the first
    honeypot payload (14:21 UTC). Uncorroborated; no compromise of a production host is documented.
    No source reports collector tamper or log deletion. Not in the KEV catalog release of 2026-11-04,
    which predates disclosure.
  victim: >-
    A honeypot only, per one researcher; no production victim documented.
  capability: >-
    A honeypot payload (coin miner) is reported, without defense-impairment detail. The behavior
    here was emulated by a post-login step in our isolated lab, not observed in the wild.
  target: >-
    Syslog and audit daemons, eBPF and capture tools, and local log files on hosts with exploitable
    sshd; whether any was reached is unreported.
  victimology:
    - 'Alpine and other musl hosts running sshd without PAM, or openssh-server-pam with UsePAM no, that allow password login.'
    - 'Hosts where the logged-in account can reach root and logs are kept on the same host.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1685'
      name: 'Disable or Modify Tools'
      evidence: >-
        The behavior includes stopping log and telemetry collectors. Mapped by behavior; no source
        shows sshole used it.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1685.004'
      name: 'Disable or Modify Tools: Disable or Modify Linux Audit System Log'
      evidence: >-
        The behavior includes stopping auditd and deleting its logs. Mapped by behavior; undocumented
        in any sshole source.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1685.006'
      name: 'Disable or Modify Tools: Clear Linux or Mac System Logs'
      evidence: >-
        The behavior includes truncating or deleting /var/log files. Mapped by behavior; undocumented
        in any sshole source.

visibility:
  telemetry_sources:
    - source: 'Off-box syslog receiver of the host forwarded stream'
      purpose: >-
        Keep the record the host loses: the login, the doas line carrying the stop command, and the
        point where the host's stream ends.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'opt-in'
      fields:
        - name: 'doas record: <user> ran command <command line> as <target> from <directory>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-C'
          load_bearing: true
          note: 'AUTHPRIV; empty tag under musl (REF-MUSL-SYSLOG); skipped with nolog. Embedded newlines render as #012.'
        - name: 'receive time and last-seen time per sending host'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'Receiver clock, not the host clock; the basis of the silence test.'
        - name: 'service stop records (start-stop-daemon signal line, daemon shutdown line)'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: 'Seen in the lab receiver copy; wording is not checked against Alpine source.'
      details: >-
        Needs rsyslog or equivalent forwarding over TCP. The stream shows the stop command if the
        session ran it through doas, and then ends. A sender that never forwarded gives nothing.
      limitations:
        - 'Only hosts configured to forward; forwarding limited by facility drops lines.'
        - 'A stop run as root without doas, sudo or su leaves no command line in syslog.'
        - 'Silence is ambiguous: reboot, network fault and maintenance end a stream too.'
    - source: 'Endpoint process creation with parent lineage that survives the session'
      purpose: >-
        Show collector stop commands and log delete commands with the per-connection sshd or
        sshd-session process in the ancestry.
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'parent process chain including the per-connection sshd or sshd-session process'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'The 9.8 sshd-session split is documented (REF-OPENSSH-RELNOTES-9-8); chain depth and field names vary by sensor.'
        - name: 'command line with argv[0] and argv[1]'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'Busybox applets show the applet in argv[1] under busybox or bbsuid (REF-ALPINE-BBSUID).'
        - name: 'audit login uid (auid)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AUDITCTL-MAN'
          load_bearing: false
          note: 'Unset on every event on the non-PAM Alpine lab host, so lineage and time carry attribution.'
      details: >-
        A sensor the session did not stop, such as Tetragon, keeps recording the stop and delete
        commands after auditd and syslog die. Auditd records only until it is stopped.
      limitations:
        - 'Auditd, bpftrace and tcpdump end when the session''s stop commands reach them.'
        - 'Shell redirection that truncates a log runs no tool; strategy two needs file events for it.'
        - 'A sensor export file deleted by the session survives only through the open file descriptor.'
    - source: 'Kernel audit or EDR file events on /var/log and the audit directory'
      purpose: >-
        Show truncation or unlink of log files and removal of the audit directory, with the actor.
      event_vocabulary: 'kernel-audit'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'file path'
          attestation: 'unattested-inferred'
          load_bearing: true
        - name: 'operation (truncate, write, unlink, rename) and success'
          attestation: 'unattested-inferred'
          load_bearing: true
      details: >-
        Catches truncation by redirection and rotated-file deletion that no tool name shows. Needs
        rules or kprobe policies set before the event.
      limitations:
        - 'Absent by default; rules must be deliberate.'
        - 'Auditd path watches give pid, exe and uid, not ancestry.'
        - 'Normal log rotation also unlinks and truncates; rotation identity must be excluded.'
    - source: 'Per-host collector liveness or heartbeat ledger'
      purpose: >-
        Show a collector or forwarded stream that stopped when no actor-attributed record exists.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      details: >-
        A scheduled check of last-seen time per host and per collector, diffed against the expected
        interval. It carries no actor.
      limitations:
        - 'No session attribution; cannot separate an administrator from an intruder.'
        - 'Late by the check interval.'

detection:
  scope: >-
    Strategy one covers the forwarded stream going silent after a stop command; strategy two covers
    stop and delete commands and file events attributed to a password-login session; strategy three
    is an optional liveness fallback. On-host logs read after the fact are not coverage.
  outcome_guardrails: >-
    A stop or delete command is an attempt; a stopped collector or emptied file is an effect. Silence
    alone is a lead. A password login, even a successful one, does not show the bypass; only a
    successful auth shows an account was used.
  shared_normalization_context: >-
    Resolve the session by ancestry to the per-connection sshd (pre-9.8) or sshd-session, never by
    login uid or auid. Applet: basename(argv[0]), or argv[1] if busybox. Collector classes: syslog
    daemon, audit daemon, eBPF tracer, packet capture, process accounting. Canonicalise log paths
    including rotated names.
  shared_enrichment_context: >-
    Join change records and logrotate identity to separate sanctioned restarts and rotation. From
    DT-SSHH-HOST-001, '*' ranks highest on an exposed-class host (musl sshd without PAM, or
    openssh-server-pam with UsePAM no; an upgraded but unrestarted sshd counts) as at login time;
    patched hosts stay in scope.
  strategies:
    - id: 'STRAT-SSH-PASSWORD-SESSION-FORWARDED-SYSLOG-SILENCE'
      name: 'forwarded syslog from a live host stops after a collector stop command'
      objective: >-
        Detect an off-box stream that goes silent right after a root command that stops a collector,
        on a host with a recent password login.
      incident_relevance: >-
        Possible later consequence of any password login, sshole included. Not documented for
        sshole; a pack inference, exercised by lab emulation.
      detection_logic: |
        On the receiver, for a live host, find a doas, sudo or su record whose command stops or
        kills a collector class (rc-service or service stop, kill or pkill of a syslog daemon,
        auditd, bpftrace or tcpdump, accton with no file argument or with off, or a stop in a shell
        -c text), or any daemon-shutdown or signal line for the host's syslog daemon, with an
        "Accepted password" on that host in the window before it. Alert when no further record from
        that host arrives for the expected interval. Raise severity when the login user ran the
        stop; top severity for a '*' login account on an exposed-class host.
        Without a prior password login, report an unattributed collector stop instead.
      minimum_evidence: >-
        A stop-command or shutdown record, a prior password-login line on that host, and a silent
        interval measured on the receiver clock. Without the login line, report an unattributed
        collector stop; silence without a stop record is a liveness lead only.
      correlation_context: >-
        Keys are host and time on the receiver clock; the login is joined by user and host. A sender
        that never forwarded cannot be tested. Ingestion delay can reorder the stop line and the gap.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the stop-command line to the end of the host stream and the login.'
          limitations: 'Needs forwarding with facility kept and a per-host last-seen computation.'
      benign_explanations:
        - explanation: 'An administrator restarts or reconfigures the syslog daemon during maintenance.'
          distinguishing_context: >-
            A change record exists and the stream resumes within the restart time.
          overlaps_incident_instance: false
          tuning_hazard: >-
            A stop followed by no resume is the signal; excluding every stop by an administrator
            hides one that never resumes.
        - explanation: 'The host reboots, shuts down or loses the network.'
          distinguishing_context: >-
            No stop command precedes the silence, and boot or network records, or a resume, follow.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding accounts that hold no password'
          reason: 'Those are the accounts the bypass logs in as.'
        - field: 'CVE identifier or campaign name in any field'
          reason: 'Post-login activity carries none; matching on them reads only a decoy.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: stop commands without a resume are unusual on a managed fleet.
          Reboots and outages drive the silence-only count.
      blind_spots:
        - description: >-
            Evasion: the forwarder can be stopped without a doas, sudo or su line, or its network path
            cut, so no stop command reaches the receiver; only the silence remains.
          routes_to: null
        - description: >-
            Missing telemetry: hosts that never forward off-box have no receiver copy, and the
            on-host record is gone after the wipe.
          routes_to: null
        - description: >-
            Attribution limit: a stop line names the user and time, not the session process; a
            concurrent second session cannot be excluded.
          routes_to: null
        - description: >-
            Evasion: a session that stops the forwarder first, then runs the rest, leaves no later
            command in the stream; covered by
            STRAT-SSH-PASSWORD-SESSION-COLLECTOR-STOP-OR-LOG-DESTROY where a surviving sensor runs.
          routes_to: null
      analyst_response: >-
        Check host reachability and the last received records, the stop command and its user, and the
        login line. Find sensors that survived and read them; preserve the host before restarting
        collectors, since a restart may fail and rewrites state.
      safe_conclusion: >-
        A host stream ended after a collector stop command or syslog-daemon shutdown record, in a
        window that follows a password login on that host; whether the session ran it, and how
        login was obtained, are not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          After a reproduced bypass login, emulated log-deletion steps ran as root through doas.
          Off-box rsyslog kept the doas stop line and the syslog daemon's signal line, then ended;
          the local log was empty. Checked by hand against the captured records. Post-login steps
          were emulated by us, not taken from a real intrusion.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud image (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; accounts alpine:*, a key-only * user,
          a $6$ donor, a ! user. Reproduced bypass logins, then post-login steps we emulated on our
          lab hosts. Telemetry: rsyslog forwarded off-box.
        measured: >-
          The receiver copy ended with the doas ran-command line for the stop and a
          start-stop-daemon signal 15 line for rsyslog; the wipe session's own Failed then
          Accepted pair was in it too. On-host /var/log/messages was 0 bytes. No benign
          stop-and-restart twin was run.
    - id: 'STRAT-SSH-PASSWORD-SESSION-COLLECTOR-STOP-OR-LOG-DESTROY'
      name: 'collector stop, or log truncate or delete, by a process under a password-login session'
      objective: >-
        Detect a collector stop command or a truncate or delete of local logs whose ancestry is a
        session that began with a password login.
      incident_relevance: >-
        Possible later consequence of any password login, sshole included. Not documented for
        sshole; a pack inference, exercised by lab emulation.
      detection_logic: |
        Alert on process creation of a collector stop (rc-service, service or systemctl stop of a
        syslog daemon, auditd, bpftrace or an eBPF sensor; kill or pkill of those or of tcpdump;
        accton with no file argument or with off) or a log delete (rm of /var/log/messages*,
        /var/log/audit or rotated names), by applet as normalised, when ancestry reaches a
        per-connection sshd (pre-9.8) or sshd-session process with an earlier "Accepted password"
        on that host. Also alert on a successful truncate, write-to-zero or unlink of those paths
        by such a process, redirection included. Real uid 0 via a doas or su hop is stronger. Top
        severity for a '*' login account on an exposed-class host.
      minimum_evidence: >-
        A stop or delete process or file event, ancestry reaching the session, and a prior
        password-login line on that host. Without ancestry, report an unattributed collector change.
      correlation_context: >-
        Keys are host, user, session process and time. Join the login by user and time; an exact
        process link is not assumed. Pair a stop with a later log-file event or a silent stream.
      detectors:
        - detector_class: 'endpoint-process-lineage-detection'
          technologies:
            - 'EDR with process creation and parent chain'
            - 'Tetragon or other eBPF sensor with process and file events'
            - 'Linux auditd with execve and path rules'
          contribution: 'Establishes command, arguments, path and session ancestry.'
          limitations: >-
            Auditd and bpftrace end when the session stops them; use a sensor the session cannot
            stop.
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the login line to process and file events by host and user.'
          limitations: 'Only as good as the ingested fields and clock alignment.'
      benign_explanations:
        - explanation: 'An administrator logs in by password and restarts or reconfigures a logging daemon.'
          distinguishing_context: >-
            Known administrator and source, a change record, and the collector is running again
            afterwards.
          overlaps_incident_instance: false
          tuning_hazard: >-
            An account with a real hash is not a bypass target, but excluding by user name hides a
            '*' account later; match the change record and the restart, not the user.
        - explanation: 'Log rotation or a cleanup job truncates or removes rotated files.'
          distinguishing_context: >-
            Run by the rotation job identity from the init or cron tree with no sshd or
            sshd-session ancestor.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding accounts that hold no password'
          reason: 'Those are the accounts the bypass logs in as.'
        - field: 'excluding by command wording or a comment in the shell text'
          reason: 'Adversary-chosen and imitable.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: collector stops and log deletes inside password sessions are
          unusual on key-only fleets. Hosts administered by password will exceed it.
      blind_spots:
        - description: >-
            Missing telemetry: a host with only auditd, bpftrace or tcpdump loses that evidence at the
            stop; no sensor outside the session's reach means no record after it.
          routes_to: null
        - description: >-
            Evasion: truncation by shell redirection runs no tool; only the file-event path of this
            strategy sees it.
          routes_to: null
        - description: >-
            Attribution limit: auditd auid is unset on the non-PAM lab host and a doas hop changes
            real uid, so only ancestry links the command to the session.
          routes_to: null
        - description: >-
            Detector limit: a rule on image name or argv[0] alone misses busybox applets (image
            busybox or bbsuid; applet in argv[1] under bbsuid or "busybox <applet>").
          routes_to: null
      analyst_response: >-
        Read the command, path and outcome, and the session's login. Locate surviving records: the
        off-box stream and any sensor still running, whose export file may be recoverable through
        the sensor's open file descriptor. Treat the host as compromised where the login is
        unexplained.
      safe_conclusion: >-
        A collector stop or log delete ran in a session (by ancestry) that began with a password
        login; whether the collector stopped or the logs were lost, and how login was obtained, are
        not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          After a reproduced bypass login, log-deletion steps ran as root through doas. Auditd
          recorded until its service stop (host 1); Tetragon, left running, kept the stop, pkill and
          rm execs (second host). Checked by hand against the captured records. Post-login steps
          were emulated by us, not taken from a real intrusion.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins, then post-login steps we emulated on our lab hosts.
          Telemetry: auditd, bpftrace, acct, Tetragon, off-box rsyslog.
        measured: >-
          Auditd, bpftrace, tcpdump and process accounting stopped at the wipe and the audit
          directory was removed. Tetragon wrote on to its deleted export file; 2,270 lines were
          recovered from its open descriptor, including rc-service rsyslog stop, pkill bpftrace
          and rm of rotated logs. No benign admin restart twin was run.
    - id: 'STRAT-SSH-PASSWORD-SESSION-COLLECTOR-LIVENESS-GAP'
      name: 'collector or forwarded-stream liveness gap on a host with a recent password login'
      objective: >-
        Detect a collector or stream that stopped, on a host with a recent password login, when no
        stop command or file event was collected.
      incident_relevance: >-
        A weaker fallback for the same possible consequence. Not documented for sshole.
      detection_logic: |
        On a schedule, for each host that forwards logs or runs a collector, compare last-seen time
        with the expected interval. Alert when a host or collector is overdue and an "Accepted
        password" for any user was logged on that host in the window before the last record. Suppress
        hosts in a maintenance window or with a boot or shutdown record in the last stream. Alert
        also when a collector's process is absent while the host still answers.
      minimum_evidence: >-
        A liveness ledger showing overdue, and a password-login line before the last record. Without
        the login line, report a liveness gap only.
      correlation_context: >-
        Keys are host and receiver time. The login is joined by host and time only; a short window
        limits false joins.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Computes per-host last-seen and joins it to login lines.'
          limitations: 'Late by the check interval; sees no command and no actor.'
      benign_explanations:
        - explanation: 'Outage, reboot, decommission or a noisy-network host drops its stream.'
          distinguishing_context: >-
            Boot or shutdown records, a resume, an asset-state change or a monitored network fault.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Suppressing every host with a recent gap hides a stop that never resumes.
      forbidden_exclusions:
        - field: 'excluding hosts because they are low-value or default-image'
          reason: 'The alpine-style default image is the documented target.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source gives a rate; it depends on fleet stability and the check interval.'
      blind_spots:
        - description: >-
            Missing telemetry: hosts that do not forward and run no liveness check have no ledger.
          routes_to: null
        - description: >-
            Evasion: an adversary that restores the collector or replays a heartbeat after the wipe
            hides the gap from a coarse interval.
          routes_to: null
        - description: >-
            Attribution limit: the join is by host and time, so the gap cannot be tied to a session.
          routes_to: null
      analyst_response: >-
        Confirm the host is up, read the last received records and any login or doas lines, and
        compare with the surviving sensor if one exists. Check the collectors and logs directly.
      safe_conclusion: >-
        A collector or stream went silent on a host with a recent password login; the cause and any
        link to the session are not established.
  supporting_technologies_considered: >-
    Package and service inventories corroborate but carry no actor. Network capture on the receiver
    side shows the stream ending but not the cause.

detector_requirements:
  required: >-
    Off-box syslog forwarding with facility kept and a per-host last-seen time for strategy one;
    process or file events with ancestry and argv[0] and argv[1] from a sensor the session cannot
    stop for strategy two; a liveness ledger for strategy three. Alert text must separate login,
    attempt, effect and silence.
  optional: >-
    A maintenance-window feed, rotation identity, a collector inventory per host and a per-account
    login-method baseline remove the main benign classes.
  correlation:
    capability: >-
      Aligned clocks with the receiver as reference, a stable host and user key, and ancestry
      resolution to sshd or sshd-session. The log pid to process link is not assumed.
    window: >-
      Start at 60 minutes after the login, or the session lifetime; this pack's choice, matching
      DT-SSHH-HOST-004. Silence interval: a multiple of the host's normal inter-record gap.
  product_support_caveat: >-
    A named product is only a candidate; verify sensors, logging, fields and parsing first. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo and Falco ran only as a container; auditd,
    bpftrace and static Tetragon do. Only a tamper-resistant sensor survives the wipe. Check busybox
    argv[1], doas chain depth, empty tags.

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure; this behaviour is not documented
      for this threat.
    - >-
      Whether any sshole exploitation has been followed by collector tamper or log deletion; the
      one honeypot report names a coin miner without such detail.
    - >-
      Whether the lab steps match any real intruder's order or tooling; they were chosen by the lab.
    - 'Whether the lab results hold on systemd or glibc hosts; only Alpine 3.24 musl was exercised.'
  assumptions:
    - id: 'ASSUMPTION-GENERIC-POST-LOGIN-DEFENSE-IMPAIRMENT'
      verdict_changing: true
      statement: >-
        A bypass login would be followed by collector tamper like other SSH footholds; no source
        says so, and the one reported honeypot payload is a coin miner. If wrong, the object stays
        generic and adds no sshole coverage. Resolve it by a report describing such activity.
    - id: 'ASSUMPTION-LAB-EMULATION-REPRESENTATIVE'
      verdict_changing: false
      statement: >-
        The lab steps (stop commands, kills and deletes by a root session) stand for what a real
        session would run; the steps were emulated. If wrong, the strategies still hold for the
        commands matched but may miss other ways to impair collectors.
  standing_negatives:
    - statement: >-
        No source reviewed on 2026-11-05 reports collector tamper or log deletion after an sshole
        login. One researcher reports spraying and a honeypot coin miner, uncorroborated; no
        compromise of a production host is documented. Checked were the Alpine advisory and the
        researcher's post.
      ref: 'REF-ALPINE-ADVISORY'
      valid_until: '2026-11-12'
      recheck: >-
        Check the CISA KEV catalog, the Alpine advisory and vendor bulletins for an intrusion report
        describing stopped collectors or wiped logs.

missing_states:
  - id: 'MISSING_OFF_BOX_LOG_FORWARDING'
    meaning: >-
      Missing telemetry: the host forwards nothing off-box, so after the wipe no record of the
      session or the stop remains.
    coverage_claim: 'no-coverage'
    response: >-
      State the behavior is not covered for the host; do not report that nothing happened.
  - id: 'MISSING_SURVIVING_SENSOR'
    meaning: >-
      Missing telemetry: no process or file sensor runs that the session cannot stop.
    coverage_claim: 'coverage-limited'
    response: >-
      Report only the stream's end; absence of a later record does not show what the session did.
  - id: 'MISSING_SESSION_ATTRIBUTION'
    meaning: >-
      Missing telemetry: a stop or delete is visible with no ancestry tying it to the login.
    coverage_claim: 'coverage-limited'
    response: >-
      Report a collector change of unknown author with nearby password logins as context, not cause.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_session_user'
    - 'password_login_record_and_source_address'
    - 'acting_user_and_process_lineage_or_missing_state'
    - 'collector_or_log_path_affected'
    - 'operation_attempted_or_effect_observed'
    - 'last_record_time_on_receiver_and_resume_state'
    - 'timestamps_and_correlation_context'
    - 'sanctioned_change_check_result'
    - 'surviving_sources_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'collector_restart_or_stream_resume'
      condition: >-
        when logs show the collector running again or the stream resuming after the stop
  recommended_title: >-
    Collector stop or log deletion after SSH password login (attempt or effect stated)
  unsupported_title: 'sshole attacker wiped logs after exploiting OpenSSH'

evidence:
  confirmed_incident_behavior: >-
    Alpine describes the bypass and says to treat an exposed machine as compromised. One researcher
    reports a honeypot coin miner, uncorroborated; no production compromise is documented. No
    source reports collector tamper or log deletion; this pack infers it, and a lab emulated it on
    2026-11-05. Not observed in the wild.
  supported_conclusion: >-
    A password login followed by a collector stop or log delete in the same session is separable
    where an off-box or surviving record exists. Inferred: a detector may report it as such, never
    as sshole activity.
  unsupported_conclusions: >-
    The evidence does not establish that any sshole exploitation produced a collector stop or log
    loss, that a login came from the bypass, that any compromise occurred, or that logs were
    deleted rather than rotated. A silent stream does not by itself show tampering. A clean result
    does not show a host is safe.
  procedure_boundary: >-
    Defense impairment after a password login. Siblings cover the star-account login, key-only
    password login, privilege escalation, persistence and the exposed posture. Reading or
    stealing credentials is separate.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: >-
        "Treat the machine as compromised" advice and review of doas use. It documents no
        exploitation and no post-login activity.
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on sshole spraying and honeypot payload'
      publisher: 'Kevin Beaumont (cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        2026-11-05 14:21 UTC: spraying of root and alpine with very long passwords; coin miner as
        first honeypot payload. Single researcher, uncorroborated; no tamper reported.
    - id: 'REF-OPENSSH-RELNOTES-10-6P2'
      type: 'attack-surface-documentation'
      title: 'OpenSSH 10.6p2 release notes'
      publisher: 'OpenSSH'
      url: 'https://www.openssh.org/releasenotes.html#10.6p2'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix in 10.6p2 on 2026-11-05; root cause stated outside sshd.'
    - id: 'REF-CVE-RECORD'
      type: 'attack-surface-documentation'
      title: 'CVE-2026-123158'
      publisher: 'CVE Program (MITRE CNA)'
      url: 'https://www.cve.org/CVERecord?id=CVE-2026-123158'
      trust_tier: 'registry'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        CVE id; CISA ADP SSVC exploitation poc. Read through the record API and NVD.
    - id: 'REF-OPENSSH-RELNOTES-9-8'
      type: 'telemetry-documentation'
      title: 'OpenSSH 9.8 release notes'
      publisher: 'OpenSSH'
      url: 'https://www.openssh.com/txt/release-9.8'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Per-session sshd-session binary from 9.8; before it the per-connection process and log
        ident are sshd.
    - id: 'REF-ATTACK-T1685'
      type: 'framework'
      title: 'Disable or Modify Tools, T1685 and sub-techniques T1685.004, T1685.006'
      publisher: 'MITRE ATT&CK'
      url: 'https://attack.mitre.org/techniques/T1685/'
