identity:
  uuid: 'edc4f2fe-2da0-4f33-a300-74ea26e522f3'
  id: 'DT-SSHH-HOST-003'
  name: 'A user escalates to root with doas, sudo or su shortly after an SSH password login on the same host'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
  behavior_classes:
    - 'privilege-escalation'
  tags:
    - 'sshole'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'doas'
    - 'sudo'
    - 'tiny-cloud'
    - 'post-login'
    - 'generic'
    - 'post-exploitation'
    - 'inferred'

behavior:
  definition: >-
    After logging in over SSH with a password the account should not have, an adversary runs doas,
    sudo or su to reach root, so that a login-only foothold becomes full control of the host.
  detailed_definition: >-
    The adversary controls an interactive session as an unprivileged login account and asks a
    delegated-privilege tool to run commands as root. Where the rule is passwordless, no second
    credential is needed. The attempt ends at the tool run; success is a root-run command.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a login account that can reach root through doas, sudo or su; not a direct root
      login, not accounts with no elevation path, and not any claim that the bypass was used.
    summary: >-
      Needs an SSH session as a login account and an elevation rule for it. The Alpine advisory
      states that on official tiny-cloud images the exposed account can use doas to become root.
      On other hosts the step is this pack's inference. One researcher reports spraying; no
      production compromise is documented.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where sshd and doas, sudo or su records reach a central store, or process
      telemetry with lineage exists; not from network telemetry, and not where doas success
      logging is off.
    blocking_conditions:
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          The Alpine advisory points to /var/log/messages; minimal hosts and containers may run no
          syslog daemon or forward nothing (this pack's caution).
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          A doas rule with the nolog option suppresses the success record; lineage needs an
          endpoint sensor.
    summary: >-
      Observable as an sshd Accepted-password record for a user, then a doas, sudo or su record or
      process creation for the same user to root. Weak evidence: a root login alone, or an
      elevation with no login record.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable without a baseline on key-only fleets or when the login account's field is "*" on
      an exposed-class host; on password-policy hosts only with a per-user baseline. It says the
      sequence happened, not that the bypass was used.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: 'Needs the login record joined to the elevation record on host, user and time.'
      - condition: 'environment-inventory-required'
        note: >-
          Needs to know which accounts hold "*", which users legitimately log in by password and
          elevate, and which hosts use passwordless rules.
    summary: >-
      Password login then elevation is routine for administrators on password-policy hosts. It
      is rare on key-only fleets and, on an exposed-class host, impossible legitimately for a
      "*" account, which cannot log in by password there. Rank by the account's field, history
      and elevation rule.

attack_surface_context:
  surface: >-
    Delegated privilege elevation (OpenDoas doas, sudo, busybox su) for a login account reached
    through an sshd session.
  how_the_surface_works: >-
    doas reads rules; "The last matching rule determines the action taken" and with no match the
    action is denied. A nopass rule skips the password check. doas logs denials, failed
    authentication and permitted runs to authpriv. tiny-cloud makes its default user a wheel
    member with a nopass rule.
  incident_processing_path: >-
    The Alpine advisory states "An attacker then gets a shell as `alpine` and can use `doas` to
    become root." It tells defenders to "Review `doas` use and recently created users, files and
    authorized keys". It publishes no timing. That the elevation follows quickly is this pack's
    reading.
  processing_stages:
    - 'password-authenticated-ssh-session-opens'
    - 'login-shell-or-command-starts'
    - 'elevation-tool-run-by-session-user'
    - 'elevation-rule-evaluated'
    - 'elevation-decision-logged'
    - 'command-runs-as-root'
  stage_evidence: >-
    An sshd Accepted line proves a password-method login, not elevation. A doas ran-command
    record, written after the rule matched and any password check passed, names the target; a
    denial, failed-auth or tty-required record proves an attempt, naming no target. Only process
    creation shows lineage; a log join is by user.
  trust_boundaries: >-
    Unprivileged login account into root. Reached: unverified for sshole; the advisory documents
    the doas path on tiny-cloud images, and no source documents it used. The login boundary is
    the sibling objects' subject.
  security_control_context: >-
    doas.conf decides: permit or deny, nopass or password, last match wins; nolog drops the
    success record. doas writes "ran command" at authpriv info, and "command not permitted",
    "failed auth for <user>" and "tty required for <user>" at notice. sudo and busybox su write
    their own formats.
  special_context:
    topic: 'session-to-elevation-attribution'
    context: >-
      The log join is by user name and time, so a second concurrent session by that user
      confuses it. Process telemetry can tie the elevation to the per-connection sshd-family
      ancestor by real uid and lineage; the login uid alone is not the acting user.
  technology_variants:
    - variant: 'alpine-tiny-cloud-images'
      context: >-
        tiny-cloud main creates the default user with a "*" field, adds it to wheel and writes
        "permit nopass :wheel" for doas, so the login is the only gate. Alpine: "safe on first
        boot", exploitable "as soon as any $6$ hash exists"; in pack terms, once the first
        $-format hash in passwd order is $5$/$6$ (DT-SSHH-ESTATE-005).
    - variant: 'alpine-busybox-su'
      context: >-
        On Alpine, su is a busybox applet run through the setuid bbsuid wrapper, which re-execs
        /bin/busybox with the applet in argv[1]; built with su syslog on. Its record is "+ <tty>
        <from>:<to>" (or "-" on failure) under ident su, facility auth; su to root needs root's
        own password.
  practitioner_implication: >-
    Discover which elevation tool each host uses and whether its success records are logged,
    where auth and authpriv lines are routed, which accounts hold "*", which users legitimately
    log in by password, and whether a sensor gives sshd or sshd-session ancestry.

threat_research:
  why_it_matters: >-
    Root turns a single-account login into control of the host: it can read secrets, alter
    authentication and persist. On passwordless-doas images Alpine documents that the bypassed
    alpine user can become root with one command. Whether the one reported payload, a coin
    miner, used elevation is not reported.
  threat_actor: >-
    Unknown. No source attributes any activity. One researcher reports Internet-wide spraying;
    no actor is named.
  actor_class: 'generic-post-login-privilege-escalation'
  campaign: >-
    sshole (CVE-2026-123158): an sshd password bypass on Linux musl builds without PAM, fixed in
    OpenSSH 10.6p2 on 2026-11-05. The Alpine advisory documents the doas path to root. CVSS 3.1
    8.1; CISA ADP SSVC exploitation "poc". One researcher reports Internet-wide spraying of
    `root` and `alpine` with very long passwords and a coin miner as the first honeypot payload
    (2026-11-05 14:21 UTC). Uncorroborated; no compromise of a production host is documented,
    and no source reports a post-login elevation. Not in the CISA KEV catalog release of
    2026-11-04, which predates disclosure; that absence is not evidence of no exploitation.
  victim: 'No production victim documented; the one reported payload was on a honeypot.'
  capability: >-
    Not observed in the wild. The Alpine advisory documents the alpine user's doas path to root on
    tiny-cloud images; our isolated lab (2026-11-05) emulated it on our lab hosts after a reproduced
    bypass, not taken from a real intrusion.
  target: >-
    Root on hosts where an exposed login account has an elevation rule. Reached: unreported.
    A direct root login (PermitRootLogin yes) needs no elevation and is out of scope here.
  victimology:
    - 'Official Alpine tiny-cloud images, where the default user has a passwordless doas rule.'
    - 'Hosts where a key-only or no-password login account is in wheel or sudoers.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1548.003'
      name: 'Abuse Elevation Control Mechanism: Sudo and Sudo Caching'
      evidence: >-
        Closest label to a login user using a delegated-privilege tool to reach root. doas is not
        named by the technique; mapped by behavior, and no source reports it used for sshole.

visibility:
  telemetry_sources:
    - source: 'sshd authentication log (syslog facility AUTH)'
      purpose: >-
        Show the password-method login, user, source address and time that start the sequence.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Accepted <method> for <user> from <address> port <port> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: 'The password method logs at INFO, so the default level carries it.'
        - name: 'syslog program name (sshd or sshd-session)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-RELNOTES-9-8'
          load_bearing: false
          note: >-
            Accepted lines: sshd before 9.8 (Alpine 3.20 and older), sshd-session from 9.8. From
            10.0 sshd-auth may tag other pre-auth messages, not the Accepted line.
      details: >-
        One line per successful authentication, written by default. It names the account and
        method, not the session that follows, so it opens the sequence and cannot show elevation.
      limitations:
        - >-
          Central collection is not default: many minimal hosts and containers run no syslog
          daemon or forwarding.
        - 'The line carries a user name, not a uid; reused names across hosts need the host key.'
    - source: 'doas, sudo and su syslog records'
      purpose: >-
        Show a permitted run as another user, a failed authentication or a denial, by the
        invoking user.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: '<user> ran command <cmd> as <target> from <cwd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-C'
          load_bearing: true
          note: >-
            authpriv info, after the rule matched and any password check passed; not with nolog.
            Format confirmed in the 2026-11-05 lab; rsyslog shows embedded newlines as #012.
        - name: 'command not permitted for <user>: <cmd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-C'
          load_bearing: false
          note: 'authpriv notice; no rule matched. An attempt, not a run.'
        - name: 'failed auth for <user>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-SHADOW-C'
          load_bearing: false
          note: 'authpriv notice; the rule needs a password and the check failed. Also in pam.c.'
        - name: 'tty required for <user>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-SHADOW-C'
          load_bearing: false
          note: 'authpriv notice; a password rule run with no terminal, as from a non-pty ssh exec.'
        - name: '<user> : TTY=<tty> ; PWD=<cwd> ; USER=<runas> ; COMMAND=<cmd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SUDOERS-MAN'
          load_bearing: false
          note: 'sudo accepted-command format; syslog facility defaults to auth; denials name a reason.'
        - name: 'su record "+ <tty> <from>:<to>" or "- ..."'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-SU-C'
          load_bearing: false
          note: 'busybox su, ident su, facility auth notice; Alpine builds it with su syslog on.'
      details: >-
        doas gives invoker, command line, target and working directory for a permitted run; nopass
        and password runs give the same line. Its denial, failed-auth and tty-required lines name
        no target. sudo records carry USER=<runas>; su records carry from:to.
      limitations:
        - 'A nolog rule removes the doas success record entirely.'
        - 'Collection depends on a syslog daemon and forwarding, as for sshd.'
        - >-
          doas lines carry no program tag on musl (doas never calls openlog; musl's default ident
          is empty); key on facility authpriv plus the message pattern.
        - 'Records invoker by name; no session or parent process.'
    - source: 'Endpoint process creation with parent lineage'
      purpose: >-
        Show a doas, sudo or su run whose ancestry reaches the per-connection sshd-family
        process, by real uid.
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'parent process chain including an sshd or sshd-session process'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            sshd-session exists from 9.8; before it the per-connection process is sshd. Field
            names differ per sensor and were not checked.
        - name: 'real uid, effective uid and command line (argv[0], argv[1])'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Alpine su is two execs: bbsuid (argv[0] su), then busybox (argv[1] su), per
            REF-ALPINE-BBSUID. Setuid tools show euid 0 even on denied runs.
      details: >-
        Ties the elevation to the session by lineage rather than name, and sees runs a log never
        writes, such as a rule with nolog.
      limitations:
        - >-
          On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
          auditd, bpftrace, acct and static Tetragon do run.
        - 'auditd auid is unset on non-PAM Alpine; join by pid, ppid and time.'
        - 'Shows the run, not whether the rule permitted it, unless paired with the log.'
        - 'Does not carry the authentication method; the sshd line must be joined.'

detection:
  scope: >-
    Strategy one joins the sshd password-login record to a doas, sudo or su record by user, host
    and time. Strategy two ties a process-level elevation to a password-authenticated session by
    lineage. Later root activity is out of scope; the miner object (DT-SSHH-HOST-007) covers the one reported payload.
  outcome_guardrails: >-
    A password login is not elevation. A ran-command record as root is an elevation; a doas
    denial, failed-auth or tty-required line is an attempt, target unknown. A tool process aimed
    at root is an attempt; a later exec by its pid or a child at real uid 0 is a success. Only a
    successful auth shows an account was used.
  shared_normalization_context: >-
    Accepted lines: sshd (pre-9.8) or sshd-session (9.8+); one ancestor. Accept an empty or "-"
    doas tag. Applet: basename(argv[0]), or argv[1] if busybox. Canonicalise users per host. Map
    doas, sudo, su to one class; target from record or argv after the applet (root unless named;
    sudo -g alone runs as the invoker).
  shared_enrichment_context: >-
    The login account's field from DT-SSHH-HOST-001's inventory (shadow, else passwd or NSS),
    gated on an exposed-class host (musl sshd without PAM, or openssh-server-pam with UsePAM no)
    as at login time where known; patched hosts stay in scope for log review. A per-user
    baseline only on password-policy hosts.
  strategies:
    - id: 'STRAT-PASSWORD-LOGIN-THEN-ELEVATION-LOG-JOIN'
      name: 'doas, sudo or su to root after an SSH password login, joined from logs'
      objective: >-
        Detect an elevation to root by a user within a short window after an sshd
        Accepted-password record for that user on the same host.
      incident_relevance: >-
        Detects a possible follow-on of the bypass on tiny-cloud-style hosts, per the advisory's
        doas path. It is a later consequence, not the bypass; no source reports the outcome.
      detection_logic: |
        On one host, take each sshd or sshd-session "Accepted password" record (user, source,
        time). Inside the window after it (start at 15 minutes; this pack's choice, tune per
        estate), alert on a run as root by the same user: doas "ran command ... as root", sudo
        USER=root, su "+ ...:root". Report sudo or su failures to root as root attempts. Report
        doas denial, failed-auth and tty-required lines as attempts, target unknown, unless
        joined process telemetry gives the target. Runs to another user are out of scope. Raise
        to top severity for a "*" login account on an exposed-class host; raise for key-only
        hosts and passwordless rules. Key doas lines on facility and message, not tag.
      minimum_evidence: >-
        An Accepted-password record and, for the same user on one host inside the window, a run
        as root, a failure naming root, or a doas attempt reported with target unknown. Without
        the login record, report an elevation of unknown origin.
      correlation_context: >-
        Keys are host, user and time. Window and clocks decide the join; ingestion delay can
        reorder the two lines. The user-name join is inferred, not exact.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the sshd and elevation records on host, user and time.'
          limitations: >-
            Only as good as syslog collection, parsing of each line format and routing of auth
            and authpriv.
      benign_explanations:
        - explanation: >-
            An administrator logs in by password on a host whose policy allows it and uses
            sudo or doas.
          distinguishing_context: >-
            The account holds a real hash, its history shows password logins followed by
            elevation, and the host policy expects password login.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding by user name also hides that name if its field is later set to "*", and a
            stolen-password intrusion; baseline the method per user instead.
        - explanation: >-
            Image bootstrap or provisioning sets a password hash and logs in as the default
            user, then elevates with a passwordless rule.
          distinguishing_context: >-
            A known provisioning run, source and time window, and a change record for the hash.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding the default user or first-boot hosts hides the exposed state the
            advisory describes; match the provisioning run, not the account.
      forbidden_exclusions:
        - field: 'the alpine default user, or any account whose field is "*"'
          reason: >-
            alpine is the account the advisory names; a "*" account is the only kind the bypass
            reaches, so excluding it suppresses the incident's own record.
        - field: 'source address or elevated command text'
          reason: 'Adversary-chosen and not a discriminator.'
        - field: 'passwordless elevation rules as benign'
          reason: 'The rule type is what makes the sequence cheap for an intruder.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate. Population depends on how often users log in by password
          and elevate; high on password-policy hosts, low on key-only fleets.
      blind_spots:
        - description: >-
            Missing telemetry: a doas rule with nolog writes no success record, so the elevation
            is invisible here; strategy two sees the process.
          routes_to: null
        - description: >-
            Missing telemetry: no syslog daemon, or auth and authpriv lines not forwarded, on
            minimal hosts and containers.
          routes_to: null
        - description: >-
            Attribution limit: the join is by user name; concurrent sessions or a shared
            account confuse which session elevated.
          routes_to: null
        - description: >-
            Timing: a bypass session that stays open and elevates after the window is missed;
            joining on session lifetime (open to close) instead of a fixed window closes it.
          routes_to: null
        - description: >-
            Scope: a password login directly as root (PermitRootLogin yes) needs no elevation
            and produces no elevation record; the login objects cover it.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Consequence: what the root session then did is not covered by this pack; no source
            reports a post-elevation step for sshole.
          routes_to: null
      analyst_response: >-
        Read the Accepted line and the elevation record. Check whether the account holds a
        password or "*", and the rule type. Review commands run as root, new users, files and
        authorized keys, as the advisory says; if the login cannot be ruled out, it says to
        treat the machine as compromised.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from reproduced bypass logins and lab-emulated doas runs hold the sequence this
          join reads: Accepted password, then a doas ran-command record as root for the same user
          and host. sudo, su and doas denials were not exercised; their formats rest on vendor
          source. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: rsyslog forwarded off-box.
        measured: >-
          Bypass logins as alpine logged Accepted password for alpine; emulated doas runs followed
          in those sessions as "alpine ran command <cmd> as root from <cwd>" (authpriv, empty tag).
          Read by hand, the records satisfy the join on host, user and window. Patched control:
          Failed lines only. No benign twin was run.
      safe_conclusion: >-
        A user ran a command as root, tried to, or made a doas attempt of unknown target, shortly
        after an SSH password login on this host; it does not establish the bypass was used.
    - id: 'STRAT-SSHD-SESSION-LINEAGE-ELEVATION'
      name: 'elevation process descended from a password-authenticated sshd session'
      objective: >-
        Detect a doas, sudo or su process targeting root, run by a login account whose ancestry
        reaches the per-connection sshd or sshd-session process, joined to its password login.
      incident_relevance: >-
        Detects the same possible follow-on at the process level, including runs with no log
        record. A later consequence of the login, not the bypass.
      detection_logic: |
        Alert on process creation of doas, sudo or su (applet as normalised; Alpine su's bbsuid
        and busybox execs are one run) by a login account's real uid, with the per-connection
        sshd (pre-9.8) or sshd-session in its ancestry, whose argv targets root: no -u (doas,
        sudo) or user (su), or root or uid 0 named. Skip doas -C, -L; sudo -l, -v, -k, -K, -V,
        -h, and -g without -u. sudo -e is a root edit with no root exec. Join the session's
        Accepted password line (by pid if logged, else user, host, time). Not login uid. Setuid
        gives euid 0 even when denied; success needs a later exec by its pid or a child with
        real uid 0, else an attempt. Top severity: a "*" account on an exposed-class host.
      minimum_evidence: >-
        A process record with real uid, the tool, a root target from argv and an sshd or
        sshd-session ancestor, plus the session's password login; success also needs a later
        exec by its pid or a child with real uid 0. Without the login join, report an elevation
        from an SSH session of unknown method, at lower severity.
      correlation_context: >-
        Keys are host, session process and real uid. Exact when a process id appears in both
        streams; otherwise inferred by user and time. Needs aligned clocks.
      detectors:
        - detector_class: 'endpoint-process-lineage-detection'
          technologies:
            - 'EDR with process creation and parent chain'
            - 'Linux auditd with execve rules'
            - 'Tetragon'
          contribution: 'Establishes the elevation run and its sshd-family ancestry by real uid.'
          limitations: >-
            Needs a sensor with lineage; does not carry the login method; a daemonised
            or re-parented process loses the ancestor.
      benign_explanations:
        - explanation: >-
            An administrator or automation SSH session that runs sudo or doas as part of routine
            work.
          distinguishing_context: >-
            A key-based login by a user whose history shows elevation, from a managed source,
            with a change or job record.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding all elevation under sshd or sshd-session removes the signal; exclude by
            login method and user baseline, not by lineage.
        - explanation: >-
            Image bootstrap that logs in by password as the default user and runs doas.
          distinguishing_context: 'A known provisioning run and source for the first-boot window.'
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding first-boot or image hosts hides the exposed default-user state; match the
            run and source.
      forbidden_exclusions:
        - field: 'excluding by command-line text of the elevated command'
          reason: 'Adversary-chosen.'
        - field: 'excluding sshd or sshd-session lineage or the password method'
          reason: 'They are the conditions this strategy exists to read.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate and none was modelled; population depends on estate habit
          and on how many hosts have a lineage sensor.
      blind_spots:
        - description: >-
            Missing telemetry: hosts with no endpoint sensor emit nothing; strategy one is the
            fallback where logs exist.
          routes_to: null
        - description: >-
            Detector limit: a sensor keyed on the image or argv[0] alone misses busybox su
            (argv[1] under bbsuid or "busybox su"); one keyed on process title may miss pre-9.8
            sshd ("sshd: user@pts/N").
          routes_to: null
        - description: >-
            Attribution limit: a log-to-process join without a shared process id is by user and
            time, not exact.
          routes_to: null
      analyst_response: >-
        Read the process chain, real uid, the tool and the login method. Check the account's
        password field and elevation rule. Review what ran as root afterwards, new accounts,
        files and authorized keys, and the source address of the session.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records captured from a reproduced bypass login and a lab-emulated doas run hold the
          lineage and success test this strategy uses: doas under sshd-session, real uid moving to 0
          in the same pid, children at uid 0. sudo, su and denied runs were not exercised. Checked
          by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: Tetragon, auditd.
        measured: >-
          Tetragon: doas exec with lineage sshd-session, sh, doas; real uid 1000 then 0 in one pid;
          child sh at uid 0; the session had an Accepted password line. auditd: setuid-family
          syscalls; auid unset (4294967295) on every event, so lineage and time carry the join.
      safe_conclusion: >-
        An elevation tool targeting root ran under a login account in an sshd or sshd-session
        lineage whose login used a password, and succeeded only if a later exec by its pid or a
        child had real uid 0; it does not establish that the bypass was used.
  supporting_technologies_considered: >-
    A periodic account and elevation-rule inventory shows which accounts can elevate without a
    password, which ranks exposure, but it carries no actor or session and so corroborates rather
    than detects.

detector_requirements:
  required: >-
    The sshd authentication log with the method and user, and doas, sudo or su records or process
    creation with real uid; a per-host user key; and alert text that separates login, attempt and
    elevation and states the target or that it is unknown.
  optional: >-
    The account-field inventory from DT-SSHH-HOST-001 sets top severity; an elevation-rule
    inventory ranks passwordless hosts; a provisioning feed removes the bootstrap class; a shared
    process id makes the join exact.
  correlation:
    capability: >-
      Aligned clocks across sshd, elevation and process streams, a stable host and user key,
      and a shared process id where available; ingestion delay can reorder the two lines.
    window: 'Minutes from login to elevation, for example 15, or the session lifetime; estates tune it.'
  baselines:
    - name: 'login method and elevation habit per user per host'
      window: '30-day, a pack suggestion rather than a sourced figure'
      seeded_from: >-
        Authentication and elevation history before the review window; never seed it from
        sessions under investigation.
  product_support_caveat: >-
    Verify lineage and syslog coverage, that nolog hides no doas success, and that parsers take
    untagged doas lines. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
    No public rule found 2026-11-05.

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure; this behaviour is not documented
      for this threat.
    - >-
      Whether any production host has been compromised through CVE-2026-123158; one researcher
      reports spraying and a honeypot payload, uncorroborated.
    - >-
      The delay between login and elevation in any real intrusion; the advisory gives none.
    - 'Whether Alpine builds doas against shadow or PAM; both write the failed-auth line.'
    - >-
      Whether the tiny-cloud main-branch default-user code matches the releases shipped in the
      affected images; inspected on the 3.24.3 aarch64 image file and on the 3.24.3 tiny-cloud image
      used in our lab reproduction; other releases and the cloudinit variant are unchecked.
    - 'Whether the sshd-session process id in the syslog line matches the process-lineage id.'
  assumptions:
    - id: 'ASSUMPTION-ELEVATION-FOLLOWS-LOGIN-SOON'
      verdict_changing: false
      statement: >-
        An intruder with the shell elevates within minutes. The advisory gives no timing, so the
        window is this pack's choice. If wrong, a later elevation falls outside it (see the
        timing blind spot). Resolve it by checking intrusion reports for login-to-elevation
        delay.
    - id: 'ASSUMPTION-GENERIC-HOSTS-FOLLOW-SAME-PATH'
      verdict_changing: false
      statement: >-
        Hosts other than tiny-cloud images follow the same login-then-elevate path. The advisory
        documents only the tiny-cloud doas path. If wrong, the object is Alpine-specific and
        generic hits are only elevation after a password login. Resolve it by inventorying
        elevation rules on exposed hosts.
    - id: 'ASSUMPTION-USER-NAME-JOIN-IS-ADEQUATE'
      verdict_changing: false
      statement: >-
        Host, user name and time identify one session closely enough to join the logs. Concurrent
        sessions break it. If wrong, strategy one mis-attributes the elevation. Resolve it by
        comparing the join with process lineage on a host that has both.
  standing_negatives:
    - statement: >-
        As of 2026-11-05, the Alpine advisory, the OpenSSH announcement, the CVE record and
        the one researcher post reporting spraying document no production compromise and no
        post-login elevation. KEV release 2026-11-04 predates disclosure. No Sigma, Elastic,
        Splunk, Falco or ET Open (Suricata) rule was found.
      ref: 'REF-BEAUMONT-SPRAY'
      valid_until: '2026-11-12'
      recheck: >-
        Check the CISA KEV catalog, the Alpine advisory, the CVE record and corroboration of the
        spraying report, and search rule repositories for the CVE identifier.

missing_states:
  - id: 'MISSING_ELEVATION_RECORD'
    meaning: >-
      Missing telemetry: doas success logging is off (nolog) or no syslog daemon or sensor
      records elevation.
    coverage_claim: 'no-coverage'
    response: >-
      State that elevation is not covered on this host; report the password login alone and say
      elevation could not be checked.
  - id: 'MISSING_PASSWORD_LOGIN_RECORD'
    meaning: >-
      Missing telemetry: the sshd authentication log is absent or not forwarded, so the login
      method is unknown.
    coverage_claim: 'coverage-limited'
    response: >-
      Report an elevation from an SSH session of unknown method, not a password login.
  - id: 'MISSING_SESSION_ATTRIBUTION'
    meaning: >-
      Analyst trap: logs join by user name and concurrent sessions or a shared account make the
      acting session unclear.
    coverage_claim: 'coverage-limited'
    response: >-
      Report the join as inferred; confirm by process lineage or session records before
      attributing the elevation to the password-authenticated session.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_user'
    - 'login_record_method_source_and_time'
    - 'elevation_tool_target_or_target_unknown_and_command'
    - 'elevation_outcome_attempt_or_run'
    - 'elevation_rule_type_when_known'
    - 'process_lineage_or_explicit_missing_state'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'sshd_family_ancestor_and_real_uid'
      condition: 'when process telemetry gives an sshd or sshd-session ancestor for the elevation'
    - field: 'login_account_password_field'
      condition: 'when the DT-SSHH-HOST-001 inventory covers the host'
  recommended_title: >-
    Elevation attempt or root run after SSH password login (target and outcome stated; bypass
    not established)
  unsupported_title: 'sshole attacker gained root on Alpine host via CVE-2026-123158'

evidence:
  confirmed_incident_behavior: >-
    Alpine: on tiny-cloud images "An attacker then gets a shell as `alpine` and can use `doas`
    to become root" once "any $6$ hash exists" (pack terms: DT-SSHH-ESTATE-005); review doas
    use. One researcher reports spraying and a honeypot coin miner; no source reports an
    elevation. Fast elevation is this pack's reading.
  supported_conclusion: >-
    A password login followed by elevation to root is observable with sshd and doas, sudo or su
    records or lineage. A detector may emit it as a generic sequence, not as the bypass.
  unsupported_conclusions: >-
    The evidence does not establish that any production host was compromised, that any login
    used the bug, that elevation followed in any case, or that root was reached on any host. A
    clean result does not show a host is safe.
  procedure_boundary: >-
    Elevation to root after an SSH password login. The login with no password, a direct root
    login, new accounts, keys and scheduled jobs are separate objects. The bypass login does not
    prove elevation happened.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: >-
        The doas path to root on tiny-cloud images, the review-doas-use advice, the
        /var/log/messages pointer and the treat as compromised guidance. Documents no
        exploitation.
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on Internet-wide spraying for the OpenSSH bypass'
      publisher: 'Kevin Beaumont (Mastodon, cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        2026-11-05 14:21 UTC: spraying of root and alpine with very long passwords; coin miner as
        first honeypot payload. Single source, uncorroborated; no elevation mentioned.
    - id: 'REF-OPENSSH-ANNOUNCE'
      type: 'attack-surface-documentation'
      title: 'Announce: OpenSSH 10.6p2 released'
      publisher: 'OpenSSH project (openssh-unix-announce)'
      url: 'https://lists.mindrot.org/pipermail/openssh-unix-announce/2026-November/000170.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        The fix release date of 2026-11-05 and the password authentication bypass in sshd. No
        post-login behavior.
    - id: 'REF-CVE-RECORD'
      type: 'attack-surface-documentation'
      title: 'CVE-2026-123158 record'
      publisher: 'CVE Program (MITRE CNA)'
      url: 'https://www.cve.org/CVERecord?id=CVE-2026-123158'
      trust_tier: 'registry'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Text says 256 to 1024; Alpine and musl give 257 to 1024. No claim here rests on either
        bound.
      evidence_use: >-
        The CVE identifier, CVSS 3.1 8.1 and the CISA ADP SSVC entry (exploitation "poc"). Says
        nothing of elevation.
    - id: 'REF-OPENDOAS-C'
      type: 'telemetry-documentation'
      title: 'OpenDoas doas.c at v6.8.2'
      publisher: 'OpenDoas project (Duncaen)'
      url: 'https://raw.githubusercontent.com/Duncaen/OpenDoas/v6.8.2/doas.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Authpriv denial (notice) and ran-command (info, not under nolog) lines; only the latter
        names the target. Target is root unless -u; -C and -L run nothing. No openlog. setresuid
        to the target just before exec.
    - id: 'REF-OPENDOAS-SHADOW-C'
      type: 'attack-surface-documentation'
      title: 'OpenDoas shadow.c at v6.8.2'
      publisher: 'OpenDoas project (Duncaen)'
      url: 'https://raw.githubusercontent.com/Duncaen/OpenDoas/v6.8.2/shadow.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The authpriv notice "failed auth for" and "tty required for" lines.'
    - id: 'REF-OPENDOAS-PAM-C'
      type: 'attack-surface-documentation'
      title: 'OpenDoas pam.c at v6.8.2'
      publisher: 'OpenDoas project (Duncaen)'
      url: 'https://raw.githubusercontent.com/Duncaen/OpenDoas/v6.8.2/pam.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The PAM build writes the same authpriv notice "failed auth for" line.'
    - id: 'REF-MUSL-SYSLOG'
      type: 'telemetry-documentation'
      title: 'musl src/misc/syslog.c'
      publisher: 'musl libc'
      url: 'https://git.musl-libc.org/cgit/musl/tree/src/misc/syslog.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The log ident is empty unless openlog sets it, so doas lines carry no program tag.'
    - id: 'REF-SUDOERS-MAN'
      type: 'telemetry-documentation'
      title: 'sudoers(5) manual, event logging'
      publisher: 'Sudo project'
      url: 'https://www.sudo.ws/docs/man/sudoers.man/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        The accepted-command log format (user, TTY, PWD, USER, COMMAND), denial reasons after
        the user name, and the syslog facility default of auth.
    - id: 'REF-SUDO-MAN'
      type: 'telemetry-documentation'
      title: 'sudo(8) manual'
      publisher: 'Sudo project'
      url: 'https://www.sudo.ws/docs/man/sudo.man/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        The -u run-as option and the non-run modes -l, -v, -k, -K, -V and -h. -g without -u
        runs as the invoking user; -e edits copies as the invoking user. The root default comes
        from sudoers runas_default.
    - id: 'REF-BUSYBOX-SU-C'
      type: 'telemetry-documentation'
      title: 'BusyBox loginutils/su.c (source)'
      publisher: 'BusyBox project (GitHub mirror)'
      url: 'https://raw.githubusercontent.com/mirror/busybox/master/loginutils/su.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        openlog(su, LOG_AUTH) and the notice record "+ tty from:to" or "-" on failure, when
        built with su syslog; the target user defaults to root. Read at master.
    - id: 'REF-ALPINE-BUSYBOX-CONFIG'
      type: 'attack-surface-documentation'
      title: 'Alpine aports busybox busyboxconfig'
      publisher: 'Alpine Linux (aports)'
      url: 'https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/busybox/busyboxconfig'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        CONFIG_SU, CONFIG_FEATURE_SU_SYSLOG and CONFIG_FEATURE_SUID are on. Read at master, not
        per-release.
    - id: 'REF-ALPINE-BUSYBOX-APKBUILD'
      type: 'attack-surface-documentation'
