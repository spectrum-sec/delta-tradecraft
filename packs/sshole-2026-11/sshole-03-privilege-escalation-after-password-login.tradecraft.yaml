        Builds bbsuid.c and installs /bin/bbsuid mode 4111 in the busybox-suid subpackage. Read
        at master, not per-release.
    - id: 'REF-ALPINE-BBSUID'
      type: 'telemetry-documentation'
      title: 'Alpine aports main/busybox/bbsuid.c'
      publisher: 'Alpine Linux (aports)'
      url: 'https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/busybox/bbsuid.c'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        exec_busybox re-execs /bin/busybox with argv[0] /bin/busybox and the applet (su,
        crontab, passwd) in argv[1]. Read at master, not per-release.
    - id: 'REF-CISA-KEV'
      type: 'attack-surface-documentation'
      title: 'Known Exploited Vulnerabilities catalog'
      publisher: 'CISA'
      url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json'
