    - id: 'REF-OPENSSH-AUTH-PASSWD-C'
      type: 'attack-surface-documentation'
      title: 'OpenSSH portable auth-passwd.c at V_10_6_P1'
      publisher: 'OpenSSH project'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth-passwd.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Root password logins fail unless PermitRootLogin is yes.'
    - id: 'REF-OPENDOAS-CONF5'
      type: 'attack-surface-documentation'
      title: 'doas.conf(5) manual page (OpenDoas v6.8.2)'
