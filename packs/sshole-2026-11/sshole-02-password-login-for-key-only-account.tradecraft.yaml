identity:
  uuid: 'c9982fc3-5c88-4484-bbdf-55fb9fb67869'
  id: 'DT-SSHH-HOST-002'
  name: 'sshd accepts a password login for an account that otherwise authenticates only by public key'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
  behavior_classes:
    - 'identity-borrowing'
  tags:
    - 'sshd'
    - 'openssh'
    - 'sshole'
    - 'musl'
    - 'alpine'
    - 'authentication-method-drift'
    - 'key-only-account'
    - 'baseline-required'
    - 'generic'

behavior:
  definition: >-
    An adversary logs in over SSH as an account that is meant to authenticate only by public key,
    and sshd accepts the password method for it. The objective is interactive access to the host
    as that account without holding its key.
  detailed_definition: >-
    A login method that the account has never used, or that policy forbids, succeeds. The method is
    the discriminator, not the credential: a stolen password, a re-enabled password login and a
    bypass all give the same accepted record. Attempts end at a failed record.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers key-only accounts on Linux musl hosts running sshd without PAM that meet the Alpine
      prerequisites; says nothing about glibc or PAM hosts, where this CVE does not apply.
    summary: >-
      Alpine needs musl sshd without PAM, or openssh-server-pam with UsePAM no;
      PasswordAuthentication on; a '*' account; and a usable $-format donor hash, per
      DT-SSHH-ESTATE-005. A working key-only account on non-PAM sshd cannot be '!'-locked, so it
      holds '*', empty or a hash; only '*' is exposed.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where sshd's authentication log is forwarded, which carries the method per login;
      network telemetry shows at most an over-length attempt by packet size, never the method or
      the result.
    blocking_conditions:
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Containers and minimal images often run no syslog daemon. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. Only syslog forwarding, or an agent that tails the log file (containerized Fluent Bit in the lab), carries it.
    summary: >-
      Observable when the accepted record for each login names user, method, source address and
      port. The OpenSSH source logs password results at INFO, the default level. No password
      content or length is logged. A failed-auth count or a banner is too weak: only a successful
      login shows an account was used.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable where a per-account method history or a key-only fleet policy exists; shows method
      drift, not that the CVE was used. Accounts with no history are outside the baseline strategy.
    blocking_conditions:
      - condition: 'environment-inventory-required'
        note: >-
          A per-account, per-host method baseline or a declared key-only host list must be built;
          the accepted record alone cannot say whether password login is normal for the account.
      - condition: 'cross-source-join-required'
        note: >-
          Telling an authorized break-glass login from an unauthorized one needs the change or
          ticket record.
    summary: >-
      On a key-only fleet any accepted password is rare and separable. On mixed hosts the history
      of the method per account decides. The record cannot tell a bypass from a stolen password,
      so the conclusion stays at method drift.

attack_surface_context:
  surface: 'OpenSSH sshd (portable) password authentication on a Linux musl system without PAM'
  how_the_surface_works: >-
    Without PAM, sshd hashes the offered password with crypt() and compares it with the stored
    field. OpenSSH says the root cause is outside sshd. The result is logged with the method; the
    program name is sshd before OpenSSH 9.8 (Alpine 3.20 and older) and sshd-session from 9.8.
  incident_processing_path: >-
    Alpine states exploitation needs an account whose field is '*', a usable $-format donor hash
    (per DT-SSHH-ESTATE-005) and a 257 to 1024 byte password. The log line is an ordinary
    accepted-password line per auth.c, as our lab reproduction showed. One researcher reports
    spraying; no production compromise is documented.
  processing_stages:
    - 'target-account-selection'
    - 'password-method-offered'
    - 'stored-field-comparison'
    - 'accepted-record-logged'
    - 'interactive-session-opened'
  stage_evidence: >-
    A failed record proves an attempt only. The accepted record proves sshd accepted the method for
    that user, not how the credential was obtained. A session or child process after it proves use.
  trust_boundaries: >-
    Network client into an authenticated account on the host. Reached: honeypots, per one
    uncorroborated researcher report; reproduced in our own isolated lab. The password-hash
    comparison is the boundary the bug defeats, only for a stored field of exactly '*'.
  security_control_context: >-
    Exposure: the branch's fixed openssh-server (DT-SSHH-ESTATE-005 table; upstream 10.6p2; never
    the meta-package) with sshd restarted since (else exposed), PasswordAuthentication no, UsePAM
    yes, PermitRootLogin (without-password on Alpine 3.16-3.22). On a key-only host an accepted
    password shows password login was on.
  practitioner_implication: >-
    Discover which hosts forward sshd logs and under which program name, which accounts are
    key-only, the per-account method history available, and whether each host is declared key-only
    by policy.

threat_research:
  why_it_matters: >-
    Key-only accounts are usually the accounts with privileged or service access and no password to
    defend. A password login for one is a cheap, inventory-free signal that covers this CVE and any
    method downgrade.
  threat_actor: 'Unknown. No source attributes activity to any actor.'
  actor_class: 'generic-credential-method-abuse'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05: CVSS 3.1 8.1, CISA ADP SSVC exploitation
    'poc'; not in the KEV catalog release of 2026-11-04, which predates disclosure. One researcher
    reports Internet-wide spraying of root and alpine with very long passwords and a coin miner as
    the first honeypot payload (2026-11-05 14:21 UTC). Uncorroborated; no compromise of a
    production host is documented.
  victim: 'Honeypots only, per one researcher; no production victim documented.'
  capability: >-
    A password login without the account's real secret on exposed Alpine-class hosts is described by
    Alpine and the CVE record, and our own isolated lab reproduced it on stock Alpine 3.24.3; a
    public proof of concept exists per CISA ADP. Honeypot hits are reported by one researcher; no
    production intrusion is documented.
  target: >-
    Key-only and other '*' accounts on musl, non-PAM sshd hosts; reported spraying names root and
    alpine. No production outcome is documented.
  victimology:
    - >-
      Alpine hosts running openssh-server (no PAM), or openssh-server-pam with UsePAM no, with
      PasswordAuthentication enabled.
    - 'Accounts holding a password field of exactly *, including key-only and directory-sourced users.'
    - 'root only where PermitRootLogin yes; the tiny-cloud image alpine user once a usable $-format donor hash exists (DT-SSHH-ESTATE-005).'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1078.003'
      name: 'Valid Accounts: Local Accounts'
      evidence: >-
        The behavior is a login as an existing local account. Mapped by behavior; no source maps
        this CVE to ATT&CK.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1021.004'
      name: 'Remote Services: SSH'
      evidence: >-
        The access path is an SSH session. Mapped by behavior; success is shown only by an accepted
        record.

visibility:
  telemetry_sources:
    - source: 'sshd authentication log (syslog facility AUTH), forwarded from the host'
      purpose: >-
        Carry user, method, source address and port for each accepted or failed login.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'authentication method (password or publickey)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
        - name: 'accepted or failed verb'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
        - name: 'user, source address and port'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
        - name: 'syslog program name'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-RELNOTES-9-8'
          load_bearing: false
          note: >-
            The 9.8 notes say some messages are tagged sshd-session; match sshd or sshd-session.
      details: >-
        At the default level, one line per accepted login and per failed password attempt; failed
        publickey tries on a valid user log at VERBOSE. No password length or content. Local
        logging is default; forwarding depends on the estate.
      advantages:
        - 'Default INFO level carries password results; no audit rule is needed.'
        - 'The method field answers the question directly, with no inventory join for strategy two.'
      limitations:
        - 'Containers and minimal images often run no syslog daemon, and the log is lost on rebuild.'
        - 'On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. rsyslog forwarding worked.'
        - 'An on-host wipe erases the local copy; only an off-box forwarded copy survives.'
        - 'Identical for a bypass, a stolen password and a legitimate password login.'
        - 'Alpine names /var/log/messages; file or journal location and program name vary elsewhere.'
        - 'During a PerSourcePenalties penalty sshd refuses connections with no Failed or Accepted line.'
    - source: 'Per-account authentication method history and key-only policy list'
      purpose: >-
        Say whether password login is normal for the account or allowed on the host.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      fields:
        - name: 'per-account set of methods seen in the baseline window'
          attestation: 'detector-computed'
          load_bearing: true
        - name: 'host key-only policy flag'
          attestation: 'estate-supplied'
          load_bearing: true
      details: >-
        Built from the same authentication log, or from configuration management that declares
        PasswordAuthentication no. It holds no event data of its own.
      limitations:
        - 'A new account or host has no history; it falls to the policy list or is uncovered.'
        - 'A baseline seeded during an intrusion treats password logins as normal.'

detection:
  scope: >-
    Strategy one covers accounts with a key-only history on hosts where password login is also
    possible; strategy two covers hosts declared key-only, with no history needed. Both read the
    accepted record only. Account state, post-login actions and patch status are sibling objects.
  outcome_guardrails: >-
    A failed record is an attempt; a spray of them is never success. Only an accepted password
    record is method drift, not proof of the CVE, a bypass or compromise. Stock Alpine logs the
    bypass as a same-PID Failed then Accepted pair (DT-SSHH-HOST-001), never required here. A later
    session is follow-on evidence.
  shared_normalization_context: >-
    Parse the method and verb from the sshd line, match program names sshd and sshd-session,
    unwrap rsyslog 'message repeated N times' lines, resolve user and host, and use UTC. Keep
    keyboard-interactive distinct: it has no password backend on non-PAM builds, so it is not this
    CVE's method.
  shared_enrichment_context: >-
    Join the account's method history, the host policy list, change, ticket and password-set
    records, and the source address class. A baseline of at least 30 days is a pack suggestion, not
    a sourced figure.
  strategies:
    - id: 'STRAT-PASSWORD-ACCEPT-AGAINST-KEY-HISTORY'
      name: 'accepted password for an account whose history is publickey only'
      objective: >-
        Detect an accepted password login for an account whose baseline holds accepted publickey
        logins and no accepted password login.
      incident_relevance: >-
        Covers key-only accounts with publickey history without reading the shadow field. Spraying
        is reported by one researcher; no production compromise is documented.
      detection_logic: |
        Per host and user, build the set of authentication methods with accepted records over the
        baseline window. Qualify an account only if it has accepted publickey records (at least
        three is a pack suggestion) and none for password. Alert on an accepted password record for
        a qualified account (sshd or sshd-session); other methods are not password. An account whose
        password success is still unreviewed stays qualified; once reviewed as benign it leaves the
        baseline. Failed records are context only. Never exclude by source, account name or
        session length. Raise severity when a session follows. Unqualified accounts are not
        evaluated here.
      minimum_evidence: >-
        One accepted password record for a user and host, plus a baseline showing publickey only.
        Without the baseline, report a password login of unknown normality, not drift.
      correlation_context: >-
        Keys are host and user. Build the baseline from a window ending before the alert; exclude
        the alert window and the detector's own prior hits. Allow for forwarding delay and skew.
      detectors:
        - detector_class: 'siem-new-terms-or-baseline-analytic'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Computes the per-user method history and flags the first password success.'
          limitations: >-
            Needs sshd logs parsed with the method; the generic Elastic unusual-user rule keys on
            user name only and does not see method.
      benign_explanations:
        - explanation: 'An administrator sets a password and logs in with it as a break-glass step.'
          distinguishing_context: >-
            A time-stamped password-set record (chpasswd or passwd log) attributable to the change
            actor predates the login. lastchg on the login day cannot order the two; keep the lead.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding a maintenance window would hide a bypass login made in that window; match the
            change record to the actor, not the time.
        - explanation: 'A person with a real password uses it when their key is unavailable.'
          distinguishing_context: >-
            The account field is a $-format hash set before the login (dated by lastchg or a change
            record) and the user confirms. A '*' field on a non-PAM musl host rules this out (route
            to DT-SSHH-HOST-001).
          overlaps_incident_instance: false
          tuning_hazard: >-
            Do not widen the exclusion to every account that ever used a password on any host.
      forbidden_exclusions:
        - field: 'source address or address range'
          reason: 'Adversary-chosen path; the record gives no basis to trust one network.'
        - field: 'account name patterns such as service or deploy names'
          reason: 'The adversary picks the target account; such accounts are the intended victims.'
        - field: 'CVE identifier, exploit name or password length in any field'
          reason: 'sshd logs none of them; matching on them reads nothing.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: a key-only account has no routine password login. Break-glass and
          new-account events set the floor; population is hosts forwarding sshd logs.
      blind_spots:
        - description: >-
            Missing telemetry: a host with no forwarded sshd log emits nothing; strategy two has the
            same gap.
          routes_to: null
        - description: >-
            Evasion: an account never seen before, or one whose baseline already contains password
            logins, is not qualified.
          routes_to: null
        - description: >-
            Missing telemetry: the baseline must exist before the event; a host onboarded after an
            intrusion cannot qualify.
          routes_to: null
        - description: >-
            Coverage gap: ephemeral or rebuilt hosts, root and default image users such as alpine
            with no key-login history (the reported spray targets) are never qualified.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Consequence: what the session does after login is not seen here.
          routes_to: 'DT-SSHH-HOST-003'
      analyst_response: >-
        Identify host, account and source. Check the account's shadow or directory field, effective
        sshd settings, openssh-server version against sshd start time, and prior logins by method.
        Trace the session by sshd-session PID lineage and time (auid is unset on non-PAM Alpine),
        check for a ticket, then isolate or rotate.
      safe_conclusion: >-
        sshd accepted a password login for an account whose history is publickey only; the
        credential's origin and any use of CVE-2026-123158 are not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Established: the reproduced bypass on a key-only '*' account emits the trigger record, an
          ordinary forwarded 'Accepted password' line naming the account, as do legitimate password
          logins. Not established: no per-account method baseline was built or scored, so
          qualification and its false-positive rate are unmeasured.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), no PAM, PasswordAuthentication yes; users alpine:*, key-only '*',
          a $6$ donor, '!'; 257, 300, 1024-byte bypass logins from a second lab host; rsyslog
          off-box. Controls: Ubuntu 24.04 glibc, patched 10.3_p1-r2.
        measured: >-
          12/12 bypass logins (key-only user and alpine) logged 'Accepted password' via sshd-session,
          after a Failed line at attempt 2. 256 B, 1025 B, '!' user, glibc and patched host: no
          Accepted line. Legitimate password and publickey logins succeeded at attempt 1. Baseline
          windows: none scored.
    - id: 'STRAT-PASSWORD-ACCEPT-ON-KEY-ONLY-HOST'
      name: 'accepted password on a host or fleet declared key-only'
      objective: >-
        Detect any accepted password login on a host where policy says password login is off,
        without needing per-account history.
      incident_relevance: >-
        Detects declared-versus-effective policy drift for any account. The CVE needs
        PasswordAuthentication yes, so it is in play only where the effective config has it on.
      detection_logic: |
        Maintain a list of hosts or groups where policy is key-only and password login is disabled.
        Alert on any accepted password record from sshd or sshd-session on a listed host: config
        drift (a Match override or a wrong list), not bypass proof. A failed record is an attempt
        only. Do not exclude by account or source. Raise severity when a session follows or the
        field is '*' on an exposed-class host. Separately, emit a posture finding,
        not a login alert, on a listed host when sshd -T shows passwordauthentication yes, a Match
        block sets it yes (or sshd -T -C for representative user and address specs does), or the
        config mtime is newer than the listener start, whatever the disk value.
      minimum_evidence: >-
        Login alert: one accepted password record on a host with a documented key-only policy;
        without a policy record, report a password login of unknown policy. Posture finding: sshd -T
        (with Match blocks or -C specs) for the running binary, plus config mtime against listener
        start.
      correlation_context: >-
        Keys are host and time. The accepted line itself shows password login was in force. sshd -T
        reads the disk file, while connections inherit the listener's loaded config (sshd.c
        send_rexec_state); keep the policy list versioned.
      detectors:
        - detector_class: 'siem-policy-list-analytic'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
            - 'Configuration management inventory'
          contribution: 'Flags password success where policy forbids it, regardless of account.'
          limitations: >-
            The list must be accurate; stale lists create noise, missing hosts create blind spots.
      benign_explanations:
        - explanation: >-
            Password login was deliberately re-enabled on the host for a task, for example recovery
            access.
          distinguishing_context: >-
            A configuration change or ticket names the actor, host and window, and the change
            predates the login.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding the host during the window would hide a bypass login in that window; require
            the change record to name the same actor.
        - explanation: 'The host is listed key-only by mistake and has real password users.'
          distinguishing_context: >-
            The effective configuration shows password login enabled and accounts with password
            fields; fix the list.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding accounts that happen to have a password'
          reason: 'The adversary logs in as a key-only account; account state is not a safe filter.'
        - field: 'excluding by source address'
          reason: 'Adversary-chosen path.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate and the pack did not model one; volume depends on how accurate the
          key-only list is.
      blind_spots:
        - description: >-
            Missing telemetry: hosts not on the list, or whose sshd logs are not forwarded, are
            outside this strategy.
          routes_to: null
        - description: >-
            Evasion: a host mislabelled key-only alerts on legitimate logins, which trains analysts
            to ignore the alert.
          routes_to: null
        - description: >-
            Consequence: what the session does after login is not seen here.
          routes_to: null
      analyst_response: >-
        Read sshd -T, config mtime and openssh-server install time against listener start, recent
        changes and the account's shadow or directory field. Check the source and the session by
        sshd-session PID lineage (not auid) for follow-on activity, then isolate, upgrade openssh-server,
        restart sshd and rotate keys.
      safe_conclusion: >-
        Login alert: the configuration in force allowed password login on a host declared key-only;
        whether the credential was real or a bypass is not established. Posture finding: the disk
        config enables password login (globally or in a Match block), or the applied setting is
        unknown until reload.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Established: the bypass emits the same forwarded 'Accepted password' line as a legitimate
          password login, so a listed host would match, and the conclusion stays drift. Not
          established: the lab host was not declared key-only; no policy list or posture finding ran.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), no PAM, PasswordAuthentication yes; users alpine:*, key-only '*',
          a $6$ donor, '!'; 257, 300, 1024-byte bypass logins from a second lab host; rsyslog
          off-box. Controls: Ubuntu 24.04 glibc, patched 10.3_p1-r2.
        measured: >-
          12/12 bypass logins and the legitimate password login each logged one 'Accepted password'
          line via sshd-session; publickey logins logged 'Accepted publickey'. 256 B, 1025 B, '!'
          user, glibc and patched host: no Accepted line. Policy-list matches: none scored.
  supporting_technologies_considered: >-
    Inventory shows exposure (DT-SSHH-ESTATE-005), not a login. Network sensors see neither the
    password nor the result; lab pcap showed over-length attempts as large auth-phase packets, an
    attempt signal for DT-SSHH-HOST-001. No network rule was published by 2026-11-05. Scanner
    PRs (Nuclei, goonami) find exposure.

detector_requirements:
  required: >-
    Forwarded sshd authentication records with user, method (password, kept distinct from
    keyboard-interactive) and verb; matching on both sshd and sshd-session program names; a
    per-account method history or a key-only host list; UTC timestamps; alert text that says method
    drift, not a bypass.
  optional: >-
    Change or ticket feed, effective sshd configuration collection and the account shadow-field
    state improve dismissal of break-glass logins and raise severity.
  correlation:
    capability: >-
      A stable host and user key across the baseline and alert windows, with the alert window
      excluded from the baseline; synchronized clocks.
    window: 'The baseline window ends before the alert window starts.'
  baselines:
    - name: 'per-host, per-user set of accepted authentication methods'
      window: '30-day, a pack suggestion rather than a sourced figure'
      seeded_from: >-
        The forwarded sshd log of a period not known to be compromised; never seeded from a window
        containing the alert, from the detector's own unreviewed hits, or from a host-supplied list.
  product_support_caveat: >-
    A named product is only a candidate implementation technology. Actual
    support depends on deployed sensors, enabled logging, retained fields,
    parsing, licensing, and architecture. Verify capability before selecting or
    generating an implementation. Parse method and sshd-session; musl: rsyslog, not Filebeat.

missing_context:
  unverified:
    - >-
      Whether any production host was compromised; one researcher reports spraying and a honeypot
      coin miner, uncorroborated.
    - >-
      first_observed 2026-11: month of disclosure; this behaviour is not documented for this
      threat.
    - >-
      The destination file on other distributions and non-default syslog setups; Alpine names
      /var/log/messages.
    - >-
      The exact line for an accepted password on other parsers and distributions; field names differ
      per SIEM parser.
    - >-
      Bypass reliability beyond stock Alpine 3.24.3 openssh-server 10.3_p1-r1, which succeeded at
      attempt 2 in 12/12 lab logins; other builds and branches are untested.
    - >-
      False-positive rate of a per-account publickey baseline; the lab built none.
  assumptions:
    - id: 'ASSUMPTION-KEY-ONLY-HAS-NO-PASSWORD-HISTORY'
      verdict_changing: false
      statement: >-
        Key-only accounts show no accepted password records in a clean baseline; this is the pack's
        reading. If wrong, the strategy goes silent for accounts with prior password use. Resolve it
        by counting accepted password records per key-only account over the baseline.
    - id: 'ASSUMPTION-METHOD-DRIFT-ONLY-SAFE-CONCLUSION'
      verdict_changing: true
      statement: >-
        The accepted record alone cannot tell a bypass from a stolen or reset password, so the
        object concludes drift; the lab's Failed then Accepted pair is DT-SSHH-HOST-001's signal.
        If wrong, the accepted line itself marks a bypass. Resolve it by comparing bypass and
        legitimate accepted lines field by field.
  standing_negatives:
    - statement: >-
        No Sigma, Elastic, Splunk, Falco or ET Open (Suricata) rule keys on an accepted password for
        a key-only or no-password account; found none by search of shallow clones on 2026-11-05.
        Elastic's unusual-user rule (rule_id 5b8d7b94-23c6-4e3f-baed-3a4d0da4f19d) keys on user name
        only.
      ref: 'REF-ELASTIC-UNUSUAL-USER'
      valid_until: '2026-11-12'
      recheck: >-
        Search the Sigma, Elastic, Splunk, Falco and ET Open (Suricata) rule repositories for the
        CVE, sshole and the accepted-password message.

missing_states:
  - id: 'MISSING_SSHD_LOG_FORWARDING'
    meaning: >-
      Missing telemetry: sshd's authentication log is not forwarded, or the host runs no syslog
      daemon.
    coverage_claim: 'no-coverage'
    response: >-
      State that the host is not covered; collect the log locally or use package and configuration
      inventory instead.
  - id: 'MISSING_METHOD_BASELINE'
    meaning: >-
      Analyst trap: the account or host has no clean method history, so a first password success
      looks like drift or normal use.
    coverage_claim: 'coverage-limited'
    response: >-
      Fall back to strategy two or report a password login of unknown normality; do not call it
      drift.
  - id: 'MISSING_SSHD_PROGRAM_NAME_VARIANT'
    meaning: >-
      Missing telemetry: the parser matches only sshd and misses records named sshd-session.
    coverage_claim: 'coverage-limited'
    response: >-
      Add sshd-session to the match and re-check whether recent records were dropped.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_account'
    - 'baseline_method_history_or_policy_flag'
    - 'timestamps_and_correlation_context'
    - 'change_or_ticket_check_result'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'authentication_method_and_verb'
      condition: 'for login alerts; a posture finding carries no login record'
    - field: 'source_address_and_port'
      condition: 'for login alerts; a posture finding carries no login record'
    - field: 'account_shadow_field_state'
      condition: 'when the account database is available for the host at alert time'
    - field: 'session_or_child_process_after_login'
      condition: 'when process or session telemetry shows activity after the accepted record'
    - field: 'sshd_t_output_and_config_mtime_vs_listener_start'
      condition: 'for a strategy-two posture finding, which carries no accepted record'
  recommended_title: >-
    sshd accepted a password login for an account that normally authenticates by public key
  unsupported_title: 'CVE-2026-123158 sshole exploited on host'

evidence:
  confirmed_incident_behavior: >-
    Alpine states exploitation needs an account with field '*' and a usable $-format donor hash
    (per DT-SSHH-ESTATE-005), and names key-only users as '*' holders. One researcher reports
    spraying of root and alpine and a honeypot coin miner, uncorroborated; no production compromise
    documented.
  supported_conclusion: >-
    sshd's accepted record names the method, so a password success for a key-only account or on a
    key-only host is detectable as method drift. A detector may emit that, not CVE use.
  unsupported_conclusions: >-
    The evidence does not establish that any host was exploited, that a password success was a
    bypass, that a missing alert means a host is safe, or that password length is in the log.
  procedure_boundary: >-
    The accepted password record for a key-only account. Account-field state, doas or sudo use
    and patch status are sibling objects; the failed attempt count is not this
    procedure's success evidence.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as '*' holders; busybox adduser.c
        writes '!'. Key-only '*' holders still follow from REF-OPENSSH-AUTH-C: '!' locks every
        method.
      evidence_use: >-
        Used: prerequisites, key-only accounts as '*' holders, '!' locked, /var/log/messages hunt,
        tiny-cloud alpine. Not used: the adduser example, contradicted by busybox source.
    - id: 'REF-OPENSSH-RELNOTES-10-6P2'
      type: 'attack-surface-documentation'
      title: 'OpenSSH release notes, 10.6p2 (2026-11-05)'
      publisher: 'OpenSSH project'
      url: 'https://www.openssh.org/releasenotes.html#10.6p2'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix in 10.6p2 on 2026-11-05; root cause outside sshd; musl without PAM scope.'
    - id: 'REF-OPENSSH-FIX-COMMIT'
      type: 'attack-surface-documentation'
      title: 'avoid password authn bypass (commit 4353fdc)'
      publisher: 'OpenSSH portable'
      url: 'https://github.com/openssh/openssh-portable/commit/4353fdc43ef646c43a8dda7025cc1a898caf1482.patch'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix rejects a stored password field shorter than 4 characters; not a length cap.'
    - id: 'REF-CVE-RECORD'
      type: 'attack-surface-documentation'
      title: 'CVE-2026-123158 record'
      publisher: 'CVE Program (MITRE CNA)'
      url: 'https://www.cve.org/CVERecord?id=CVE-2026-123158'
      trust_tier: 'registry'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Text says 256 to 1024; Alpine and musl's 256-byte key limit give 257 to 1024. Length is
        never logged, so no detection claim rests on either bound.
      evidence_use: 'Used: CVE id, CVSS 3.1 8.1, CWE-394. Not used: the 256 lower bound.'
    - id: 'REF-NVD-RECORD'
