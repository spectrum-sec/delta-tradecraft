identity:
  uuid: '46a66119-5a2a-4805-8f4c-342a1a8a7342'
  id: 'DT-SSHH-HOST-004'
  name: 'A session that began with an SSH password login adds an account, password, login key, scheduled job or sshd setting'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
    - 'host-filesystem'
  behavior_classes:
    - 'persistence'
  tags:
    - 'sshole'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'account-creation'
    - 'authorized-keys'
    - 'cron'
    - 'ssh-session-attribution'
    - 'inferred'
    - 'generic'
    - 'post-exploitation'

behavior:
  definition: >-
    After logging in over SSH with a password, an adversary uses that session to create an account,
    set a password, write an SSH public key, install a scheduled job or loosen sshd configuration, so
    access no longer depends on the password login.
  detailed_definition: >-
    A login key or job for the session's own account needs no privilege; adding accounts, setting
    passwords or editing sshd_config does. Each gives access that outlasts a fix to the entry flaw.
    The attempt ends at the tool run or write; success begins at a later login or job run, or an
    sshd reload for sshd_config.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a password-authenticated session changing its own keys or jobs, or identity state where
      it holds privilege; not the claim that sshole exploitation did so.
    summary: >-
      Needs a successful SSH password login, however obtained, and a writable home or scheduler path
      or a route to privilege. Alpine says to review doas use and recently created users, files and
      authorized keys. One researcher reports a honeypot coin miner; no source reports an account,
      key or job change.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where process or file telemetry with real user and lineage exists, or where syslog
      carries tool or doas records; not from sshd logs alone, which end at the login.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Key and job writes and busybox adduser, addgroup and crontab runs log nothing themselves
          in the busybox source reviewed; privileged ones show only as doas sh -c text (strategy
          three); otherwise only audit rules or an EDR sensor see them. A later crond run line shows
          a job ran, not when it was installed.
      - condition: 'stream-existence-varies-by-estate'
        note: 'Many Alpine hosts and containers run no syslog daemon, audit rules or sensor.'
    summary: >-
      Needs the login record, plus a process or file event with ancestry reaching the session's
      per-connection sshd process. A syslog line for doas, passwd or chpasswd is partial evidence. A
      periodic account diff names no session.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable where password login is rare for the account, or the login account's stored
      field is '*' on an exposed-class host; not on hosts where administrators routinely change
      identity state in password sessions.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          The password login line and the change come from different streams; the join key
          between them (user, session process, time) is this pack's inference.
      - condition: 'environment-inventory-required'
        note: 'Which accounts and hosts legitimately use password login must be inventoried.'
    summary: >-
      On key-only fleets an identity or key change after a password login is a small population.
      Where administrators log in by password and change accounts, it matches normal work; on an
      exposed-class host a '*' login account cannot log in by password, so it ranks highest.
      Names and key content are not discriminators.

attack_surface_context:
  surface: >-
    Local accounts, SSH login keys and per-user scheduler files on a Linux host reached by an SSH
    password login; Alpine with busybox tools is the worked case.
  how_the_surface_works: >-
    Each login runs in a per-connection process: sshd before OpenSSH 9.8 (Alpine 3.20 and older),
    sshd-session from 9.8; log lines carry that name. sshd reads ~/.ssh/authorized_keys by default.
    Busybox provides the account and crontab tools as applets; crond runs spool jobs; Alpine's root
    crontab runs /etc/periodic.
  incident_processing_path: >-
    The Alpine advisory says to review doas use and recently created users, files and authorized
    keys on exposed machines. It describes no post-login activity. One researcher reports a coin
    miner as the first honeypot payload, without persistence detail. Mapping the checklist to this
    object is this pack's reading.
  processing_stages:
    - 'ssh-password-login-accepted'
    - 'session-shell-or-command-start'
    - 'identity-keys-or-scheduler-discovery'
    - 'account-tool-run-or-file-write'
    - 'credential-or-job-registered'
    - 'later-login-or-job-run'
  stage_evidence: >-
    The sshd line proves a login, not a change. A tool run proves an attempt; a successful file
    event proves a change; a later key login or job run proves it took effect. An sshd_config write
    applies only after an sshd reload (SIGHUP) or restart; that record, or a later root password
    login, shows it took effect.
  trust_boundaries: >-
    Password login into a user session is the boundary the flaw bypasses. Account changes cross to
    privilege, which tiny-cloud images grant through passwordless doas for wheel. Reached:
    unverified for sshole.
  security_control_context: >-
    File permissions, doas or sudo rules, StrictModes (sshd refuses a key file others can write),
    AllowUsers and read-only filesystems decide the outcome. A key appended by shell redirection
    launches no account tool, so a tool-name rule misses it.
  special_context:
    topic: 'tool-logging-differs-by-implementation'
    context: >-
      Busybox passwd logs "password for <name> changed by <actor>" (tag passwd); chpasswd logs
      "password for '<name>' changed" at user.info, with no actor and an empty tag under musl.
      Adduser, addgroup and crontab show no syslog call; crond logs job runs. Match message and
      facility, not tag.
  technology_variants:
    - variant: 'linux-shadow-utils'
      context: >-
        Hosts with useradd, groupadd, usermod and gpasswd run different tool names; they log
        tagged authpriv records (lab capture, Alpine 3.24). Match tool classes, not Alpine names.
  practitioner_implication: >-
    Discover which accounts may use password login, which tools and keys locations the host uses,
    whether syslog, audit or EDR records writes with ancestry, how a per-connection sshd or
    sshd-session process maps to its login line, and which automation changes accounts.

threat_research:
  why_it_matters: >-
    A planted key, account or job gives access that survives the sshd fix and any password rotation,
    turning a one-connection bypass into durable host access.
  threat_actor: >-
    Unknown. No source attributes any sshole activity to a group.
  actor_class: 'generic-post-exploitation'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. OpenSSH fixed it in 10.6p2 and calls the root
    cause outside sshd. CISA's ADP entry records exploitation "poc". One researcher reports
    Internet-wide spraying of root and alpine with very long passwords and a coin miner as the first
    honeypot payload (14:21 UTC). Uncorroborated; no compromise of a production host is documented.
    No source reports an account, key or job change. Not in the KEV catalog release of 2026-11-04,
    which predates disclosure.
  victim: >-
    A honeypot only, per one researcher; no production victim documented.
  capability: >-
    A honeypot payload (coin miner) is reported, without persistence detail. The Alpine advisory
    lists review items; no persistence sequence is published. Our isolated lab (2026-11-05) emulated
    keys, account, cron and sshd_config changes after a reproduced bypass login.
  target: >-
    Local accounts, login keys and scheduler files on hosts with exploitable sshd; whether any was
    reached is unreported.
  victimology:
    - 'Alpine and other musl hosts running sshd without PAM, or openssh-server-pam with UsePAM no, that allow password login.'
    - 'Hosts where the logged-in account can write its own keys or jobs, or reach root.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1136.001'
      name: 'Create Account: Local Account'
      evidence: >-
        The behavior includes adding a local account with account tools. Mapped by behavior; no
        source shows sshole used it.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1098.004'
      name: 'Account Manipulation: SSH Authorized Keys'
      evidence: >-
        The behavior includes adding a public key to authorized_keys, and editing sshd_config
        (for example PermitRootLogin yes), which this technique's description also covers. Mapped
        by behavior; undocumented in any sshole source.
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1053.003'
      name: 'Scheduled Task/Job: Cron'
      evidence: >-
        The behavior includes installing a crontab or periodic script that crond runs. Mapped by
        behavior; undocumented in any sshole source.

visibility:
  telemetry_sources:
    - source: 'Endpoint process creation with parent lineage and real user'
      purpose: >-
        Show an account, password or crontab tool run with the per-connection sshd or sshd-session
        process in its ancestry.
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'parent process chain including the per-connection sshd or sshd-session process'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'The 9.8 sshd-session split is documented; sensor field names and chain depth are not checked.'
        - name: 'command line with argv[0] and argv[1]'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Applet is basename(argv[0]), or argv[1] when that is busybox. bbsuid applets (passwd,
            crontab, su) exec bbsuid, then busybox with the applet in argv[1] (REF-ALPINE-BBSUID).
        - name: 'real user id'
          attestation: 'unattested-inferred'
          load_bearing: false
          note: 'Names the session user only for unelevated runs; doas sets real uid to the target.'
      details: >-
        Shows the tool and its arguments under the session. A key written by shell redirection runs
        no tool, so this stream misses it.
      limitations:
        - 'Shows the tool run, not whether the change took effect.'
        - 'Misses key or job files written without an account tool.'
        - 'Absent on hosts with no sensor or execve audit rules.'
        - >-
          On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
          auditd, bpftrace, acct and static Tetragon do run.
    - source: 'Kernel audit or EDR file events on identity, keys, scheduler and sshd config files'
      purpose: >-
        Show writes to passwd, shadow, group, authorized_keys, sshd_config, the crond spool and
        periodic script directories with the acting user.
      event_vocabulary: 'kernel-audit'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'file path'
          attestation: 'unattested-inferred'
          load_bearing: true
        - name: 'real uid (uid) and effective uid (euid)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AUDITCTL-MAN'
          load_bearing: true
          note: >-
            auditctl documents auid, uid and euid as separate fields. auid was unset (4294967295)
            on every event on non-PAM Alpine in the 2026-11-05 lab.
        - name: 'operation and success'
          attestation: 'unattested-inferred'
          load_bearing: true
      details: >-
        Catches changes by tool or by shell redirection. Keys files sit in each home directory, so
        watches must cover every location sshd reads.
      limitations:
        - 'Needs deliberately configured rules; absent by default.'
        - 'Many home directories make full path coverage hard.'
        - 'Polling file-integrity tools lose the actor.'
        - 'Write-only (-p wa) watches miss reads, such as a read of /etc/shadow.'
        - 'Path watches give pid, exe and uid, not session ancestry; ancestry needs a process-event join or EDR.'
    - source: 'Host syslog: sshd, doas, busybox passwd, chpasswd and crond records'
      purpose: >-
        Show the password login, and some changes or privileged commands, where no sensor exists.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Accepted password for <user> from <address> port <port> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: 'Logged at INFO per auth_log; program sshd before 9.8, sshd-session from 9.8 (REF-OPENSSH-RELNOTES-9-8). Match either.'
        - name: 'doas record: <user> ran command <command line> as <target> from <directory>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-C'
          load_bearing: true
          note: 'AUTHPRIV, empty tag under musl (REF-MUSL-SYSLOG); not with nolog. rsyslog shows newlines as #012.'
        - name: 'passwd record: password for <name> changed by <actor>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-PASSWD'
          load_bearing: false
          note: 'openlog(applet name, LOG_AUTH); the only password record that names an actor.'
        - name: "chpasswd record: password for '<name>' changed"
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-CHPASSWD'
          load_bearing: false
          note: 'Facility user, severity info; empty tag (no openlog). Names the target, not the actor.'
        - name: 'shadow-utils records: useradd new user, usermod change user, gpasswd user added'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SHADOW-USERADD'
          load_bearing: false
          note: 'authpriv, tagged with tool and pid; PAM chpasswd logs pam_unix password changed (lab capture).'
        - name: 'sudo record: <user> : TTY=<tty> ; PWD=<cwd> ; USER=<runas> ; COMMAND=<cmd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SUDOERS-MAN'
          load_bearing: false
          note: 'Facility auth by default; carries the full command line.'
        - name: 'crond record: USER <user> pid <n> cmd <command>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-BUSYBOX-CROND'
          load_bearing: false
          note: 'Logged on every job run, existing jobs included; not an installation record.'
      details: >-
        The login line anchors the session. A doas line carries the command line, so a privileged
        adduser or chpasswd appears there. Busybox adduser, addgroup and crontab emit no syslog call
        on success. The sshd line is logged by default; central collection varies by estate.
      limitations:
        - >-
          No record of the key, crontab or sshd_config writes themselves; privileged ones appear
          only as doas sh -c command text.
        - 'Root can stop the daemon and truncate local logs; only a forwarded copy survives.'
        - 'Containers often have no syslog daemon; retention is short.'
        - 'Records no real uid or ancestry; the join to a session is by host, user and time.'
        - 'doas and chpasswd records have an empty program tag under musl; a tag filter misses them.'
        - 'Forwarding only auth and authpriv drops busybox chpasswd, which logs at facility user.'
    - source: 'Periodic account, authorized-keys and crontab inventory'
      purpose: >-
        Reveal accounts, keys and jobs that exist when no actor-attributed telemetry exists.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'first-party-build'
      details: >-
        A scheduled collection diffed against the last run shows additions. It carries no actor.
      limitations:
        - 'No session attribution; cannot separate an administrator from an intruder.'
        - 'Late by the interval; add-and-remove between runs is missed.'

detection:
  scope: >-
    Strategy one covers account, password and crontab tool runs under a password-login session;
    strategy two covers identity, keys, scheduler and sshd configuration writes by the same session,
    shell redirection included; strategy three is the syslog-only fallback. An inventory diff is not
    coverage.
  outcome_guardrails: >-
    A password login is not a change and does not show the bypass; only a successful auth shows an
    account was used. A tool run is an attempt; a successful file event is a change; a later key
    login, job run or, for sshd_config, sshd reload (SIGHUP), restart or root password login shows
    effect. Read-only calls: discovery.
  shared_normalization_context: >-
    Resolve the session by ancestry to the per-connection sshd (pre-9.8) or sshd-session, never
    by login uid. Real uid names the user only without an elevation hop. Applet:
    basename(argv[0]), or argv[1] if busybox, not the image; syslog by facility and message.
    Canonicalise identity, keys and scheduler paths.
  shared_enrichment_context: >-
    Join provisioning, configuration management and administrator password-login history to
    separate sanctioned changes. From DT-SSHH-HOST-001, '*' ranks highest on an exposed-class
    host (musl sshd without PAM, or openssh-server-pam with UsePAM no) as at login time; patched
    hosts stay in scope.
  strategies:
    - id: 'STRAT-SSH-PASSWORD-SESSION-LINEAGE-TOOL'
      name: 'account, password or crontab tool process under a password-login session'
      objective: >-
        Detect an account, password or crontab tool run whose ancestry is a session that began with
        a password login.
      incident_relevance: >-
        Possible later consequence of any password login, sshole included. Not documented for
        sshole; a pack inference.
      detection_logic: |
        Alert on process creation of an account, group, password or crontab tool, by applet (as
        normalised; bbsuid then busybox is one run): adduser, addgroup, chpasswd, passwd,
        usermod, useradd, groupadd, gpasswd, crontab, when ancestry reaches a per-connection
        sshd or sshd-session process whose login was "Accepted password" on that host earlier.
        Take the session user from that login, not the tool's real uid; a doas, sudo or su hop
        marks an elevated run. chpasswd and passwd runs are changes without arguments (stdin or
        prompt); others need change arguments. Status, list or help calls are discovery. Top
        severity for a '*' login account on an exposed-class host. Reports an attempt only.
      minimum_evidence: >-
        A changing tool process record, ancestry reaching the session's sshd process, and a prior
        password-login line on that host. Without ancestry, report an unattributed tool run.
      correlation_context: >-
        Keys are host, user, session process and time. Sessions are joined to login lines by user
        and time; an exact process link is not assumed. Pair with strategy two to promote an
        attempt to a change.
      detectors:
        - detector_class: 'endpoint-process-lineage-detection'
          technologies:
            - 'EDR with process creation and parent chain'
            - 'Linux auditd with execve rules'
            - 'Tetragon'
          contribution: 'Establishes tool, arguments and session ancestry.'
          limitations: 'Sees only tool processes; absent without a sensor.'
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the login line to process events by host and user.'
          limitations: 'Only as good as the ingested fields and clock alignment.'
      benign_explanations:
        - explanation: 'An administrator logs in by password and creates accounts or sets passwords.'
          distinguishing_context: >-
            Known administrator and source, a ticket or change record, and the account holds a real
            hash and a password-login history.
          overlaps_incident_instance: false
          tuning_hazard: >-
            An account with a real hash is not a bypass target, but excluding by user name hides
            that name if its field is later set to '*', and a stolen-password intrusion; match the
            ticket, not the user.
        - explanation: 'Provisioning or first-boot automation sets passwords or accounts.'
          distinguishing_context: >-
            Runs from the init process or a known automation identity, with no sshd or sshd-session
            ancestor.
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'account name or key content'
          reason: 'Adversary-chosen and imitable.'
        - field: 'excluding accounts that hold no password'
          reason: 'Those are the accounts the bypass logs in as.'
        - field: 'CVE identifier or campaign name in any field'
          reason: 'Post-login activity carries none; matching on them reads only a decoy.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: on key-only fleets password-session identity changes are
          unusual. Hosts administered by password will exceed it.
      blind_spots:
        - description: >-
            Evasion: a key or job file written by shell redirection runs no account tool; strategy
            two covers it.
          routes_to: null
        - description: >-
            Missing telemetry: hosts with no sensor emit nothing; strategy three is a weaker fallback.
          routes_to: null
        - description: >-
            Attribution limit: after doas or su the tool's real uid is the target, so only
            ancestry links it to the session; a sensor with shallow chains loses the link.
          routes_to: null
        - description: >-
            Detector limit: a rule on image name or argv[0] alone misses busybox applets (image
            busybox or bbsuid; applet in argv[1] under bbsuid or "busybox <applet>").
          routes_to: null
      analyst_response: >-
        Identify host, session, the account's stored field and change. Check the new account,
        password or job, its later use, and provisioning. Where the host is in the exposed
        class and the login is not tied to a legitimate user, escalate per Alpine's
        advice to treat it as compromised; otherwise report an unattributed change.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records captured from a reproduced bypass login and lab-emulated useradd and chpasswd runs
          under doas carry the session lineage this strategy reads. Busybox adduser, passwd and
          crontab applets and a benign admin twin were not run. Checked by hand against the captured
          records; not yet replayed as an automated query.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: Tetragon, auditd.
        measured: >-
          Tetragon: useradd and chpasswd execs with lineage sshd-session, sh, doas, sh, tool;
          the session had an Accepted password line. auditd: EXECVE for both; auid unset, so the
          join is pid, ppid and time. Real uid was 0 after the doas hop, so only ancestry tied
          the runs to the session user.
      safe_conclusion: >-
        An account, password or crontab tool ran in a session that began with a password login;
        whether the change took effect and how login was obtained are not established.
    - id: 'STRAT-SSH-PASSWORD-SESSION-FILE-WRITE'
      name: 'identity, keys, scheduler or sshd config write attributed to a password-login session'
      objective: >-
        Detect a successful write to an identity store, authorized-keys file, scheduler path or sshd
        configuration by a session that began with a password login, redirection included.
      incident_relevance: >-
        Covers the key or job written by redirection that strategy one cannot see. Possible
        consequence; not documented for sshole.
      detection_logic: |
        Alert on a successful create, write or rename of passwd, shadow, group, an
        authorized-keys file sshd reads, sshd_config or sshd_config.d, a crond spool crontab
        (any owner; Alpine's spool is a symlink: watch /etc/crontabs) or a run-parts script the
        root crontab calls (/etc/periodic on Alpine), when ancestry reaches a per-connection
        sshd or sshd-session process with an earlier "Accepted password". auid is unset on
        non-PAM Alpine; a real-uid-only match is weaker. Real uid 0 via an elevation hop is
        stronger; setuid euid 0 from crontab or passwd is expected. A failed outcome is an
        attempt. Top severity for a '*' login account on an exposed-class host. Only this
        strategy may conclude a change.
      minimum_evidence: >-
        A file event with a covered path, a successful mutating outcome, ancestry reaching the
        session, and a prior password-login line. Real uid only: same user near a password login,
        session not established. Missing actor: unknown author.
      correlation_context: >-
        Keys are host, path, process ancestry, real uid and time. Join to the login line by host,
        session ancestor and time. Correlate a later key login or a first-seen crond job; for
        sshd_config, a later sshd reload (SIGHUP) or restart, or root password login, since the edit
        applies only then.
      detectors:
        - detector_class: 'file-event-actor-attribution'
          technologies:
            - 'Linux auditd path watches'
            - 'EDR file telemetry'
            - 'File integrity monitoring with actor'
            - 'Tetragon file-write kprobes'
          contribution: 'Records acting user, path and outcome for every write path.'
          limitations: 'Coverage must include every keys location; polling tools lose the actor.'
      benign_explanations:
        - explanation: 'An administrator or configuration management edits keys, accounts or jobs.'
          distinguishing_context: >-
            The real user is the automation identity, outside any password-login session.
          overlaps_incident_instance: false
          tuning_hazard: 'Excluding by path hides a session write to the same file.'
        - explanation: 'A user in a password session installs their own key or crontab.'
          distinguishing_context: >-
            The key matches the user's key inventory and the account holds a real hash and a
            password-login history.
          overlaps_incident_instance: false
          tuning_hazard: >-
            An account with a real hash is not a bypass target, but excluding self-service writes
            hides a '*' account's bypass login and stolen-password intrusions; match the key, not
            the actor.
      forbidden_exclusions:
        - field: 'excluding writes by file name or key comment'
          reason: 'Adversary-chosen and imitable.'
        - field: 'excluding accounts that hold no password'
          reason: 'Those are the accounts the bypass logs in as.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate; it depends on how many hosts have watches on keys locations.
      blind_spots:
        - description: >-
            Missing telemetry: file events on keys locations are not collected by default and
            locations vary by host.
          routes_to: null
        - description: >-
            Evasion: a key written then deleted inside one polling interval defeats polling
            integrity tools but still allows a login.
          routes_to: null
        - description: >-
            Attribution limit: auditd path watches carry pid, exe and uid, not ancestry; a
            short-lived shell or pid reuse breaks the process join.
          routes_to: null
        - description: >-
            Scope: writes to doas or sudo rules (/etc/doas.conf, /etc/doas.d, /etc/sudoers.d) can
            also reopen access; they are not watched here.
          routes_to: null
        - description: >-
            Missing telemetry: write-only watches miss credential reads such as /etc/shadow; the
            2026-11-05 lab saw only the doas record for that read.
          routes_to: null
      analyst_response: >-
        Read the written content and path, real and effective user and outcome. Confirm sshd accepts
        the location, check for a later login with the key or a first-seen crond job, and trace the
        session to its login line.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from reproduced bypass logins and lab-emulated writes to authorized_keys (user and
          root), passwd, shadow, the root crontab, /etc/periodic and sshd_config. Tetragon carried
          session lineage for the key, passwd, crontab and sshd_config writes; auditd had no
          ancestry. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: auditd watches, Tetragon.
        measured: >-
          auditd watches recorded all six write classes, shadow by auditd only. User key write:
          parent sshd-session, uid 1000; root writes via doas, uid 0. passwd as temp file plus
          rename. auid unset on every event. -p wa watches missed a /etc/shadow read. No sshd reload
          or restart followed the sshd_config write. No benign twin.
      safe_conclusion: >-
        An identity, keys, scheduler or sshd configuration file was successfully written by a
        session (by ancestry) that began with a password login, or, on real uid only, by the same
        user near such a login; the cause and how login was obtained are not established.
    - id: 'STRAT-SSH-PASSWORD-LOGIN-SYSLOG-FOLLOW-ON'
      name: 'syslog-only record of a privileged change or job after a password login'
      objective: >-
        Detect, on hosts with syslog and no sensor, a doas, sudo, passwd, chpasswd or
        shadow-utils account record on the same host shortly after a password login.
      incident_relevance: >-
        A weaker fallback for the same possible consequence. Not documented for sshole.
      detection_logic: |
        Key doas, chpasswd (facility user) and other lines by facility and message, not tag. In
        the window after "Accepted password for <user>", alert on a doas or sudo record by that
        user running an account, password or crontab tool, or a passwd record naming that user
        as actor. By host and time only, alert on a shadow-utils account record or a busybox
        chpasswd record with no provisioning identity. A doas or sudo shell whose -c text names
        an identity, keys or scheduler path or tool is an attempt here; route bare shells (doas
        -s, doas sh) to DT-SSHH-HOST-003. A denied doas record is an attempt. Never alert on a
        crond run line alone. Top severity for a '*' login account on an exposed-class host.
      minimum_evidence: >-
        A password-login line and, on the same host within the window, a doas, sudo or passwd
        record naming that user, or a chpasswd or shadow-utils record joined by time only.
        Otherwise report unrelated activity.
      correlation_context: >-
        Keys are host, user and time, an inferred join; chpasswd joins by host and time. A short
        window limits false joins; a concurrent second session cannot be separated.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins login and follow-on syslog records by host and user.'
          limitations: >-
            Sees a key write or crontab install only as doas command text, and no process
            ancestry.
      benign_explanations:
        - explanation: 'An administrator logs in by password and runs privileged account commands.'
          distinguishing_context: >-
            Known administrator, ticket, and a real hash and password-login history for the account.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding administrators who use doas removes the tiny-cloud alpine user, whose '*'
            field and passwordless doas are the documented bypass path.
      forbidden_exclusions:
        - field: 'excluding the logged-in user because it is a default or cloud account'
          reason: 'The alpine-style default account is a documented target.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source gives a rate; it depends on how often administrators use password login.'
      blind_spots:
        - description: >-
            Missing telemetry: busybox adduser, addgroup and crontab runs, key writes and periodic
            script drops leave no syslog record when run without doas, or inside a doas shell.
          routes_to: null
        - description: >-
            Attribution limit: the join is by host, user and time, so a second session cannot be excluded.
          routes_to: null
        - description: >-
            Missing telemetry: forwarding limited to auth and authpriv drops busybox chpasswd,
            which logs at facility user.
          routes_to: null
        - description: >-
            Missing telemetry: the anchoring Accepted line is absent when syslog, forwarding or
            retention lost it. A PerSourcePenalties drop logs no Failed line, so it hides
            attempt context only; a dropped connection opens no session.
          routes_to: null
      analyst_response: >-
        Read the login line and source, the doas command line or log record, and nearby file or
        process data if any exists. Check the host for new accounts, keys and jobs directly.
      safe_conclusion: >-
        A privileged account or password record followed a password login on the same host; the
        session link, any key write and the cause are not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from a reproduced bypass and emulated post-login steps hold the syslog-only
          sequence: Accepted password, a doas record whose sh -c text ran account tools, then
          useradd's own records. Also captured: busybox chpasswd (user) and shadow-utils lines; sudo
          was not run. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: rsyslog forwarded off-box.
        measured: >-
          Forwarded syslog: Accepted password for alpine; doas "ran command sh -c ... as root"
          naming useradd and chpasswd; useradd "new user:" and "new group:" lines (authpriv,
          tagged). The writes left no syslog line of their own; privileged ones showed only as doas
          sh -c text. After a local log wipe, the off-box copy kept all.
  supporting_technologies_considered: >-
    Account, key and crontab inventories and package-version checks corroborate but carry no actor.
    Network sensors cannot see these changes inside the encrypted session.

detector_requirements:
  required: >-
    For strategies one and two, process or file events with ancestry and argv[0] and argv[1];
    for strategy three, forwarded sshd, doas, sudo and account-tool syslog with facility kept,
    user included. Keys and scheduler locations per host, a password-login record, and alert
    text separating login, attempt and change.
  optional: >-
    A per-account login-method baseline, stored-field inventory, administrator list, key inventory
    and crond job baseline remove the main benign classes. A provisioning feed speeds dismissal.
  correlation:
    capability: >-
      Aligned clocks, a stable host and user key, and ancestry resolution to sshd or
      sshd-session. The log pid to process link is not assumed; ingestion delay can reorder login
      and change.
    window: >-
      Start at 60 minutes after the login, or the session lifetime; this pack's choice, longer
      than DT-SSHH-HOST-003's 15 because a change may follow discovery and elevation.
  product_support_caveat: >-
    A named product is a candidate; verify sensors, logging and parsing. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor. Check busybox argv[1], doas chain depth,
    empty tags, user facility.

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure; this behaviour is not documented
      for this threat.
    - >-
      Whether any sshole exploitation has been followed by an account, key or job change; the one
      honeypot report names a coin miner without persistence detail.
    - >-
      How a syslog pid maps to the session's process; not checked. (auid is unset on non-PAM
      Alpine: 2026-11-05 lab.)
    - 'Keys locations set by AuthorizedKeysFile overrides on each host.'
  assumptions:
    - id: 'ASSUMPTION-GENERIC-POST-LOGIN-PERSISTENCE'
      verdict_changing: true
      statement: >-
        A bypass login would be followed by account, key or job persistence like other SSH
        footholds; Alpine lists these only as review items, and the one reported honeypot payload is
        a coin miner. If wrong, the object stays generic and adds no sshole coverage. Resolve it by
        a report describing new accounts, keys or jobs.
    - id: 'ASSUMPTION-SESSION-JOIN-BY-USER-AND-TIME'
      verdict_changing: false
      statement: >-
        A login line joins a later change by host, user and time, and ancestry to the per-connection
        sshd or sshd-session process identifies the session; neither is sourced. If wrong,
        concurrent sessions are misattributed. Resolve it per host by comparing a login's log pid
        and time with its descendants.
  standing_negatives:
    - statement: >-
        No source reviewed on 2026-11-05 reports an account, key or job change after an sshole
        login. One researcher reports spraying and a honeypot coin miner, uncorroborated; no
        compromise of a production host is documented. Checked were the Alpine advisory, the
        researcher's post, Detectify and The Hacker News.
      ref: 'REF-ALPINE-ADVISORY'
      valid_until: '2026-11-12'
      recheck: >-
        Check the CISA KEV catalog, the Alpine advisory and vendor bulletins for an exploitation or
        intrusion report describing new accounts, keys or jobs.

missing_states:
  - id: 'MISSING_ENDPOINT_TELEMETRY_ON_ALPINE_HOST'
    meaning: >-
      Missing telemetry: the host runs no sensor or audit rules and may run no syslog daemon.
    coverage_claim: 'no-coverage'
    response: >-
      State the behavior is not covered; use the inventory diff and report an unattributed change,
      never post-login persistence.
  - id: 'MISSING_SESSION_ATTRIBUTION'
    meaning: >-
      Missing telemetry: changes are visible with no real uid or ancestry tying them to the login.
    coverage_claim: 'coverage-limited'
    response: >-
      Report a change of unknown author with the nearby password logins as context, not as cause.
  - id: 'MISSING_KEYS_LOCATION_COVERAGE'
    meaning: >-
      Missing telemetry: keys or scheduler locations the host reads, including AuthorizedKeysFile
      overrides and run-parts directories, fall outside the watched paths.
    coverage_claim: 'coverage-limited'
    response: >-
      Report only covered locations; absence of an alert does not exclude a planted key or job.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_session_user'
    - 'password_login_record_and_source_address'
    - 'acting_user_and_process_lineage_or_missing_state'
    - 'tool_or_file_path_changed'
    - 'operation_attempted_or_change_observed'
    - 'new_account_or_key_fingerprint_when_available'
    - 'timestamps_and_correlation_context'
    - 'sanctioned_change_check_result'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'later_login_or_job_run_by_affected_account'
      condition: >-
        when logs show a login with the new key, account or password, or a job run, after the change
  recommended_title: >-
    Account, key, job or sshd-config change after SSH password login (attempt or change stated)
  unsupported_title: 'sshole attacker planted a backdoor after exploiting OpenSSH'

evidence:
  confirmed_incident_behavior: >-
    Alpine describes the bypass and says to review doas use and recently created users, files and
    authorized keys. One researcher reports spraying and a honeypot coin miner, uncorroborated; no
    production compromise is documented. No source reports an account, key or job change; that
    sequence is this pack's inference.
  supported_conclusion: >-
    A password login followed by an identity, key or job change in the same session is separable
    where the telemetry exists. Inferred: a detector may report it as such, never as sshole activity.
  unsupported_conclusions: >-
    The evidence does not establish that any sshole exploitation produced a change, that a login
    came from the bypass, that any compromise occurred, or that a planted key was used. A clean
    result does not show a host is safe.
  procedure_boundary: >-
    Persistence after a password login. Siblings cover the star-account login, key-only password
    login, privilege escalation and the exposed posture. The bypass and later key login are separate.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: >-
        Review items (doas use, recently created users, files, authorized keys) and "treat the
        machine as compromised" advice. It documents no exploitation and no post-login activity.
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on sshole spraying and honeypot payload'
      publisher: 'Kevin Beaumont (cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        2026-11-05 14:21 UTC: spraying of root and alpine with very long passwords; coin miner as
        first honeypot payload. Single researcher, uncorroborated.
    - id: 'REF-OPENSSH-RELNOTES-10-6P2'
      type: 'attack-surface-documentation'
      title: 'OpenSSH 10.6p2 release notes'
      publisher: 'OpenSSH'
      url: 'https://www.openssh.org/releasenotes.html#10.6p2'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix in 10.6p2 on 2026-11-05; root cause stated outside sshd.'
    - id: 'REF-CVE-RECORD'
