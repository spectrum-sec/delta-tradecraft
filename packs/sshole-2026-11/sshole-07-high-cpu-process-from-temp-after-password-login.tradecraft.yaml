identity:
  uuid: 'eae0e2d2-522d-4521-b266-4622d6c79f01'
  id: 'DT-SSHH-HOST-007'
  name: 'A session that began with an SSH password login starts a root process from a world-writable path that holds a core near 100% (resource hijacking)'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-filesystem'
  behavior_classes:
    - 'other'
  behavior_classes_note: >-
    Resource hijacking (ATT&CK T1496, compute hijacking): no member names consuming a host's
    compute for the adversary's gain.
  tags:
    - 'sshole'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'coin-miner'
    - 'resource-hijacking'
    - 'post-login'
    - 'single-source-itw-class'
    - 'lab-emulated-shape'
    - 'generic'
    - 'post-exploitation'

behavior:
  definition: >-
    After logging in over SSH with a password, a session starts a program from a world-writable
    path (/tmp, /var/tmp, /dev/shm or a hidden directory below them) as root, and it holds a CPU
    core near 100%. This root, temp-path shape is the pack's lab emulation; the only sshole report
    is one researcher's uncorroborated honeypot coin miner, with no path, privilege or launch
    method given.
  detailed_definition: >-
    A file is put in a path any user can write, marked executable and started; in our emulation
    it was started under nohup, which only ignores hangups, and once the launching shell exited
    init adopted it (ppid 1). The attempt ends at the exec; success is sustained
    CPU use. Detection is generic.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a password-authenticated session that runs a program from a temp path as root;
      non-root runs are out of scope, as is the claim that every sshole login does so.
    summary: >-
      Needs a successful SSH password login, however obtained, a writable temp path that allows
      execution, and CPU to spare. One researcher reports a coin miner as the first honeypot
      payload (REF-BEAUMONT-SPRAY). No source describes its path, privilege or persistence.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where process-exec telemetry or host CPU metrics exist; not from sshd logs, which
      end at the login, and not where the process is renamed to a system path.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Exec records with a path need audit execve rules or a sensor; none is on by default,
          and on musl Sysmon for Linux and Filebeat do not run and osquery has no official build (Wazuh needs its vendor repo; Falco ran only as a container).
      - condition: 'stream-existence-varies-by-estate'
        note: 'Many Alpine hosts and containers run no audit rules, sensor or sysstat collector.'
    summary: >-
      Needs the login record plus an exec record with path and user, or a CPU series. Lineage
      breaks once the parent exits, so the session link is by time and path, not ancestry alone.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable where root rarely runs programs from temp paths; not on hosts whose builds,
      installers or jobs do so as root, or where CPU is routinely saturated.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          The login line, the exec record and the CPU series come from different streams; the
          join (host, time, path) is this pack's inference.
      - condition: 'environment-inventory-required'
        note: 'Which root jobs legitimately run from temp paths, and normal CPU load, must be known.'
    summary: >-
      A root exec from a temp path soon after a password login is a small population on most
      fleets. Sustained CPU corroborates it but cannot name a cause alone.

attack_surface_context:
  surface: >-
    World-writable directories and the process table of a Linux host reached by an SSH password
    login; Alpine is the worked case.
  how_the_surface_works: >-
    /tmp, /var/tmp and /dev/shm accept writes from every user; execution works unless the mount
    forbids it. A child whose parent exits is reparented to init or a subreaper (REF-GETPPID-MAN),
    so a detached process shows ppid 1. From OpenSSH 9.8 the session process is sshd-session.
  incident_processing_path: >-
    One researcher reports a coin miner as the first honeypot payload after spraying of root and
    alpine (REF-BEAUMONT-SPRAY). Path, privilege, persistence and the miner are not described.
  processing_stages:
    - 'ssh-password-login-accepted'
    - 'session-shell-or-command-start'
    - 'file-written-to-writable-path'
    - 'file-marked-executable-and-started'
    - 'process-detached-and-reparented'
    - 'sustained-cpu-use'
  stage_evidence: >-
    The sshd line proves a login, not a payload. An exec from a temp path proves an attempt;
    sustained CPU use shows the program ran; neither shows mining without the process content.
  trust_boundaries: >-
    Password login into a user session is the boundary the flaw bypasses. Root needs a further
    hop, such as the passwordless doas that tiny-cloud grants (REF-TINY-CLOUD-INIT), or a root login.
  security_control_context: >-
    A noexec mount on /tmp, /var/tmp or /dev/shm stops direct execution but not an interpreter
    given the file. Process limits and cgroup CPU quotas cap use but leave the process visible.
  practitioner_implication: >-
    Discover which hosts keep audit or sensor exec records, which mounts allow execution, which
    root jobs run from temp paths, normal CPU load, and how a session maps to later processes.

threat_research:
  why_it_matters: >-
    A hijacked host burns compute and power for the adversary, slows its own services and can
    show that a login foothold was used; a miner is also the payload least likely to be hidden.
  threat_actor: >-
    Unknown. No source attributes any sshole activity to a group.
  actor_class: 'opportunistic-resource-hijacking'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. OpenSSH fixed it in 10.6p2. One researcher
    reports Internet-wide spraying of root and alpine with very long passwords and a coin miner as
    the first honeypot payload (14:21 UTC). Uncorroborated; no compromise of a production host is
    documented. The Alpine advisory describes no post-login activity.
  victim: >-
    A honeypot only, per one researcher; no production victim documented.
  capability: >-
    A coin miner is reported as the first payload on a honeypot. How it was launched, from which
    path and with what privilege are not reported.
  target: >-
    Spare CPU on hosts with exploitable sshd; whether any production host was reached is unreported.
  victimology:
    - 'Alpine and other musl hosts running sshd without PAM, or openssh-server-pam with UsePAM no, that allow password login.'
    - 'Hosts, including containers and cloud instances, with spare CPU and a writable temp path.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1496.001'
      name: 'Resource Hijacking: Compute Hijacking'
      evidence: >-
        The behavior is use of a host's CPU for the adversary's work (REF-ATTACK-T1496). Mapped by
        behavior; a coin miner is reported in one honeypot, nothing more.

visibility:
  telemetry_sources:
    - source: 'Endpoint process creation with path, parent and real user'
      purpose: >-
        Show a process started from a world-writable path by uid 0, with the session's
        per-connection sshd (pre-9.8) or sshd-session in its ancestry while the chain is intact.
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'executed path, and script path where an interpreter runs it'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            An interpreter exec shows the shell, not the script; the script path is in argv or a
            PATH record, so match both.
        - name: 'real user id and parent chain'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-TETRAGON-EVENTS'
          load_bearing: true
          note: >-
            process_exec carries binary, arguments, uid and a parent block; auditd records uid
            separately from auid.
        - name: 'parent pid'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-GETPPID-MAN'
          load_bearing: false
          note: 'Becomes 1 or a subreaper once the original parent exits; the session link is then lost.'
      details: >-
        Auditd execve rules (REF-AUDITCTL-MAN), Tetragon and bpftrace on sched_process_exec give
        the exec on musl. Process accounting writes only at process end, with a short command name
        and no path (REF-ACCT-MAN). File creation or chmod in the same path adds a join record.
      limitations:
        - 'Absent on hosts with no sensor or execve audit rules.'
        - 'Ancestry breaks at reparenting; time and path carry the join.'
        - 'Auditd auid is unset on non-PAM Alpine, so uid, pid and time are the keys.'
        - 'A path watch or chmod record needs its own rule.'
    - source: 'Host CPU utilisation series (sysstat sar, cloud instance metric)'
      purpose: >-
        Show a sustained step in CPU use on the host that began after a password login.
      event_vocabulary: 'none'
      tier: 'not-applicable'
      operational_viability: 'opt-in'
      fields:
        - name: 'CPU %user, %system and %idle per interval'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SAR-MAN'
          load_bearing: true
          note: 'sar -u reports them at a set interval; on N cores one pegged core adds about 100/N points.'
      details: >-
        A host-level series gives a step from the baseline held across intervals. It names no
        process, user or session; a per-process view needs a separate collector.
      limitations:
        - 'Needs a sysstat collector or cloud agent already running; absent by default.'
        - 'A step of 100/N points is small on many-core hosts and lost in noisy load.'
        - 'No attribution; only a join to an exec record names a process.'
    - source: 'Host syslog: sshd login records'
      purpose: 'Anchor the session with the password login and its source.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Accepted password for <user> from <address> port <port> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: >-
            INFO per auth_log; program sshd before 9.8, sshd-session from 9.8
            (REF-OPENSSH-RELNOTES-9-8). Match either.
      details: >-
        The login line is the only record that the session began with a password; the other
        streams carry no login method.
      limitations:
        - 'Containers often have no syslog daemon; retention is short.'
        - 'Records no ancestry; the join is by host, user and time.'

detection:
  scope: >-
    Strategy one covers root exec from a world-writable path after a password login; strategy two
    covers a sustained host CPU step after one, joined to a new process. Neither reads miner
    content, names or pool traffic.
  outcome_guardrails: >-
    A password login is not a payload and does not show the bypass. An exec from a temp path is an
    attempt to run something; high CPU shows work, not mining. Neither shows sshole exploitation.
  shared_normalization_context: >-
    Canonicalise paths (resolve symlinks, /dev/shm, /var/tmp, hidden directories under them).
    Resolve a script run through an interpreter or busybox to the script path. Real uid 0, not auid.
  shared_enrichment_context: >-
    Join root temp-path jobs, CI, mount options and admin password logins. From
    DT-SSHH-HOST-001, a '*' account ranks highest on an exposed-class host (musl sshd without
    PAM, or openssh-server-pam with UsePAM no; an upgraded but unrestarted sshd counts) as at
    login time where known; patched hosts stay in scope.
  strategies:
    - id: 'STRAT-SSH-PASSWORD-SESSION-TEMP-PATH-ROOT-EXEC'
      name: 'root process exec from a world-writable path after a password login'
      objective: >-
        Detect a uid 0 process started from a world-writable path in or soon after a session that
        began with a password login.
      incident_relevance: >-
        Matches the reported honeypot coin miner only in class; its path and privilege are
        unreported. Detection is generic.
      detection_logic: |
        Alert on process exec with real uid 0 where the executed or script path (as normalised) is
        under /tmp, /var/tmp, /dev/shm or a hidden directory below them, on a host with an
        "Accepted password" login in the preceding 60 minutes. Tier A: ancestry reaches that
        login's per-connection sshd (pre-9.8) or sshd-session. Tier B: ppid is 1 or a subreaper or
        ancestry is lost, and a chmod +x or create of the same path ran in the window by a process
        in the session. Tier C: time only. Raise severity when the process holds high CPU
        (strategy two) or the login account is '*' on an exposed-class host. Reports an attempt.
      minimum_evidence: >-
        An exec record with path and uid 0, and a password-login line on that host shortly before.
        Without ancestry or a same-path chmod, report an unattributed root exec from a temp path.
      correlation_context: >-
        Keys are host, path, session process, uid and time. A chmod or create of the same path
        links a detached process back to the session when ppid is 1. Pair with strategy two to show
        the process held CPU.
      detectors:
        - detector_class: 'endpoint-process-lineage-detection'
          technologies:
            - 'EDR with process creation and parent chain'
            - 'Linux auditd with execve rules'
            - 'Tetragon'
            - 'bpftrace on process exec'
          contribution: 'Gives path, user, parent and time for the exec, and the chmod if covered.'
          limitations: 'Sees only what the sensor covers; absent without one.'
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the login line to exec records by host and time.'
          limitations: 'Only as good as the ingested fields and clock alignment.'
      benign_explanations:
        - explanation: 'An installer, package build, test or CI step runs as root from a temp path.'
          distinguishing_context: >-
            Parent is a package manager, build tool or known automation identity, with no sshd or
            sshd-session ancestor and no password-login line.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding a path or user name hides an adversary who copies the choice; exclude by the
            automation identity and parent, not the directory.
        - explanation: 'An administrator logs in by password and runs a script from /tmp as root.'
          distinguishing_context: >-
            Known administrator and source, a ticket, and a script the administrator wrote; the
            account holds a real hash.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding administrators who use doas removes the tiny-cloud alpine user, whose '*'
            field and passwordless doas are the documented bypass path.
      forbidden_exclusions:
        - field: 'file or process name, including look-alike system names'
          reason: 'Adversary-chosen and imitable.'
        - field: 'excluding accounts that hold no password'
          reason: 'Those are the accounts the bypass logs in as.'
        - field: 'CVE identifier or campaign name in any field'
          reason: 'Post-login activity carries none; matching on them reads only a decoy.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: root execs from temp paths in password sessions are unusual on
          key-only fleets. Hosts with root build or install jobs in temp paths will exceed it.
      blind_spots:
        - description: >-
            Evasion: a program placed in a system path, run from memory or renamed to look like a
            kernel thread is not under a temp path.
          routes_to: null
        - description: >-
            Evasion: on a noexec mount the file runs through an interpreter, so the exec is the
            interpreter and the path is only in its arguments.
          routes_to: null
        - description: >-
            Missing telemetry: hosts with no sensor or execve rules emit nothing; strategy two is a
            weaker fallback.
          routes_to: null
        - description: >-
            Attribution limit: after the parent exits, ppid is 1 or a subreaper and ancestry no
            longer reaches the session; a concurrent second session cannot be separated by time.
          routes_to: null
        - description: >-
            Scope: a persistence entry that relaunches the process from a temp path is not
            covered by this pack; no source reports persistence for sshole.
          routes_to: null
      analyst_response: >-
        Read the path, user, parent chain and command line; check who created the file and when,
        and whether it holds CPU or opens outbound connections. Trace the session to its login line
        and the account's stored field. On an exposed-class host with an unexplained login, treat
        it as compromised per Alpine.
      safe_conclusion: >-
        A root process started from a world-writable path in or soon after a session that began
        with a password login; what it does and how login was obtained are not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          After a reproduced bypass login, an emulated root script started detached from a hidden
          /tmp directory was recorded with its path, uid 0 and ppid 1 by auditd, and its exec and chmod +x by Tetragon.
          Checked by hand against the captured records. Post-login steps were emulated by us on our
          lab hosts, not taken from a real intrusion.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins, then post-login steps emulated on our lab hosts.
          Telemetry: auditd, bpftrace (host 1); Tetragon (host 2); acct.
        measured: >-
          Auditd EXECVE: the busybox shell with the temp script path as argument, uid 0, ppid 1.
          Tetragon: exec and chmod +x of that path. bpftrace recorded the exec; process
          accounting only the command name. No benign root-from-temp twin was run.
    - id: 'STRAT-SSH-PASSWORD-SESSION-SUSTAINED-CPU-STEP'
      name: 'sustained host CPU step after a password login, joined to a new process'
      objective: >-
        Detect, where no exec telemetry exists, a held rise in host CPU use that began after a
        password login, and name the process when one is available.
      incident_relevance: >-
        A coin miner holds a core, which this series shows; the reported honeypot miner gives no
        CPU figures. Detection is generic.
      detection_logic: |
        On a host with an "Accepted password" login in the preceding 60 minutes, alert on a held
        CPU rise that starts after the login. Host series: CPU use (100 minus %idle) at least
        0.8 x 100/N points over the host's own baseline, N being the core count, or at least 95%
        where baseline plus that rise passes 95. Per-process series where collected (pidstat):
        one process at 80% or more of one core. Held: every sample for 10 minutes and 3
        consecutive collector intervals. Raise to a lead on a process whose exec in the 5 minutes
        before the step is under a world-writable path (strategy one) or is unknown to the host's
        baseline. Alone it reports unexplained load; it never names a miner.
      minimum_evidence: >-
        A CPU series with a held step starting after a password-login line on the same host.
        Without a joined new process, report unexplained sustained load only.
      correlation_context: >-
        Keys are host and time; the exec join adds a process and path. Sampling interval and
        collector clock bound the start time.
      detectors:
        - detector_class: 'host-resource-metric-detection'
          technologies:
            - 'sysstat sar'
            - 'Cloud instance CPU metric'
            - 'Infrastructure monitoring agent'
          contribution: 'Gives the held CPU step and its start time.'
          limitations: 'Names no process or user; blind where no collector runs.'
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the login line and exec records to the CPU series by host and time.'
          limitations: 'Metric and log timestamps and intervals differ.'
      benign_explanations:
        - explanation: 'A scheduled job, build, backup, compression or database task loads the CPU.'
          distinguishing_context: >-
            Starts on the job schedule from a known path and parent, with no password login
            before it.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding a time window hides a miner started in it; match the process and schedule.
        - explanation: 'An administrator logs in by password and runs a heavy task.'
          distinguishing_context: >-
            Known administrator, ticket, and a process from a system path that ends within the task.
          overlaps_incident_instance: false
          tuning_hazard: 'Excluding administrator logins hides a stolen-password intrusion; match the ticket.'
      forbidden_exclusions:
        - field: 'excluding hosts because CPU is normally busy'
          reason: 'A miner hides in a busy host; raise the threshold by baseline, not exempt the host.'
        - field: 'process name or user name of the load'
          reason: 'Adversary-chosen and imitable.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No source gives a rate; it depends on the baseline and on how often load follows password
          logins.
      blind_spots:
        - description: >-
            Evasion: a miner throttled below the threshold, or run only when the host is idle,
            produces no sustained step.
          routes_to: null
        - description: >-
            Missing telemetry: hosts with no sysstat collector or cloud metric emit no series;
            collection may stop with the attacker's own log or collector shutdown.
          routes_to: null
        - description: >-
            Detector limit: on many-core hosts one pegged core is a small host step (100/N points)
            inside normal variance; only a per-process series keeps it visible.
          routes_to: null
        - description: >-
            Attribution limit: the series names no process; without strategy one's exec record the
            cause stays open.
          routes_to: null
      analyst_response: >-
        Read the series start against the login time; list the busiest processes now, their paths,
        owners and start times; check for outbound connections and root-owned files in temp paths.
        Compare with the job schedule.
      safe_conclusion: >-
        Host CPU use rose and held after a password login; the cause, and whether it is mining or
        tied to the session, are not established.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          After a reproduced bypass login, an emulated root process held one core of a 2 vCPU host.
          sar showed the host step and ps the process share. Checked by hand against the captured
          records; not yet replayed as an automated query. Post-login steps were emulated by us on
          our lab hosts, not taken from a real intrusion.
        method: >-
          Our isolated lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud image
          (openssh-server 10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; accounts alpine:*, a
          key-only * user, a $6$ donor, a ! user. Reproduced bypass logins, then post-login steps we
          emulated on our lab hosts. Telemetry: sysstat sar, ps.
        measured: >-
          sar host CPU 0.0 before, then 49.8-50.3% for the process's life: about 100/N for N=2
          and above the 40-point host threshold throughout. ps: 99.6% of one core. The sample
          interval and the process lifetime are not in the lab record, so whether the 10-minute
          hold was met is not established. No benign heavy-task twin was run.
  supporting_technologies_considered: >-
    Outbound network flow, DNS and pool-protocol sensors may corroborate mining but were not
    exercised here and do not name the session; file hash and memory analysis confirm a miner
    after the fact.

detector_requirements:
  required: >-
    For strategy one, exec records with path, uid and parent, plus a forwarded password-login
    record; for strategy two, a CPU series at a known interval plus the login record. Alert text
    must separate login, attempt and observed load.
  optional: >-
    Chmod or file-create records on temp paths, a per-host CPU baseline, mount options, an
    inventory of root jobs that use temp paths and an administrator list remove the main benign
    classes.
  correlation:
    capability: >-
      Aligned clocks, a stable host key, path normalisation and a way to link a detached process to
      the session when ppid is 1; the chmod of the same path is the lead.
    window: >-
      60 minutes after the login, or the session lifetime; this pack's choice, longer than
      DT-SSHH-HOST-003's 15 because a payload may follow discovery and download.
  product_support_caveat: >-
    A named product is only a candidate; support depends on sensors, logging, fields and
    parsing, so verify first. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo and Falco ran only as a container; auditd, bpftrace and static Tetragon do (lab 2026-11-05).

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure; this behaviour is not documented for
      this threat (a coin miner payload is reported, REF-BEAUMONT-SPRAY, but not its path,
      privilege or detachment).
    - >-
      Whether the reported honeypot miner ran from a temp path, as root or detached; the post
      gives none of these. The lab shape is emulated.
    - >-
      How a syslog pid maps to the session's process; not checked. (auid is unset on non-PAM
      Alpine: 2026-11-05 lab.)
    - 'Which mounts on the host forbid execution from /tmp, /var/tmp and /dev/shm.'
  assumptions:
    - id: 'ASSUMPTION-MINER-RUNS-FROM-TEMP-AS-ROOT'
      verdict_changing: true
      statement: >-
        The reported miner was started from a world-writable path with root privilege and detached,
        like common miner droppers; the report gives no path or privilege. If wrong, strategy one
        misses it and only strategy two applies. Resolve it by a report naming path and user.
    - id: 'ASSUMPTION-SESSION-JOIN-BY-TIME-AND-PATH'
      verdict_changing: false
      statement: >-
        A detached process joins its session by host, time, and a chmod or create of the same path;
        this is the pack's inference. If wrong, concurrent sessions are misattributed. Resolve it per
        host by comparing a login's time and descendants with exec records.
  standing_negatives:
    - statement: >-
        No source reviewed on 2026-11-05 describes a miner's path, privilege or persistence after an
        sshole login. One researcher reports spraying and a honeypot coin miner, uncorroborated; no
        compromise of a production host is documented. Checked were the Alpine advisory and the
        researcher's post.
      ref: 'REF-ALPINE-ADVISORY'
      valid_until: '2026-11-12'
      recheck: >-
        Check the researcher's thread, the Alpine advisory, CISA KEV and vendor bulletins for a
        report naming the miner's launch path, privilege or persistence.

missing_states:
  - id: 'MISSING_EXEC_TELEMETRY_ON_ALPINE_HOST'
    meaning: >-
      Missing telemetry: the host runs no sensor or audit execve rules; process accounting gives
      no path.
    coverage_claim: 'no-coverage'
    response: >-
      State strategy one is not covered; use the CPU series if present and report unexplained load,
      never a miner.
  - id: 'MISSING_SESSION_ATTRIBUTION'
    meaning: >-
      Missing telemetry: the exec is visible, but ancestry reaches init and no same-path file event
      ties it to the login.
    coverage_claim: 'coverage-limited'
    response: >-
      Report a root exec from a temp path with the nearby password logins as context, not as cause.
  - id: 'MISSING_CPU_SERIES'
    meaning: >-
      Missing telemetry: no sysstat or cloud CPU series covers the host or interval.
    coverage_claim: 'no-coverage'
    response: >-
      State strategy two is not covered; absence of an alert does not show the host is not mining.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_session_user'
    - 'password_login_record_and_source_address'
    - 'executed_path_and_user_or_cpu_step_start_and_size'
    - 'process_lineage_or_missing_state'
    - 'attempt_or_observed_load_stated'
    - 'timestamps_and_correlation_context'
    - 'sanctioned_job_check_result'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'same_path_chmod_or_create_record'
      condition: 'when a detached process is joined to the session by file event instead of ancestry'
  recommended_title: >-
    Root process from a temp path or sustained CPU after SSH password login (attempt or load stated)
  unsupported_title: 'sshole attacker is mining cryptocurrency on this host'

evidence:
  confirmed_incident_behavior: >-
    One researcher reports spraying of root and alpine with very long passwords and a coin miner as
    the first honeypot payload (REF-BEAUMONT-SPRAY). Uncorroborated; no production compromise is
    documented; the launch path, privilege and persistence are not reported.
  supported_conclusion: >-
    A root process from a world-writable path, or a held CPU step, after a password login is
    separable where telemetry exists. Inferred: a detector reports it as such, never as sshole
    or mining. Lab: the exec and the CPU step were captured with emulated post-login steps.
  unsupported_conclusions: >-
    The evidence does not establish that any sshole exploitation produced the process, that it
    mined, that a login came from the bypass, or that any production host was compromised. A clean
    result does not show a host is safe.
  procedure_boundary: >-
    Resource hijacking after a password login. Siblings cover the star-account login, key-only
    password login, privilege escalation and the exposed posture. The bypass and the
    miner's network use are separate.
  references:
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on sshole spraying and honeypot payload'
      publisher: 'Kevin Beaumont (cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        2026-11-05 14:21 UTC: spraying of root and alpine with very long passwords; coin miner as
        first honeypot payload. Single researcher, uncorroborated; no path or privilege given.
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: >-
        Exposed class, doas path and "treat the machine as compromised" advice. It documents no
        exploitation and no post-login activity.
    - id: 'REF-OPENSSH-RELNOTES-10-6P2'
      type: 'attack-surface-documentation'
      title: 'OpenSSH 10.6p2 release notes'
      publisher: 'OpenSSH'
      url: 'https://www.openssh.org/releasenotes.html#10.6p2'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Fix in 10.6p2 on 2026-11-05.'
    - id: 'REF-CVE-RECORD'
