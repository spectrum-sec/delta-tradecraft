identity:
  uuid: '9fae404d-97b6-4eb8-a16a-deb795437de1'
  id: 'DT-SSHH-HOST-008'
  name: 'A source that sprayed SSH passwords or was penalized by sshd later gets an accepted password login'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-os-authorization-boundary'
  behavior_classes:
    - 'denial-record-as-primary-observable'
    - 'identity-borrowing'
  tags:
    - 'sshd'
    - 'openssh'
    - 'sshole'
    - 'password-spraying'
    - 'persourcepenalties'
    - 'source-join'
    - 'risk-correlation'
    - 'generic'
    - 'inferred'

behavior:
  definition: >-
    An adversary sends many failed SSH password attempts from one source across accounts or hosts,
    then gets an accepted password login from that source, so that noise turns into access.
  detailed_definition: >-
    The adversary controls the client address and the account names and passwords it offers. The
    attempt phase ends at refused or failed authentications; success is a later accepted password
    login from the same source on any host. The spray itself crosses no boundary.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers sshd listeners with password authentication on, reachable by the source; not
      key-only listeners (PasswordAuthentication no), and not any claim the bypass was used.
    summary: >-
      Needs network reach to sshd, PasswordAuthentication yes, and an account the source can log in
      as, by a guessed or stolen password or by the bypass on an exposed-class host
      (DT-SSHH-HOST-001). One researcher reports Internet-wide spraying of root and alpine with
      very long passwords, which he says bypass auth (REF-BEAUMONT-SPRAY); uncorroborated.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where the sshd log is collected with source address; penalty drop lines need
      OpenSSH 9.8 or later and activating lines 10.1 or later at the default level, with
      PerSourcePenalties left on. Neither shows the password or its length.
    blocking_conditions:
      - condition: 'stream-existence-varies-by-estate'
        note: 'Whether sshd lines reach a store depends on the syslog setup and forwarding.'
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Drop lines log at INFO from 9.8; the activating line logs at VERBOSE in 9.8 to 10.0 and
          at INFO only from 10.1. Both need PerSourcePenalties not set to no and the source not on
          PerSourcePenaltyExemptList; failed-password lines need nothing beyond INFO.
    summary: >-
      Failed and refused password lines name user and source; penalty lines from the listener name
      the source and reason; an Accepted password line names user and source. Too weak: a penalty
      or spray line alone, which Internet-facing hosts collect constantly, or a login alone.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable as the sequence spray or penalty then success from one source; it says nothing
      about successful logins with no spray before them, and a source join is not an actor join.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          Spray, penalty and Accepted lines come from different connections, processes and often
          hosts; only the source address joins them.
      - condition: 'below-alerting-signal-strength'
        note: 'Spray and penalty lines alone are commodity Internet noise; they rank, never alert.'
      - condition: 'only-unreliable-negative-evidence'
        note: >-
          Structurally lost: a bypass needs one connection and no volume, and penalties throttle
          naive spraying, so a login with no prior spray is not cleared. Scope covers only the
          sprayed-then-succeeded sequence.
    summary: >-
      A success from a source that was failing logins across accounts or hosts is rarer than either
      alone. It ranks by the account's field (DT-SSHH-HOST-001), the host class and the failure
      pattern. Shared egress addresses and users who mistype and retry blur it.

attack_surface_context:
  surface: 'sshd password authentication and its PerSourcePenalties connection throttle'
  how_the_surface_works: >-
    sshd logs each password attempt as Failed or Accepted with user, source and port. A refused
    account (locked, Deny or Allow lists) is tried against a fake account named NOUSER and logs an
    invalid user prefix. From 9.8 the listener penalizes a source whose connection ends after
    failed authentication and refuses new connections from it while the penalty lasts.
  incident_processing_path: >-
    One researcher reports Internet-wide spraying "targeting root and alpine as usernames, and very
    long passwords (which bypasses auth)" and a coin miner as the first honeypot payload
    (REF-BEAUMONT-SPRAY). The bypass claim is his; no other source corroborates it, no lengths or
    packets are published, and no production compromise is documented. Our lab reproduced a spray
    and a later bypass from one lab source on one host; that pairing is our construction.
  processing_stages:
    - 'network-reach-to-sshd'
    - 'password-attempts-for-several-accounts'
    - 'failed-or-refused-records-logged'
    - 'source-penalty-activated-by-listener'
    - 'connections-dropped-before-version-exchange'
    - 'penalty-expires'
    - 'password-login-accepted-from-same-source'
    - 'session-opened-as-account'
  stage_evidence: >-
    Failed lines prove attempts, not intent. A penalty line proves the listener throttled the
    source; drop lines prove refused connections, not what they carried. Only the Accepted line
    proves access, and nothing in the chain shows the bypass rather than a correct password. A
    spray trying root and alpine once each per host accrues at most 10 s per host, below the 15 s minimum,
    so it logs no INFO penalty; only cross-host failure counts see it.
  trust_boundaries: >-
    Network client into authenticated host access. The spray reaches no boundary; the Accepted line
    does. For sshole, a honeypot only, per one uncorroborated researcher. A source join links two
    records, not one actor.
  security_control_context: >-
    PerSourcePenalties (on by default from 9.8): each connection that ends after failed
    authentication adds 5 s (authfail; invaliduser, from 10.3, also 5 s), not each password
    attempt; enforcement starts above 15 s and caps at 10 min; penalties apply per netblock
    (PerSourceNetBlockSize, default 32:128) (REF-OPENSSH-SSHD-CONFIG-MAN). Lab: 4 rapid failed
    connections activated a penalty of about 19 s. Exempt-listed sources never log a penalty. The bypass succeeds in one connection, so a penalty does not stop it.
  special_context:
    topic: 'penalty-line-semantics'
    context: >-
      The listener sshd, not sshd-session, logs "srclimit_penalise: <address>/<mask>: activating
      ipv4 penalty of <N> seconds for penalty: <reason>" when a source's accrued penalty crosses
      the minimum: at VERBOSE, absent at the default level, in 9.8 to 10.0, and at INFO from 10.1.
      N is whole seconds before 10.3 and has three decimals from 10.3. The reason names the last
      offence. A connection with any password attempt exits as failed authentication, even for an
      invalid or refused user: sshd-session's cleanup_exit checks the attempt before the invalid
      user flag (REF-OPENSSH-SSHD-SESSION-C). Attempted authentication by invalid user (from
      10.3) marks an invalid or refused user whose connection made no attempt. Each refused
      connection logs "drop connection #<n> from [<address>]:<port> on [<address>]:<port>
      penalty: <reason>" at INFO from 9.8; from 10.0 a burst rate limit demotes them and logs
      "PerSourcePenalties logging rate-limited: additional <n> connections dropped". Penalty
      lines carry the listener PID, never a connection PID.
  practitioner_implication: >-
    Discover which hosts run 9.8 or later (10.1 or later, or LogLevel VERBOSE, for activating
    lines), any PerSourcePenalties or exempt-list overrides, whether
    the listener's sshd lines are collected beside sshd-session's, which source addresses are NAT,
    VPN or bastion egress, and whether the DT-SSHH-HOST-001 account inventory exists to rank hits.

threat_research:
  why_it_matters: >-
    A source that sprayed and then got in has moved from noise to access. Ranking successes by
    prior spray puts a few logins ahead of thousands of failures; it adds nothing where the bypass
    landed with no prior spray.
  threat_actor: 'Unknown. No source attributes the reported spraying to any actor.'
  actor_class: 'generic-password-spraying'
  campaign: >-
    sshole (CVE-2026-123158), status as of 2026-11-05. One researcher reports Internet-wide
    spraying of root and alpine with very long passwords "(which bypasses auth)" and a coin miner
    as the first honeypot payload (2026-11-05 14:21 UTC, REF-BEAUMONT-SPRAY). Uncorroborated; no
    addresses, hashes or pools are published, and no production compromise is documented. Not in
    the CISA KEV catalog release of 2026-11-04, which predates disclosure (REF-CISA-KEV).
  victim: 'A honeypot only, per one uncorroborated researcher; no production host compromise is documented.'
  capability: >-
    One researcher reports spraying of root and alpine with very long passwords "(which bypasses
    auth)" and a honeypot coin miner; uncorroborated. No source reports a sprayed source later logging in to a production
    host. Our lab emulated a spray and reproduced a bypass from one lab source.
  target: >-
    root and alpine are the names reported sprayed. Root needs PermitRootLogin yes; the default
    prohibit-password refuses root passwords. Reached: a honeypot, per one researcher.
  victimology:
    - 'Internet-facing hosts running sshd with PasswordAuthentication yes.'
    - 'Alpine tiny-cloud images, whose alpine user holds * and passwordless doas (REF-ALPINE-ADVISORY).'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1110.003'
      name: 'Brute Force: Password Spraying'
      evidence: >-
        Reported: two account names (root, alpine) sprayed Internet-wide with very long passwords;
        no password count is given. Mapping to .003 rather than .001 is this pack's choice: the same
        few names are sprayed across many hosts, and no password count is reported. The researcher says the passwords bypass auth; either
        way the failed record is the same.

visibility:
  telemetry_sources:
    - source: 'sshd authentication log (syslog facility AUTH), per-connection process'
      purpose: 'Record failed, refused and accepted password logins with user, source and port.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Failed password for [invalid user ]<user> from <ip> port <n> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: 'The invalid user prefix marks an unknown or refused account; lab: root logged this way.'
        - name: 'Accepted password for <user> from <ip> port <n> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
        - name: 'User <user> not allowed because account is locked'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: false
          note: 'No source address; join to the Failed line by connection PID.'
        - name: 'error: Could not get shadow information for NOUSER'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-SHADOW-C'
          load_bearing: false
          note: 'NOUSER is the fake account sshd uses for a refused user (auth.c); no source address.'
        - name: 'Disconnecting <state> user <user> <ip> port <n>: Change of username or service not allowed: ...'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH2-C'
          load_bearing: false
          note: >-
            Format from auth2.c and packet.c (REF-OPENSSH-PACKET-C); the reason is cut at 100
            characters, so the second user may be lost. Lab: logged when a client switched user in one connection.
      details: >-
        Lines from one connection share the sshd-session PID and source port. Locked-account and
        shell refusals carry no address, so they reach the source only through the same PID's
        Failed line; AllowUsers, DenyUsers and group refusals name "from <host>". No line carries
        the password or its length.
      advantages:
        - 'Present at the default INFO log level.'
        - 'The same stream carries the success that this object joins on.'
      limitations:
        - 'Landing file and program tag vary by syslog setup and version (sshd, sshd-session, sshd-auth).'
        - 'Source address is whatever reached sshd: NAT, VPN or a proxy hides the client.'
        - 'Ubuntu rsyslog compresses repeats as "message repeated N times: [...]"; parse both forms.'
    - source: 'sshd listener log (program sshd, PerSourcePenalties)'
      purpose: 'Show the listener penalized a source for failed authentication and refused it.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'srclimit_penalise: <ip>/<mask>: activating <family> penalty of <N> seconds for penalty: <reason>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-SRCLIMIT-C'
          load_bearing: true
          note: >-
            INFO from 10.1, VERBOSE in 9.8 to 10.0 (REF-OPENSSH-SRCLIMIT-C-9-8,
            REF-OPENSSH-SRCLIMIT-C-10-1). N is whole seconds before 10.3, three decimals from 10.3;
            parse both. A first single penalty above the minimum logs "new ... active penalty"
            instead; authfail and invaliduser defaults (5 s) never do that alone.
        - name: 'drop connection #<n> from [<ip>]:<port> on [<ip>]:<port> penalty: <reason>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-SSHD-C'
          load_bearing: true
          note: >-
            INFO from 9.8 (REF-OPENSSH-SSHD-C-9-8); from 10.0 rate-limited, with a summary line
            counting the unlogged drops.
        - name: 'syslog program sshd and the listener PID'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-RELNOTES-9-8'
          load_bearing: false
          note: 'Lab: penalty lines tagged sshd[<listener pid>], auth lines sshd-session[<pid>].'
      details: >-
        One activating line per penalty episode and one drop line per refused connection, keyed by
        source and reason. Dropped connections close before SSH version exchange (lab: the client
        saw EOF or reset), so they leave no auth line.
      advantages:
        - 'Free at the default configuration and level, and already a per-source summary of failure.'
      limitations:
        - 'Absent before 9.8, when disabled, and for exempt-listed sources.'
        - 'Activating lines are absent at the default LogLevel in 9.8 to 10.0; drop lines remain.'
        - 'A parser or rule keyed on sshd-session, or excluding the listener, drops every penalty line.'
        - 'From 10.0 drop lines are rate-limited; counts from them undercount.'
        - 'The netblock mask can group several clients into one penalized source.'
    - source: 'Network flow records for SSH (cloud flow logs, NetFlow or NDR)'
      purpose: 'Show bursts of short SSH connections from one source to one or many hosts.'
      event_vocabulary: 'flow-record'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'source address, destination, port, packets, bytes, action'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Generic placeholder names, not vendor spellings; each product names these differently.
            Lab cloud flow logs carried them with ACCEPT or REJECT.
        - name: 'distinct destination hosts per source per window'
          attestation: 'detector-computed'
          load_bearing: true
      details: >-
        Lab: flow logs held every attack connection; penalty drops showed a pre-banner SYN and RST
        pattern in capture; a fresh public address drew Internet SSH probes within about 30 min,
        recorded as REJECT for ports the security group closed.
      limitations:
        - 'No user, method or outcome; a burst is connections, not failed logins.'
        - 'Aggregation windows merge connections; per-connection counts are approximate.'
        - 'Success still needs the sshd Accepted line.'

detection:
  scope: >-
    Strategy one joins sshd spray or penalty records to a later Accepted password from the same
    source, on any monitored host. Strategy two takes the spraying source from flow records, for
    sources that hit hosts whose sshd log is not collected. Strategy three scores sources as a
    hunt. The bypass itself is DT-SSHH-HOST-001's subject.
  outcome_guardrails: >-
    Spray and penalty lines are attempts. An Accepted line is access, not proof of the bypass or a
    guessed password. The sequence shows one address did both, not one actor. No spray before a
    success clears nothing.
  shared_normalization_context: >-
    Match message content, not program: auth lines come from sshd-session (sshd before 9.8),
    penalty lines from the listener sshd. Normalise the source to the address, for IPv6 also its
    /64, and for penalties the logged netblock. Parse penalty seconds as whole (before 10.3) or
    fractional (10.3 on). Count failures per connection (PID and port), not per line; expand
    "message repeated N times". Exclude the accepting connection's own failures.
  shared_enrichment_context: >-
    The account's field and the host's exposed class from DT-SSHH-HOST-001 and DT-SSHH-ESTATE-005
    set severity. A list of the estate's own egress, VPN, bastion and scanner addresses separates
    shared sources; it is context, never a suppression.
  strategies:
    - id: 'STRAT-PENALIZED-OR-SPRAYING-SOURCE-THEN-ACCEPTED-PASSWORD'
      name: 'penalized or spraying source later yields an accepted password login'
      objective: >-
        Detect an Accepted password from a source that earlier, in other connections, was
        penalized by an sshd listener or failed password logins across accounts or hosts.
      incident_relevance: >-
        Detects the reported spray followed by access, a possible outcome; no source reports a
        sprayed source logging in to a production host. Generic: also fires on guessed passwords.
      detection_logic: |
        Mark a source as spraying when, within the window before a login, any monitored host
        logged for it an activating penalty or drop line whose reason is "penalty: failed
        authentication" or "penalty: attempted authentication by invalid user", or failed
        password records in at least two connections other than the accepting one. Count invalid
        user and refused account failures. Other penalty reasons (no authentication attempted,
        which ssh-keyscan also earns; LoginGraceTime; crash; RefuseConnection) and MaxStartups
        drops only rank. Join sources on the full address and, for IPv6, also on the /64. When an
        Accepted password line from that source follows on any monitored host, alert if the mark
        rests on a qualifying penalty line or on failed connections spanning at least two
        accounts or two hosts; otherwise emit a lead. Start the window at 24 hours (this pack's
        choice; tune per estate). Top severity: the account's field is * on an exposed-class
        host, or the account is key-only; raise for root and alpine. Spray with no Accepted line
        is not an alert.
      minimum_evidence: >-
        One Accepted password record (host, user, source, time) and, from the same source earlier in
        the window, a qualifying penalty line or failed records in two other connections spanning
        two accounts or two hosts. Anything less, including two failed connections for one account
        on one host, is a lead.
      correlation_context: >-
        Key: source address (or the penalty's netblock; for IPv6 also the /64), across hosts.
        Order by source timestamp,
        not ingestion. Exact within one record set; across hosts the join is by address only, so
        NAT and shared egress make it inferred. Retain listener lines as long as auth lines.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins penalty and failure records to a later Accepted line by source across hosts.'
          limitations: 'Needs listener and session lines both parsed with source; blind to sources it never sees.'
      benign_explanations:
        - explanation: >-
            A user mistypes several times, is penalized, and later logs in correctly from the same
            address.
          distinguishing_context: >-
            The account holds a hash, the failures name that same user only, the source is the
            user's known address, and the user confirms the login.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding single-user failure runs would also drop a spray aimed at one account such as
            alpine; rank by the account field instead.
        - explanation: >-
            Many users share one egress address (NAT, VPN, bastion); one user's failures and
            another's success meet on the address.
          distinguishing_context: 'The address is on the estate egress list and the failing and accepted users differ.'
          overlaps_incident_instance: false
          tuning_hazard: >-
            Suppressing egress addresses hides an intruder inside the estate using them; lower
            severity, never drop, and keep * accounts at the top.
        - explanation: 'An authorized scanner or security test sprays and then logs in.'
          distinguishing_context: 'A scope record names source, hosts, accounts and time.'
          overlaps_incident_instance: true
          tuning_hazard: 'Excluding the scanner address forever hides an attacker reusing it; match the scope record.'
      forbidden_exclusions:
        - field: 'excluding accounts by name (root, alpine)'
          reason: 'They are the names reported sprayed; it would suppress the incident record.'
        - field: 'excluding sources by geography, reputation or cloud provider'
          reason: 'The attacker chooses the source; it would suppress the incident record.'
        - field: 'requiring a penalty line'
          reason: >-
            Absent before 9.8, activating lines at the default level before 10.1, when disabled or
            exempt-listed, and when spray stays below the minimum.
        - field: 'requiring the accepted connection to be in the penalty window'
          reason: >-
            A penalty refuses connections only on the listener that applied it, so success there
            comes after it expires and success elsewhere can come at any time.
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No rate measured or sourced. It tracks how often Internet-facing password logins come
          from addresses that also failed elsewhere, chiefly shared egress and retrying users.
          Population: password-auth hosts whose sshd and listener lines are collected.
      blind_spots:
        - description: >-
            Evasion: a bypass from an address that never sprayed, or after the window, leaves no
            spray to join; the account-state join covers it.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Evasion: spraying from one address and logging in from another breaks the source key;
            the account-state join covers the login.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Evasion: rotating addresses within an IPv6 prefix splits penalties, since the default
            PerSourceNetBlockSize 32:128 penalizes each address alone; the /64 join covers only
            rotation inside one /64.
          routes_to: null
        - description: >-
            Missing telemetry: hosts whose sshd log is not collected see neither leg; flow records
            can supply the spray leg.
          routes_to: null
        - description: >-
            Parsing difference: rules keyed on sshd-session drop listener penalty lines; rules keyed
            on sshd miss 9.8+ auth lines; a seconds pattern for one form misses the other (whole
            before 10.3, fractional from 10.3).
          routes_to: null
        - description: >-
            Attribution limit: NAT, VPN and proxies rewrite the source, so the join may link
            different clients.
          routes_to: null
      analyst_response: >-
        List the source's failures, penalties and drops by host, user and time, and the accepted
        login's host, user, PID and port. Check the account's field and host class, a Failed line
        in the accepting connection, and what the session then did (doas or sudo to root,
        DT-SSHH-HOST-003; a sustained CPU-bound process, DT-SSHH-HOST-007).
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from a lab spray and reproduced bypasses hold both legs: from one lab source on
          one host, failed and refused password lines, a listener penalty and drop lines, then
          Accepted password lines. No join, window or benign twin was run. Checked by hand against
          the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), default PerSourcePenalties, PasswordAuthentication yes,
          PermitRootLogin no. 15 rapid attempts, root and alpine among the users, from a second lab
          host, then bypass logins from it. Telemetry: rsyslog forwarded off-box.
        measured: >-
          Spray: "User root not allowed because account is locked", "Could not get shadow
          information for NOUSER", "Failed password for invalid user root"; after 4 rapid failed
          connections the listener logged srclimit_penalise (about 19 s, failed authentication)
          and drop lines. Bypass: Accepted password, same
          source. The report quotes spray lines without timestamps; order here rests on
          per-connection PID order.
      safe_conclusion: >-
        A source that sprayed or was penalized earlier later logged in by password to a monitored
        host; that it was the same actor, and how the password was obtained, are not established.
    - id: 'STRAT-FLOW-BURST-SOURCE-THEN-ACCEPTED-PASSWORD'
      name: 'source with a burst of short SSH flows later yields an accepted password login'
      objective: >-
        Detect an Accepted password from a source that flow records show opened bursts of short SSH
        connections to many hosts, including hosts whose sshd log is not collected.
      incident_relevance: >-
        Detects the same possible sequence where the spray hit unmonitored or firewalled hosts and
        only the success lands on a monitored one. Generic; not specific to the bypass.
      detection_logic: |
        From SSH flow records, mark a source that within the window reached at least a calibrated
        number of distinct destination hosts on SSH with short, low-byte connections, or was
        refused (REJECT) on SSH by perimeter rules at a calibrated number of distinct
        destinations; a single refusal does not qualify. Alert when an Accepted password line from
        the same source follows on a monitored host. Calibrate counts on the estate's own scanners
        and admins; start the window at 24 hours (this pack's choice). Flows alone never alert.
      minimum_evidence: >-
        A flow-record burst, or perimeter refusals at the calibrated number of destinations, from
        the source, and a later Accepted password line from it. Without the Accepted line, report a
        scanning source only.
      correlation_context: >-
        Key: source address, for IPv6 also the /64. Flow aggregation intervals blur timing, so
        order by the Accepted line
        and allow one aggregation interval of slack. Inferred across NAT.
      detectors:
        - detector_class: 'network-flow-analytics'
          technologies:
            - 'Cloud VPC flow logs'
            - 'NetFlow or IPFIX collectors'
            - 'Zeek or Suricata (off-box)'
            - 'Cloud threat-detection findings for SSH brute force'
          contribution: 'Supplies a spraying source from the network side to join to the sshd log.'
          limitations: 'No user or outcome; a burst is not a failed login; cloud findings vary by provider.'
      benign_explanations:
        - explanation: 'An internal inventory or vulnerability scanner sweeps SSH and an admin logs in from it.'
          distinguishing_context: 'The source is a registered scanner and a scope or change record exists.'
          overlaps_incident_instance: false
          tuning_hazard: 'Allowlisting the scanner address hides an attacker on that host; match the schedule.'
        - explanation: 'Configuration management opens many short SSH sessions to many hosts.'
          distinguishing_context: 'The source is a managed automation host and its logins are by key, not password.'
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding sources by geography, reputation or cloud provider'
          reason: 'The attacker chooses the source; it would suppress the incident record.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No rate measured; depends on flow coverage, perimeter policy and scanner population.'
      blind_spots:
        - description: 'Missing telemetry: no flow collection on the path, or sampling that drops short flows.'
          routes_to: null
        - description: 'Attribution limit: flows carry no user or outcome; the sshd log is required for success.'
          routes_to: null
        - description: >-
            Evasion: a slow spray below the burst threshold, or a single bypass connection, leaves
            no burst.
          routes_to: 'DT-SSHH-HOST-001'
      analyst_response: >-
        Pull the source's flows by destination and action, then the Accepted line's host, user,
        PID and port. Check the account's field, host class, and the session's follow-on activity.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Lab cloud flow logs and capture held the spray and bypass connections from one lab
          source; penalty drops showed as pre-banner SYN and RST in capture. No burst threshold or
          join was scored and no cloud brute-force finding was deployed. Checked by hand against
          the captured records.
      safe_conclusion: >-
        A source that opened bursts of short SSH connections later logged in by password to a
        monitored host; how the password was obtained is not established.
    - id: 'STRAT-SPRAY-AND-USERNAME-SWITCH-SOURCE-RISK-HUNT'
      name: 'per-source spray, penalty and username-switch risk score (hunt only)'
      objective: >-
        Rank sources by spray volume, penalty episodes, root and alpine targeting and
        Change-of-username disconnects, for review and as an input to strategy one.
      incident_relevance: >-
        Surfaces sources that match the reported spraying, success or not. A hunt and a risk
        input; never a standing alert, since this traffic is constant on Internet-facing hosts.
      detection_logic: |
        Hunt only. Per source (and IPv6 /64) and window, count failed and refused password
        connections, distinct users and hosts, attempts for root and alpine, activating penalty
        and drop lines by reason (plus rate-limited summaries), and Change of username or service
        disconnects. Rank by combination; feed the top sources to strategy one and to the account-state join. Report a
        username-switch disconnect as a client trying several users in one connection, not as
        exploitation.
      minimum_evidence: >-
        Per-source counts with the records behind them. Report a ranked spraying or scanning
        source; nothing about access.
      detectors:
        - detector_class: 'siem-hunt-query'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Aggregates sshd and listener lines per source into a ranked list.'
          limitations: 'Commodity noise dominates; only useful joined to success or account state.'
      benign_explanations:
        - explanation: 'Commodity Internet SSH scanning and brute force unrelated to this CVE.'
          overlaps_incident_instance: true
          tuning_hazard: 'Do not suppress root or alpine attempts as background; they are the names reported.'
        - explanation: 'A client misconfigured with a wrong user or key retries repeatedly.'
          distinguishing_context: 'One user, one known source, and the owner confirms the client.'
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding root or alpine attempts as background noise'
          reason: 'They are the names reported sprayed; it would suppress the incident record.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          No rate measured or sourced. Internet-facing hosts see continuous SSH probing (lab:
          probes within about 30 min of a public address). A ranked list, not alerts.
      blind_spots:
        - description: >-
            Evasion: a bypass needs one connection and no spray, and penalties push careful
            attackers to slow or spread attempts, below any ranking.
          routes_to: 'DT-SSHH-HOST-001'
        - description: >-
            Parsing difference: the username-switch reason is cut at 100 characters, losing the
            second user name for long names (REF-OPENSSH-PACKET-C).
          routes_to: null
      analyst_response: >-
        For top sources, check any Accepted login from them on any host (strategy one), the
        accounts tried, and whether any targeted host is in the exposed class (DT-SSHH-ESTATE-005).
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Lab records hold every input: refused-account, NOUSER and invalid-user Failed lines,
          listener penalty and drop lines, and two Change of username or service disconnects from
          a client that switched user in one connection (our evasion test, not a scanner). No
          ranking was run. Checked by hand against the captured records.
      safe_conclusion: >-
        A source sprayed or scanned SSH logins against these hosts; it does not show access or use
        of the bypass.
  supporting_technologies_considered: >-
    Threat-intelligence address feeds could seed spraying sources, but the one report publishes no
    addresses. Honeypots corroborate spraying, not access to production hosts. Packet size of auth
    packets is DT-SSHH-HOST-001's hunt.

detector_requirements:
  required: >-
    Collect both sshd-session (or pre-9.8 sshd) auth lines and the listener's sshd lines with
    source address, PID and source timestamp; parse invalid user and refused-account forms, the
    penalty reason, and whole or fractional penalty seconds; keep a host key; and alert text that
    says sprayed-then-accepted, not exploited.
  optional: >-
    The DT-SSHH-HOST-001 account inventory and DT-SSHH-ESTATE-005 exposed-class data set severity;
    an estate egress list explains shared sources; flow records add sprays against unmonitored
    hosts.
  correlation:
    capability: >-
      Aligned clocks across hosts, a normalised source address on every record, and retention of
      listener and auth lines for the full window.
    window: "24 hours from spray to success as a starting point (this pack's choice); estates tune it."
  baselines:
    - name: 'per-source distinct SSH destinations and perimeter REJECT counts for scanners and admins'
      window: '30-day, a pack suggestion rather than a sourced figure'
      seeded_from: >-
        Flow records of a period not known to contain spraying against the estate, labelled by
        the scanner and automation register; never seeded from the window under test, from the
        detector's own unreviewed hits, or from Internet probe traffic.
  product_support_caveat: >-
    A named product is only a candidate implementation technology. Actual support depends on
    deployed sensors, enabled logging, retained fields, parsing, licensing, and architecture.
    Verify capability before selecting or generating an implementation. Verify parsers keep the
    listener's sshd lines and the invalid user prefix, that PerSourcePenalties is not disabled or
    exempt-listed, and that hosts on 9.8 to 10.0 log at VERBOSE where activating lines are needed.

missing_context:
  unverified:
    - >-
      first_observed 2026-11: month of disclosure; spraying reported 2026-11-05
      (REF-BEAUMONT-SPRAY), uncorroborated.
    - 'Whether the reported very long passwords bypass auth, as the researcher says; no packets or lengths are published.'
    - 'Whether any sprayed source later logged in to a production host; no source reports it.'
    - 'Penalty defaults and exempt lists on each estate; distro builds may override them.'
  assumptions:
    - id: 'ASSUMPTION-SPRAY-AND-SUCCESS-SHARE-A-SOURCE'
      verdict_changing: false
      statement: >-
        An actor that sprays then succeeds does so from one address. The report publishes no
        infrastructure, so this is the pack's inference. If wrong, strategies one and two stay
        silent on a real intrusion. Resolve it by comparing spray and login sources in honeypot
        or incident data.
    - id: 'ASSUMPTION-WINDOW-COVERS-SPRAY-TO-SUCCESS'
      verdict_changing: false
      statement: >-
        Spray and success fall within 24 hours. No source gives a delay; the window is this pack's
        choice. If wrong, later successes are missed or more noise is joined. Resolve it by
        measuring spray-to-login delay in honeypot or incident data.
  standing_negatives:
    - statement: >-
        As of 2026-11-05 no source publishes addresses, hashes or pools for the reported spraying,
        and no production compromise is documented.
      ref: 'REF-BEAUMONT-SPRAY'
      valid_until: '2026-11-12'
      recheck: >-
        Re-read the researcher's post and replies, and search vendor and CERT bulletins for
        spraying data naming CVE-2026-123158.
    - statement: >-
        The CVE was not in the CISA KEV catalog release of 2026-11-04, which predates disclosure.
      ref: 'REF-CISA-KEV'
      valid_until: '2026-11-12'
      recheck: 'Re-fetch the CISA KEV catalog and search it for CVE-2026-123158.'
    - statement: >-
        No Sigma, Elastic, Splunk, Falco or ET Open (Suricata) rule joining sshd penalty or spray
        records to a later accepted login for this CVE was found by search of the public rule
        repositories on 2026-11-05.
      valid_until: '2026-11-12'
      recheck: >-
        Search the Sigma, Elastic, Splunk, Falco and ET Open (Suricata) rule repositories for the
        CVE, sshole, srclimit_penalise and "drop connection" with "Accepted password".

missing_states:
  - id: 'MISSING_SSHD_AUTH_LOG'
    meaning: 'Missing telemetry: the sshd authentication log is not retained or forwarded.'
    coverage_claim: 'no-coverage'
    response: 'State the host is not covered; a quiet SIEM says nothing about it.'
  - id: 'MISSING_PENALTY_LINES'
    meaning: >-
      Missing telemetry: the listener's lines are not collected, the host runs OpenSSH before 9.8
      (or 9.8 to 10.0 at the default LogLevel, which drops activating lines), or PerSourcePenalties
      is off or exempts the source.
    coverage_claim: 'coverage-limited'
    response: 'Use failed-connection counts alone and say penalty evidence could not be checked.'
  - id: 'MISSING_PRIOR_SPRAY'
    meaning: 'Analyst trap: an accepted password login with no spray from its source.'
    coverage_claim: 'no-coverage'
    response: >-
      This object makes no claim; never read it as cleared. Run the DT-SSHH-HOST-001 account-state
      join and pair check.
  - id: 'MISSING_TRUE_CLIENT_ADDRESS'
    meaning: 'Attribution limit: NAT, VPN or a proxy rewrites the source address.'
    coverage_claim: 'coverage-limited'
    response: 'Report the join as by address only, not by client; check the egress list.'

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'source_address_or_netblock'
    - 'accepted_login_host_user_pid_and_port'
    - 'accepted_login_timestamp'
    - 'prior_spray_records_by_host_user_and_time'
    - 'penalty_or_drop_lines_or_explicit_missing_state'
    - 'window_used'
    - 'account_field_and_host_class_or_unknown'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'flow_burst_summary'
      condition: 'when STRAT-FLOW-BURST-SOURCE-THEN-ACCEPTED-PASSWORD supplied the spray leg'
    - field: 'egress_list_match'
      condition: 'when the source address is on the estate egress, VPN or bastion list'
  recommended_title: >-
    Accepted SSH password login from a source that earlier sprayed or was penalized (same address;
    actor and credential origin not established)
  unsupported_title: 'Password spraying campaign compromised host via sshole'

evidence:
  confirmed_incident_behavior: >-
    One researcher reports Internet-wide spraying "targeting root and alpine as usernames, and very
    long passwords (which bypasses auth)" and a coin miner as the first honeypot payload;
    uncorroborated, no addresses published, no production compromise documented. That a sprayed source would later log in is
    this pack's reading, not a reported fact.
  supported_conclusion: >-
    sshd logs failed and refused attempts per source, and from 9.8 the listener logs penalty drops
    per source (activating lines at INFO from 10.1), so an Accepted password from a source with
    that history can be joined and ranked. A detector may emit it as sprayed-then-accepted.
  unsupported_conclusions: >-
    The evidence does not establish any production compromise or that one actor sent both legs;
    that the spray carried bypass attempts is the researcher's claim, uncorroborated. Nor does it
    establish that a sprayed host is exposed, or that a login with no prior spray is clean.
  procedure_boundary: >-
    Spraying followed by success from the same source. The bypass login itself, its
    same-connection Failed then Accepted pair and the account-state join are DT-SSHH-HOST-001;
    escalation after login is DT-SSHH-HOST-003 and a CPU-bound process after login is
    DT-SSHH-HOST-007.
  references:
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on spraying for the sshd bypass (2026-11-05 14:21 UTC)'
      publisher: 'Kevin Beaumont (cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        Spraying targets root and alpine "and very long passwords (which bypasses auth)"; first
        honeypot payload a coin miner. Single researcher, uncorroborated; no lengths, packets or
        addresses published, no production compromise.
    - id: 'REF-CISA-KEV'
      type: 'attack-surface-documentation'
      title: 'Known Exploited Vulnerabilities catalog'
      publisher: 'CISA'
      url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json'
      trust_tier: 'government'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        Catalog release 2026.11.04 lacks the CVE and predates disclosure; absence is not a
        status.
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: 'The alpine user holds * with passwordless doas on tiny-cloud images. Silent on spraying.'
    - id: 'REF-OPENSSH-RELNOTES-9-8'
      type: 'telemetry-documentation'
      title: 'OpenSSH 9.8 release notes'
      publisher: 'OpenSSH project'
      url: 'https://www.openssh.com/txt/release-9.8'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        PerSourcePenalties added and on by default, aimed at repeated failed authentication; the
        server split into the listener sshd and per-session sshd-session.
    - id: 'REF-OPENSSH-SSHD-CONFIG-MAN'
      type: 'attack-surface-documentation'
      title: 'sshd_config(5) manual page'
      publisher: 'OpenBSD (OpenSSH)'
      url: 'https://man.openbsd.org/sshd_config'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        PerSourcePenalties defaults (authfail and invaliduser 5s, min 15s, max 10m), refusal by
        PerSourceNetBlockSize (default 32:128), PerSourcePenaltyExemptList; LogLevel INFO.
    - id: 'REF-OPENSSH-SRCLIMIT-C'
      type: 'telemetry-documentation'
      title: 'srclimit.c at V_10_6_P1 (srclimit_penalise)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/srclimit.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Activating line at INFO with seconds to three decimals once accrued penalty passes the
        minimum; first-penalty line at INFO if active, else VERBOSE; reason strings per offence,
        including attempted authentication by invalid user. The invalid user reason and seconds to
        three decimals first appear at V_10_3_P1.
    - id: 'REF-OPENSSH-SRCLIMIT-C-9-8'
      type: 'telemetry-documentation'
      title: 'srclimit.c at V_9_8_P1 (srclimit_penalise)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_9_8_P1/srclimit.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Activating and new-penalty lines at VERBOSE with whole seconds; no invalid user reason.
        Unchanged in this respect through V_10_0_P2.
    - id: 'REF-OPENSSH-SRCLIMIT-C-10-1'
      type: 'telemetry-documentation'
      title: 'srclimit.c at V_10_1_P1 (srclimit_penalise)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_1_P1/srclimit.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Activating line raised to INFO, still whole seconds; no invalid user reason.
    - id: 'REF-OPENSSH-SSHD-C'
      type: 'telemetry-documentation'
      title: 'sshd.c at V_10_6_P1 (drop_connection, child exit penalties)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/sshd.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Drop line format at INFO, rate-limited with a summary line; penalty by child exit status
        (failed auth, invalid user); best-effort "Not allowed at this time" to the client.
    - id: 'REF-OPENSSH-SSHD-C-9-8'
      type: 'telemetry-documentation'
      title: 'sshd.c at V_9_8_P1 (drop_connection)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_9_8_P1/sshd.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Every penalty drop logged at INFO with no rate limit (same at V_9_9_P1); the rate limit
        and summary line first appear at V_10_0_P1.
    - id: 'REF-OPENSSH-SSHD-SESSION-C'
      type: 'telemetry-documentation'
      title: 'sshd-session.c at V_10_6_P1 (cleanup_exit)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/sshd-session.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        cleanup_exit returns the auth-attempted status before the invalid-user status, so any
        password attempt, even for an invalid or refused user, is penalized as failed
        authentication.
    - id: 'REF-OPENSSH-AUTH-C'
      type: 'telemetry-documentation'
      title: 'auth.c at V_10_6_P1 (auth_log, allowed_user, fakepw)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Failed and Accepted format with the invalid user prefix, the locked-account line when PAM
        is off, and the NOUSER fake account for refused users.
    - id: 'REF-OPENSSH-AUTH-SHADOW-C'
      type: 'telemetry-documentation'
      title: 'auth-shadow.c at V_10_6_P1'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth-shadow.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The "Could not get shadow information for <user>" error line.'
    - id: 'REF-OPENSSH-AUTH2-C'
      type: 'telemetry-documentation'
      title: 'auth2.c at V_10_6_P1 (input_userauth_request)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth2.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'A user or service change within one connection disconnects with "Change of username or service not allowed".'
    - id: 'REF-OPENSSH-PACKET-C'
      type: 'telemetry-documentation'
      title: 'packet.c at V_10_6_P1 (ssh_packet_disconnect)'
      publisher: 'OpenSSH portable'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/packet.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Disconnects log "Disconnecting <connection id>: <reason>" with the reason cut at 100 characters.'
    - id: 'REF-ATTACK-T1110-003'
      type: 'framework'
      title: 'Brute Force: Password Spraying (T1110.003)'
      publisher: 'MITRE ATT&CK'
      url: 'https://attack.mitre.org/techniques/T1110/003/'
      trust_tier: 'registry'
      verification: 'confirmed'
      evidence_use: 'One or a small list of passwords against many accounts; names SSH among targeted services.'
