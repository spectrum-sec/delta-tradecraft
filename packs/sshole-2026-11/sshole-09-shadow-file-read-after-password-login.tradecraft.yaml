identity:
  uuid: '60bfbdca-e8a3-4276-a455-b709417e2688'
  id: 'DT-SSHH-HOST-009'
  name: 'A session that began with an SSH password login reads the local shadow password file'
  incident: 'sshole (CVE-2026-123158)'
  first_observed: '2026-11'
  last_reviewed: '2026-11-05'

classification:
  primary_attack_surface: 'host-os'
  secondary_attack_surfaces:
    - 'host-filesystem'
  behavior_classes:
    - 'other'
  behavior_classes_note: >-
    Local credential-store read on a host; the credential-access members are all cloud or
    workload-identity specific, and collection would hide the credential objective.
  tags:
    - 'sshole'
    - 'openssh'
    - 'musl'
    - 'alpine'
    - 'credential-access'
    - 'shadow-file'
    - 'doas'
    - 'post-login'
    - 'generic'
    - 'post-exploitation'
    - 'inferred'

behavior:
  definition: >-
    After logging in over SSH with a password, an adversary uses that session, through doas, sudo
    or su, to read /etc/shadow and take the stored password hashes of local accounts.
  detailed_definition: >-
    The adversary controls a login session and a route to the privilege that the shadow file
    requires. Reading it crosses from one account's access into every local account's stored
    hash. The attempt ends at a command or open aimed at the file; success is a completed read.
    Cracking or reuse of the hashes is a later, separate outcome.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers a password-authenticated session that reaches root or shadow-read rights and reads
      the file; not a claim that any sshole intrusion did so.
    summary: >-
      Needs an SSH session, however obtained, and root or equivalent read access to /etc/shadow.
      The Alpine advisory states the tiny-cloud alpine user can become root through doas. No
      source documents an sshole attacker reading the shadow file; this is a hypothetical
      follow-on that we emulated in our lab.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Observable where process arguments, a file-read audit or sensor rule, or doas or sudo
      records reach a store; not from sshd logs, network telemetry or write-only file watches.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          The read itself is seen only by an added read watch, a read-aware sensor rule or EDR
          file-open events. Write-only (-p wa) audit watches did not record it in our lab.
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Many Alpine hosts and containers run no syslog forwarding, audit rules or sensor;
          Sysmon for Linux, Filebeat and Elastic Agent do not run on musl.
    summary: >-
      Needs the session's password login, plus a process record naming the file in its arguments,
      a successful read event on it, or a doas or sudo record whose command text names it, tied to
      that session. Too weak: the login alone, a root shell with no command text, or a shadow read
      by sshd itself during authentication.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable from sshd's own lookups and from tool, package and agent readers by process
      identity and session lineage; not where administrators routinely inspect shadow in
      password sessions. It says the file was read, not that the bypass was used.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          The read or command record and the password login come from different streams; the
          join by lineage, user and time is this pack's inference.
      - condition: 'environment-inventory-required'
        note: >-
          Which tools, agents and users legitimately read shadow, and which accounts log in by
          password, must be known.
    summary: >-
      sshd reads shadow on every password authentication on these hosts, so any read rule must
      drop the sshd-family process's own reads first. A read by a shell tool descended from a
      password-login session is rare outside incident response. Rank highest for a "*" login
      account on an exposed-class host.

attack_surface_context:
  surface: >-
    The local shadow password file (/etc/shadow) on a Linux host reached by an SSH password login;
    Alpine with busybox tools and OpenDoas is the worked case.
  how_the_surface_works: >-
    /etc/shadow holds each local account's stored password field and is readable only by root
    and, where the file is group-readable, its group; a login account normally needs doas, sudo
    or su first. The mode per Alpine release was not checked. sshd on musl without PAM looks up
    the shadow entry through getspnam in shadow_pw on each password check, in the privileged
    monitor process. On Alpine, cat, grep and cut are busybox applets.
  incident_processing_path: >-
    The Alpine advisory states "An attacker then gets a shell as `alpine` and can use `doas` to
    become root." It describes no credential access. One researcher reports a coin miner as the
    first honeypot payload. No source reports a shadow read; that it would follow is this pack's
    reading, exercised by us in the lab.
  processing_stages:
    - 'password-authenticated-ssh-session-opens'
    - 'elevation-to-root-or-shadow-reader'
    - 'read-command-run-naming-the-file'
    - 'shadow-file-opened-for-read'
    - 'hashes-returned-to-session'
    - 'hashes-cracked-or-reused-elsewhere'
  stage_evidence: >-
    A doas or sudo line proves a command naming the file was permitted, not that it read it. An
    exec record with the path in its arguments proves a command aimed at it. Only a file-open
    event with a success result proves the read. Later cracking or reuse is invisible on this host.
  trust_boundaries: >-
    Root-only file into the session's hands. Reached: unverified for sshole; no source reports
    it. Elevation, the boundary before it, is DT-SSHH-HOST-003's subject.
  security_control_context: >-
    File mode limits the read to root; doas or sudo rules decide who reaches root, and doas nolog
    drops the success record. auditd watches record only the permissions they name (r, w, x, a).
    Falco's stock Read sensitive file untrusted rule trusts named readers, sshd and sshd-session
    among them, and shell binaries.
  special_context:
    topic: 'sshd-own-shadow-lookups'
    context: >-
      sshd's shadow_pw calls getspnam for the logging-in user, so every password authentication
      reads shadow from an sshd-family process. On 10.x that is the sshd-session monitor:
      mm_answer_authpassword calls auth_password, then shadow_pw, and monitor.o links only into
      sshd-session (REF-OPENSSH-MONITOR-C, REF-OPENSSH-MAKEFILE-IN); sshd-auth asks the monitor
      and is not expected to read shadow. Before 9.8 the reader is sshd. In our lab an added read
      watch logged 374 events, noisy for this reason. A rule must drop the sshd-family process itself, never its
      descendants.
  technology_variants:
    - variant: 'alpine-tiny-cloud-images'
      context: >-
        The default alpine user holds "*" and a passwordless doas rule, so a bypass login reaches
        root and the shadow file in one command. The file still holds the $5$ or $6$ hash the
        bypass needs as its salt donor (DT-SSHH-ESTATE-005).
    - variant: 'busybox-applets'
      context: >-
        cat, grep and cut run as busybox applets, so the exec image is busybox and the applet is
        argv[0]; a sensor keyed on the image alone sees busybox, not cat.
  practitioner_implication: >-
    Discover whether hosts carry a read watch, read-aware sensor or EDR file-open events on the
    shadow file, which sshd binaries read it, which tools, agents and jobs read it legitimately,
    whether doas and sudo records are forwarded, and which accounts log in by password.

threat_research:
  why_it_matters: >-
    The shadow file gives the stored hash of every local account. Offline cracking can yield
    passwords reused on other hosts or services, so one bypassed host can widen into others
    after the sshd fix.
  threat_actor: >-
    Unknown. No source attributes any sshole activity, and none reports a shadow read.
  actor_class: 'generic-post-login-credential-access'
  campaign: >-
    sshole (CVE-2026-123158): an sshd password bypass on Linux musl builds without PAM, fixed in
    OpenSSH 10.6p2 on 2026-11-05. CISA ADP SSVC exploitation "poc". One researcher reports
    Internet-wide spraying of `root` and `alpine` with very long passwords and a coin miner as the
    first honeypot payload (14:21 UTC). Uncorroborated; no compromise of a production host is
    documented, and no source reports credential access. Not in the KEV catalog release of
    2026-11-04, which predates disclosure.
  victim: 'No production victim documented; the one reported payload was on a honeypot.'
  capability: >-
    Not observed in the wild for sshole. No public source documents an sshole attacker reading
    /etc/shadow. Our isolated lab (2026-11-05) emulated the read through doas after a reproduced
    bypass login, on our lab hosts; it is not taken from a real intrusion.
  target: >-
    Stored password hashes of local accounts on hosts with exploitable sshd. Reached: unreported.
  victimology:
    - 'Official Alpine tiny-cloud images, where the default user reaches root through passwordless doas.'
    - 'Hosts whose local accounts share passwords with other hosts or services.'
  framework_mappings:
    - framework: 'MITRE ATT&CK'
      technique_mapping_status: 'mapped'
      id: 'T1003.008'
      name: 'OS Credential Dumping: /etc/passwd and /etc/shadow'
      evidence: >-
        The behavior is a read of /etc/shadow for its stored hashes, which this sub-technique
        names. Mapped by behavior; no source shows sshole used it.

visibility:
  telemetry_sources:
    - source: 'Kernel audit read watch on /etc/shadow'
      purpose: >-
        Record each open of the shadow file for read, with the process, uid and result.
      event_vocabulary: 'kernel-audit'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'watch permission r on /etc/shadow (auditctl -p r, or the syscall form)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AUDITCTL-MAN'
          load_bearing: true
          note: >-
            -p wa watches do not fire on reads. auditctl marks -p deprecated in favour of the
            syscall form.
        - name: 'uid, euid and auid'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AUDITCTL-MAN'
          load_bearing: true
          note: 'auid was unset (4294967295) on every event on non-PAM Alpine in the 2026-11-05 lab.'
        - name: 'comm, exe, pid and ppid'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: >-
            Present in the lab records. comm is set by the process and spoofable; exe is the
            stronger key for dropping sshd's own reads.
      details: >-
        Sees the read whatever command performs it, including a shell redirection. It carries pid
        and ppid, not full ancestry, so the session link needs a process-event join.
      limitations:
        - 'Not configured by default; the lab default (-p wa) missed the read.'
        - 'Noisy: every password authentication adds sshd reads (374 events in one lab run).'
        - 'Local audit logs die with a wipe unless forwarded off-box.'
        - 'auid is unset on non-PAM Alpine; join by pid, ppid and time.'
    - source: 'Endpoint process creation with arguments and parent lineage'
      purpose: >-
        Show a command naming /etc/shadow in its arguments, with the per-connection sshd or
        sshd-session process in its ancestry.
      event_vocabulary: 'host-process-event'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'binary, arguments, uid and parent block (Tetragon process_exec)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-TETRAGON-EVENTS'
          load_bearing: true
          note: 'auditd EXECVE records carry the same arguments as a0, a1 and so on.'
        - name: 'parent process chain including the per-connection sshd or sshd-session process'
          attestation: 'unattested-inferred'
          load_bearing: true
          note: 'sshd-session exists from 9.8; before it the per-connection process is sshd.'
      details: >-
        Gives the command text and the session lineage, which is the attribution a read watch
        lacks. It shows intent, not that the file was opened.
      limitations:
        - 'Misses a read that names no path in arguments, such as a shell redirection or script.'
        - 'Absent on hosts with no sensor or execve audit rules.'
        - >-
          On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
          auditd, bpftrace, acct and static Tetragon do run.
        - 'The lab Tetragon policy hooked file writes only, so it did not record the read itself.'
    - source: 'Falco stock rule alerts (Read sensitive file untrusted)'
      purpose: >-
        Raise an alert on an open-for-read of the shadow file by a process outside the rule's
        trusted-reader lists, with up to four ancestor names.
      event_vocabulary: 'other'
      event_vocabulary_note: 'A rule-engine alert built on syscall events, not a raw event stream.'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      fields:
        - name: 'rule Read sensitive file untrusted (open_read and sensitive_files)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-FALCO-RULES'
          load_bearing: true
          note: 'sensitive_file_names includes /etc/shadow; tagged maturity_stable.'
        - name: 'output fields gparent, ggparent, gggparent, process, parent, command, user_loginuid'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-FALCO-RULES'
          load_bearing: true
          note: >-
            gparent is proc.aname[2]; the lab alerts named sshd-session as grandparent or
            great-grandparent.
      details: >-
        The stock rule fired in our lab on the emulated cat and grep reads with no custom content.
        It excludes sshd, sshd-session and shell binaries by process name.
      limitations:
        - >-
          The static musl build starts, but its eBPF engine did not initialize on our lab kernel;
          the rule ran only from a container.
        - 'Excludes shell binaries, so a read opened by the shell, as for an input redirection, does not fire.'
        - 'Trusted lists are by process name, which a renamed binary can match.'
        - 'Not deployed by default; alerts need an output shipped off-box.'
    - source: 'Host syslog: sshd, doas and sudo records'
      purpose: >-
        Show the password login and a privileged command whose text names the shadow file, where
        no sensor exists.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      fields:
        - name: 'Accepted password for <user> from <address> port <port> ssh2'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENSSH-AUTH-C'
          load_bearing: true
          note: 'INFO; program sshd before 9.8, sshd-session from 9.8 (REF-OPENSSH-RELNOTES-9-8).'
        - name: '<user> ran command <cmd> as <target> from <cwd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENDOAS-C'
          load_bearing: true
          note: >-
            authpriv info; empty tag under musl (REF-MUSL-SYSLOG); not with nolog. Format
            confirmed in the 2026-11-05 lab.
        - name: '<user> : TTY=<tty> ; PWD=<cwd> ; USER=<runas> ; COMMAND=<cmd>'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-SUDOERS-MAN'
          load_bearing: false
          note: 'sudo accepted-command format; facility auth by default. Not exercised in the lab.'
      details: >-
        A doas or sudo record carries the full command line, so a one-shot read appears as text.
        A read typed inside an elevated shell leaves only the shell's record.
      limitations:
        - 'Records command text, not whether the file was read.'
        - 'Blind to reads inside doas -s, doas sh or su shells.'
        - 'A nolog doas rule removes the record.'
        - 'Root can stop the daemon and truncate local logs; only a forwarded copy survives.'

detection:
  scope: >-
    Strategy one reads the open of the shadow file under a password-login session; strategy two
    reads a command naming it in its arguments under that session; strategy three is the
    syslog-only fallback on doas or sudo command text. Elevation and log wiping are sibling
    objects.
  outcome_guardrails: >-
    A password login is not a read. Command text naming the file is an attempt; only a successful
    open event shows a read. Neither shows the hashes left the host, were cracked or were reused,
    nor that the login came from the bypass.
  shared_normalization_context: >-
    Canonicalise the path (/etc/shadow, and relative or symlinked forms resolved by the sensor).
    Applet: argv[0], or argv[1] when the image is busybox. On busybox hosts exe is /bin/busybox
    for every applet; never allowlist a reader by exe path alone, pair it with the applet or argv.
    Resolve the session by ancestry to the
    per-connection sshd (pre-9.8) or sshd-session, never by login uid. Key doas lines on facility
    and message, not tag.
  shared_enrichment_context: >-
    The login account's field from DT-SSHH-HOST-001's inventory, gated on an exposed-class host
    (musl sshd without PAM, or openssh-server-pam with UsePAM no), sets top severity. A list of
    sanctioned shadow readers (account tools, package manager, integrity and audit agents,
    scheduled census jobs) removes the main benign class.
  strategies:
    - id: 'STRAT-SHADOW-READ-EVENT-UNDER-PASSWORD-SESSION'
      name: 'open-for-read of /etc/shadow by a process descended from a password-login session'
      objective: >-
        Detect a successful read of the shadow file by a process whose ancestry reaches a
        per-connection sshd or sshd-session process that logged an Accepted password.
      incident_relevance: >-
        Detects a possible follow-on of any password login, sshole included. Not documented for
        sshole; emulated by us.
      detection_logic: |
        Alert on a successful open-for-read of /etc/shadow (audit read watch or syscall rule,
        a read-aware sensor rule, or EDR file-open) when the reading process descends from a
        per-connection sshd or sshd-session process whose login was "Accepted password" on that
        host. First drop reads made by the sshd-family process itself (sshd, sshd-auth,
        sshd-session) as identified by executable path and position in the chain: these are
        the authentication lookups. Do not drop their descendants. Drop sanctioned readers with
        no sshd-family ancestor. A failed open is an attempt. Top severity for a "*" login
        account on an exposed-class host.
      minimum_evidence: >-
        A successful read event on the shadow file, a reading process that is not the
        sshd-family process, ancestry reaching the session's sshd process, and a prior
        password-login line. Without ancestry, report an unattributed shadow read.
      correlation_context: >-
        Keys are host, pid, ppid chain and time. auid is unset on non-PAM Alpine, so the
        read-watch event joins process events by pid and time; the login line joins by user and
        time. Neither join is exact.
      detectors:
        - detector_class: 'file-event-actor-attribution'
          technologies:
            - 'Linux auditd read watch or syscall rule'
            - 'Falco'
            - 'EDR file telemetry'
          contribution: 'Records the read, the reading process and its result.'
          limitations: >-
            Needs a read-aware rule added; auditd lacks ancestry, and the stock rule's output
            carries up to four ancestor names.
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the read to process lineage and the password-login line.'
          limitations: 'Only as good as ingested fields and clock alignment.'
      benign_explanations:
        - explanation: 'sshd reads the shadow entry on every password authentication.'
          distinguishing_context: >-
            The reader is the sshd-family process itself, by executable path, not a descendant
            of it.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Dropping by comm name alone lets a renamed tool pass; dropping all reads under
            sshd-session lineage removes the signal.
        - explanation: >-
            Account tools, the package manager, integrity agents or a scheduled census read
            shadow.
          distinguishing_context: 'No sshd-family ancestor; a known service, job or tool identity.'
          overlaps_incident_instance: false
        - explanation: >-
            A responder logs in as the default alpine user and uses doas to check shadow for "*"
            accounts.
          distinguishing_context: >-
            A key-method login, a known source and a change or incident ticket.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding alpine or doas reads of shadow removes the emulated instance, which was the
            same shape.
      forbidden_exclusions:
        - field: 'excluding reads by comm name sshd, sshd-auth or sshd-session alone'
          reason: 'comm is set by the process; a renamed tool would pass.'
        - field: 'excluding reads under sshd or sshd-session lineage'
          reason: 'That lineage is what this strategy reads.'
        - field: 'excluding the alpine default user or any account whose field is "*"'
          reason: 'Those are the accounts the bypass logs in as.'
      expected_volume:
        band: 'rare'
        basis: 'modelled'
        note: >-
          Reasoned, not measured: after sshd's own reads are dropped, shell reads of shadow in
          password sessions are unusual. Raw read-watch volume is high (374 events in one lab
          run), and exposure checks after 2026-11-05 will add responder reads.
      blind_spots:
        - description: >-
            Missing telemetry: no read watch, read-aware sensor or EDR file events on most hosts;
            strategy two or three is the fallback.
          routes_to: null
        - description: >-
            Attribution limit: a process that daemonises or is re-parented before reading loses
            the sshd-family ancestor.
          routes_to: null
        - description: >-
            Evasion: reading a copy (a backup such as shadow-, or the raw block device) is
            outside a watch or rule on the path (this pack's reading).
          routes_to: null
        - description: >-
            Detector limit: Falco's stock rule skips shell binaries and named trusted readers. An
            input redirection is opened by the shell before exec, so it is attributed to sh and
            skipped there (this pack's reading); a renamed binary can also pass.
          routes_to: null
        - description: 'Scope: the elevation that made the read possible is not alerted here.'
          routes_to: 'DT-SSHH-HOST-003'
      analyst_response: >-
        Read the reading process, its chain and the session's login line and source. Check the
        account's stored field and the elevation record. Treat every hash in the file as exposed:
        list accounts with real hashes and check for their reuse elsewhere.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from a reproduced bypass login and lab-emulated shadow reads under doas. An
          added auditd read watch recorded the read; containerized Falco's stock rule fired on cat
          and grep reads with sshd-session in its ancestor fields. Default write-only watches on an
          earlier host recorded nothing. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05 to 06): Alpine 3.24.3 tiny-cloud
          (openssh-server 10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*,
          key-only *, a $6$ donor, !. Reproduced bypass logins from a second lab host, then
          post-login steps we emulated on our lab hosts. Telemetry: auditd -p wa and -p r
          watches, Falco in a container.
        measured: >-
          -p r watch: 374 events over the run, noisy from sshd authentication lookups; the
          emulated read was among them with its command arguments; not split per process. Falco:
          Read sensitive file untrusted on both reads, sshd-session as gparent or ggparent.
          -p wa host: no record of the read. No benign twin. The sshd-family drop and the
          pid/ppid lineage join were not run.
      safe_conclusion: >-
        A process descended from a session that began with a password login read the shadow
        file; how login was obtained and whether the hashes were used are not established.
    - id: 'STRAT-SHADOW-PATH-IN-EXEC-ARGS-UNDER-PASSWORD-SESSION'
      name: 'command naming /etc/shadow in its arguments under a password-login session'
      objective: >-
        Detect a process whose arguments name the shadow file, with the per-connection sshd or
        sshd-session process of a password login in its ancestry.
      incident_relevance: >-
        Same possible follow-on, seen at process creation; works where no read watch exists. Not
        documented for sshole.
      detection_logic: |
        Alert on process creation whose arguments contain the shadow path, as a separate
        argument or inside a shell -c string, when ancestry reaches a per-connection sshd
        (pre-9.8) or sshd-session process whose login was "Accepted password" on that host.
        Take the session user from the login, not real uid; a doas, sudo or su hop marks an
        elevated run. Applet as normalised. Report as an attempt; promote to a read only when
        strategy one or a success result joins it. Skip sanctioned account tools whose
        arguments name the file only as a target of change; DT-SSHH-HOST-004 covers those.
        Top severity for a "*" login account on an exposed-class host.
      minimum_evidence: >-
        A process record with arguments naming the shadow file, ancestry reaching the session's
        sshd process, and a prior password-login line. Without the login join, report a shadow
        command from an SSH session of unknown method.
      correlation_context: >-
        Keys are host, session process, pid and time. Exact when the sensor carries the parent
        chain; the login line joins by user and time.
      detectors:
        - detector_class: 'endpoint-process-lineage-detection'
          technologies:
            - 'Tetragon'
            - 'Linux auditd with execve rules'
            - 'EDR with process creation and parent chain'
          contribution: 'Establishes the command text and its sshd-family ancestry.'
          limitations: 'Sees only commands that name the path; absent without a sensor.'
      benign_explanations:
        - explanation: >-
            An administrator in a password session inspects shadow during troubleshooting or
            exposure checks.
          distinguishing_context: >-
            Known administrator and source, a ticket, and an account with a real hash and a
            password-login history.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding by user name hides that name if its field is later "*", and a
            stolen-password intrusion; match the ticket.
        - explanation: 'Account tools such as passwd, chpasswd or usermod run with shadow paths.'
          distinguishing_context: 'The tool is an account tool changing an account, not a reader.'
          overlaps_incident_instance: false
      forbidden_exclusions:
        - field: 'excluding by the rest of the command line (pipes, cut, grep patterns)'
          reason: 'Adversary-chosen; the emulated read was piped through cut.'
        - field: 'excluding sshd or sshd-session lineage or the password method'
          reason: 'They are the conditions this strategy exists to read.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source gives a rate; it depends on administrator habit and sensor coverage.'
      blind_spots:
        - description: >-
            Evasion: a read that names no path in arguments (shell redirection, a script, a path
            built at run time) is invisible here; strategy one covers it.
          routes_to: null
        - description: >-
            Detector limit: a rule on image name sees busybox, not cat or grep; match argv.
          routes_to: null
        - description: 'Missing telemetry: hosts with no exec sensor emit nothing.'
          routes_to: null
      analyst_response: >-
        Read the command line, chain and login line. Confirm the read with a file event if one
        exists, check the account's stored field, and treat the file's hashes as exposed.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from reproduced bypass logins and lab-emulated doas sh -c reads of the shadow
          file: Tetragon doas and sh execs whose arguments carried the command, under the session's
          sshd-session lineage; auditd EXECVE arguments on a later host. Account-tool and admin
          twins were not run. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05 to 06): Alpine 3.24.3 tiny-cloud
          (openssh-server 10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*,
          key-only *, a $6$ donor, !. Reproduced bypass logins from a second lab host, then
          post-login steps we emulated on our lab hosts. Telemetry: Tetragon, auditd.
        measured: >-
          Tetragon: doas and sh exec records with the shadow command in args, under the
          session's sshd-session lineage; the session had an Accepted password line. auditd
          (read-watch host): EXECVE carried the doas sh -c command text; auid unset, so pid, ppid
          and time carry the join. No benign twin. The join to the login line was by hand.
      safe_conclusion: >-
        A command naming the shadow file ran in a session that began with a password login;
        whether the file was read and how login was obtained are not established.
    - id: 'STRAT-PASSWORD-LOGIN-THEN-SHADOW-COMMAND-SYSLOG'
      name: 'doas or sudo command naming /etc/shadow after a password login, from syslog'
      objective: >-
        Detect, on hosts with syslog and no sensor, a doas or sudo record whose command text
        names the shadow file, by a user shortly after that user's Accepted-password line.
      incident_relevance: >-
        A weaker fallback for the same possible follow-on. Not documented for sshole.
      detection_logic: |
        Key doas lines on facility authpriv and message, not tag. In the window after
        "Accepted password for <user>" on a host, alert on a doas "ran command" or sudo
        COMMAND= record by that user whose command text contains the shadow path. Report it as
        a permitted command naming the file, not a read. A bare elevated shell (doas -s, doas
        sh, su) routes to DT-SSHH-HOST-003. Top severity for a "*" login account on an
        exposed-class host.
      minimum_evidence: >-
        A password-login line and, for the same user on the host within the window, a doas or sudo
        record whose command text names the shadow file.
      correlation_context: >-
        Keys are host, user and time, an inferred join; a concurrent second session cannot be
        separated. Start at 60 minutes or the session lifetime; this pack's choice.
      detectors:
        - detector_class: 'siem-correlation'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Joins the login line and the elevation record by host, user and time.'
          limitations: 'Sees only one-shot command text; no read result and no lineage.'
      benign_explanations:
        - explanation: >-
            An administrator logs in by password and uses doas or sudo to view shadow.
          distinguishing_context: >-
            Known administrator, ticket, and a real hash and password-login history.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Excluding doas users removes the tiny-cloud alpine user, whose "*" field and
            passwordless doas are the documented bypass path.
      forbidden_exclusions:
        - field: 'excluding the logged-in user because it is a default or cloud account'
          reason: 'The alpine-style default account is a documented target.'
      expected_volume:
        band: null
        basis: 'unavailable'
        note: 'No source gives a rate; it depends on how often administrators use password login.'
      blind_spots:
        - description: >-
            Missing telemetry: a read typed inside an elevated shell leaves only the shell's
            record; strategies one and two see it.
          routes_to: null
        - description: 'Missing telemetry: a nolog doas rule or unforwarded authpriv leaves nothing.'
          routes_to: null
        - description: >-
            Consequence: an attacker who then stops syslog or wipes local logs removes the local
            record; forwarding and tamper detection are the sibling object's subject.
          routes_to: 'DT-SSHH-HOST-006'
      analyst_response: >-
        Read the login line and source and the doas or sudo command. Check the host for other
        follow-on activity and treat the file's hashes as exposed unless a file event shows no read.
      validation:
        status: 'lab-telemetry-verified'
        evidence: >-
          Records from a reproduced bypass and an emulated read hold the sequence: Accepted
          password, then a doas ran-command record as root whose text names the shadow file. sudo
          was not run. Checked by hand against the captured records.
        method: >-
          Our lab (Delta research team, 2026-11-05): Alpine 3.24.3 tiny-cloud (openssh-server
          10.3_p1-r1, musl 1.2.6), PasswordAuthentication yes; users alpine:*, key-only *, a $6$
          donor, !. Reproduced bypass logins from a second lab host, then post-login steps we
          emulated on our lab hosts. Telemetry: rsyslog forwarded off-box.
        measured: >-
          Forwarded syslog: Accepted password for alpine; doas "alpine ran command sh -c <text
          naming /etc/shadow> as root from <cwd>" (authpriv, empty tag). The read itself left no
          syslog line. No benign twin.
      safe_conclusion: >-
        A user ran a privileged command naming the shadow file shortly after an SSH password login
        on this host; whether it read the file and how login was obtained are not established.
  supporting_technologies_considered: >-
    File-integrity monitoring, including Wazuh's default checks on /etc, detects changes to the
    shadow file, not reads, so it does not cover this behavior. Network sensors cannot see a read
    inside the encrypted session.

detector_requirements:
  required: >-
    For strategy one, a read-aware audit rule, sensor rule or EDR file-open event on the shadow
    file with process identity by executable path; for strategy two, exec events with arguments
    and ancestry; for strategy three, forwarded sshd and doas or sudo records. All need the
    password-login line and alert text that separates command, read and later use.
  optional: >-
    The account-field inventory from DT-SSHH-HOST-001 sets top severity; a sanctioned-reader list
    removes agent and tool reads; off-box forwarding of audit or sensor output survives a wipe.
  correlation:
    capability: >-
      Aligned clocks, a stable host and user key, and ancestry resolution to sshd or
      sshd-session. auid cannot carry the join on non-PAM Alpine; pid, ppid and time do.
    window: "Start at 60 minutes after the login, or the session lifetime; this pack's choice."
  baselines:
    - name: 'processes that legitimately read /etc/shadow, per host class'
      window: '30-day, a pack suggestion rather than a sourced figure'
      seeded_from: >-
        Read events with no sshd-family ancestor before the review window; never seed it from
        reads under password-login sessions.
  product_support_caveat: >-
    A named product is only a candidate; verify sensors, rules, fields and parsing. On Alpine/musl, Sysmon for Linux, Filebeat and Elastic Agent do not run and osquery has no official build; the Wazuh agent runs from the Wazuh Alpine repo, and Falco ran only as a container (2026-11-05 lab); commercial EDR support for musl was not tested — check your vendor.
    Check that read rules exist, that sshd's own reads are dropped by path, and that untagged doas
    lines parse.

missing_context:
  unverified:
    - >-
      identity.first_observed 2026-11: month of disclosure; this behaviour is not documented
      for this threat.
    - 'Whether any sshole exploitation has been followed by a shadow read; no source reports one.'
    - 'Whether Falco user_loginuid is unset on non-PAM Alpine, as auditd auid was.'
    - 'Whether the static Falco build runs its engine natively on other kernels.'
    - 'How the 374 read-watch events split between sshd lookups and other readers; not counted.'
    - 'The shadow file mode and group on each Alpine release; not checked.'
  assumptions:
    - id: 'ASSUMPTION-SHADOW-READ-FOLLOWS-BYPASS'
      verdict_changing: true
      statement: >-
        A bypass login with root via doas would be followed by a shadow read like other SSH
        footholds. No source reports it; the only reported payload is a coin miner. If wrong, the
        object stays generic and adds no sshole coverage. Resolve it by an intrusion report
        describing credential access after an sshole login.
    - id: 'ASSUMPTION-SSHD-OWN-READS-SEPARABLE'
      verdict_changing: false
      statement: >-
        sshd's own shadow lookups can be dropped by executable path and chain position without
        dropping its descendants. The lab advice was to filter by comm. If wrong, strategy one
        either floods or misses. Resolve it by replaying the lab read-watch records with the
        path-based drop and counting what survives.
    - id: 'ASSUMPTION-SESSION-JOIN-BY-LINEAGE-AND-TIME'
      verdict_changing: false
      statement: >-
        Ancestry to the per-connection sshd or sshd-session process, joined by user and time to
        the login line, identifies the session. If wrong, concurrent sessions are misattributed.
        Resolve it per host by comparing a login's log pid and time with its descendants.
  standing_negatives:
    - statement: >-
        No source reviewed on 2026-11-05 reports a shadow read or other credential access after an
        sshole login. Checked: the Alpine advisory, the researcher post reporting spraying, and
        the CVE record. KEV release 2026-11-04 predates disclosure.
      ref: 'REF-BEAUMONT-SPRAY'
      valid_until: '2026-11-12'
      recheck: >-
        Check the CISA KEV catalog, the Alpine advisory and vendor bulletins for an intrusion
        report describing credential access after an sshole login.

missing_states:
  - id: 'MISSING_READ_EVENT'
    meaning: >-
      Missing telemetry: no read watch, read-aware sensor rule or EDR file-open events on the
      shadow file.
    coverage_claim: 'coverage-limited'
    response: >-
      Report command text only, as an attempt; never claim the file was read.
  - id: 'MISSING_PROCESS_LINEAGE'
    meaning: >-
      Missing telemetry: read or exec events lack ancestry to the per-connection sshd process.
    coverage_claim: 'coverage-limited'
    response: >-
      Report an unattributed shadow read with nearby password logins as context, not cause.
  - id: 'MISSING_ENDPOINT_AND_SYSLOG'
    meaning: >-
      Missing telemetry: the host runs no sensor or audit rules and forwards no authpriv.
    coverage_claim: 'no-coverage'
    response: 'State the behavior is not covered on this host.'

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'host_and_session_user'
    - 'password_login_record_and_source_address'
    - 'reading_process_executable_and_command_line'
    - 'process_lineage_or_explicit_missing_state'
    - 'outcome_command_only_or_read_observed'
    - 'elevation_record_when_present'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'login_account_password_field'
      condition: 'when the DT-SSHH-HOST-001 inventory covers the host'
    - field: 'read_event_result'
      condition: 'when strategy one or a joined file event supplies it'
  recommended_title: >-
    Shadow file command or read after SSH password login (read stated or not; bypass not
    established)
  unsupported_title: 'sshole attacker dumped password hashes from Alpine host'

evidence:
  confirmed_incident_behavior: >-
    Alpine states the alpine user "can use `doas` to become root" on tiny-cloud images. One
    researcher reports spraying and a honeypot coin miner, uncorroborated. No source reports a
    shadow read; that sequence is this pack's inference, emulated by us in the lab.
  supported_conclusion: >-
    A shadow read in a session that began with a password login is observable with added read
    rules, exec arguments or doas text. A detector may report it as such, never as sshole
    activity.
  unsupported_conclusions: >-
    The evidence does not establish that any sshole exploitation read the shadow file, that a
    login came from the bypass, that hashes left the host or were cracked, or that any
    compromise occurred. A clean result does not show a host is safe.
  procedure_boundary: >-
    Credential read after a password login. Elevation, account and key changes, log wiping and
    the CPU-bound process are sibling objects. Reuse of cracked hashes elsewhere is outside it.
  references:
    - id: 'REF-ALPINE-ADVISORY'
      type: 'attack-surface-documentation'
      title: 'Security advisory: openssh-server password authentication bypass'
      publisher: 'Alpine Linux'
      url: 'https://www.alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      citation_caveat: 'contradicted-elsewhere'
      citation_caveat_note: >-
        Lists key-only users made by adduser without a password as * holders; busybox adduser.c
        writes !. No claim here rests on that example.
      evidence_use: >-
        The doas path to root on tiny-cloud images and the review advice. It documents no
        exploitation and no credential access.
    - id: 'REF-BEAUMONT-SPRAY'
      type: 'incident-campaign-primary-source'
      title: 'Post on Internet-wide spraying for the OpenSSH bypass'
      publisher: 'Kevin Beaumont (Mastodon, cyberplace.social)'
      url: 'https://cyberplace.social/@GossiTheDog/117564277295417498'
      trust_tier: 'researcher'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        2026-11-05 14:21 UTC: spraying of root and alpine with very long passwords; coin miner as
        first honeypot payload. Single source, uncorroborated; no credential access mentioned.
    - id: 'REF-CVE-RECORD'
      type: 'attack-surface-documentation'
      title: 'CVE-2026-123158 record'
      publisher: 'CVE Program (MITRE CNA)'
      url: 'https://www.cve.org/CVERecord?id=CVE-2026-123158'
      trust_tier: 'registry'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: 'CVE id and the CISA ADP SSVC entry (exploitation "poc"). Says nothing of shadow reads.'
    - id: 'REF-ATTACK-T1003-008'
      type: 'framework'
      title: 'OS Credential Dumping: /etc/passwd and /etc/shadow, Sub-technique T1003.008'
      publisher: 'MITRE ATT&CK'
      url: 'https://attack.mitre.org/techniques/T1003/008/'
      trust_tier: 'registry'
      verification: 'confirmed'
      evidence_use: 'The sub-technique id and name used in framework_mappings.'
    - id: 'REF-OPENSSH-XCRYPT-C'
      type: 'attack-surface-documentation'
      title: 'OpenSSH portable openbsd-compat/xcrypt.c at V_10_6_P1'
      publisher: 'OpenSSH project'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/openbsd-compat/xcrypt.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        shadow_pw calls getspnam for the user, so sshd reads shadow during password checks.
    - id: 'REF-OPENSSH-MONITOR-C'
      type: 'telemetry-documentation'
      title: 'OpenSSH portable monitor.c at V_10_6_P1 (mm_answer_authpassword)'
      publisher: 'OpenSSH project'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/monitor.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The privileged monitor answers password requests by calling auth_password.'
    - id: 'REF-OPENSSH-MAKEFILE-IN'
      type: 'telemetry-documentation'
      title: 'OpenSSH portable Makefile.in at V_10_6_P1'
      publisher: 'OpenSSH project'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/Makefile.in'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        monitor.o links into sshd-session only, not sshd-auth or sshd, so the shadow lookup runs
        in sshd-session.
    - id: 'REF-AUDITCTL-MAN'
      type: 'telemetry-documentation'
      title: 'auditctl(8) - Linux manual page'
      publisher: 'man7.org (Linux audit manual)'
      url: 'https://man7.org/linux/man-pages/man8/auditctl.8.html'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        Watch permissions r, w, x and a, with -p deprecated in favour of the syscall form; auid,
        uid and euid are separate fields.
    - id: 'REF-TETRAGON-EVENTS'
      type: 'telemetry-documentation'
      title: 'Tetragon events'
      publisher: 'Cilium (Tetragon)'
      url: 'https://tetragon.io/docs/concepts/events/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'process_exec carries binary, arguments, uid and parent. File events need a tracing policy.'
    - id: 'REF-FALCO-RULES'
      type: 'detection-modeling-reference'
      title: 'falcosecurity/rules rules/falco_rules.yaml'
      publisher: 'Falco project (falcosecurity)'
      url: 'https://raw.githubusercontent.com/falcosecurity/rules/main/rules/falco_rules.yaml'
      trust_tier: 'vendor'
      verification: 'confirmed-with-scope-caveat'
      evidence_use: >-
        Read sensitive file untrusted: open_read of sensitive_files (/etc/shadow included), trusted
        lists naming sshd, sshd-session and shell binaries, and output fields gparent, ggparent and
        command. The rule is tagged T1555 upstream; this object maps T1003.008. Read at main, not
        the version the lab container ran.
    - id: 'REF-OPENDOAS-C'
      type: 'telemetry-documentation'
      title: 'doas.c at v6.8.2'
      publisher: 'OpenDoas'
      url: 'https://raw.githubusercontent.com/Duncaen/OpenDoas/v6.8.2/doas.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: >-
        AUTHPRIV record "<user> ran command <cmdline> as <target> from <cwd>", not under nolog;
        no openlog call.
    - id: 'REF-MUSL-SYSLOG'
      type: 'telemetry-documentation'
      title: 'src/misc/syslog.c'
      publisher: 'musl libc'
      url: 'https://git.musl-libc.org/cgit/musl/tree/src/misc/syslog.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Ident is empty unless openlog sets it, so doas lines carry no tag.'
    - id: 'REF-SUDOERS-MAN'
      type: 'telemetry-documentation'
      title: 'sudoers(5) manual, event logging'
      publisher: 'Sudo project'
      url: 'https://www.sudo.ws/docs/man/sudoers.man/'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'The accepted-command log format (user, TTY, PWD, USER, COMMAND) and facility auth.'
    - id: 'REF-OPENSSH-AUTH-C'
      type: 'telemetry-documentation'
      title: 'OpenSSH portable auth.c at V_10_6_P1 (auth_log)'
      publisher: 'OpenSSH project'
      url: 'https://raw.githubusercontent.com/openssh/openssh-portable/V_10_6_P1/auth.c'
      trust_tier: 'vendor'
      verification: 'confirmed'
      evidence_use: 'Accepted and Failed password lines, format and INFO level.'
    - id: 'REF-OPENSSH-RELNOTES-9-8'
      type: 'telemetry-documentation'
