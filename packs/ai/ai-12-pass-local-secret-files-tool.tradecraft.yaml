identity:
  uuid: '7b5ae6f9-0b80-4cd6-8cf9-6eef19be98cf'
  id: 'DT-AAG1-AI-012'
  aliases:
    - 'P31'
  name: 'Attackers make an agent pass local secret files to a tool'
  incident: >-
    MCP tool-poisoning secret-file exfiltration (Invariant Labs, responsibly disclosed research): a
    poisoned tool description made a Cursor/MCP agent read local credential and key files and submit
    their contents inside a benign-looking tool parameter.
  first_observed: '2025'
  last_reviewed: '2026-08-24'

classification:
  primary_attack_surface: 'ai-agent-harness'
  secondary_attack_surfaces:
    - 'host-filesystem'
  behavior_classes:
    - 'collection'
    - 'other'
  behavior_classes_note: >-
    secret-file-exposure-via-tool-arguments: a poisoned tool description steers a file-capable agent
    to read credential or key files and place their contents into a tool call's parameters, exposing
    the secret to the tool destination.
  tags:
    - 'ai'
    - 'mcp'
    - 'tool-poisoning'
    - 'secrets'
    - 'exfiltration'
    - 'cursor'

behavior:
  definition: >-
    An attacker steers an agent with local-file access to read credential or key files and include
    their contents as parameters to a tool call, exposing the secret to the tool destination.
  detailed_definition: >-
    The adversary controls a tool description or instruction the agent trusts and uses it to direct a
    file-capable agent to read secret material and pass it, as argument content, to a tool the agent
    is permitted to call. The boundary crossed is from a local secret at rest into a tool invocation
    whose destination the attacker influences: the secret leaves the host inside an argument the user
    may never see, because argument values can be hidden behind a simplified confirmation surface.
    The attempt ends when the argument carrying the secret is constructed; success begins when the
    tool receives it. It is independent of MCP client, tool transport, secret file format, and
    endpoint sensor.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers an agent reading local secret material and placing it into a tool call's arguments; does
      not cover what the receiving tool does with the secret afterward.
    summary: >-
      This can occur when an attacker can place a poisoned tool description or instruction where the
      agent reads it, the agent can read local files, and the agent can call a tool whose destination
      the attacker influences. Exposure requires only that the argument carrying the secret be
      submitted; a simplified confirmation UI that hides argument values lets it pass without the user
      seeing the secret.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      The tool call and its arguments are observable where opt-in tool-detail capture is enabled and
      the secret value is not truncated; the file read and the network send are observable where
      endpoint file and network telemetry exist. No single stream carries argument content plus the
      confirming file read and send.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Tool-parameter content is captured only with Claude Code OTEL_LOG_TOOL_DETAILS=1; M365
          Copilot audit records carry agent identity but no arguments, and Agent 365
          gen_ai.tool.call.arguments is captured but not queryable in advanced hunting.
      - condition: 'below-alerting-signal-strength'
        note: >-
          Claude Code tool_input truncates values over 512 characters and bounds payloads to about 4
          K characters, so a secret longer than the cap is silently dropped from the argument record;
          the argument event may then show a call without the secret it carried.
      - condition: 'cross-source-join-required'
        note: >-
          Proving the secret was read and sent, not merely referenced, needs the tool-argument event
          joined to endpoint file-read and network telemetry on path, host, and destination.
    summary: >-
      The behavior is observable when the tool-call arguments are captured with a credential or
      sensitive-path value present, ideally joined to a DeviceFileEvents read of that path and a
      network send to the destination. A tool call naming a secret path establishes intent; the
      argument content establishes the secret was carried; the file read plus send establishes it
      left the host. No vendor documents secret detection inside tool parameters, so the secret-match
      predicate is a derived analytic over captured argument text, and truncation can remove the
      evidence entirely.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable from benign secret-management workflows when a credential or sensitive-path value in a
      tool argument coincides with an absent approval and a downstream read or send; legitimate
      secrets tooling overlaps and must not be excluded by path alone.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          Separation rests on joining the argument's secret match to the approval event and to
          endpoint file/network confirmation; the argument text alone does not distinguish a poisoned
          read from a sanctioned one.
    summary: >-
      Distinguishing malicious exposure from legitimate secret handling rests on matching sensitive
      local paths and credential patterns in tool arguments, checking whether an approval or consent
      event accompanied the call, and confirming a file read or network send. A valid credential
      match with no consent and a downstream send is distinguishable; a path reference with no
      captured value, or a value with no read or send, is too weak to establish the behavior.

attack_surface_context:
  surface: >-
    An MCP-capable coding agent (Cursor and similar clients) that reads local files and calls tools
    whose descriptions come from connected MCP servers.
  how_the_surface_works: >-
    The client connects to MCP servers that advertise tools with names and natural-language
    descriptions; those descriptions enter the model's context and are treated as trusted guidance.
    The agent can read local files and call tools, passing arguments the model constructs. A
    confirmation surface shows the user which tool is being called, but may simplify or hide the full
    argument values, so the user approves a call without seeing everything it carries.
  incident_processing_path: >-
    Research reports (source-attested) that a poisoned tool description directed the agent to read
    ~/.cursor/mcp.json and SSH material and submit the contents inside a benign-looking sidenote
    parameter, and that a simplified confirmation UI hid the argument values from the user. That the
    same underlying research also covers the tool-metadata surface (the sibling procedure) is stated;
    this object is scoped to the tool-input content rather than the description text, which is this
    pack's split of one body of research into two observables.
  processing_stages:
    - 'poisoned-tool-description-ingest'
    - 'agent-context-assembly'
    - 'local-secret-file-read'
    - 'tool-argument-construction'
    - 'confirmation-surface-display'
    - 'tool-call-submission'
    - 'destination-receipt'
  stage_evidence: >-
    The stage an instrument sits at fixes what it proves: a file-read event proves the secret was
    accessed, not that it was sent; a tool-argument event proves the secret was placed into a call,
    not that the tool received usable content if truncation intervened; only the destination's own
    audit or a network send proves receipt.
  trust_boundaries: >-
    Untrusted tool description into the agent's trusted context (reached: the poisoned description
    steered the agent); local secret at rest into a tool argument (reached: the agent read and
    submitted the material); host to tool destination (reached in the research: the argument was
    submitted). The confirmation surface was intended as a boundary but was bypassed by hiding the
    argument values.
  security_control_context: >-
    Preventive controls decide at the tool boundary: an approval or consent prompt gates a call, a
    per-tool allowlist restricts which tools run, and DLP or secret scanning can inspect argument
    content where it sits inline. These log an approval decision and, where present, a block, but no
    vendor scans arguments for secrets natively. Bypass representations include a simplified
    confirmation that hides argument values, an innocuous parameter name carrying the secret, and
    splitting the secret to stay under the truncation cap.
  practitioner_implication: >-
    An implementer must discover which agents can read local files and call tools, whether tool-detail
    content capture is enabled and how far it truncates, which sensitive paths exist on the host
    (agent-owned files such as ~/.claude.json and ~/.claude/settings.json among them), whether an
    approval event accompanies tool calls, and whether endpoint file and network telemetry can confirm
    a read and a send.

threat_research:
  why_it_matters: >-
    A coding agent that can read local files and call tools can be turned into a credential-exfiltration
    path by nothing more than a poisoned tool description, with the secret hidden inside an argument
    the user is not shown.
  threat_actor: >-
    Unknown; the case is responsibly disclosed research (Invariant Labs) demonstrating tool poisoning,
    with no in-the-wild actor or group attribution.
  campaign: >-
    MCP tool-poisoning research against Cursor and MCP clients, sharing a primary source with the
    adjacent tool-metadata procedure.
  victim: >-
    None in the wild; the demonstration used the researchers' own Cursor/MCP setup. The exposed class
    is any developer running a file-capable MCP agent that connects to untrusted tool servers.
  capability: >-
    Researchers showed a poisoned tool description reading ~/.cursor/mcp.json and SSH material and
    submitting the contents inside a benign-looking parameter, with the argument values hidden behind a
    simplified confirmation UI. The demonstration establishes the read-and-submit path; it does not
    establish a production victim or the receiving server's use of the secret.
  target: >-
    Local credential and key files (MCP configuration and SSH material), targeted through tool
    arguments. Reached in the research setup; not shown against a third-party production developer.
  victimology:
    - 'Developers running file-capable MCP or agentic coding clients connected to third-party tool servers.'
    - 'Hosts holding agent-owned credential files such as ~/.claude.json, ~/.cursor/mcp.json, and SSH keys.'

visibility:
  telemetry_sources:
    - source: 'AI-runtime tool-call and approval capture (Claude Code / Cowork / Agent 365)'
      purpose: >-
        Carry the tool name, its arguments, and the approval decision so a secret in an argument and a
        missing consent can be scored.
      event_vocabulary: 'application-record'
      tier: 'request-response'
      operational_viability: 'opt-in'
      fields:
        - name: 'claude_code.tool_result (tool_name, tool_parameters, tool_input, tool_input_size_bytes, mcp_server_scope, decision_type)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-CLAUDE-OTEL'
          load_bearing: true
          note: >-
            tool_input and tool_parameters require OTEL_LOG_TOOL_DETAILS=1; values over 512 characters
            and payloads over about 4 K characters are truncated, which can drop the secret. A paired
            claude_code.tool_decision event carries the approval (decision, source, tool_source).
      details: >-
        Claude Cowork tool_parameters carries file paths and command arguments scoped by
        workspace.host_paths; Agent 365 gen_ai.tool.call.arguments is a mandatory execute_tool
        attribute but has no CloudAppEvents field; Codex codex.tool_result exposes only duration,
        success, and an output snippet.
      limitations:
        - 'Tool-detail content is off unless OTEL_LOG_TOOL_DETAILS=1, and is truncated when on.'
        - 'M365 Copilot audit carries agent/plugin identity only, no tool arguments.'
        - 'No vendor documents secret detection inside tool parameters; the match is derived.'
    - source: 'Endpoint file-access telemetry for the secret read'
      purpose: 'Prove the named secret file was read or copied on the host, independent of argument capture.'
      event_vocabulary: 'host-process-event'
      tier: 'request-response'
      operational_viability: 'opt-in'
      fields:
        - name: 'DeviceFileEvents (ActionType, FolderPath, FileName, SHA256, InitiatingProcessCommandLine)'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-DEFENDER-FILE'
          load_bearing: true
          note: >-
            Windows event 4663 (Object, Accesses, Process Name) is the equivalent but needs a SACL ACE
            on the path plus the Audit File System subcategory enabled.
      details: >-
        Endpoint file events record the read or copy of the credential or key file and the initiating
        process, giving the read half the argument event cannot prove on its own.
      limitations:
        - 'Requires an endpoint sensor and, for 4663, a SACL on the secret path.'
        - 'A read does not prove the content was sent to a tool destination.'
    - source: 'Network and destination-receipt telemetry'
      purpose: 'Prove the secret left the host and reached the tool destination.'
      event_vocabulary: 'flow-record'
      tier: 'no-tier-model'
      operational_viability: 'opt-in'
      details: >-
        DeviceNetworkEvents or Sysmon 3 record the destination the argument was sent to; the tool
        destination's own audit log (for example an Artifactory access log DOWNLOAD/DEPLOY) proves
        receipt rather than attempt.
      limitations:
        - 'Requires network telemetry on the host or an accessible destination audit log.'
        - 'Cannot attribute the send to a specific tool argument without the AI-runtime join.'

detection:
  scope: >-
    Detection spans the secret at rest, its read, its placement into a tool argument, and its receipt
    by the tool destination. Two materially distinct strategies divide the path: one matches secrets
    and sensitive paths in captured tool arguments and checks for a missing approval, and one confirms
    the file read and the network send in endpoint telemetry.
  outcome_guardrails: >-
    A sensitive path in a tool argument establishes intent; a captured credential value establishes
    the secret was carried; a file read establishes access; a network send or destination-audit entry
    establishes it left the host. These stay distinct: "agent referenced a secret path" and "secret
    reached a tool destination" are different alerts.
  shared_normalization_context: >-
    Canonicalize file paths (expand home directories and symlinks), classify them against a sensitive-path
    list, and fingerprint credential patterns in argument content rather than storing the secret,
    treating credential shapes as one class.
  shared_enrichment_context: >-
    Join the tool-argument event, the approval event, the file-read event, and the network send on
    conversation id, tool call id, path, secret fingerprint, and destination. A valid credential match
    with no consent plus a downstream read or send is meaningful without a long baseline.
  strategies:
    - id: 'STRAT-TOOL-ARGUMENT-SECRET-MATCH'
      name: 'tool-argument secret match'
      objective: >-
        Flag a tool call whose arguments contain a sensitive local path or a credential pattern,
        raising severity when no approval event accompanied the call.
      incident_relevance: >-
        Detects the read-and-submit step the research demonstrated. It establishes that a secret was
        placed into a tool argument; it does not by itself prove the tool received usable content if
        truncation intervened, which the endpoint strategy helps confirm.
      detection_logic: >-
        Match sensitive local paths and credential patterns in captured tool arguments and raise when
        the named tool reads or uploads the path or when the paired approval event is absent. Associate
        the finding with the conversation, tool call id, path, and secret fingerprint. Do not exclude a
        call merely because the parameter name looks innocuous; an innocuous name carrying the secret is
        the documented pattern.
      minimum_evidence: >-
        A captured tool argument containing a credential value or sensitive path, with the approval
        state of the call. Without endpoint confirmation, report attempted local-secret access or
        transfer, not confirmed exfiltration.
      correlation_context: >-
        Key on conversation id, tool call id, path, and secret fingerprint in real time on the single
        call. Truncation over 512 characters per value can drop the secret, weakening recall on long
        credentials.
      detectors:
        - detector_class: 'ai-tool-argument-analytics'
          technologies:
            - 'SIEM regex/secret-scanning over tool-parameter logs (Splunk, Elastic, Sentinel, Google SecOps)'
            - 'DLP or secret-detection over captured tool arguments'
          contribution: 'Extracts the secret match and the approval state from the argument record.'
          limitations: 'Depends on opt-in, truncated capture; no native secret field, so the match is derived.'
      benign_explanations:
        - explanation: >-
            Legitimate secret-management workflows and example paths place credential-shaped strings and
            sensitive paths into tool arguments.
          distinguishing_context: >-
            A valid credential match with no accompanying consent and a downstream read or upload
            separates the malicious case; a path reference in an approved workflow does not.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding all calls that reference known secret paths would also suppress the poisoned read,
            which targets exactly those paths.
      blind_spots:
        - description: 'Missing telemetry: tool-detail capture off, or the secret truncated past the 512-character cap.'
          routes_to: null
        - description: 'Missing telemetry: M365 and Codex expose no tool arguments at all.'
          routes_to: null
        - description: 'Evasion: the secret split across arguments or encoded to stay under the cap.'
          routes_to: null
      analyst_response: >-
        Recover the full argument, confirm the credential is real and which path it came from, check
        whether an approval accompanied the call, determine whether the file was read and the argument
        sent in endpoint telemetry, and identify the poisoned tool description that steered it.
      safe_conclusion: >-
        A tool call carried a local secret in its arguments without approval; that the secret left the
        host requires endpoint read-and-send confirmation.
    - id: 'STRAT-ENDPOINT-READ-AND-EGRESS'
      name: 'endpoint read and egress confirmation'
      objective: >-
        Confirm that the named secret file was read on the host and that its content was sent to a tool
        destination.
      incident_relevance: >-
        Detects the effect the argument event cannot prove alone. A file read plus a send must be tied
        to the tool call before it is attributed to this procedure.
      detection_logic: >-
        Select endpoint file-read events on sensitive paths by the agent process and correlate them to
        an outbound send or a destination-audit entry within a bounded window, joined to the tool call
        where argument capture carries the path. Raise on a secret-path read followed by a send to a
        non-approved destination. Treat a destination-audit receipt as stronger than a network send.
      minimum_evidence: >-
        An endpoint read of a sensitive path by the agent process plus a network send or
        destination-audit entry. Without the tool-call join, report a secret-file read and outbound
        send on the host, not agent-argument exfiltration.
      correlation_context: >-
        Correlate within a bounded window on host, agent process, path, and destination; join to the
        tool call on path and fingerprint. Concurrent unrelated file activity on the host weakens the
        attribution.
      detectors:
        - detector_class: 'endpoint-file-and-network-analytics'
          technologies:
            - 'Microsoft Defender DeviceFileEvents / DeviceNetworkEvents'
            - 'Sysmon (events 3, 11) and Windows 4663 with SACL'
            - 'Tool destination audit logs (e.g. Artifactory access log)'
          contribution: 'Proves the read and the send independent of AI-argument capture.'
          limitations: 'Requires a sensor and, for 4663, a SACL; cannot name the tool argument without the join.'
      benign_explanations:
        - explanation: >-
            Developer tooling legitimately reads credential files and sends them to sanctioned services
            during normal workflows.
          distinguishing_context: >-
            A secret-path read by the agent process followed by a send to a non-approved destination
            separates the malicious case; a sanctioned upload does not.
          overlaps_incident_instance: false
          tuning_hazard: >-
            Allowlisting the agent process wholesale would pass its poisoned read as trusted developer
            activity.
      blind_spots:
        - description: 'Missing telemetry: no endpoint sensor, or no SACL on the secret path for 4663.'
          routes_to: null
        - description: 'Attribution limit: no destination audit and no tool-call join to name the argument.'
          routes_to: null
      analyst_response: >-
        Identify the reading process and the path, determine the destination of the send, recover the
        destination-audit receipt where available, join to the tool call, and scope which credentials
        may have been exposed.
      safe_conclusion: >-
        A secret file was read and sent from the host; attributing it to the poisoned tool argument
        requires the join to the tool call.

detector_requirements:
  required: >-
    Tool-call and approval capture on the AI surface with argument content retained; path
    canonicalization and a sensitive-path list; credential-pattern fingerprinting over argument content;
    endpoint file-access telemetry on the hosts running the agent (with a SACL where 4663 is the source);
    network or destination-audit telemetry for the send; a join from the tool argument to the file read
    and the send on path, fingerprint, and destination; and outcome-aware alert text separating a
    referenced secret path from confirmed exfiltration.
  optional: >-
    DLP or secret scanning inline at the tool boundary and a per-tool approval policy add a block and a
    consent signal, but neither gates the argument-plus-endpoint correlation.
  correlation:
    capability: >-
      Aligned clocks across the AI-runtime, endpoint, and destination streams; a stable secret
      fingerprint and canonical path carried end to end; and agent-process and conversation identity to
      bind a read and a send to a tool call.
    window: 'Real time within a single tool call; the read and send typically follow within seconds to minutes.'
  baselines:
    - name: 'Sensitive local paths and approved tool destinations'
      window: 'Maintained lists, reviewed on change'
      seeded_from: >-
        Known credential locations and sanctioned integrations; never seeded from observed agent tool
        calls, which would enrol an attacker destination as approved.
  product_support_caveat: >-
    A named product is only a candidate implementation technology; actual support depends on deployed
    sensors, enabled logging, retained fields, and architecture. For this object, verification means
    confirming that tool-detail content capture is enabled and not truncating the secret, that endpoint
    file telemetry (with a SACL where needed) covers the agent hosts, and that a destination audit or
    network send can be joined to the tool call, since no vendor scans arguments for secrets.

missing_context:
  unverified:
    - 'The precise first-observed date of the behavior; the cited research page is undated in the catalog and dated here to 2025.'
    - 'Whether truncation removed the secret in the demonstrated run, or the value fit within the cap.'
    - 'The receiving tool server''s use of the submitted secret.'
    - 'Whether any production developer, as opposed to the research setup, was exposed.'
  assumptions:
    - id: 'ASSUMPTION-CONTENT-SCOPE-SPLIT'
      verdict_changing: false
      statement: >-
        This object's observable is the tool-input content, distinct from the sibling procedure's
        tool-description metadata, even though both rest on one body of research. The source treats the
        poisoned description and the submitted argument as one attack; this pack split them into two
        observables so the detection predicate is the argument content rather than the description text.
        If wrong, the two objects double-count one observable and the argument-content predicate should
        be merged with the metadata one. Resolve it by confirming with the source authors whether the
        submitted-argument content is separately instrumentable from the tool-description text.
  standing_negatives:
    - statement: >-
        No vendor documents secret detection inside tool parameters: the AI-runtime pages fetched for
        the telemetry audit expose argument content (opt-in and truncated) but no secret-match field, so
        the credential predicate is a derived analytic.
      valid_until: '2026-11-30'
      recheck: >-
        Re-read the Claude Code, Cowork, and Agent 365 tool-telemetry documentation for a newly
        documented secret-detection or sensitive-argument field.

missing_states:
  - id: 'MISSING_ARGUMENT_CAPTURE'
    meaning: 'Missing telemetry: tool-detail capture is off or the secret is truncated past the 512-character cap.'
    coverage_claim: 'coverage-limited'
    response: >-
      Fall back to endpoint telemetry: report a secret-file read and outbound send without argument
      attribution, and do not claim the secret was carried in a tool argument.
  - id: 'MISSING_ENDPOINT_TELEMETRY'
    meaning: 'Missing telemetry: no endpoint file/network sensor, or no SACL on the secret path.'
    coverage_claim: 'no-coverage'
    response: >-
      Do not claim exfiltration; limit the conclusion to an attempted secret access from the captured
      tool argument.
  - id: 'MISSING_APPROVAL_EVENT'
    meaning: 'Attribution gap: no approval or consent event is recorded for the tool call.'
    coverage_claim: 'coverage-limited'
    response: >-
      Treat absence of a captured approval as a confidence raiser, not proof of bypass, since capture of
      the approval event may itself be disabled.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'actor_or_explicit_missing_state'
    - 'tool_name_and_call_id'
    - 'secret_path_or_credential_fingerprint'
    - 'approval_or_consent_state'
    - 'file_read_confirmation_when_available'
    - 'destination_and_receipt_when_present'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'network_send_destination'
      condition: 'when an outbound send or destination-audit receipt is observed'
  recommended_title: 'Agent placed a local secret into a tool call without approval'
  unsupported_title: 'Attacker stole all developer credentials from the host'

evidence:
  confirmed_incident_behavior: >-
    Research reports that a poisoned tool description made the agent read ~/.cursor/mcp.json and SSH
    material and submit the contents inside a benign-looking sidenote parameter, with the argument
    values hidden behind a simplified confirmation UI. That this object's observable is the submitted
    argument content, separated from the tool-description text of the adjacent procedure, is this
    pack's scoping of one body of research, registered in missing_context.assumptions, not a
    distinction the source draws.
  supported_conclusion: >-
    The evidence supports that a poisoned tool description can steer a file-capable MCP agent to read
    local secrets and place them into a tool call's arguments, hidden from the user by a simplified
    confirmation surface. The behavior is detectable where a credential or sensitive-path value in a
    tool argument with no approval is correlated with an endpoint read and send, and reportable as an
    attempted secret access from the argument alone.
  unsupported_conclusions: >-
    The evidence does not establish an in-the-wild victim, the receiving server's use of the secret, or
    that the tool received usable content if truncation intervened. Those require endpoint, network, and
    destination telemetry not carried by the cited research.
  procedure_boundary: >-
    This procedure is the reading of a local secret and its placement into a tool argument. The upstream
    tool-description poisoning and any downstream use of the received secret are separate behaviors and
    are not evidenced by the argument having been submitted.
  references:
    - id: 'REF-THREAT-INVARIANTLABS'
      type: 'incident-procedure-primary-source'
      title: 'MCP security notification: tool poisoning attacks'
      publisher: 'Invariant Labs'
      url: 'https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks'
      trust_tier: 'researcher'
      verification: 'not-resolved-out-of-scope'
      evidence_use: >-
        Primary source for the poisoned tool description reading local secret files and submitting them
        inside a benign-looking parameter hidden by a simplified confirmation UI. It does not enumerate
        a production victim or the receiving server's use of the secret.
    - id: 'REF-CLAUDE-OTEL'
      type: 'telemetry-documentation'
      title: 'Monitoring usage with OpenTelemetry (Claude Code)'
      publisher: 'Anthropic'
      url: 'https://code.claude.com/docs/en/monitoring-usage'
      trust_tier: 'vendor'
      verification: 'not-resolved-out-of-scope'
      evidence_use: >-
        Documents the tool_result and tool_decision events, the OTEL_LOG_TOOL_DETAILS flag, and the
        512-character and 4 K truncation used by the AI-runtime telemetry source; supports no incident fact.
    - id: 'REF-DEFENDER-FILE'
      type: 'telemetry-documentation'
      title: 'DeviceFileEvents table (advanced hunting)'
      publisher: 'Microsoft'
      url: 'https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicefileevents-table'
      trust_tier: 'vendor'
      verification: 'not-resolved-out-of-scope'
      evidence_use: 'Documents the file-read fields used to confirm the secret was read on the host.'
