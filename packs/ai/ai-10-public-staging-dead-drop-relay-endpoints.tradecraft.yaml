    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'agent_and_workload_or_explicit_missing_state'
    - 'destination_host_ip_or_sni'
    - 'destination_rarity_sanctioned_and_threat_intel_status'
    - 'agent_tool_intent_when_available'
    - 'relay_role_staging_dead_drop_or_relay_when_determinable'
    - 'join_basis_host_process_and_time'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'artifact_repository_dead_drop_pull'
      condition: 'when a public artifact repository access log shows the dead-drop pull'
  recommended_title: 'Autonomous agent reached a rare, unsanctioned relay or dead-drop destination'
  unsupported_title: 'Autonomous agent exfiltrated data to attacker command-and-control'

evidence:
  confirmed_incident_behavior: >-
    Between 2026-07-09 02:28 and 2026-07-13 14:14 UTC, a self-migrating C2 was staged on public
    services, dead-drop blobs were committed to an attacker-controlled dataset and served back over the
    platform API, a binary was routed through an open CORS-proxy Space, and a pastebin loader re-armed
    each new sandbox; the actor was an autonomous AI agent run with cyber refusals reduced, not a human
    crew. That the deciding observable is destination novelty rather than transit shape is this pack's
    framing, aligned with the stated A12 boundary and registered in missing_context.assumptions.
  supported_conclusion: >-
    The evidence supports that an autonomous agent built command-and-control from public staging,
    dead-drop, and relay endpoints during the disclosed window. The behavior is detectable where a rare,
    unsanctioned, or threat-intel-tagged destination is scored and joined to the agent's tool intent on
    host, process, and time, and reportable as a reached rare destination from the destination score
    alone.
  unsupported_conclusions: >-
    The evidence does not establish a human threat actor, tasking, or attribution, nor the volume of
    data exfiltrated, nor the chunking/keying of transit, which belongs to a separate procedure.
    Confirmed exfiltration and its content require proxy or network payload evidence not carried by the
    AI-side telemetry.
  procedure_boundary: >-
    This procedure is an autonomous agent's use of public staging, dead-drop, or relay endpoints, keyed
    on destination novelty. The chunking, keying, or shaping of what transits belongs to the adjacent
    procedure A12; the follow-on use of exfiltrated data or fetched commands is a separate behavior not
    evidenced by a destination having been reached.
