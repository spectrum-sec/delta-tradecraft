identity:
  uuid: '16aa7630-ae13-4f5b-911b-2326b2080c52'
  id: 'DT-AAG1-AI-016'
  aliases:
    - 'P42'
  name: 'Attackers use stolen cloud credentials to consume hosted model APIs'
  incident: >-
    Sysdig-reported LLMjacking: an operator entered via a Laravel CVE (CVE-2021-3129), then used
    stolen cloud credentials to probe and invoke AWS Bedrock and nine other hosted LLM services.
  first_observed: '2024'
  last_reviewed: '2026-08-24'

classification:
  primary_attack_surface: 'application-ai-platform'
  secondary_attack_surfaces:
    - 'cloud-control-plane'
    - 'identity-provider'
  behavior_classes:
    - 'credential-replay-from-outside-the-issuing-boundary'
    - 'other'
  behavior_classes_note: >-
    hosted-model-resource-consumption: a valid but stolen cloud principal is used to invoke a hosted
    model API and consume tokens at the victim account's expense (llmjacking), independent of how the
    credential was obtained.
  tags:
    - 'ai'
    - 'llmjacking'
    - 'cloud-credentials'
    - 'bedrock'
    - 'model-abuse'

behavior:
  definition: >-
    An attacker uses stolen cloud credentials to invoke hosted model APIs, probe models, or consume
    tokens at the victim account's expense.
  detailed_definition: >-
    The adversary holds valid authentication material for a principal that can reach a hosted model
    inference API, and exercises that access to enumerate reachable models, test which are enabled,
    and drive inference at the account owner's cost. The boundary crossed is an authorization one: a
    principal acts against the model plane from outside the context in which its credential was
    meant to be used, with no exploit of the model service itself. The attempt ends at possession of
    working credentials; success begins when an invocation returns model output or accrues billable
    consumption. It is independent of cloud provider, model vendor, inference API shape, and endpoint
    sensor.

manifestation:
  possible:
    answer: 'yes'
    answer_scope: >-
      Covers enumeration and invocation of hosted model APIs under a stolen cloud principal and the
      billable consumption that follows; does not cover the initial credential theft nor any
      downstream objective beyond consuming inference.
    summary: >-
      This can occur when an attacker holds valid credentials for a principal that carries
      model-invoke permission, a hosted model endpoint is reachable from the attacker's network, and
      no preventive control blocks that principal. Consumption additionally requires that model
      access be enabled on the account and the requested model be available in the targeted region.
  observable:
    answer: 'yes-conditional'
    answer_scope: >-
      Invocation is observable where model-invocation logging is enabled or where control-plane
      management events are forwarded; the invoking principal is recorded, but the request origin is
      recoverable only from a separate stream, so origin attribution is not read from invocation
      logs alone.
    blocking_conditions:
      - condition: 'audit-tier-or-enablement-required'
        note: >-
          Bedrock model invocation logging is disabled by default and covers bedrock-runtime only;
          OpenAI audit logs must be enabled by an organization owner; Vertex Data Access logging is
          off by default. Without these the invocation body and per-principal detail are not recorded.
      - condition: 'stream-existence-varies-by-estate'
        note: >-
          Which provider streams exist varies by estate; some accounts retain only CloudTrail
          management events for Bedrock and no invocation logging, so token counts and request bodies
          are absent.
    summary: >-
      The behavior is observable when invocation logging records identity.arn, modelId, operation and
      token counts, or when CloudTrail management events record InvokeModel and Converse against the
      calling principal, with enough baseline to see the volume or region as abnormal. A single
      InvokeModel with no volume context, or a GetModelInvocationLoggingConfiguration query alone,
      establishes access probing but not abusive consumption; Bedrock invocation logs carry no source
      IP, so origin must come from CloudTrail.
  detectable:
    answer: 'yes-conditional'
    answer_scope: >-
      Separable from legitimate model use when a per-principal baseline of volume, region and model
      is joined to the request origin and to any logging-configuration change; a legitimate load test
      or model migration overlaps and must not be tuned out blindly.
    blocking_conditions:
      - condition: 'cross-source-join-required'
        note: >-
          Bedrock invocation logs name the principal but carry no IP, while CloudTrail management
          events carry sourceIPAddress and userAgent; separating stolen-credential origin from
          normal use needs the two joined on request id and principal, and neither stream alone does it.
      - condition: 'environment-inventory-required'
        note: >-
          Distinguishing abuse from a new deployment needs a per-principal baseline of normal models,
          regions and volume, which no vendor ships; it must be built before the anomaly is meaningful.
    summary: >-
      Separation rests on baselining invoke volume, tokens, regions and error rate per cloud
      principal and raising on an abrupt change, a new source IP or region, or a disablement of
      invocation logging. Because legitimate migrations and load tests move the same fields, the
      signal is strengthened by a new origin and by logging-configuration changes on the same
      principal; a raw spike with no origin or baseline is too weak to establish abuse.

attack_surface_context:
  surface: >-
    Hosted model inference APIs reached with cloud credentials: AWS Bedrock (InvokeModel, Converse
    and their streaming forms) and comparable OpenAI, Anthropic and Google Vertex endpoints.
  how_the_surface_works: >-
    A cloud principal authenticates with IAM or STS credentials and calls a model-inference endpoint;
    the provider authorizes the principal, runs inference, and bills the account for the tokens
    consumed. Access is authorized per principal and per model, and enabling a model or a region is a
    separate account-level step from holding the invoke permission.
  incident_processing_path: >-
    Sysdig reports (source-attested) that the operator entered through Laravel CVE-2021-3129, then ran
    scripted checks against ten AI services, probed Bedrock with an InvokeModel call carrying
    max_tokens_to_sample set to minus one to tell an enabled principal apart from an AccessDenied
    result, and issued GetModelInvocationLoggingConfiguration queries to see whether invocations were
    being logged. That the operator sought to consume inference at the victim's expense rather than
    only to enumerate is this pack's reading of the probing pattern, consistent with the source's
    llmjacking framing but not a billed-consumption figure the post publishes.
  processing_stages:
    - 'credential-theft-upstream'
    - 'credential-possession'
    - 'service-enumeration'
    - 'access-probe-invokemodel'
    - 'logging-configuration-check'
    - 'model-invocation'
    - 'token-consumption'
    - 'account-billing'
  stage_evidence: >-
    The stage an event sits at fixes what it can prove: an access probe or a logging-configuration
    query proves enumeration, not consumption; an InvokeModel management event proves an authorized
    call was made; only invocation logging with token counts, or the account bill, proves inference
    was actually consumed and at what volume.
  trust_boundaries: >-
    Stolen credential into the cloud authorization boundary (reached: the principal was accepted and
    calls authorized); principal into the model plane (reached: probing calls returned enabled-versus-
    denied signals); model plane to account billing (reached in the source's framing as consumption,
    though no billed figure is published). No boundary of the model service itself was exploited; the
    crossing is authorization, not code execution.
  security_control_context: >-
    Preventive control here is IAM/SCP policy and model-access enablement: a principal without
    bedrock:InvokeModel, or an account without the model enabled, returns AccessDenied, which is
    itself the signal the operator's probe reads. Detective control is invocation logging and
    CloudTrail, but invocation logging is off by default and management events carry no token counts.
    Bypass representations include using a principal that legitimately holds invoke permission,
    operating in a region the victim already uses, and disabling invocation logging before consuming.
  practitioner_implication: >-
    An implementer must discover which providers the estate uses, whether model invocation logging is
    enabled and forwarded (Bedrock, OpenAI owner-enabled audit, Vertex Data Access), whether
    CloudTrail management events are retained to supply the request origin the invocation logs lack,
    and what a normal per-principal model, region and volume baseline looks like before any anomaly
    can be scored.

threat_research:
  why_it_matters: >-
    A stolen cloud credential turns a victim's own paid model access into an attacker resource:
    inference runs under the victim's identity and bill, enumeration reveals which models and regions
    are open, and a logging-configuration check lets the operator gauge whether the consumption will
    be recorded at all.
  threat_actor: >-
    Unknown. Sysdig observed the operator enter via Laravel CVE-2021-3129 and script checks against
    ten AI services; the report assigns no group attribution.
  campaign: 'Sysdig-reported LLMjacking abuse of stolen cloud credentials against hosted LLM services.'
  victim: >-
    Cloud accounts whose stolen credentials carried hosted-model access; Sysdig frames the class of
    victims rather than naming an organization.
  capability: >-
    Scripted enumeration of ten AI services, a Bedrock access probe using InvokeModel with
    max_tokens_to_sample set to minus one to separate enabled access from AccessDenied, and
    GetModelInvocationLoggingConfiguration queries to check whether invocations were logged.
  target: >-
    Hosted model inference under the victim's principal. The source establishes access probing and
    the llmjacking pattern; it does not publish a billed-consumption total, so the consumption
    outcome is framed rather than quantified.
  victimology:
    - 'Cloud accounts holding enabled hosted-model access whose IAM credentials are exposed.'
    - 'Organizations that expose vulnerable web applications from which cloud credentials can be stolen.'

visibility:
  telemetry_sources:
    - source: 'AWS Bedrock model invocation logging'
      purpose: >-
        Record the invoking principal, model, operation and token counts for a Bedrock inference call,
        establishing that consumption occurred and at what volume.
      event_vocabulary: 'application-record'
      tier: 'request-response'
      operational_viability: 'opt-in'
      fields:
        - name: 'identity.arn'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AWS-BEDROCK-LOGGING'
          load_bearing: true
          note: 'The STS/IAM principal, captured automatically when logging is enabled.'
        - name: 'operation / modelId'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AWS-BEDROCK-LOGGING'
          load_bearing: true
        - name: 'input.inputTokenCount / output.outputTokenCount'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AWS-BEDROCK-LOGGING'
          load_bearing: true
          note: 'Bodies over 100 KB and binary data are stored as separate S3 objects.'
      details: >-
        Records schemaType ModelInvocationLog with account, region, requestId, operation (Converse,
        ConverseStream, InvokeModel, InvokeModelWithResponseStream), modelId, and input/output token
        counts and bodies. Disabled by default and covers bedrock-runtime only.
      limitations:
        - 'Disabled by default; captures bedrock-runtime traffic only, not bedrock-mantle.'
        - 'Contains no source IP address, so request origin must come from CloudTrail.'
        - 'Bodies over 100 KB and binary data are offloaded to separate S3 objects.'
    - source: 'AWS CloudTrail (Bedrock management and data events)'
      purpose: >-
        Attribute a Bedrock API call to a principal, source IP and user agent, and supply the request
        origin that invocation logging omits.
      event_vocabulary: 'cloud-management-event'
      tier: 'no-tier-model'
      operational_viability: 'on-by-default'
      fields:
        - name: 'userIdentity'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AWS-CLOUDTRAIL-BEDROCK'
          load_bearing: true
        - name: 'sourceIPAddress / userAgent'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-AWS-CLOUDTRAIL-BEDROCK'
          load_bearing: true
      details: >-
        InvokeModel, InvokeModelWithResponseStream, Converse and ConverseStream and all other Bedrock
        operations appear as management events; InvokeAgent, Retrieve, RetrieveAndGenerate and
        InvokeFlow are data events requiring advanced event selectors and extra cost.
      limitations:
        - 'Management events carry no token counts, so consumption volume is not recoverable here.'
        - 'Data events require advanced event selectors and incur additional cost.'
    - source: 'OpenAI Platform audit logs'
      purpose: >-
        Record key and session events under an OpenAI organization, including the actor session IP,
        for credential-provisioning and sign-in activity around abuse.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'opt-in'
      fields:
        - name: 'actor.session.ip_address'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENAI-AUDIT'
          load_bearing: false
        - name: 'type / actor.api_key.id'
          attestation: 'vendor-attested'
          attestation_ref: 'REF-OPENAI-AUDIT'
          load_bearing: false
      details: >-
        GET /organization/audit_logs returns typed events including api_key and service_account
        lifecycle, login.succeeded/failed, ip_allowlist changes and organization.updated, with actor
        session and API-key detail.
      limitations:
        - 'Must be enabled by an organization owner.'
        - 'The fetched reference documents no retention period.'
    - source: 'Anthropic Compliance API'
      purpose: 'Provide per-actor activity records for post-abuse session activity under an organization.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'opt-in'
      details: >-
        GET /v1/compliance/activities (scope read:compliance_activities) returns Activity records with
        id, created_at, organization_id, type, actor and resource ids.
      limitations:
        - 'Anthropic does not publish the activity-type enumeration, so credential-abuse types cannot be asserted.'
        - 'Covers Compliance-API-visible actions only, not raw inference volume.'
    - source: 'Google Vertex AI audit logging'
      purpose: 'Record admin and data-access activity for Vertex model use per principal.'
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'on-by-default'
      operational_viability_note: >-
        Admin Activity is always on; the Data Access categories that carry per-principal read/write
        detail are off by default, so the load-bearing half is opt-in.
      details: >-
        Admin Activity logs are always on; Data Access ADMIN_READ/DATA_READ/DATA_WRITE are disabled by
        default and require enabling before per-principal model use is recorded.
      limitations:
        - 'Data Access logging is off by default and requires a privileged log-viewer role to read.'
    - source: 'Identity-provider and endpoint telemetry'
      purpose: >-
        Record credential provisioning at the IdP and the network origin of the host issuing the model
        calls, for corroboration.
      event_vocabulary: 'application-record'
      tier: 'metadata'
      operational_viability: 'opt-in'
      details: >-
        Entra audit activities (Add service principal credentials, Update application certificates and
        secrets) and Okta app.oauth2.client.lifecycle events record credential provisioning;
        DeviceNetworkEvents and Sysmon 3 record the calling host's outbound connections.
      limitations:
        - 'Attributes credential provisioning and host origin, not the model consumption itself.'
        - 'Endpoint network telemetry requires a deployed sensor on the calling host.'

detection:
  scope: >-
    Detection spans the stolen principal's enumeration, its access probe, its model invocations and
    the resulting consumption. One strategy baselines per-principal invocation behaviour and raises on
    tempo, cost, region or logging-configuration anomalies, drawing origin from the control plane the
    invocation logs omit.
  outcome_guardrails: >-
    An access probe or a logging-configuration query establishes enumeration, not consumption. An
    InvokeModel management event establishes an authorized call. Only invocation logging with token
    counts, or the account bill, establishes consumed inference and its volume. These stay distinct;
    "probed access" and "consumed inference" are different alerts.
  shared_normalization_context: >-
    Normalize to the cloud principal, model id, region and request id across invocation logging and
    CloudTrail, and treat the enabled-versus-AccessDenied probe result as a discrete access-test
    signal rather than a failed invocation.
  shared_enrichment_context: >-
    Join the invoking principal to its request origin (CloudTrail sourceIPAddress), to a
    per-principal baseline of normal models, regions and volume, and to any
    logging-configuration-change event on the same principal. A 30-to-90-day baseline helps
    prioritise, but a new origin correlated with a logging-config disablement is meaningful without one.
  strategies:
    - id: 'STRAT-PRINCIPAL-INVOCATION-ANOMALY'
      name: 'per-principal invocation anomaly'
      objective: >-
        Detect an abrupt change in model-invocation volume, cost, region or error pattern for a cloud
        principal, or a disablement of invocation logging, that indicates stolen-credential abuse.
      incident_relevance: >-
        Detects the consumption and probing outcome the incident's llmjacking pattern produces. It
        detects abnormal invocation for a principal; it does not by itself prove the credential was
        stolen, which comes from the origin and provisioning join.
      detection_logic: >-
        Baseline model invoke volume, token counts, regions, operations, error rate and call duration
        per cloud principal, and raise on an abrupt cost or throughput change, a new region or model
        for that principal, a burst of enabled-versus-denied access probes, or a
        GetModelInvocationLoggingConfiguration query followed by a logging disablement. Join each
        finding to the request origin from CloudTrail and to credential-provisioning events at the
        IdP. Raise confidence on a new source IP or region and on a logging-configuration change on
        the same principal. Do not exclude a principal merely because it legitimately holds invoke
        permission.
      minimum_evidence: >-
        A per-principal invocation or management-event series showing the anomalous volume, region or
        operation, tied to the principal. Without a request origin or provisioning join, report
        abnormal invocation for the principal, not confirmed credential theft.
      correlation_context: >-
        Correlate on cloud principal or API key, model, region, request id and account across
        invocation logging and CloudTrail, over rolling windows of five minutes, one hour and
        twenty-four hours, against a thirty-day (sixty-to-ninety-day for seasonal principals)
        baseline. Bedrock invocation logs and CloudTrail must be joined because the former carries the
        token counts and the latter the origin.
      detectors:
        - detector_class: 'cloud-usage-baseline-anomaly-analytics'
          technologies:
            - 'Splunk'
            - 'Elastic'
            - 'Microsoft Sentinel'
            - 'Google SecOps'
          contribution: 'Baselines per-principal invocation behaviour and raises on statistical deviation.'
          limitations: 'Requires invocation logging or forwarded management events and a per-principal baseline.'
        - detector_class: 'control-plane-audit-correlation'
          technologies:
            - 'AWS CloudTrail analytics'
            - 'Cloud-native audit correlation'
          contribution: 'Supplies the request origin and logging-configuration changes the invocation logs omit.'
          limitations: 'Management events carry no token counts; data events require advanced selectors and cost.'
      benign_explanations:
        - explanation: >-
            New deployments, load tests and legitimate model migrations move invocation volume, region
            and model for a principal.
          distinguishing_context: >-
            A new source IP or region for the principal, credential-provisioning anomalies, or a
            logging-configuration disablement separate abuse from a sanctioned change; a raw volume
            spike does not.
          overlaps_incident_instance: true
          tuning_hazard: >-
            Excluding a principal that holds legitimate invoke permission, to cut migration noise,
            would suppress the stolen-credential case, which reuses exactly such a principal.
      blind_spots:
        - description: 'Missing telemetry: invocation logging disabled, leaving only management events with no token counts.'
          routes_to: null
        - description: 'Attribution limit: Bedrock invocation logs carry no source IP, so origin depends on the CloudTrail join.'
          routes_to: null
        - description: 'Missing telemetry: no per-principal usage baseline exists, so a first-abuse spike has nothing to deviate from.'
          routes_to: null
      analyst_response: >-
        Retrieve the principal, the anomalous models, regions and token volume, and the request origin
        from CloudTrail; check for a logging-configuration change and for credential-provisioning
        events at the IdP; determine whether the principal's normal owner recognises the activity; and
        scope any other principals showing the same origin.
      expected_volume:
        band: null
        basis: 'unavailable'
        note: >-
          The source gives the mechanism but no firing rate; volume depends on the estate's principal
          count and baseline quality, so a per-principal anomaly rate is not derivable from the source.
      safe_conclusion: >-
        A cloud principal's model-invocation behaviour changed abruptly or its invocation logging was
        disabled; confirming stolen-credential abuse requires the request-origin and
        credential-provisioning join.

detector_requirements:
  required: >-
    Enablement and retention of model invocation logging or forwarded control-plane management events;
    normalization to cloud principal, model, region and request id; a per-principal baseline of normal
    models, regions and volume; a join from the invoking principal to its request origin and to
    credential-provisioning events; and outcome-aware alert text that keeps access probing distinct
    from consumed inference.
  optional: >-
    IdP credential-provisioning telemetry (Entra, Okta) and endpoint network telemetry add origin and
    provisioning corroboration, and a logging-configuration-change feed adds an early anti-forensics
    signal, but none gates the core per-principal anomaly.
  correlation:
    capability: >-
      Aligned clocks across invocation logging, CloudTrail and IdP streams; a stable principal or
      API-key identifier carried across them; and retention long enough to hold a per-principal
      baseline.
    window: 'Rolling five-minute, one-hour and twenty-four-hour windows against a thirty-day baseline.'
  baselines:
    - name: 'Per-principal normal models, regions and invocation volume'
      window: '30-day (60-to-90-day for seasonal principals)'
      seeded_from: >-
        Observed sanctioned invocation for known-good principals; never seeded from a window that
        already contains the abuse, which would enrol the attacker's volume as normal.
  product_support_caveat: >-
    A named product is only a candidate implementation technology; actual support depends on deployed
    sensors, enabled logging, retained fields and architecture. For this object, verification
    specifically means confirming that model invocation logging is enabled and forwarded (it is off by
    default on Bedrock and owner-enabled on OpenAI), that CloudTrail management events are retained to
    supply the request origin invocation logs omit, and that a per-principal usage baseline exists.

missing_context:
  unverified:
    - 'The precise first-observed date of the behavior; the fetched Sysdig page states neither a publication nor an incident date.'
    - 'The billed consumption total or number of tokens the operator consumed under the victim principals.'
    - 'The retention period of OpenAI audit logs, undocumented on the fetched reference.'
    - 'Whether any first-party stream normalizes provider, model and error per principal (only OTel fields, not native audit, document this).'
  assumptions:
    - id: 'ASSUMPTION-CONSUMPTION-INTENT'
      verdict_changing: false
      statement: >-
        The operator sought to consume billable inference, not only to enumerate access. Sysdig frames
        the activity as llmjacking and documents the access probe and logging-configuration checks, but
        publishes no billed-consumption figure; this pack read consumption intent from the probing
        pattern, which is reasoning from enumeration behaviour to objective. If wrong, the consumption
        stage in the processing path and the "consumed inference" outcome overstate what the source
        supports, though the per-principal anomaly strategy still fires on the probing volume. Resolve
        it by obtaining the victim accounts' Bedrock invocation token counts or billing records for
        the abuse window.
  standing_negatives:
    - statement: >-
        AWS Bedrock model invocation logging records no source IP address: the fetched logging
        reference documents identity, model, operation and token fields but no client IP, so origin
        must come from CloudTrail.
      valid_until: '2026-11-30'
      recheck: >-
        Re-read the Bedrock model-invocation-logging reference for a newly documented client-IP or
        source-address field in the ModelInvocationLog schema.

missing_states:
  - id: 'MISSING_INVOCATION_LOGGING'
    meaning: 'Missing telemetry: model invocation logging is disabled, leaving only management events with no token counts.'
    coverage_claim: 'coverage-limited'
    response: >-
      Report that an authorized call was made from control-plane events; do not claim consumption
      volume, which requires the invocation log or the account bill.
  - id: 'MISSING_REQUEST_ORIGIN'
    meaning: 'Attribution gap: the invocation log names the principal but carries no source IP or region of origin.'
    coverage_claim: 'coverage-limited'
    response: >-
      Join CloudTrail sourceIPAddress on request id to recover origin; without it, mark origin
      attribution incomplete and do not assert stolen-credential abuse.
  - id: 'MISSING_USAGE_BASELINE'
    meaning: 'Missing telemetry: no per-principal usage baseline exists to deviate against.'
    coverage_claim: 'no-coverage'
    response: >-
      Do not raise a volume-anomaly alert; fall back to origin and logging-configuration signals until
      a baseline is built.

alert_evidence_contract:
  required_fields:
    - 'tradecraft_id'
    - 'detection_strategy_id'
    - 'plain_language_behavior_claim'
    - 'cloud_principal_or_api_key'
    - 'affected_account_and_region'
    - 'model_id_and_operation'
    - 'observed_invocation_volume_and_token_counts_when_available'
    - 'request_origin_ip_and_user_agent_when_available'
    - 'logging_configuration_change_when_present'
    - 'timestamps_and_correlation_context'
    - 'source_types_and_durable_evidence_references'
    - 'confirmed_facts_inferences_assumptions_and_missing_capabilities'
  conditional_fields:
    - field: 'credential_provisioning_event'
      condition: 'when IdP telemetry shows credentials added or updated for the principal in the window'
  recommended_title: 'Cloud principal shows anomalous hosted-model invocation consistent with stolen-credential abuse'
  unsupported_title: 'Attacker stole cloud credentials and ran a large-scale paid-inference operation on the victim account'

evidence:
  confirmed_incident_behavior: >-
    Sysdig reports that an operator entered via Laravel CVE-2021-3129, scripted checks against ten AI
    services, probed AWS Bedrock with an InvokeModel call carrying max_tokens_to_sample set to minus
    one to separate an enabled principal from an AccessDenied result, and issued
    GetModelInvocationLoggingConfiguration queries to see whether invocations were logged. That the
    objective was to consume billable inference rather than only to enumerate is this pack's reading
    of the probing pattern, registered in missing_context.assumptions, not a billed figure the source
    publishes.
  supported_conclusion: >-
    The evidence supports that stolen cloud credentials were used to enumerate and probe hosted model
    access and to check invocation logging, across AWS Bedrock and nine other services. The behavior
    is detectable where a per-principal invocation baseline is joined to the request origin and to
    credential-provisioning events, and reportable as abnormal invocation from control-plane events
    alone.
  unsupported_conclusions: >-
    The evidence does not establish the billed consumption total, the number of victim accounts, the
    exact credential-theft path, or any objective beyond consuming inference. Those require billing
    records and per-principal invocation logs the cited source does not carry.
  procedure_boundary: >-
    This procedure is the use of stolen cloud credentials to enumerate and consume hosted model APIs.
    The upstream web-application exploit that yielded the credentials, and any downstream use of model
    output, are separate behaviors and are not evidenced by this consumption having occurred.
  references:
    - id: 'REF-THREAT-SYSDIG'
      type: 'incident-procedure-primary-source'
      title: 'LLMjacking: Stolen Cloud Credentials Used in New AI Attack'
      publisher: 'Sysdig'
      url: 'https://www.sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack'
      trust_tier: 'vendor'
      verification: 'not-resolved-out-of-scope'
      evidence_use: >-
        Primary procedure-level source for the credential-abuse pattern, the entry via Laravel
        CVE-2021-3129, the ten-service enumeration, the Bedrock access probe and the
        logging-configuration checks. It does not publish an incident date or a billed-consumption total.
    - id: 'REF-AWS-BEDROCK-LOGGING'
      type: 'telemetry-documentation'
